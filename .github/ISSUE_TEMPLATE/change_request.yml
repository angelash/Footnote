name: Change Request
description: 范围/系统边界/Schema 变更申请（必须审批）
title: "[CR] <变更标题>"
labels: ["change-request", "needs-approval"]
body:
  - type: markdown
    attributes:
      value: |
        ## 变更申请
        变更冻结文档或引入新系统/Schema必须提交此申请。

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 为什么需要这个变更？不变更的代价？
      placeholder: |
        描述变更的背景和必要性...
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 变更内容
      description: 具体要改什么？（明确到文件/字段/系统）
      placeholder: |
        - 文件: /docs/01_bibles/tech_bible.md
        - 变更: 新增 xxx 系统定义
        - 字段: xxx
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 受影响的系统/任务/测试/里程碑
      placeholder: |
        - 系统: NarrativeEngine
        - 任务: T-0001, T-0002
        - 测试: 需更新冒烟清单
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: 风险等级
      options:
        - "Low - 局部变更，影响范围小"
        - "Medium - 跨模块变更，需要协调"
        - "High - 系统级变更，影响里程碑"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否有其他方案？为什么选择当前方案？
      placeholder: |
        方案A: ...
        方案B: ...
        选择原因: ...

  - type: textarea
    id: acceptance
    attributes:
      label: 验收点
      description: 如何验证变更正确完成？
      placeholder: |
        - [ ] 验收点1
        - [ ] 验收点2
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: 回滚方案
      description: 如果变更失败，如何回滚？
      placeholder: |
        1. Git revert 到 commit xxx
        2. 恢复原配置

