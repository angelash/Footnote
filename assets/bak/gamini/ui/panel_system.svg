<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0.95" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Panel Body -->
  <path d="M10,10 L390,10 L390,270 L370,290 L10,290 Z" fill="url(#panelGrad)" stroke="#4a9eff" stroke-width="2" />
  
  <!-- Header Decoration -->
  <rect x="10" y="10" width="380" height="30" fill="#4a9eff" fill-opacity="0.1" />
  <rect x="15" y="15" width="200" height="20" fill="#4a9eff" fill-opacity="0.2" />
  <rect x="350" y="15" width="35" height="4" fill="#4a9eff" />
  <rect x="350" y="23" width="25" height="4" fill="#4a9eff" opacity="0.6" />
  <rect x="350" y="31" width="15" height="4" fill="#4a9eff" opacity="0.3" />

  <!-- Corner Accents -->
  <path d="M10,40 V10 H40" stroke="#4a9eff" stroke-width="2" fill="none" />
  <path d="M390,40 V10 H360" stroke="#4a9eff" stroke-width="2" fill="none" />
  <path d="M10,260 V290 H40" stroke="#4a9eff" stroke-width="2" fill="none" />
  
  <!-- Content Placeholder Lines -->
  <rect x="30" y="60" width="340" height="1" fill="#4a9eff" opacity="0.3" />
  <rect x="30" y="100" width="340" height="1" fill="#4a9eff" opacity="0.3" />
  <rect x="30" y="140" width="340" height="1" fill="#4a9eff" opacity="0.3" />
  
  <!-- System Status Text (Simulated) -->
  <rect x="30" y="70" width="100" height="8" rx="2" fill="#4a9eff" opacity="0.5" />
  <rect x="30" y="110" width="150" height="8" rx="2" fill="#4a9eff" opacity="0.5" />
  <rect x="30" y="150" width="120" height="8" rx="2" fill="#4a9eff" opacity="0.5" />

  <!-- Action Button Area -->
  <rect x="280" y="240" width="100" height="40" rx="4" fill="#4a9eff" fill-opacity="0.2" stroke="#4a9eff" stroke-width="1" />
  <text x="330" y="265" font-family="monospace" font-size="14" fill="#4a9eff" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">CONFIRM</text>
</svg>
