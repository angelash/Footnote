<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- C0-Z2 早餐小店
  尺寸: 750×1334px（竖屏）
  场景: 城区生活小店，柜台、座椅、菜单
  氛围: 温暖灯光，日常但有微妙错位
-->
<svg width="750" height="1334" viewBox="0 0 750 1334" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 店内背景 -->
    <linearGradient id="shopBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1814"/>
      <stop offset="100%" style="stop-color:#12100c"/>
    </linearGradient>
    
    <!-- 暖光 -->
    <radialGradient id="warmLight" cx="50%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#3a3020;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1814;stop-opacity:1"/>
    </radialGradient>
    
    <!-- 灯光发光 -->
    <filter id="lampGlow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 木纹 -->
    <pattern id="woodGrain" patternUnits="userSpaceOnUse" width="40" height="10">
      <rect width="40" height="10" fill="#3a3028"/>
      <line x1="0" y1="3" x2="40" y2="3" stroke="#4a4038" stroke-width="0.5"/>
      <line x1="0" y1="7" x2="40" y2="7" stroke="#2a2018" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- 主背景 -->
  <rect x="0" y="0" width="750" height="1334" fill="url(#shopBg)"/>
  <rect x="0" y="0" width="750" height="600" fill="url(#warmLight)"/>
  
  <!-- ===== 吊灯 ===== -->
  <g transform="translate(375, 50)" filter="url(#lampGlow2)">
    <!-- 灯罩 -->
    <ellipse cx="0" cy="80" rx="60" ry="30" fill="#4a4030" stroke="#5a5040" stroke-width="2"/>
    <ellipse cx="0" cy="75" rx="50" ry="25" fill="#3a3020"/>
    <!-- 灯泡光 -->
    <ellipse cx="0" cy="85" rx="35" ry="20" fill="#FFDD88" opacity="0.4"/>
    <ellipse cx="0" cy="85" rx="20" ry="12" fill="#FFEE99" opacity="0.6"/>
    <!-- 灯线 -->
    <line x1="0" y1="0" x2="0" y2="50" stroke="#2a2018" stroke-width="3"/>
  </g>
  
  <!-- 光晕效果 -->
  <ellipse cx="375" cy="200" rx="200" ry="150" fill="#FFDD88" opacity="0.05"/>
  
  <!-- ===== 后墙 ===== -->
  <rect x="50" y="150" width="650" height="400" fill="#1e1c18" stroke="#2a2820" stroke-width="2"/>
  
  <!-- 菜单板 -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="250" height="180" rx="4" fill="#1a1814" stroke="#3a3830" stroke-width="2"/>
    <text x="125" y="30" font-family="Noto Sans SC" font-size="18" fill="#E8D4A0" text-anchor="middle">今日供应</text>
    <line x1="20" y1="45" x2="230" y2="45" stroke="#3a3830" stroke-width="1"/>
    
    <!-- 菜单项 -->
    <text x="30" y="75" font-family="Noto Sans SC" font-size="14" fill="#C8B898">豆浆</text>
    <text x="220" y="75" font-family="Noto Sans SC" font-size="12" fill="#A89878" text-anchor="end">2</text>
    <text x="30" y="100" font-family="Noto Sans SC" font-size="14" fill="#C8B898">油条</text>
    <text x="220" y="100" font-family="Noto Sans SC" font-size="12" fill="#A89878" text-anchor="end">1.5</text>
    <text x="30" y="125" font-family="Noto Sans SC" font-size="14" fill="#C8B898">包子</text>
    <text x="220" y="125" font-family="Noto Sans SC" font-size="12" fill="#A89878" text-anchor="end">3</text>
    <text x="30" y="150" font-family="Noto Sans SC" font-size="14" fill="#C8B898">米粥</text>
    <text x="220" y="150" font-family="Noto Sans SC" font-size="12" fill="#A89878" text-anchor="end">2.5</text>
    
    <!-- 价格微妙错位 -->
    <text x="30" y="170" font-family="Noto Sans SC" font-size="11" fill="#686860" opacity="0.4">(昨日价)</text>
  </g>
  
  <!-- 货架 -->
  <g transform="translate(400, 200)">
    <rect x="0" y="0" width="200" height="150" fill="#2a2820" stroke="#3a3830" stroke-width="1"/>
    <!-- 层板 -->
    <line x1="0" y1="50" x2="200" y2="50" stroke="#3a3830" stroke-width="2"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#3a3830" stroke-width="2"/>
    <!-- 罐子 -->
    <rect x="20" y="15" width="30" height="30" rx="3" fill="#4a4840"/>
    <rect x="60" y="10" width="35" height="35" rx="3" fill="#5a5850"/>
    <rect x="110" y="18" width="28" height="28" rx="3" fill="#4a4840"/>
    <rect x="150" y="12" width="32" height="34" rx="3" fill="#5a5850"/>
    <!-- 碗碟 -->
    <ellipse cx="40" cy="72" rx="25" ry="8" fill="#E8E4D8"/>
    <ellipse cx="100" cy="75" rx="30" ry="10" fill="#D8D4C8"/>
    <ellipse cx="160" cy="72" rx="25" ry="8" fill="#E8E4D8"/>
  </g>
  
  <!-- ===== 柜台 ===== -->
  <g transform="translate(80, 550)">
    <rect x="0" y="0" width="590" height="100" rx="4" fill="url(#woodGrain)" stroke="#2a2018" stroke-width="2"/>
    <rect x="0" y="0" width="590" height="15" rx="4" fill="#4a4038"/>
    
    <!-- 柜台上的物品 -->
    <!-- 收银机 -->
    <g transform="translate(450, -60)">
      <rect x="0" y="0" width="80" height="50" rx="3" fill="#3a3a48" stroke="#4a4a58" stroke-width="1"/>
      <rect x="10" y="8" width="60" height="25" rx="2" fill="#1a1a24"/>
      <text x="40" y="25" font-family="monospace" font-size="10" fill="#00FFAA" text-anchor="middle">0.00</text>
      <rect x="10" y="38" width="25" height="8" rx="1" fill="#4a4a58"/>
    </g>
    
    <!-- 蒸笼 -->
    <g transform="translate(150, -80)">
      <ellipse cx="50" cy="70" rx="45" ry="15" fill="#8B7355"/>
      <rect x="5" y="20" width="90" height="50" fill="#A89060" stroke="#8B7355" stroke-width="1"/>
      <ellipse cx="50" cy="20" rx="45" ry="15" fill="#C8B080"/>
      <!-- 蒸汽 -->
      <g opacity="0.3">
        <path d="M30 10 Q25 0, 30 -10" fill="none" stroke="#E8E8E8" stroke-width="2">
          <animate attributeName="d" values="M30 10 Q25 0, 30 -10;M30 10 Q35 0, 30 -10;M30 10 Q25 0, 30 -10" dur="2s" repeatCount="indefinite"/>
        </path>
        <path d="M50 8 Q45 -2, 50 -12" fill="none" stroke="#E8E8E8" stroke-width="2">
          <animate attributeName="d" values="M50 8 Q45 -2, 50 -12;M50 8 Q55 -2, 50 -12;M50 8 Q45 -2, 50 -12" dur="2.5s" repeatCount="indefinite"/>
        </path>
        <path d="M70 10 Q65 0, 70 -10" fill="none" stroke="#E8E8E8" stroke-width="2">
          <animate attributeName="d" values="M70 10 Q65 0, 70 -10;M70 10 Q75 0, 70 -10;M70 10 Q65 0, 70 -10" dur="1.8s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
    
    <!-- 碗筷 -->
    <g transform="translate(300, -40)">
      <ellipse cx="25" cy="30" rx="30" ry="12" fill="#E8E4D8" stroke="#C8C4B8" stroke-width="1"/>
      <ellipse cx="25" cy="25" rx="25" ry="10" fill="#F0ECE0"/>
    </g>
  </g>
  
  <!-- ===== 座椅区 ===== -->
  
  <!-- 桌子1 -->
  <g transform="translate(100, 750)">
    <rect x="0" y="0" width="180" height="120" rx="4" fill="url(#woodGrain)" stroke="#2a2018" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="10" fill="#4a4038"/>
    <!-- 桌上餐具 -->
    <ellipse cx="50" cy="50" rx="25" ry="10" fill="#E8E4D8"/>
    <ellipse cx="130" cy="55" rx="20" ry="8" fill="#E8E4D8"/>
  </g>
  
  <!-- 凳子 -->
  <g transform="translate(60, 880)">
    <rect x="0" y="0" width="50" height="10" rx="2" fill="#5a5048"/>
    <rect x="20" y="10" width="10" height="40" fill="#4a4038"/>
  </g>
  <g transform="translate(220, 880)">
    <rect x="0" y="0" width="50" height="10" rx="2" fill="#5a5048"/>
    <rect x="20" y="10" width="10" height="40" fill="#4a4038"/>
  </g>
  
  <!-- 桌子2 -->
  <g transform="translate(400, 800)">
    <rect x="0" y="0" width="200" height="130" rx="4" fill="url(#woodGrain)" stroke="#2a2018" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="10" fill="#4a4038"/>
  </g>
  
  <!-- ===== 地面 ===== -->
  <rect x="0" y="1000" width="750" height="334" fill="#14120e"/>
  
  <!-- 地砖线 -->
  <g stroke="#1e1c18" stroke-width="1">
    <line x1="0" y1="1100" x2="750" y2="1100"/>
    <line x1="0" y1="1200" x2="750" y2="1200"/>
    <line x1="150" y1="1000" x2="150" y2="1334"/>
    <line x1="300" y1="1000" x2="300" y2="1334"/>
    <line x1="450" y1="1000" x2="450" y2="1334"/>
    <line x1="600" y1="1000" x2="600" y2="1334"/>
  </g>
  
  <!-- ===== 窗户透光 ===== -->
  <g transform="translate(0, 400)">
    <rect x="0" y="0" width="50" height="200" fill="#2a2820"/>
    <rect x="5" y="10" width="40" height="80" fill="#1a2025" opacity="0.5"/>
    <rect x="5" y="100" width="40" height="90" fill="#1a2025" opacity="0.5"/>
  </g>
  
  <!-- 外部光线 -->
  <polygon points="0,400 50,410 50,590 0,600" fill="#3a4550" opacity="0.1"/>
  
  <!-- ===== 氛围 ===== -->
  
  <!-- 温暖渐变遮罩 -->
  <rect x="0" y="0" width="750" height="1334" fill="#FFDD88" opacity="0.02"/>
  
  <!-- 底部渐变 -->
  <defs>
    <linearGradient id="bottomFade2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#12100c;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#12100c;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <rect x="0" y="1150" width="750" height="184" fill="url(#bottomFade2)"/>
</svg>

