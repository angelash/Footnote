<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- C0-Z3 薄墙巷口
  尺寸: 750×1334px（竖屏）
  场景: 薄墙、回声区域，首次异常暗示
  氛围: 诡异微妙，墙体透明感
-->
<svg width="750" height="1334" viewBox="0 0 750 1334" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 巷子背景 -->
    <linearGradient id="alleyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c12"/>
      <stop offset="100%" style="stop-color:#08080c"/>
    </linearGradient>
    
    <!-- 薄墙透明效果 -->
    <linearGradient id="thinWallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a24;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1e1e28;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#1a1a24;stop-opacity:1"/>
    </linearGradient>
    
    <!-- 深度透视效果 -->
    <filter id="depthBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 回声波纹 -->
    <filter id="echoWave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    
    <!-- 砖墙纹理 -->
    <pattern id="brickPattern" patternUnits="userSpaceOnUse" width="60" height="30">
      <rect width="60" height="30" fill="#1a1a24"/>
      <rect x="0" y="0" width="28" height="13" fill="#1e1e28" stroke="#14141c" stroke-width="1"/>
      <rect x="30" y="0" width="28" height="13" fill="#1e1e28" stroke="#14141c" stroke-width="1"/>
      <rect x="15" y="15" width="28" height="13" fill="#1e1e28" stroke="#14141c" stroke-width="1"/>
      <rect x="45" y="15" width="13" height="13" fill="#1e1e28" stroke="#14141c" stroke-width="1"/>
      <rect x="0" y="15" width="13" height="13" fill="#1e1e28" stroke="#14141c" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- 主背景 -->
  <rect x="0" y="0" width="750" height="1334" fill="url(#alleyBg)"/>
  
  <!-- 天空一角 -->
  <rect x="200" y="0" width="350" height="150" fill="#0e0e15"/>
  <ellipse cx="375" cy="0" rx="200" ry="80" fill="#12121a"/>
  
  <!-- ===== 左侧墙壁（正常） ===== -->
  <g transform="translate(0, 100)">
    <rect x="0" y="0" width="180" height="1100" fill="url(#brickPattern)"/>
    <rect x="0" y="0" width="180" height="1100" fill="#1a1a24" opacity="0.3"/>
    
    <!-- 墙面污渍 -->
    <ellipse cx="80" cy="400" rx="40" ry="60" fill="#14141c" opacity="0.5"/>
    <ellipse cx="120" cy="700" rx="50" ry="40" fill="#14141c" opacity="0.4"/>
  </g>
  
  <!-- ===== 右侧薄墙（关键异常） ===== -->
  <g transform="translate(570, 100)">
    <!-- 薄墙主体 -->
    <rect x="0" y="0" width="180" height="1100" fill="url(#thinWallGrad)"/>
    
    <!-- 砖纹（透明感） -->
    <rect x="0" y="0" width="180" height="1100" fill="url(#brickPattern)" opacity="0.4"/>
    
    <!-- 透视内部结构（深度感知预告） -->
    <g opacity="0.15" filter="url(#depthBlur)">
      <!-- 管道暗示 -->
      <line x1="40" y1="200" x2="40" y2="600" stroke="#00FFAA" stroke-width="3"/>
      <line x1="100" y1="300" x2="100" y2="800" stroke="#00FFAA" stroke-width="2"/>
      <!-- 框架结构 -->
      <rect x="20" y="400" width="80" height="150" fill="none" stroke="#00FFAA" stroke-width="1" stroke-dasharray="5 5"/>
    </g>
    
    <!-- 墙体厚度不一致暗示 -->
    <g opacity="0.3">
      <rect x="50" y="500" width="80" height="200" fill="#0e0e14"/>
      <text x="90" y="600" font-family="monospace" font-size="8" fill="#4A9EFF" text-anchor="middle" opacity="0.5">厚度异常</text>
    </g>
  </g>
  
  <!-- ===== 巷子地面 ===== -->
  <rect x="180" y="800" width="390" height="534" fill="#0e0e14"/>
  
  <!-- 地面透视线 -->
  <g stroke="#1a1a24" stroke-width="1">
    <line x1="180" y1="900" x2="570" y2="900"/>
    <line x1="180" y1="1000" x2="570" y2="1000"/>
    <line x1="180" y1="1100" x2="570" y2="1100"/>
    <line x1="180" y1="1200" x2="570" y2="1200"/>
  </g>
  
  <!-- 积水反光 -->
  <ellipse cx="375" cy="1000" rx="120" ry="30" fill="#1a1a28" opacity="0.5"/>
  <ellipse cx="375" cy="1000" rx="80" ry="20" fill="#2a2a38" opacity="0.3"/>
  
  <!-- ===== 回声区域效果 ===== -->
  <g transform="translate(375, 600)">
    <!-- 回声波纹 -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00FFAA" stroke-width="1" opacity="0">
      <animate attributeName="r" values="20;80;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00FFAA" stroke-width="1" opacity="0">
      <animate attributeName="r" values="10;60;10" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#00FFAA" stroke-width="1" opacity="0">
      <animate attributeName="r" values="5;40;5" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0;0.15" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 回声图标 -->
    <text x="0" y="5" font-family="Noto Sans SC" font-size="12" fill="#00FFAA" text-anchor="middle" opacity="0.4">回声区</text>
  </g>
  
  <!-- ===== 巷口入口 ===== -->
  <g transform="translate(200, 150)">
    <!-- 门框 -->
    <rect x="0" y="0" width="350" height="500" fill="#0a0a0f"/>
    <rect x="10" y="10" width="330" height="480" fill="#08080c"/>
    
    <!-- 远处走廊 -->
    <rect x="100" y="100" width="150" height="300" fill="#0c0c12"/>
    <rect x="120" y="120" width="110" height="260" fill="#0a0a0f"/>
  </g>
  
  <!-- ===== 路灯 ===== -->
  <g transform="translate(250, 300)">
    <rect x="0" y="0" width="8" height="200" fill="#2a2a35"/>
    <ellipse cx="4" cy="-20" rx="25" ry="15" fill="#1e1e28" stroke="#2a2a35" stroke-width="1"/>
    <!-- 灯光 -->
    <ellipse cx="4" cy="50" rx="60" ry="100" fill="#FFDD88" opacity="0.03"/>
    <circle cx="4" cy="-15" r="8" fill="#FFDD88" opacity="0.3"/>
  </g>
  
  <!-- ===== 警示标记 ===== -->
  <g transform="translate(500, 750)">
    <rect x="0" y="0" width="60" height="40" rx="4" fill="#1a1a24" stroke="#FF4444" stroke-width="1" opacity="0.6"/>
    <text x="30" y="25" font-family="Noto Sans SC" font-size="10" fill="#FF4444" text-anchor="middle" opacity="0.8">薄墙</text>
  </g>
  
  <!-- ===== 氛围效果 ===== -->
  
  <!-- 雾气 -->
  <g opacity="0.1">
    <ellipse cx="300" cy="900" rx="200" ry="100" fill="#E8E6E3"/>
    <ellipse cx="450" cy="1100" rx="150" ry="80" fill="#E8E6E3"/>
  </g>
  
  <!-- 微尘 -->
  <g opacity="0.4">
    <circle cx="300" cy="500" r="1" fill="#E8E6E3">
      <animate attributeName="cy" values="500;450;500" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="600" r="0.8" fill="#E8E6E3">
      <animate attributeName="cy" values="600;550;600" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="700" r="1.2" fill="#00FFAA">
      <animate attributeName="cy" values="700;640;700" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 底部渐变 -->
  <defs>
    <linearGradient id="bottomFade3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#08080c;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#08080c;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <rect x="0" y="1150" width="750" height="184" fill="url(#bottomFade3)"/>
</svg>

