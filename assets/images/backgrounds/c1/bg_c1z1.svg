<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- C1-Z1 市政办事厅
  尺寸: 750×1334px（竖屏）
  场景: 取号机、窗口，官僚机器
  氛围: 冷光、秩序压迫感
-->
<svg width="750" height="1334" viewBox="0 0 750 1334" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 大厅背景 -->
    <linearGradient id="hallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c14"/>
      <stop offset="100%" style="stop-color:#08080e"/>
    </linearGradient>
    
    <!-- 冷光效果 -->
    <radialGradient id="coldLight" cx="50%" cy="10%" r="60%">
      <stop offset="0%" style="stop-color:#1a1a28;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0c0c14;stop-opacity:1"/>
    </radialGradient>
    
    <!-- 荧光灯 -->
    <filter id="fluorescentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 主背景 -->
  <rect x="0" y="0" width="750" height="1334" fill="url(#hallBg)"/>
  <rect x="0" y="0" width="750" height="400" fill="url(#coldLight)"/>
  
  <!-- ===== 天花板荧光灯阵列 ===== -->
  <g filter="url(#fluorescentGlow)">
    <rect x="100" y="30" width="200" height="12" rx="2" fill="#E8E8F0" opacity="0.15"/>
    <rect x="130" y="33" width="140" height="6" fill="#F0F0FF" opacity="0.3"/>
    
    <rect x="350" y="30" width="200" height="12" rx="2" fill="#E8E8F0" opacity="0.15"/>
    <rect x="380" y="33" width="140" height="6" fill="#F0F0FF" opacity="0.3"/>
    
    <rect x="100" y="80" width="200" height="12" rx="2" fill="#E8E8F0" opacity="0.12"/>
    <rect x="350" y="80" width="200" height="12" rx="2" fill="#E8E8F0" opacity="0.12"/>
  </g>
  
  <!-- ===== 服务窗口墙 ===== -->
  <rect x="50" y="150" width="650" height="350" fill="#12121a" stroke="#1e1e28" stroke-width="2"/>
  
  <!-- 窗口1 -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="180" height="250" rx="4" fill="#1a1a24" stroke="#2a2a35" stroke-width="2"/>
    <rect x="10" y="10" width="160" height="150" rx="2" fill="#0e0e14"/>
    <!-- 玻璃 -->
    <rect x="10" y="10" width="160" height="150" rx="2" fill="#4A9EFF" opacity="0.03"/>
    <!-- 窗口编号 -->
    <rect x="60" y="170" width="60" height="30" rx="4" fill="#4A9EFF" opacity="0.2"/>
    <text x="90" y="190" font-family="monospace" font-size="16" fill="#4A9EFF" text-anchor="middle">01</text>
    <!-- 状态 -->
    <circle cx="150" y="230" r="8" fill="#00CC66">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="235" font-family="Noto Sans SC" font-size="10" fill="#E8E6E3" text-anchor="middle">办理中</text>
  </g>
  
  <!-- 窗口2 -->
  <g transform="translate(285, 180)">
    <rect x="0" y="0" width="180" height="250" rx="4" fill="#1a1a24" stroke="#2a2a35" stroke-width="2"/>
    <rect x="10" y="10" width="160" height="150" rx="2" fill="#0e0e14"/>
    <rect x="10" y="10" width="160" height="150" rx="2" fill="#4A9EFF" opacity="0.03"/>
    <rect x="60" y="170" width="60" height="30" rx="4" fill="#4A9EFF" opacity="0.2"/>
    <text x="90" y="190" font-family="monospace" font-size="16" fill="#4A9EFF" text-anchor="middle">02</text>
    <circle cx="150" cy="230" r="8" fill="#FFAA00" opacity="0.6"/>
    <text x="90" y="235" font-family="Noto Sans SC" font-size="10" fill="#686868" text-anchor="middle">等待</text>
  </g>
  
  <!-- 窗口3 -->
  <g transform="translate(490, 180)">
    <rect x="0" y="0" width="180" height="250" rx="4" fill="#1a1a24" stroke="#2a2a35" stroke-width="2"/>
    <rect x="10" y="10" width="160" height="150" rx="2" fill="#0e0e14"/>
    <rect x="10" y="10" width="160" height="150" rx="2" fill="#4A9EFF" opacity="0.03"/>
    <rect x="60" y="170" width="60" height="30" rx="4" fill="#686868" opacity="0.2"/>
    <text x="90" y="190" font-family="monospace" font-size="16" fill="#686868" text-anchor="middle">03</text>
    <circle cx="150" cy="230" r="8" fill="#686868" opacity="0.3"/>
    <text x="90" y="235" font-family="Noto Sans SC" font-size="10" fill="#4a4a50" text-anchor="middle">暂停</text>
  </g>
  
  <!-- ===== 叫号显示屏 ===== -->
  <g transform="translate(250, 520)">
    <rect x="0" y="0" width="250" height="100" rx="6" fill="#1a1a24" stroke="#4A9EFF" stroke-width="2"/>
    <rect x="10" y="10" width="230" height="80" rx="4" fill="#0a0a0f"/>
    <text x="125" y="40" font-family="Noto Sans SC" font-size="14" fill="#686868" text-anchor="middle">当前叫号</text>
    <text x="125" y="75" font-family="monospace" font-size="32" fill="#00FFAA" text-anchor="middle">A-042</text>
  </g>
  
  <!-- ===== 取号机 ===== -->
  <g transform="translate(580, 550)">
    <rect x="0" y="0" width="100" height="200" rx="6" fill="#2a2a35" stroke="#3a3a48" stroke-width="2"/>
    <rect x="15" y="25" width="70" height="60" rx="4" fill="#1a1a24"/>
    <text x="50" y="60" font-family="monospace" font-size="14" fill="#4A9EFF" text-anchor="middle">取号</text>
    
    <!-- 按钮区 -->
    <rect x="20" y="100" width="60" height="40" rx="4" fill="#4A9EFF" opacity="0.2"/>
    <text x="50" y="125" font-family="Noto Sans SC" font-size="11" fill="#4A9EFF" text-anchor="middle">点击</text>
    
    <!-- 出票口 -->
    <rect x="25" y="155" width="50" height="10" rx="2" fill="#1a1a24"/>
    
    <!-- 号票 -->
    <g transform="translate(30, 145)">
      <rect x="0" y="0" width="40" height="25" fill="#E8E6E3" rx="2"/>
      <text x="20" y="17" font-family="monospace" font-size="10" fill="#1a1a24" text-anchor="middle">A-043</text>
    </g>
  </g>
  
  <!-- ===== 等候区座椅 ===== -->
  <g transform="translate(80, 750)">
    <!-- 座椅排1 -->
    <rect x="0" y="0" width="250" height="50" rx="4" fill="#2a2a35"/>
    <rect x="260" y="0" width="250" height="50" rx="4" fill="#2a2a35"/>
    
    <!-- 座椅排2 -->
    <rect x="0" y="100" width="250" height="50" rx="4" fill="#2a2a35"/>
    <rect x="260" y="100" width="250" height="50" rx="4" fill="#2a2a35"/>
  </g>
  
  <!-- ===== 地面 ===== -->
  <rect x="0" y="950" width="750" height="384" fill="#0a0a10"/>
  
  <!-- 地面标线 -->
  <g stroke="#1a1a24" stroke-width="1">
    <line x1="0" y1="1050" x2="750" y2="1050"/>
    <line x1="0" y1="1150" x2="750" y2="1150"/>
    <line x1="0" y1="1250" x2="750" y2="1250"/>
  </g>
  
  <!-- 排队标记 -->
  <g transform="translate(300, 1000)">
    <rect x="0" y="0" width="150" height="8" fill="#4A9EFF" opacity="0.1"/>
    <text x="75" y="-5" font-family="Noto Sans SC" font-size="10" fill="#4A9EFF" text-anchor="middle" opacity="0.5">请在此等候</text>
  </g>
  
  <!-- ===== 氛围 ===== -->
  
  <!-- 底部渐变 -->
  <defs>
    <linearGradient id="bottomFadeC1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#08080e;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#08080e;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <rect x="0" y="1150" width="750" height="184" fill="url(#bottomFadeC1)"/>
</svg>

