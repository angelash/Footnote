<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- C1-Z3 医疗站
  尺寸: 750×1334px（竖屏）
  场景: 诊室、病床、医疗设备
  氛围: 清冷、消毒气息、隐性对齐
-->
<svg width="750" height="1334" viewBox="0 0 750 1334" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 医疗站背景 -->
    <linearGradient id="medicalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0e12"/>
      <stop offset="100%" style="stop-color:#080a0e"/>
    </linearGradient>
    
    <!-- 医疗蓝光 -->
    <radialGradient id="medicalLight" cx="50%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#1a2030;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0c0e12;stop-opacity:1"/>
    </radialGradient>
    
    <!-- 消毒灯光 -->
    <filter id="sanitizeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 主背景 -->
  <rect x="0" y="0" width="750" height="1334" fill="url(#medicalBg)"/>
  <rect x="0" y="0" width="750" height="500" fill="url(#medicalLight)"/>
  
  <!-- ===== 天花板 ===== -->
  <rect x="0" y="0" width="750" height="100" fill="#0e1015"/>
  
  <!-- 消毒灯 -->
  <g filter="url(#sanitizeGlow)">
    <rect x="200" y="40" width="350" height="20" rx="4" fill="#1a2030" stroke="#4A9EFF" stroke-width="1"/>
    <rect x="220" y="45" width="310" height="10" fill="#4A9EFF" opacity="0.2"/>
  </g>
  
  <!-- ===== 后墙 ===== -->
  <rect x="50" y="100" width="650" height="450" fill="#10141a"/>
  
  <!-- 医疗标志 -->
  <g transform="translate(325, 130)">
    <rect x="0" y="0" width="100" height="80" rx="4" fill="#1a1a24" stroke="#4A9EFF" stroke-width="1"/>
    <!-- 十字 -->
    <rect x="40" y="15" width="20" height="50" fill="#4A9EFF" opacity="0.5"/>
    <rect x="25" y="30" width="50" height="20" fill="#4A9EFF" opacity="0.5"/>
    <text x="50" y="75" font-family="Noto Sans SC" font-size="8" fill="#4A9EFF" text-anchor="middle">医疗站</text>
  </g>
  
  <!-- ===== 诊疗台 ===== -->
  <g transform="translate(100, 250)">
    <rect x="0" y="0" width="250" height="180" rx="4" fill="#1e2530" stroke="#2a3040" stroke-width="2"/>
    
    <!-- 桌面 -->
    <rect x="0" y="0" width="250" height="20" rx="4" fill="#2a3040"/>
    
    <!-- 电脑 -->
    <rect x="20" y="30" width="100" height="70" rx="2" fill="#1a1a24" stroke="#2a2a35" stroke-width="1"/>
    <rect x="25" y="35" width="90" height="55" fill="#0a0a0f"/>
    <text x="70" y="60" font-family="monospace" font-size="8" fill="#4A9EFF" text-anchor="middle">患者档案</text>
    <text x="70" y="75" font-family="monospace" font-size="6" fill="#00FFAA" text-anchor="middle">对齐完成 ✓</text>
    
    <!-- 文件 -->
    <rect x="140" y="35" width="80" height="60" rx="2" fill="#E8D4A0" opacity="0.7"/>
    <line x1="150" y1="50" x2="210" y2="50" stroke="#1a1a24" stroke-width="0.5"/>
    <line x1="150" y1="60" x2="210" y2="60" stroke="#1a1a24" stroke-width="0.5"/>
    <line x1="150" y1="70" x2="200" y2="70" stroke="#1a1a24" stroke-width="0.5"/>
    
    <!-- 抽屉 -->
    <rect x="20" y="120" width="80" height="40" rx="2" fill="#1e2530" stroke="#2a3040" stroke-width="1"/>
    <rect x="110" y="120" width="80" height="40" rx="2" fill="#1e2530" stroke="#2a3040" stroke-width="1"/>
  </g>
  
  <!-- ===== 病床 ===== -->
  <g transform="translate(400, 280)">
    <rect x="0" y="0" width="280" height="150" rx="4" fill="#1e2530" stroke="#2a3040" stroke-width="2"/>
    
    <!-- 床面 -->
    <rect x="10" y="10" width="260" height="100" rx="4" fill="#2a3040"/>
    <rect x="20" y="20" width="240" height="80" rx="2" fill="#3a4050"/>
    
    <!-- 枕头 -->
    <rect x="30" y="30" width="60" height="40" rx="8" fill="#E8E6E3" opacity="0.8"/>
    
    <!-- 床头设备 -->
    <rect x="250" y="0" width="30" height="70" rx="2" fill="#1a2030" stroke="#2a3040" stroke-width="1"/>
    <circle cx="265" cy="20" r="6" fill="#00CC66" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="265" y="45" font-family="monospace" font-size="6" fill="#00CC66" text-anchor="middle">正常</text>
  </g>
  
  <!-- ===== 药品柜 ===== -->
  <g transform="translate(50, 460)">
    <rect x="0" y="0" width="150" height="200" rx="4" fill="#1e2530" stroke="#2a3040" stroke-width="2"/>
    
    <!-- 玻璃门 -->
    <rect x="10" y="10" width="130" height="180" rx="2" fill="#1a2030" stroke="#3a4050" stroke-width="1"/>
    <rect x="10" y="10" width="130" height="180" rx="2" fill="#4A9EFF" opacity="0.02"/>
    
    <!-- 药瓶 -->
    <g transform="translate(20, 25)">
      <rect x="0" y="0" width="20" height="35" rx="2" fill="#4A9EFF" opacity="0.3"/>
      <rect x="30" y="0" width="20" height="35" rx="2" fill="#00FFAA" opacity="0.3"/>
      <rect x="60" y="0" width="20" height="35" rx="2" fill="#FF6666" opacity="0.3"/>
      <rect x="90" y="0" width="20" height="35" rx="2" fill="#4A9EFF" opacity="0.3"/>
    </g>
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="20" height="35" rx="2" fill="#00FFAA" opacity="0.3"/>
      <rect x="30" y="0" width="20" height="35" rx="2" fill="#4A9EFF" opacity="0.3"/>
      <rect x="60" y="0" width="20" height="35" rx="2" fill="#FFAA00" opacity="0.3"/>
    </g>
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="20" height="35" rx="2" fill="#FF6666" opacity="0.3"/>
      <rect x="30" y="0" width="20" height="35" rx="2" fill="#4A9EFF" opacity="0.3"/>
      <rect x="60" y="0" width="20" height="35" rx="2" fill="#00FFAA" opacity="0.3"/>
      <rect x="90" y="0" width="20" height="35" rx="2" fill="#FFAA00" opacity="0.3"/>
    </g>
  </g>
  
  <!-- ===== 心理咨询区暗示 ===== -->
  <g transform="translate(550, 480)">
    <rect x="0" y="0" width="150" height="180" rx="4" fill="#1e2530" stroke="#2a3040" stroke-width="1" opacity="0.5"/>
    <text x="75" y="90" font-family="Noto Sans SC" font-size="10" fill="#686868" text-anchor="middle">对齐室</text>
    <text x="75" y="110" font-family="Noto Sans SC" font-size="8" fill="#4A9EFF" text-anchor="middle" opacity="0.5">预约中...</text>
    
    <!-- 门帘效果 -->
    <g opacity="0.3">
      <line x1="20" y1="0" x2="20" y2="180" stroke="#4A9EFF" stroke-width="1" stroke-dasharray="5 5"/>
      <line x1="50" y1="0" x2="50" y2="180" stroke="#4A9EFF" stroke-width="1" stroke-dasharray="5 5"/>
      <line x1="80" y1="0" x2="80" y2="180" stroke="#4A9EFF" stroke-width="1" stroke-dasharray="5 5"/>
      <line x1="110" y1="0" x2="110" y2="180" stroke="#4A9EFF" stroke-width="1" stroke-dasharray="5 5"/>
      <line x1="140" y1="0" x2="140" y2="180" stroke="#4A9EFF" stroke-width="1" stroke-dasharray="5 5"/>
    </g>
  </g>
  
  <!-- ===== 等候椅 ===== -->
  <g transform="translate(220, 700)">
    <rect x="0" y="0" width="310" height="50" rx="4" fill="#2a3040"/>
    <rect x="0" y="50" width="310" height="40" rx="4" fill="#1e2530"/>
  </g>
  
  <!-- ===== 地面 ===== -->
  <rect x="0" y="800" width="750" height="534" fill="#0a0c10"/>
  
  <!-- 地板格 -->
  <g stroke="#14181e" stroke-width="1">
    <line x1="0" y1="900" x2="750" y2="900"/>
    <line x1="0" y1="1000" x2="750" y2="1000"/>
    <line x1="0" y1="1100" x2="750" y2="1100"/>
    <line x1="0" y1="1200" x2="750" y2="1200"/>
  </g>
  
  <!-- 消毒区标识 -->
  <g transform="translate(300, 820)">
    <rect x="0" y="0" width="150" height="40" rx="4" fill="#1e2530" stroke="#4A9EFF" stroke-width="1"/>
    <text x="75" y="25" font-family="Noto Sans SC" font-size="12" fill="#4A9EFF" text-anchor="middle">消毒区</text>
  </g>
  
  <!-- ===== 氛围效果 ===== -->
  
  <!-- 蓝光环境 -->
  <rect x="0" y="0" width="750" height="1334" fill="#4A9EFF" opacity="0.01"/>
  
  <!-- 底部渐变 -->
  <defs>
    <linearGradient id="bottomFadeMed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#080a0e;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#080a0e;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <rect x="0" y="1150" width="750" height="184" fill="url(#bottomFadeMed)"/>
</svg>

