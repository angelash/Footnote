<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- C1-Z4 旧地图摊
  尺寸: 750×1334px（竖屏）
  场景: 地图卷轴、暖光、纸张质感
  氛围: 学术、温暖、差异金暗示
-->
<svg width="750" height="1334" viewBox="0 0 750 1334" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 温暖背景 -->
    <linearGradient id="mapShopBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14120e"/>
      <stop offset="100%" style="stop-color:#0e0c08"/>
    </linearGradient>
    
    <!-- 暖光 -->
    <radialGradient id="warmLight" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#2a2418;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#14120e;stop-opacity:1"/>
    </radialGradient>
    
    <!-- 纸张质感 -->
    <filter id="paperTexture2">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#E8D4A0" surfaceScale="2" result="light">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1" k2="0" k3="0" k4="0"/>
    </filter>
    
    <!-- 差异金发光 -->
    <filter id="diffGoldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 主背景 -->
  <rect x="0" y="0" width="750" height="1334" fill="url(#mapShopBg)"/>
  <rect x="0" y="0" width="750" height="600" fill="url(#warmLight)"/>
  
  <!-- ===== 油灯光源 ===== -->
  <g transform="translate(375, 80)">
    <ellipse cx="0" cy="0" rx="200" ry="150" fill="#FFDD88" opacity="0.03"/>
    <ellipse cx="0" cy="0" rx="100" ry="80" fill="#FFDD88" opacity="0.05"/>
    
    <!-- 油灯 -->
    <rect x="-15" y="-40" width="30" height="50" rx="4" fill="#8B7355" stroke="#6B5345" stroke-width="1"/>
    <ellipse cx="0" cy="-50" rx="8" ry="12" fill="#FFDD88" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M0 -55 Q-3 -65, 0 -70 Q3 -65, 0 -55" fill="#FF8844" opacity="0.6">
      <animate attributeName="d" values="M0 -55 Q-3 -65, 0 -70 Q3 -65, 0 -55;M0 -55 Q-4 -68, 0 -75 Q4 -68, 0 -55;M0 -55 Q-3 -65, 0 -70 Q3 -65, 0 -55" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- ===== 后墙书架 ===== -->
  <rect x="50" y="120" width="650" height="400" fill="#1a1612" stroke="#2a2420" stroke-width="2"/>
  
  <!-- 书架横板 -->
  <g fill="#3a3228" stroke="#2a2420" stroke-width="1">
    <rect x="60" y="200" width="630" height="15"/>
    <rect x="60" y="320" width="630" height="15"/>
    <rect x="60" y="440" width="630" height="15"/>
  </g>
  
  <!-- 卷轴架 -->
  <g transform="translate(70, 140)">
    <g transform="translate(0, 0)">
      <ellipse cx="15" cy="25" rx="15" ry="25" fill="#E8D4A0" opacity="0.8"/>
      <ellipse cx="15" cy="25" rx="10" ry="20" fill="#C8B480"/>
    </g>
    <g transform="translate(50, 5)">
      <ellipse cx="15" cy="25" rx="15" ry="25" fill="#D4C090" opacity="0.8"/>
      <ellipse cx="15" cy="25" rx="10" ry="20" fill="#B8A470"/>
    </g>
    <g transform="translate(100, -5)">
      <ellipse cx="15" cy="25" rx="15" ry="25" fill="#E8D4A0" opacity="0.8"/>
      <ellipse cx="15" cy="25" rx="10" ry="20" fill="#C8B480"/>
    </g>
  </g>
  
  <!-- 书籍 -->
  <g transform="translate(400, 150)">
    <rect x="0" y="0" width="20" height="45" fill="#8B4513"/>
    <rect x="25" y="5" width="18" height="40" fill="#4A6B8B"/>
    <rect x="48" y="0" width="22" height="45" fill="#6B4B3B"/>
    <rect x="75" y="8" width="16" height="37" fill="#4B6B4B"/>
  </g>
  
  <!-- ===== 地图展示桌 ===== -->
  <g transform="translate(100, 550)">
    <!-- 桌面 -->
    <rect x="0" y="0" width="550" height="250" rx="4" fill="#3a3228" stroke="#4a4238" stroke-width="2"/>
    
    <!-- 展开的地图 -->
    <g transform="translate(30, 20)">
      <rect x="0" y="0" width="400" height="200" rx="4" fill="#E8D4A0" stroke="#C8B480" stroke-width="1"/>
      
      <!-- 地图内容 -->
      <g stroke="#8B7355" stroke-width="1" fill="none" opacity="0.6">
        <!-- 区域划分 -->
        <path d="M50 50 L150 40 L200 80 L180 150"/>
        <path d="M200 80 L300 60 L350 100 L320 180"/>
        <path d="M100 100 L180 150 L200 180"/>
        
        <!-- 道路 -->
        <path d="M20 100 L100 90 L200 100 L380 95" stroke-dasharray="5 3"/>
      </g>
      
      <!-- 差异标记（金色） -->
      <g filter="url(#diffGoldGlow)">
        <circle cx="150" cy="80" r="8" fill="#FFD700" opacity="0.8">
          <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="280" cy="120" r="6" fill="#FFD700" opacity="0.6"/>
        <circle cx="100" cy="150" r="5" fill="#FFD700" opacity="0.5"/>
      </g>
      
      <!-- 注释 -->
      <text x="160" y="95" font-family="monospace" font-size="8" fill="#FFD700" opacity="0.7">v2≠v1</text>
      
      <!-- 边缘磨损 -->
      <path d="M0 0 L10 5 L5 15" fill="#D4C090" opacity="0.3"/>
      <path d="M400 200 L390 195 L395 185" fill="#D4C090" opacity="0.3"/>
    </g>
    
    <!-- 放大镜 -->
    <g transform="translate(460, 80)">
      <circle cx="25" cy="25" r="20" fill="none" stroke="#8B7355" stroke-width="3"/>
      <line x1="40" y1="40" x2="60" y2="60" stroke="#8B7355" stroke-width="4" stroke-linecap="round"/>
      <circle cx="25" cy="25" r="15" fill="#E8D4A0" opacity="0.1"/>
    </g>
    
    <!-- 测量工具 -->
    <g transform="translate(450, 150)">
      <rect x="0" y="0" width="60" height="8" rx="1" fill="#8B7355"/>
      <g stroke="#E8D4A0" stroke-width="0.5">
        <line x1="5" y1="2" x2="5" y2="6"/>
        <line x1="15" y1="2" x2="15" y2="6"/>
        <line x1="25" y1="2" x2="25" y2="6"/>
        <line x1="35" y1="2" x2="35" y2="6"/>
        <line x1="45" y1="2" x2="45" y2="6"/>
        <line x1="55" y1="2" x2="55" y2="6"/>
      </g>
    </g>
  </g>
  
  <!-- ===== 地面 ===== -->
  <rect x="0" y="850" width="750" height="484" fill="#0c0a06"/>
  
  <!-- 木地板纹理 -->
  <g stroke="#1a1612" stroke-width="1">
    <line x1="0" y1="900" x2="750" y2="900"/>
    <line x1="0" y1="1000" x2="750" y2="1000"/>
    <line x1="0" y1="1100" x2="750" y2="1100"/>
    <line x1="0" y1="1200" x2="750" y2="1200"/>
  </g>
  
  <!-- ===== 散落的卷轴 ===== -->
  <g transform="translate(100, 900)">
    <ellipse cx="20" cy="15" rx="20" ry="15" fill="#E8D4A0" opacity="0.7"/>
    <rect x="5" y="0" width="30" height="30" rx="5" fill="#E8D4A0" opacity="0.6"/>
  </g>
  <g transform="translate(600, 920)">
    <ellipse cx="15" cy="12" rx="15" ry="12" fill="#D4C090" opacity="0.6"/>
  </g>
  
  <!-- ===== 氛围 ===== -->
  
  <!-- 暖色调覆盖 -->
  <rect x="0" y="0" width="750" height="1334" fill="#FFDD88" opacity="0.02"/>
  
  <!-- 底部渐变 -->
  <defs>
    <linearGradient id="bottomFadeMap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a06;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0c0a06;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <rect x="0" y="1150" width="750" height="184" fill="url(#bottomFadeMap)"/>
</svg>

