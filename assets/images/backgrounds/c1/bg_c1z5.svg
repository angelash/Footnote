<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- C1-Z5 礼堂街夜谈
  尺寸: 750×1334px（竖屏）
  场景: 街灯、长凳，夜色朦胧
  氛围: 平静、信仰感、祷文隐现
-->
<svg width="750" height="1334" viewBox="0 0 750 1334" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 夜空 -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14"/>
      <stop offset="40%" style="stop-color:#0e0e18"/>
      <stop offset="100%" style="stop-color:#12121c"/>
    </linearGradient>
    
    <!-- 街灯光晕 -->
    <radialGradient id="streetLampLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFDD88;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#FFDD88;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#FFDD88;stop-opacity:0"/>
    </radialGradient>
    
    <!-- 灯光滤镜 -->
    <filter id="lampBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 夜空背景 -->
  <rect x="0" y="0" width="750" height="1334" fill="url(#nightSky)"/>
  
  <!-- 星星 -->
  <g fill="#E8E6E3" opacity="0.3">
    <circle cx="100" cy="80" r="1"/>
    <circle cx="250" cy="50" r="0.8"/>
    <circle cx="400" cy="90" r="1.2"/>
    <circle cx="550" cy="40" r="0.6"/>
    <circle cx="650" cy="100" r="1"/>
    <circle cx="180" cy="130" r="0.7"/>
    <circle cx="480" cy="120" r="0.9"/>
  </g>
  
  <!-- ===== 礼堂建筑剪影 ===== -->
  <g transform="translate(0, 150)">
    <!-- 礼堂轮廓 -->
    <path d="M100 400 L100 200 L200 100 L375 50 L550 100 L650 200 L650 400" fill="#0e0e14" stroke="#1a1a24" stroke-width="1"/>
    
    <!-- 尖顶 -->
    <polygon points="375,50 350,100 400,100" fill="#0e0e14"/>
    <line x1="375" y1="20" x2="375" y2="50" stroke="#1a1a24" stroke-width="2"/>
    
    <!-- 窗户（微光） -->
    <rect x="200" y="200" width="60" height="100" rx="4" fill="#1a1a28"/>
    <rect x="200" y="200" width="60" height="100" rx="4" fill="#FFDD88" opacity="0.03"/>
    
    <rect x="345" y="180" width="60" height="120" rx="4" fill="#1a1a28"/>
    <rect x="345" y="180" width="60" height="120" rx="4" fill="#FFDD88" opacity="0.05"/>
    
    <rect x="490" y="200" width="60" height="100" rx="4" fill="#1a1a28"/>
    <rect x="490" y="200" width="60" height="100" rx="4" fill="#FFDD88" opacity="0.03"/>
    
    <!-- 门 -->
    <rect x="330" y="320" width="90" height="130" rx="4" fill="#0a0a10"/>
  </g>
  
  <!-- ===== 街灯 ===== -->
  
  <!-- 左侧街灯 -->
  <g transform="translate(150, 400)">
    <!-- 灯柱 -->
    <rect x="0" y="0" width="10" height="350" fill="#2a2a35"/>
    
    <!-- 灯头 -->
    <ellipse cx="5" cy="-20" rx="30" ry="20" fill="#2a2a35" stroke="#3a3a48" stroke-width="1"/>
    
    <!-- 灯光 -->
    <ellipse cx="5" cy="100" rx="150" ry="200" fill="url(#streetLampLight)"/>
    <circle cx="5" cy="-15" r="12" fill="#FFDD88" opacity="0.6" filter="url(#lampBlur)">
      <animate attributeName="opacity" values="0.5;0.7;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 右侧街灯 -->
  <g transform="translate(590, 420)">
    <rect x="0" y="0" width="10" height="330" fill="#2a2a35"/>
    <ellipse cx="5" cy="-20" rx="30" ry="20" fill="#2a2a35" stroke="#3a3a48" stroke-width="1"/>
    <ellipse cx="5" cy="100" rx="150" ry="200" fill="url(#streetLampLight)"/>
    <circle cx="5" cy="-15" r="12" fill="#FFDD88" opacity="0.5" filter="url(#lampBlur)">
      <animate attributeName="opacity" values="0.4;0.6;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- ===== 长凳 ===== -->
  
  <!-- 左侧长凳 -->
  <g transform="translate(80, 800)">
    <rect x="0" y="0" width="180" height="20" rx="3" fill="#3a3530" stroke="#4a4540" stroke-width="1"/>
    <rect x="10" y="20" width="15" height="40" fill="#3a3530"/>
    <rect x="155" y="20" width="15" height="40" fill="#3a3530"/>
    <rect x="0" y="-30" width="180" height="10" rx="2" fill="#3a3530"/>
    <rect x="0" y="-50" width="10" height="60" rx="2" fill="#3a3530"/>
    <rect x="170" y="-50" width="10" height="60" rx="2" fill="#3a3530"/>
  </g>
  
  <!-- 右侧长凳 -->
  <g transform="translate(490, 820)">
    <rect x="0" y="0" width="180" height="20" rx="3" fill="#3a3530" stroke="#4a4540" stroke-width="1"/>
    <rect x="10" y="20" width="15" height="40" fill="#3a3530"/>
    <rect x="155" y="20" width="15" height="40" fill="#3a3530"/>
    <rect x="0" y="-30" width="180" height="10" rx="2" fill="#3a3530"/>
    <rect x="0" y="-50" width="10" height="60" rx="2" fill="#3a3530"/>
    <rect x="170" y="-50" width="10" height="60" rx="2" fill="#3a3530"/>
  </g>
  
  <!-- ===== 地面 ===== -->
  <rect x="0" y="900" width="750" height="434" fill="#0c0c12"/>
  
  <!-- 石板路 -->
  <g stroke="#1a1a24" stroke-width="1" fill="none">
    <rect x="50" y="920" width="100" height="60" rx="2"/>
    <rect x="160" y="920" width="120" height="60" rx="2"/>
    <rect x="290" y="920" width="90" height="60" rx="2"/>
    <rect x="390" y="920" width="110" height="60" rx="2"/>
    <rect x="510" y="920" width="100" height="60" rx="2"/>
    <rect x="620" y="920" width="80" height="60" rx="2"/>
    
    <rect x="80" y="990" width="110" height="70" rx="2"/>
    <rect x="200" y="990" width="130" height="70" rx="2"/>
    <rect x="340" y="990" width="100" height="70" rx="2"/>
    <rect x="450" y="990" width="120" height="70" rx="2"/>
    <rect x="580" y="990" width="100" height="70" rx="2"/>
  </g>
  
  <!-- ===== 祷文浮动效果 ===== -->
  <g font-family="serif" fill="#E8D4A0" opacity="0.15">
    <text x="200" y="650" font-size="14" transform="rotate(-5)">平面即真实</text>
    <text x="450" y="680" font-size="12" transform="rotate(3)">深度是幻象</text>
    <text x="300" y="750" font-size="10" transform="rotate(-2)">回归表面</text>
  </g>
  
  <!-- ===== 氛围 ===== -->
  
  <!-- 薄雾 -->
  <g opacity="0.05">
    <ellipse cx="200" cy="850" rx="200" ry="100" fill="#E8E6E3"/>
    <ellipse cx="550" cy="900" rx="180" ry="80" fill="#E8E6E3"/>
  </g>
  
  <!-- 底部渐变 -->
  <defs>
    <linearGradient id="bottomFadeNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c12;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0c0c12;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <rect x="0" y="1150" width="750" height="184" fill="url(#bottomFadeNight)"/>
</svg>

