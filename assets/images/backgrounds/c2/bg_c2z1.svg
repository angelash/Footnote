<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- C2-Z1 维修局校准室
  尺寸: 750×1334px（竖屏）
  场景: 科技感校准设备，深度感知训练
  氛围: 专业、科技、能力觉醒
-->
<svg width="750" height="1334" viewBox="0 0 750 1334" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 科技背景 -->
    <linearGradient id="techBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e14"/>
      <stop offset="100%" style="stop-color:#060a0e"/>
    </linearGradient>
    
    <!-- 科技蓝发光 -->
    <filter id="techGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 网格线 -->
    <pattern id="techGrid" patternUnits="userSpaceOnUse" width="50" height="50">
      <rect width="50" height="50" fill="none"/>
      <line x1="50" y1="0" x2="50" y2="50" stroke="#4A9EFF" stroke-width="0.5" opacity="0.1"/>
      <line x1="0" y1="50" x2="50" y2="50" stroke="#4A9EFF" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    
    <!-- 深度感知渐变 -->
    <radialGradient id="depthField" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00FFAA;stop-opacity:0.2"/>
      <stop offset="70%" style="stop-color:#00FFAA;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#00FFAA;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- 主背景 -->
  <rect x="0" y="0" width="750" height="1334" fill="url(#techBg)"/>
  
  <!-- 网格覆盖 -->
  <rect x="0" y="0" width="750" height="1334" fill="url(#techGrid)"/>
  
  <!-- ===== 天花板设备 ===== -->
  <g transform="translate(0, 50)">
    <!-- 主灯带 -->
    <rect x="100" y="0" width="550" height="30" rx="4" fill="#1a2030" stroke="#4A9EFF" stroke-width="1"/>
    <rect x="120" y="8" width="510" height="14" fill="#4A9EFF" opacity="0.3"/>
    
    <!-- 扫描轨道 -->
    <rect x="200" y="40" width="350" height="10" rx="2" fill="#1a2030"/>
    <rect x="350" y="42" width="50" height="6" rx="1" fill="#4A9EFF" opacity="0.8">
      <animate attributeName="x" values="200;500;200" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- ===== 校准台 ===== -->
  <g transform="translate(150, 300)">
    <!-- 主控台 -->
    <rect x="0" y="0" width="450" height="200" rx="8" fill="#1a2030" stroke="#2a3040" stroke-width="2"/>
    
    <!-- 屏幕 -->
    <rect x="20" y="20" width="280" height="160" rx="4" fill="#0a0e14" stroke="#4A9EFF" stroke-width="1"/>
    
    <!-- 屏幕内容 -->
    <g transform="translate(30, 35)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#4A9EFF">深度感知校准</text>
      <text x="0" y="25" font-family="monospace" font-size="10" fill="#00FFAA">状态: 就绪</text>
      
      <!-- 波形图 -->
      <path d="M0 60 Q30 40, 60 60 Q90 80, 120 60 Q150 40, 180 60 Q210 80, 240 60" fill="none" stroke="#00FFAA" stroke-width="1.5">
        <animate attributeName="d" values="M0 60 Q30 40, 60 60 Q90 80, 120 60 Q150 40, 180 60 Q210 80, 240 60;M0 60 Q30 80, 60 60 Q90 40, 120 60 Q150 80, 180 60 Q210 40, 240 60;M0 60 Q30 40, 60 60 Q90 80, 120 60 Q150 40, 180 60 Q210 80, 240 60" dur="2s" repeatCount="indefinite"/>
      </path>
      
      <!-- 数值 -->
      <text x="0" y="100" font-family="monospace" font-size="10" fill="#686868">灵敏度: 78%</text>
      <text x="130" y="100" font-family="monospace" font-size="10" fill="#686868">深度: 3.2m</text>
    </g>
    
    <!-- 控制面板 -->
    <g transform="translate(320, 30)">
      <rect x="0" y="0" width="110" height="140" rx="4" fill="#0e1418" stroke="#2a3040" stroke-width="1"/>
      
      <!-- 按钮 -->
      <circle cx="30" cy="35" r="15" fill="#2a3040" stroke="#4A9EFF" stroke-width="1"/>
      <circle cx="80" cy="35" r="15" fill="#2a3040" stroke="#4A9EFF" stroke-width="1"/>
      <circle cx="30" cy="85" r="15" fill="#00FFAA" opacity="0.3"/>
      <circle cx="80" cy="85" r="15" fill="#2a3040" stroke="#686868" stroke-width="1"/>
      
      <!-- 滑块 -->
      <rect x="20" y="110" width="70" height="8" rx="2" fill="#1a2030"/>
      <rect x="50" y="108" width="15" height="12" rx="2" fill="#4A9EFF"/>
    </g>
  </g>
  
  <!-- ===== 校准区域 ===== -->
  <g transform="translate(200, 550)">
    <!-- 平台 -->
    <ellipse cx="175" cy="200" rx="150" ry="40" fill="#1a2030" stroke="#2a3040" stroke-width="2"/>
    
    <!-- 深度场 -->
    <ellipse cx="175" cy="100" rx="120" ry="120" fill="url(#depthField)" filter="url(#techGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- 扫描环 -->
    <g stroke="#00FFAA" stroke-width="1.5" fill="none">
      <ellipse cx="175" cy="100" rx="80" ry="80" stroke-dasharray="10 5">
        <animateTransform attributeName="transform" type="rotate" from="0 175 100" to="360 175 100" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="175" cy="100" rx="50" ry="50" stroke-dasharray="8 4">
        <animateTransform attributeName="transform" type="rotate" from="360 175 100" to="0 175 100" dur="4s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- 中心标记 -->
    <circle cx="175" cy="100" r="10" fill="#00FFAA" opacity="0.5">
      <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="175" cy="100" r="4" fill="#00FFAA"/>
  </g>
  
  <!-- ===== 侧面设备架 ===== -->
  
  <!-- 左侧 -->
  <g transform="translate(30, 400)">
    <rect x="0" y="0" width="80" height="350" rx="4" fill="#1a2030" stroke="#2a3040" stroke-width="1"/>
    
    <!-- 指示灯 -->
    <circle cx="40" cy="40" r="8" fill="#00FFAA" opacity="0.8"/>
    <circle cx="40" cy="80" r="8" fill="#4A9EFF" opacity="0.5"/>
    <circle cx="40" cy="120" r="8" fill="#686868" opacity="0.3"/>
    
    <!-- 数据条 -->
    <rect x="15" y="160" width="50" height="150" rx="2" fill="#0e1418"/>
    <rect x="20" y="250" width="40" height="55" rx="1" fill="#00FFAA" opacity="0.4"/>
  </g>
  
  <!-- 右侧 -->
  <g transform="translate(640, 420)">
    <rect x="0" y="0" width="80" height="330" rx="4" fill="#1a2030" stroke="#2a3040" stroke-width="1"/>
    <circle cx="40" cy="40" r="8" fill="#4A9EFF" opacity="0.8"/>
    <circle cx="40" cy="80" r="8" fill="#4A9EFF" opacity="0.5"/>
    <rect x="15" y="120" width="50" height="180" rx="2" fill="#0e1418"/>
  </g>
  
  <!-- ===== 地面 ===== -->
  <rect x="0" y="850" width="750" height="484" fill="#060a0e"/>
  
  <!-- 地面发光线 -->
  <g stroke="#4A9EFF" stroke-width="1" opacity="0.2">
    <line x1="100" y1="900" x2="650" y2="900"/>
    <line x1="80" y1="1000" x2="670" y2="1000"/>
    <line x1="60" y1="1100" x2="690" y2="1100"/>
  </g>
  
  <!-- ===== 状态显示 ===== -->
  <g transform="translate(250, 800)">
    <rect x="0" y="0" width="250" height="35" rx="4" fill="#1a2030" stroke="#00FFAA" stroke-width="1"/>
    <text x="125" y="23" font-family="monospace" font-size="12" fill="#00FFAA" text-anchor="middle">深度感知: 已激活</text>
  </g>
  
  <!-- 底部渐变 -->
  <defs>
    <linearGradient id="bottomFadeTech" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#060a0e;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#060a0e;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <rect x="0" y="1150" width="750" height="184" fill="url(#bottomFadeTech)"/>
</svg>

