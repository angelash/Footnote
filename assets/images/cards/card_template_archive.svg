<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 档案卡片模板
  尺寸: 300×450px
  类型: 档案类卡片（文件、记录）
-->
<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 卡片背景渐变 -->
    <linearGradient id="archiveCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24"/>
      <stop offset="100%" style="stop-color:#14141c"/>
    </linearGradient>
    
    <!-- 边框渐变 -->
    <linearGradient id="archiveBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D4A0"/>
      <stop offset="50%" style="stop-color:#C8B480"/>
      <stop offset="100%" style="stop-color:#E8D4A0"/>
    </linearGradient>
    
    <!-- 纸张纹理 -->
    <pattern id="paperTexture" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#1a1a24"/>
      <rect x="0" y="0" width="1" height="1" fill="#E8D4A0" opacity="0.02"/>
      <rect x="10" y="10" width="1" height="1" fill="#E8D4A0" opacity="0.02"/>
    </pattern>
  </defs>
  
  <!-- 卡片主体 -->
  <rect x="5" y="5" width="290" height="440" rx="8" fill="url(#archiveCardBg)" stroke="url(#archiveBorder)" stroke-width="2"/>
  
  <!-- 纸张纹理覆盖 -->
  <rect x="5" y="5" width="290" height="440" rx="8" fill="url(#paperTexture)"/>
  
  <!-- 顶部类型标签 -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="80" height="25" rx="4" fill="#E8D4A0" opacity="0.2"/>
    <text x="40" y="17" font-family="Noto Sans SC" font-size="11" fill="#E8D4A0" text-anchor="middle">档案</text>
  </g>
  
  <!-- 档案编号区 -->
  <g transform="translate(200, 20)">
    <rect x="0" y="0" width="80" height="25" rx="4" fill="none" stroke="#E8D4A0" stroke-width="1" opacity="0.5"/>
    <text x="40" y="17" font-family="monospace" font-size="10" fill="#E8D4A0" text-anchor="middle" opacity="0.7">#ARCH-001</text>
  </g>
  
  <!-- 图标区域 -->
  <g transform="translate(100, 70)">
    <rect x="0" y="0" width="100" height="100" rx="4" fill="#14141c" stroke="#E8D4A0" stroke-width="1" opacity="0.3"/>
    <!-- 文件图标占位 -->
    <rect x="30" y="20" width="40" height="55" rx="2" fill="none" stroke="#E8D4A0" stroke-width="1.5" opacity="0.5"/>
    <line x1="35" y1="40" x2="65" y2="40" stroke="#E8D4A0" stroke-width="0.5" opacity="0.3"/>
    <line x1="35" y1="50" x2="65" y2="50" stroke="#E8D4A0" stroke-width="0.5" opacity="0.3"/>
    <line x1="35" y1="60" x2="55" y2="60" stroke="#E8D4A0" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- 标题区 -->
  <g transform="translate(20, 190)">
    <line x1="0" y1="0" x2="260" y2="0" stroke="#E8D4A0" stroke-width="0.5" opacity="0.3"/>
    <text x="130" y="30" font-family="Noto Sans SC" font-size="18" fill="#E8E6E3" text-anchor="middle" font-weight="bold">[卡片标题]</text>
    <line x1="0" y1="45" x2="260" y2="45" stroke="#E8D4A0" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- 内容区 -->
  <g transform="translate(20, 255)">
    <text x="0" y="0" font-family="Noto Sans SC" font-size="12" fill="#E8E6E3" opacity="0.8">[卡片正面文本]</text>
    <text x="0" y="25" font-family="Noto Sans SC" font-size="12" fill="#E8E6E3" opacity="0.8">[第二行...]</text>
    <text x="0" y="50" font-family="Noto Sans SC" font-size="12" fill="#E8E6E3" opacity="0.8">[第三行...]</text>
  </g>
  
  <!-- 底部装饰 -->
  <g transform="translate(20, 380)">
    <line x1="0" y1="0" x2="260" y2="0" stroke="#E8D4A0" stroke-width="0.5" opacity="0.3"/>
    <!-- 来源标记 -->
    <text x="0" y="25" font-family="monospace" font-size="10" fill="#686868">来源: [区域ID]</text>
    <text x="260" y="25" font-family="monospace" font-size="10" fill="#686868" text-anchor="end">已归档</text>
  </g>
  
  <!-- 角装饰 -->
  <g stroke="#E8D4A0" stroke-width="1" fill="none" opacity="0.4">
    <path d="M15 25 L15 15 L25 15"/>
    <path d="M285 25 L285 15 L275 15"/>
    <path d="M15 435 L15 425 L25 425"/>
    <path d="M285 435 L285 425 L275 425"/>
  </g>
</svg>

