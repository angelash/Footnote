<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 物品卡片模板
  尺寸: 300×450px
  类型: 物品类卡片（道具、收集物）
-->
<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 卡片背景渐变 -->
    <linearGradient id="itemCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2a"/>
      <stop offset="100%" style="stop-color:#12121a"/>
    </linearGradient>
    
    <!-- 边框渐变 -->
    <linearGradient id="itemBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EFF"/>
      <stop offset="50%" style="stop-color:#3080DD"/>
      <stop offset="100%" style="stop-color:#4A9EFF"/>
    </linearGradient>
    
    <!-- 物品光晕 -->
    <filter id="itemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 卡片主体 -->
  <rect x="5" y="5" width="290" height="440" rx="8" fill="url(#itemCardBg)" stroke="url(#itemBorder)" stroke-width="2"/>
  
  <!-- 顶部类型标签 -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="80" height="25" rx="4" fill="#4A9EFF" opacity="0.2"/>
    <text x="40" y="17" font-family="Noto Sans SC" font-size="11" fill="#4A9EFF" text-anchor="middle">物品</text>
  </g>
  
  <!-- 稀有度标记 -->
  <g transform="translate(200, 20)">
    <rect x="0" y="0" width="80" height="25" rx="4" fill="none" stroke="#4A9EFF" stroke-width="1" opacity="0.5"/>
    <text x="40" y="17" font-family="Noto Sans SC" font-size="10" fill="#4A9EFF" text-anchor="middle">普通</text>
  </g>
  
  <!-- 物品展示区 -->
  <g transform="translate(75, 60)">
    <rect x="0" y="0" width="150" height="150" rx="8" fill="#0e0e14" stroke="#4A9EFF" stroke-width="1" opacity="0.5"/>
    
    <!-- 物品光效背景 -->
    <circle cx="75" cy="75" r="50" fill="#4A9EFF" opacity="0.05"/>
    
    <!-- 物品占位符 -->
    <g filter="url(#itemGlow)">
      <rect x="50" y="50" width="50" height="50" rx="4" fill="none" stroke="#4A9EFF" stroke-width="2" stroke-dasharray="5 3"/>
      <text x="75" y="80" font-family="Noto Sans SC" font-size="12" fill="#4A9EFF" text-anchor="middle">?</text>
    </g>
  </g>
  
  <!-- 标题区 -->
  <g transform="translate(20, 230)">
    <line x1="0" y1="0" x2="260" y2="0" stroke="#4A9EFF" stroke-width="0.5" opacity="0.3"/>
    <text x="130" y="30" font-family="Noto Sans SC" font-size="18" fill="#E8E6E3" text-anchor="middle" font-weight="bold">[物品名称]</text>
    <line x1="0" y1="45" x2="260" y2="45" stroke="#4A9EFF" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- 描述区 -->
  <g transform="translate(20, 295)">
    <text x="0" y="0" font-family="Noto Sans SC" font-size="12" fill="#E8E6E3" opacity="0.8">[物品描述文本]</text>
    <text x="0" y="25" font-family="Noto Sans SC" font-size="12" fill="#E8E6E3" opacity="0.8">[第二行...]</text>
  </g>
  
  <!-- 效果提示 -->
  <g transform="translate(20, 360)">
    <rect x="0" y="0" width="260" height="40" rx="4" fill="#4A9EFF" opacity="0.1"/>
    <text x="130" y="25" font-family="Noto Sans SC" font-size="11" fill="#4A9EFF" text-anchor="middle">[使用效果说明]</text>
  </g>
  
  <!-- 底部信息 -->
  <g transform="translate(20, 415)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#686868">获取: [来源]</text>
    <text x="260" y="0" font-family="monospace" font-size="10" fill="#686868" text-anchor="end">×1</text>
  </g>
  
  <!-- 角装饰 -->
  <g stroke="#4A9EFF" stroke-width="1" fill="none" opacity="0.4">
    <path d="M15 25 L15 15 L25 15"/>
    <path d="M285 25 L285 15 L275 15"/>
    <path d="M15 435 L15 425 L25 425"/>
    <path d="M285 435 L285 425 L275 425"/>
  </g>
</svg>

