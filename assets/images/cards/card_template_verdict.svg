<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 判定卡片模板
  尺寸: 300×450px
  类型: 系统判定类卡片（警告、错误、对齐）
-->
<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 卡片背景渐变 -->
    <linearGradient id="verdictCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1416"/>
      <stop offset="100%" style="stop-color:#140e10"/>
    </linearGradient>
    
    <!-- 边框渐变（警告红） -->
    <linearGradient id="verdictBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444"/>
      <stop offset="50%" style="stop-color:#CC2222"/>
      <stop offset="100%" style="stop-color:#FF4444"/>
    </linearGradient>
    
    <!-- 脉冲效果 -->
    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 干扰条纹 -->
    <pattern id="glitchStripes" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#140e10"/>
      <rect x="0" y="0" width="10" height="2" fill="#FF4444" opacity="0.03"/>
    </pattern>
  </defs>
  
  <!-- 卡片主体 -->
  <rect x="5" y="5" width="290" height="440" rx="8" fill="url(#verdictCardBg)" stroke="url(#verdictBorder)" stroke-width="2"/>
  
  <!-- 干扰覆盖 -->
  <rect x="5" y="5" width="290" height="440" rx="8" fill="url(#glitchStripes)"/>
  
  <!-- 顶部警告标签 -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="260" height="30" rx="4" fill="#FF4444" opacity="0.2"/>
    <text x="130" y="20" font-family="monospace" font-size="12" fill="#FF4444" text-anchor="middle">⚠ 系统判定</text>
  </g>
  
  <!-- 警告符号 -->
  <g transform="translate(100, 70)" filter="url(#pulseGlow)">
    <polygon points="50,10 90,80 10,80" fill="none" stroke="#FF4444" stroke-width="3">
      <animate attributeName="stroke-width" values="2;4;2" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
    <text x="50" y="65" font-family="sans-serif" font-size="36" fill="#FF4444" text-anchor="middle" font-weight="bold">!</text>
  </g>
  
  <!-- 判定标题 -->
  <g transform="translate(20, 180)">
    <line x1="0" y1="0" x2="260" y2="0" stroke="#FF4444" stroke-width="0.5" opacity="0.5"/>
    <text x="130" y="35" font-family="Noto Sans SC" font-size="18" fill="#FF4444" text-anchor="middle" font-weight="bold">[判定类型]</text>
    <line x1="0" y1="50" x2="260" y2="50" stroke="#FF4444" stroke-width="0.5" opacity="0.5"/>
  </g>
  
  <!-- 判定内容 -->
  <g transform="translate(20, 250)">
    <text x="130" y="0" font-family="Noto Sans SC" font-size="13" fill="#E8E6E3" text-anchor="middle" opacity="0.9">[判定描述]</text>
    <text x="130" y="25" font-family="Noto Sans SC" font-size="13" fill="#E8E6E3" text-anchor="middle" opacity="0.9">[第二行...]</text>
    <text x="130" y="50" font-family="Noto Sans SC" font-size="13" fill="#E8E6E3" text-anchor="middle" opacity="0.9">[第三行...]</text>
  </g>
  
  <!-- 系统备注 -->
  <g transform="translate(20, 330)">
    <rect x="0" y="0" width="260" height="60" rx="4" fill="#FF4444" opacity="0.1" stroke="#FF4444" stroke-width="0.5" stroke-dasharray="5 3"/>
    <text x="130" y="25" font-family="monospace" font-size="10" fill="#FF4444" text-anchor="middle" opacity="0.8">"[系统语气备注]"</text>
    <text x="130" y="45" font-family="monospace" font-size="10" fill="#FF4444" text-anchor="middle" opacity="0.6">—— 收敛运行时</text>
  </g>
  
  <!-- 底部状态 -->
  <g transform="translate(20, 410)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#FF4444" opacity="0.7">状态: 已生效</text>
    <text x="260" y="0" font-family="monospace" font-size="10" fill="#686868" text-anchor="end">不可逆</text>
  </g>
  
  <!-- 边框脉冲效果 -->
  <rect x="5" y="5" width="290" height="440" rx="8" fill="none" stroke="#FF4444" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>

