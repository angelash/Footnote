<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 日记卡模板
  尺寸: 300×450px
  用途: 阿棠碎片日记、私人记录
  风格: 手写感 + 页码跳号 + 温暖但破碎
-->
<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 旧纸张背景 -->
    <linearGradient id="diaryBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2820"/>
      <stop offset="100%" style="stop-color:#1e1c16"/>
    </linearGradient>
    
    <!-- 纸张纹理 -->
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" result="noise"/>
      <feBlend in="SourceGraphic" in2="noise" mode="overlay"/>
    </filter>
    
    <!-- 边缘撕裂效果 -->
    <clipPath id="tornEdge">
      <path d="M8 0 L292 0 L294 5 L290 8 L295 12 L292 18 L296 25 L292 30 L298 450 L5 450 L8 445 L4 440 L10 435 L6 430 L8 0"/>
    </clipPath>
    
    <!-- 暖色光晕 -->
    <radialGradient id="warmGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FF88FF;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#FF88FF;stop-opacity:0"/>
    </radialGradient>
    
    <!-- 补丁痕迹线条 -->
    <linearGradient id="patchLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF88FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FF88FF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FF88FF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- 卡片阴影 -->
  <rect x="6" y="6" width="290" height="440" rx="2" fill="#000000" opacity="0.25"/>
  
  <!-- 主背景（带撕裂边缘） -->
  <g clip-path="url(#tornEdge)">
    <rect x="2" y="2" width="296" height="446" fill="url(#diaryBg)"/>
    <rect x="2" y="2" width="296" height="446" fill="url(#warmGlow)"/>
  </g>
  
  <!-- 纸张纹理层 -->
  <rect x="2" y="2" width="296" height="446" fill="#ffffff" opacity="0.03"/>
  
  <!-- 边框 -->
  <rect x="2" y="2" width="296" height="446" rx="2" 
        fill="none" stroke="#3a3830" stroke-width="1"/>
  
  <!-- 左侧装订线 -->
  <line x1="25" y1="10" x2="25" y2="440" stroke="#2a2820" stroke-width="1" stroke-dasharray="20 5"/>
  <circle cx="25" cy="50" r="3" fill="none" stroke="#3a3830" stroke-width="1"/>
  <circle cx="25" cy="225" r="3" fill="none" stroke="#3a3830" stroke-width="1"/>
  <circle cx="25" cy="400" r="3" fill="none" stroke="#3a3830" stroke-width="1"/>
  
  <!-- 日期区域（含页码跳号） -->
  <g transform="translate(35, 20)">
    <text x="0" y="16" font-family="serif" font-size="12" fill="#686860" font-style="italic">页 </text>
    <text x="22" y="16" font-family="serif" font-size="12" fill="#FF88FF" opacity="0.7">... 13 → 17</text>
    <text x="80" y="16" font-family="serif" font-size="10" fill="#686860" opacity="0.5">(跳号)</text>
  </g>
  
  <!-- 横线纸效果 -->
  <g stroke="#3a3830" stroke-width="0.5" opacity="0.4">
    <line x1="35" y1="60" x2="280" y2="60"/>
    <line x1="35" y1="85" x2="280" y2="85"/>
    <line x1="35" y1="110" x2="280" y2="110"/>
    <line x1="35" y1="135" x2="280" y2="135"/>
    <line x1="35" y1="160" x2="280" y2="160"/>
    <line x1="35" y1="185" x2="280" y2="185"/>
    <line x1="35" y1="210" x2="280" y2="210"/>
    <line x1="35" y1="235" x2="280" y2="235"/>
    <line x1="35" y1="260" x2="280" y2="260"/>
  </g>
  
  <!-- 日记内容占位（手写风格位置） -->
  <g transform="translate(40, 55)">
    <!-- 模拟手写文字的不规则行 -->
    <rect x="0" y="5" width="200" height="18" rx="1" fill="#1e1c16" opacity="0.5"/>
    <rect x="10" y="30" width="180" height="18" rx="1" fill="#1e1c16" opacity="0.45"/>
    <rect x="5" y="55" width="220" height="18" rx="1" fill="#1e1c16" opacity="0.4"/>
    <rect x="0" y="80" width="160" height="18" rx="1" fill="#1e1c16" opacity="0.35"/>
  </g>
  
  <!-- 补丁痕迹 -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="200" height="2" fill="url(#patchLine)"/>
    <text x="0" y="20" font-family="Noto Sans SC" font-size="9" fill="#FF88FF" opacity="0.5">补丁痕迹</text>
  </g>
  
  <!-- 边角折痕 -->
  <g transform="translate(265, 415)">
    <path d="M0 35 L35 35 L35 0 Z" fill="#2a2820" stroke="#3a3830" stroke-width="0.5"/>
    <path d="M0 35 L35 0" stroke="#3a3830" stroke-width="0.5" stroke-dasharray="2 2"/>
  </g>
  
  <!-- 墨渍装饰 -->
  <ellipse cx="260" cy="80" rx="15" ry="10" fill="#1e1c16" opacity="0.3" transform="rotate(-15 260 80)"/>
  
  <!-- 极淡小字区域 -->
  <g transform="translate(40, 390)">
    <text x="0" y="12" font-family="Noto Sans SC" font-size="10" fill="#686860" opacity="0.4">
      我不是在猜
    </text>
  </g>
  
  <!-- 漂移动画效果（微微偏移） -->
  <g opacity="0.5">
    <rect x="100" y="150" width="150" height="20" fill="none" stroke="#FF88FF" stroke-width="0.5" opacity="0">
      <animate attributeName="opacity" values="0;0.2;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="100;102;100" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

