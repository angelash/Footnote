<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 判词卡模板
  尺寸: 300×450px
  用途: F21判词、系统结算、字段接受
  风格: 冷峻 + 格式化 + 非人类感
-->
<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 深色背景 -->
    <linearGradient id="verdictBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c12"/>
      <stop offset="50%" style="stop-color:#08080c"/>
      <stop offset="100%" style="stop-color:#0c0c12"/>
    </linearGradient>
    
    <!-- 警告红边框 -->
    <linearGradient id="verdictBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#FF4444;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#FF4444;stop-opacity:0.6"/>
    </linearGradient>
    
    <!-- 扫描线效果 -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="300" height="4">
      <rect width="300" height="1" fill="#FF4444" opacity="0.03"/>
    </pattern>
    
    <!-- 字段发光 -->
    <filter id="fieldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 格式化背景 -->
    <pattern id="gridPattern" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="none" stroke="#1a1a24" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- 卡片阴影 -->
  <rect x="6" y="6" width="290" height="440" rx="4" fill="#000000" opacity="0.4"/>
  
  <!-- 主背景 -->
  <rect x="2" y="2" width="296" height="446" rx="4" fill="url(#verdictBg)"/>
  
  <!-- 网格背景 -->
  <rect x="2" y="2" width="296" height="446" rx="4" fill="url(#gridPattern)" opacity="0.3"/>
  
  <!-- 扫描线 -->
  <rect x="2" y="2" width="296" height="446" rx="4" fill="url(#scanlines)"/>
  
  <!-- 边框 -->
  <rect x="2" y="2" width="296" height="446" rx="4" 
        fill="none" stroke="url(#verdictBorder)" stroke-width="2"/>
  
  <!-- 顶部系统标识 -->
  <g transform="translate(150, 30)">
    <!-- 警告图标 -->
    <polygon points="0,-15 13,10 -13,10" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <text x="0" y="5" font-family="monospace" font-size="14" fill="#FF4444" text-anchor="middle" font-weight="bold">!</text>
  </g>
  
  <!-- 系统标签 -->
  <rect x="100" y="55" width="100" height="20" rx="2" fill="#FF4444" opacity="0.1"/>
  <text x="150" y="69" font-family="monospace" font-size="10" fill="#FF4444" text-anchor="middle">SYSTEM VERDICT</text>
  
  <!-- 分隔线 -->
  <line x1="30" y1="90" x2="270" y2="90" stroke="#FF4444" stroke-width="1" opacity="0.3"/>
  
  <!-- 判词主内容区 -->
  <g transform="translate(30, 120)">
    <!-- 引号开始 -->
    <text x="0" y="0" font-family="serif" font-size="40" fill="#FF4444" opacity="0.3">"</text>
    
    <!-- 判词文本区域 -->
    <rect x="10" y="20" width="220" height="80" rx="2" fill="none" stroke="#1a1a24" stroke-dasharray="4 2" opacity="0.3"/>
    
    <!-- 引号结束 -->
    <text x="220" y="110" font-family="serif" font-size="40" fill="#FF4444" opacity="0.3">"</text>
  </g>
  
  <!-- 字段表区域 -->
  <g transform="translate(30, 250)">
    <text x="0" y="12" font-family="monospace" font-size="11" fill="#686868">字段表：</text>
    
    <!-- 字段行 -->
    <g transform="translate(0, 24)">
      <text x="0" y="12" font-family="monospace" font-size="10" fill="#4A9EFF">条目：</text>
      <rect x="50" y="0" width="160" height="16" rx="1" fill="#1a1a24"/>
    </g>
    <g transform="translate(0, 48)">
      <text x="0" y="12" font-family="monospace" font-size="10" fill="#4A9EFF">收敛：</text>
      <rect x="50" y="0" width="160" height="16" rx="1" fill="#1a1a24"/>
    </g>
    <g transform="translate(0, 72)">
      <text x="0" y="12" font-family="monospace" font-size="10" fill="#FFD700">字段：</text>
      <text x="50" y="12" font-family="monospace" font-size="10" fill="#FFD700" filter="url(#fieldGlow)">◦◦◦</text>
    </g>
  </g>
  
  <!-- 底部备注 -->
  <g transform="translate(30, 370)">
    <line x1="0" y1="0" x2="240" y2="0" stroke="#2a2a35" stroke-width="1"/>
    <text x="0" y="20" font-family="Noto Sans SC" font-size="10" fill="#686868">新增字段将提高解释成本</text>
    <text x="0" y="38" font-family="monospace" font-size="9" fill="#686868" opacity="0.6">字段：待定义</text>
  </g>
  
  <!-- 底部确认按钮区域 -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="100" height="30" rx="4" fill="#FF4444" opacity="0.15"/>
    <rect x="0" y="0" width="100" height="30" rx="4" fill="none" stroke="#FF4444" stroke-width="1"/>
    <text x="50" y="20" font-family="Noto Sans SC" font-size="12" fill="#FF4444" text-anchor="middle">继续</text>
  </g>
  
  <!-- 脉冲动画效果 -->
  <rect x="2" y="2" width="296" height="446" rx="4" fill="none" stroke="#FF4444" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- 角落数据标记 -->
  <text x="275" y="438" font-family="monospace" font-size="8" fill="#2a2a35" text-anchor="end">v.03</text>
</svg>

