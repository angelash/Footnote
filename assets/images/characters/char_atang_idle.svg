<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 阿棠 立绘（待机状态）
  角色: 漂移者，16-18岁少女
  尺寸: 400×600px
  风格: 眼神迷离，碎片感
-->
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 漂移紫光环 -->
    <filter id="driftGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 碎片效果 -->
    <filter id="fragmentEffect">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <!-- 服装 -->
    <linearGradient id="atangCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a3a5a"/>
      <stop offset="100%" style="stop-color:#3a2a4a"/>
    </linearGradient>
    
    <!-- 皮肤（苍白） -->
    <linearGradient id="paleSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F0E8"/>
      <stop offset="100%" style="stop-color:#E8E0D8"/>
    </linearGradient>
  </defs>
  
  <!-- 漂移光环 -->
  <g filter="url(#driftGlow)" opacity="0.25">
    <ellipse cx="200" cy="300" rx="120" ry="200" fill="#FF88FF" opacity="0.4"/>
  </g>
  
  <!-- 碎片漂浮效果 -->
  <g opacity="0.3">
    <rect x="100" cy="200" width="8" height="8" fill="#FF88FF" transform="rotate(15)">
      <animate attributeName="y" values="200;180;200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="280" cy="250" width="6" height="6" fill="#FF88FF" transform="rotate(-20)">
      <animate attributeName="y" values="250;230;250" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="150" cy="400" width="5" height="5" fill="#FF88FF" transform="rotate(30)">
      <animate attributeName="y" values="400;380;400" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- ===== 身体 ===== -->
  
  <!-- 连衣裙 -->
  <path d="M155 210 Q140 280, 130 400 L120 540 L280 540 L270 400 Q260 280, 245 210 Z" fill="url(#atangCloth)" stroke="#5a4a6a" stroke-width="1"/>
  
  <!-- 裙子褶皱 -->
  <g stroke="#5a4a6a" stroke-width="0.5" fill="none" opacity="0.5">
    <path d="M150 350 Q160 400, 140 500"/>
    <path d="M200 300 L200 530"/>
    <path d="M250 350 Q240 400, 260 500"/>
  </g>
  
  <!-- 领口 -->
  <ellipse cx="200" cy="215" rx="30" ry="10" fill="#3a2a4a"/>
  
  <!-- ===== 手臂 ===== -->
  
  <!-- 左臂（瘦弱） -->
  <path d="M155 220 Q120 280, 110 350 Q100 420, 115 470" fill="none" stroke="url(#paleSkin)" stroke-width="20" stroke-linecap="round"/>
  
  <!-- 右臂 -->
  <path d="M245 220 Q280 280, 290 350 Q300 420, 285 470" fill="none" stroke="url(#paleSkin)" stroke-width="20" stroke-linecap="round"/>
  
  <!-- 手（纤细） -->
  <ellipse cx="118" cy="485" rx="14" ry="18" fill="url(#paleSkin)" stroke="#D8D0C8" stroke-width="0.5"/>
  <ellipse cx="282" cy="485" rx="14" ry="18" fill="url(#paleSkin)" stroke="#D8D0C8" stroke-width="0.5"/>
  
  <!-- ===== 头部 ===== -->
  
  <!-- 颈部（细长） -->
  <rect x="185" y="175" width="30" height="45" rx="5" fill="url(#paleSkin)"/>
  
  <!-- 脸部 -->
  <ellipse cx="200" cy="115" rx="48" ry="62" fill="url(#paleSkin)" stroke="#D8D0C8" stroke-width="0.5"/>
  
  <!-- 头发（凌乱长发） -->
  <path d="M152 80 Q160 30, 200 25 Q240 30, 248 80 L255 180 Q245 150, 200 145 Q155 150, 145 180 L152 80 Z" fill="#2a2030" stroke="#3a3040" stroke-width="0.5"/>
  
  <!-- 头发散落 -->
  <path d="M145 180 Q130 250, 140 350" fill="none" stroke="#2a2030" stroke-width="8"/>
  <path d="M255 180 Q270 250, 260 350" fill="none" stroke="#2a2030" stroke-width="8"/>
  
  <!-- 刘海 -->
  <path d="M160 75 Q180 60, 200 65 Q220 60, 240 75 L235 95 Q210 85, 200 90 Q190 85, 165 95 Z" fill="#2a2030"/>
  
  <!-- 眼睛（迷离的） -->
  <g transform="translate(168, 108)">
    <!-- 左眼 -->
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="#1a1a24"/>
    <circle cx="2" cy="0" r="5" fill="#8060A0" opacity="0.8"/>
    <circle cx="4" cy="-2" r="1.5" fill="#FFFFFF" opacity="0.7"/>
    <!-- 眼下阴影 -->
    <ellipse cx="0" cy="10" rx="8" ry="3" fill="#C8C0D0" opacity="0.3"/>
    
    <!-- 右眼 -->
    <ellipse cx="64" cy="0" rx="12" ry="8" fill="#1a1a24"/>
    <circle cx="66" cy="0" r="5" fill="#8060A0" opacity="0.8"/>
    <circle cx="68" cy="-2" r="1.5" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="64" cy="10" rx="8" ry="3" fill="#C8C0D0" opacity="0.3"/>
  </g>
  
  <!-- 眉毛（淡） -->
  <path d="M155 95 Q170 92, 182 95" fill="none" stroke="#3a3040" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M218 95 Q230 92, 245 95" fill="none" stroke="#3a3040" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- 鼻子 -->
  <path d="M200 118 L197 138 L200 145 L203 138" fill="none" stroke="#D8D0C8" stroke-width="1" opacity="0.4"/>
  
  <!-- 嘴巴（微张） -->
  <ellipse cx="200" cy="162" rx="8" ry="4" fill="#C0A0A0" opacity="0.5"/>
  <path d="M192 162 Q200 165, 208 162" fill="none" stroke="#B09090" stroke-width="1"/>
  
  <!-- ===== 腿部 ===== -->
  
  <!-- 腿（裙下） -->
  <rect x="160" y="520" width="30" height="75" rx="4" fill="url(#paleSkin)"/>
  <rect x="210" y="520" width="30" height="75" rx="4" fill="url(#paleSkin)"/>
  
  <!-- 鞋 -->
  <ellipse cx="175" cy="595" rx="20" ry="8" fill="#3a2a4a" stroke="#4a3a5a" stroke-width="0.5"/>
  <ellipse cx="225" cy="595" rx="20" ry="8" fill="#3a2a4a" stroke="#4a3a5a" stroke-width="0.5"/>
  
  <!-- ===== 漂移效果 ===== -->
  
  <!-- 身体轮廓闪烁 -->
  <path d="M155 210 Q140 280, 130 400 L120 540 L280 540 L270 400 Q260 280, 245 210" fill="none" stroke="#FF88FF" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- 记忆碎片 -->
  <g filter="url(#driftGlow)" opacity="0.4">
    <polygon points="320,150 330,160 325,175 315,165" fill="#FF88FF">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="80,280 95,285 90,300 75,295" fill="#FF88FF">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2.5s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>

