<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 陈匠 立绘（待机状态）
  角色: 点灯者，朴实
  尺寸: 400×600px
  风格: 带旧灯芯，温暖坚持
-->
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 朴素衣服 -->
    <linearGradient id="simpleCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4038"/>
      <stop offset="100%" style="stop-color:#3a3028"/>
    </linearGradient>
    
    <!-- 灯火橙光环 -->
    <filter id="lampGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 皮肤（风霜） -->
    <linearGradient id="weatheredSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8C0A8"/>
      <stop offset="100%" style="stop-color:#C8B098"/>
    </linearGradient>
  </defs>
  
  <!-- 灯火光环 -->
  <g filter="url(#lampGlow)" opacity="0.25">
    <ellipse cx="320" cy="400" rx="80" ry="120" fill="#FFAA44" opacity="0.5"/>
  </g>
  
  <!-- ===== 身体 ===== -->
  
  <!-- 上衣 -->
  <path d="M145 215 Q135 280, 140 380 L140 520 L260 520 L260 380 Q265 280, 255 215 Z" fill="url(#simpleCloth)" stroke="#5a5048" stroke-width="1"/>
  
  <!-- 衣服纹理 -->
  <g stroke="#5a5048" stroke-width="0.5" fill="none" opacity="0.3">
    <path d="M160 280 L155 500"/>
    <path d="M200 250 L200 510"/>
    <path d="M240 280 L245 500"/>
  </g>
  
  <!-- 领口 -->
  <polygon points="180,220 200,250 220,220" fill="#3a3028"/>
  
  <!-- 扣子 -->
  <circle cx="200" cy="290" r="5" fill="#6a6058"/>
  <circle cx="200" cy="360" r="5" fill="#6a6058"/>
  
  <!-- ===== 手臂 ===== -->
  
  <!-- 左臂 -->
  <path d="M145 225 Q110 285, 100 355 Q90 425, 110 475" fill="none" stroke="url(#simpleCloth)" stroke-width="28" stroke-linecap="round"/>
  
  <!-- 右臂（持灯） -->
  <path d="M255 225 Q300 270, 320 330 Q340 400, 320 460" fill="none" stroke="url(#simpleCloth)" stroke-width="28" stroke-linecap="round"/>
  
  <!-- 手 -->
  <ellipse cx="113" cy="490" rx="17" ry="21" fill="url(#weatheredSkin)" stroke="#B8A088" stroke-width="0.5"/>
  <ellipse cx="318" cy="475" rx="17" ry="21" fill="url(#weatheredSkin)" stroke="#B8A088" stroke-width="0.5"/>
  
  <!-- ===== 旧油灯 ===== -->
  <g transform="translate(290, 350)">
    <!-- 灯座 -->
    <rect x="0" y="80" width="50" height="15" rx="3" fill="#8B7355" stroke="#6B5345" stroke-width="1"/>
    
    <!-- 灯身 -->
    <ellipse cx="25" cy="55" rx="22" ry="30" fill="#1a1a24" stroke="#8B7355" stroke-width="2"/>
    <ellipse cx="25" cy="55" rx="15" ry="22" fill="#2a2a35"/>
    
    <!-- 灯芯 -->
    <rect x="22" y="25" width="6" height="20" fill="#E8D4A0"/>
    
    <!-- 火焰 -->
    <g filter="url(#lampGlow)">
      <ellipse cx="25" cy="15" rx="12" ry="18" fill="#FFAA44" opacity="0.8">
        <animate attributeName="ry" values="16;20;16" dur="0.8s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="25" cy="12" rx="8" ry="12" fill="#FFDD88" opacity="0.9">
        <animate attributeName="ry" values="10;14;10" dur="0.8s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="25" cy="10" rx="4" ry="6" fill="#FFFFFF" opacity="0.8"/>
    </g>
    
    <!-- 提手 -->
    <path d="M10 45 Q25 20, 40 45" fill="none" stroke="#8B7355" stroke-width="3"/>
  </g>
  
  <!-- ===== 头部 ===== -->
  
  <!-- 颈部 -->
  <rect x="180" y="180" width="40" height="45" rx="5" fill="url(#weatheredSkin)"/>
  
  <!-- 脸部 -->
  <ellipse cx="200" cy="120" rx="52" ry="68" fill="url(#weatheredSkin)" stroke="#B8A088" stroke-width="0.5"/>
  
  <!-- 头发（花白短发） -->
  <path d="M148 90 Q155 50, 200 45 Q245 50, 252 90 L255 120 Q248 90, 200 85 Q152 90, 145 120 Z" fill="#6a6a6a" stroke="#7a7a7a" stroke-width="0.5"/>
  
  <!-- 皱纹 -->
  <g stroke="#B8A088" stroke-width="0.5" opacity="0.5">
    <path d="M158 70 Q175 67, 185 72"/>
    <path d="M215 72 Q225 67, 242 70"/>
    <path d="M165 95 Q175 92, 185 95"/>
    <path d="M215 95 Q225 92, 235 95"/>
  </g>
  
  <!-- 眼睛（温暖坚定） -->
  <g transform="translate(168, 110)">
    <!-- 左眼 -->
    <path d="M-8 0 Q0 -5, 8 0 Q0 4, -8 0" fill="#1a1a24"/>
    <circle cx="0" cy="-1" r="3" fill="#6a5040"/>
    <circle cx="1" cy="-2" r="1" fill="#FFFFFF"/>
    <!-- 眼角皱纹 -->
    <path d="M-12 -3 Q-10 0, -12 3" fill="none" stroke="#B8A088" stroke-width="0.5"/>
    
    <!-- 右眼 -->
    <path d="M56 0 Q64 -5, 72 0 Q64 4, 56 0" fill="#1a1a24"/>
    <circle cx="64" cy="-1" r="3" fill="#6a5040"/>
    <circle cx="65" cy="-2" r="1" fill="#FFFFFF"/>
    <path d="M76 -3 Q74 0, 76 3" fill="none" stroke="#B8A088" stroke-width="0.5"/>
  </g>
  
  <!-- 眉毛 -->
  <path d="M155 98 Q168 93, 182 98" fill="none" stroke="#6a6a6a" stroke-width="2" stroke-linecap="round"/>
  <path d="M218 98 Q232 93, 245 98" fill="none" stroke="#6a6a6a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 鼻子 -->
  <path d="M200 122 L196 148 L200 158 L204 148" fill="none" stroke="#B8A088" stroke-width="1" opacity="0.5"/>
  
  <!-- 嘴巴（温和微笑） -->
  <path d="M185 175 Q200 182, 215 175" fill="none" stroke="#908070" stroke-width="1.5"/>
  
  <!-- ===== 腿部 ===== -->
  
  <!-- 裤子 -->
  <rect x="155" y="500" width="38" height="95" rx="4" fill="url(#simpleCloth)"/>
  <rect x="207" y="500" width="38" height="95" rx="4" fill="url(#simpleCloth)"/>
  
  <!-- 布鞋 -->
  <ellipse cx="174" cy="595" rx="24" ry="10" fill="#3a3028" stroke="#4a4038" stroke-width="0.5"/>
  <ellipse cx="226" cy="595" rx="24" ry="10" fill="#3a3028" stroke="#4a4038" stroke-width="0.5"/>
  
  <!-- ===== 灯火橙装饰 ===== -->
  <g filter="url(#lampGlow)" opacity="0.3">
    <circle cx="200" cy="250" r="5" fill="#FFAA44"/>
    <circle cx="195" cy="400" r="3" fill="#FFAA44"/>
  </g>
</svg>

