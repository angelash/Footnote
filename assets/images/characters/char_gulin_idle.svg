<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 顾临 立绘（待机状态）
  角色: 维修局主管，收敛主义者
  尺寸: 400×600px
  风格: 简约线稿，权威冷峻
-->
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 正装渐变 -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24"/>
      <stop offset="100%" style="stop-color:#0e0e14"/>
    </linearGradient>
    
    <!-- 衬衫 -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E6E3"/>
      <stop offset="100%" style="stop-color:#D0CEC8"/>
    </linearGradient>
    
    <!-- 皮肤色 -->
    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0CDB8"/>
      <stop offset="100%" style="stop-color:#D0BCA0"/>
    </linearGradient>
  </defs>
  
  <!-- ===== 身体 ===== -->
  
  <!-- 西装外套 -->
  <path d="M140 210 Q130 260, 135 350 L135 520 L265 520 L265 350 Q270 260, 260 210 Z" fill="url(#suitGrad)" stroke="#2a2a35" stroke-width="1"/>
  
  <!-- 衬衫领口 -->
  <polygon points="185,215 200,240 215,215 200,195" fill="url(#shirtGrad)"/>
  
  <!-- 领带 -->
  <polygon points="195,230 200,350 205,230" fill="#4A9EFF"/>
  
  <!-- 西装翻领 -->
  <path d="M185 215 L150 260 L150 400" fill="none" stroke="#2a2a35" stroke-width="1"/>
  <path d="M215 215 L250 260 L250 400" fill="none" stroke="#2a2a35" stroke-width="1"/>
  
  <!-- 口袋 -->
  <rect x="150" y="320" width="40" height="4" fill="#2a2a35"/>
  <rect x="210" y="320" width="40" height="4" fill="#2a2a35"/>
  
  <!-- 按钮 -->
  <circle cx="200" cy="300" r="4" fill="#3a3a48"/>
  <circle cx="200" cy="350" r="4" fill="#3a3a48"/>
  
  <!-- ===== 手臂 ===== -->
  
  <!-- 左臂 -->
  <path d="M140 220 Q100 280, 85 360 Q80 420, 100 470" fill="none" stroke="url(#suitGrad)" stroke-width="30" stroke-linecap="round"/>
  
  <!-- 左手（背后） -->
  <ellipse cx="105" cy="485" rx="18" ry="22" fill="url(#skinGrad2)" stroke="#C0A890" stroke-width="0.5"/>
  
  <!-- 右臂 -->
  <path d="M260 220 Q300 280, 315 360 Q320 420, 300 470" fill="none" stroke="url(#suitGrad)" stroke-width="30" stroke-linecap="round"/>
  
  <!-- 右手（背后） -->
  <ellipse cx="295" cy="485" rx="18" ry="22" fill="url(#skinGrad2)" stroke="#C0A890" stroke-width="0.5"/>
  
  <!-- ===== 头部 ===== -->
  
  <!-- 颈部 -->
  <rect x="180" y="180" width="40" height="40" rx="5" fill="url(#skinGrad2)"/>
  
  <!-- 脸部 -->
  <ellipse cx="200" cy="120" rx="52" ry="68" fill="url(#skinGrad2)" stroke="#C0A890" stroke-width="0.5"/>
  
  <!-- 头发（整齐） -->
  <path d="M148 85 Q155 40, 200 35 Q245 40, 252 85 L252 100 Q245 75, 200 70 Q155 75, 148 100 Z" fill="#2a2a35" stroke="#3a3a48" stroke-width="0.5"/>
  
  <!-- 鬓角 -->
  <rect x="148" y="85" width="8" height="40" fill="#2a2a35" rx="2"/>
  <rect x="244" y="85" width="8" height="40" fill="#2a2a35" rx="2"/>
  
  <!-- 眼睛（锐利） -->
  <g transform="translate(170, 115)">
    <!-- 左眼 -->
    <path d="M-8 0 Q0 -8, 8 0 Q0 5, -8 0" fill="#1a1a24"/>
    <circle cx="0" cy="-1" r="3" fill="#686868"/>
    <circle cx="1" cy="-2" r="1" fill="#FFFFFF"/>
    
    <!-- 右眼 -->
    <path d="M52 0 Q60 -8, 68 0 Q60 5, 52 0" fill="#1a1a24"/>
    <circle cx="60" cy="-1" r="3" fill="#686868"/>
    <circle cx="61" cy="-2" r="1" fill="#FFFFFF"/>
  </g>
  
  <!-- 眉毛（严肃） -->
  <path d="M155 102 L185 100" fill="none" stroke="#2a2a35" stroke-width="3" stroke-linecap="round"/>
  <path d="M215 100 L245 102" fill="none" stroke="#2a2a35" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 鼻子 -->
  <path d="M200 125 L195 145 L200 152 L205 145" fill="none" stroke="#C0A890" stroke-width="1" opacity="0.5"/>
  
  <!-- 嘴巴（紧闭） -->
  <line x1="185" y1="168" x2="215" y2="168" stroke="#A08878" stroke-width="2"/>
  
  <!-- ===== 腿部 ===== -->
  
  <!-- 西裤 -->
  <rect x="150" y="500" width="40" height="95" rx="4" fill="url(#suitGrad)"/>
  <rect x="210" y="500" width="40" height="95" rx="4" fill="url(#suitGrad)"/>
  
  <!-- 皮鞋 -->
  <ellipse cx="170" cy="595" rx="24" ry="10" fill="#0e0e14" stroke="#1a1a24" stroke-width="1"/>
  <ellipse cx="230" cy="595" rx="24" ry="10" fill="#0e0e14" stroke="#1a1a24" stroke-width="1"/>
  
  <!-- ===== 权威元素 ===== -->
  
  <!-- 眼镜 -->
  <g fill="none" stroke="#4a4a58" stroke-width="1.5">
    <rect x="155" y="108" width="28" height="18" rx="3"/>
    <rect x="217" y="108" width="28" height="18" rx="3"/>
    <line x1="183" y1="117" x2="217" y2="117"/>
    <line x1="155" y1="117" x2="148" y2="112"/>
    <line x1="245" y1="117" x2="252" y2="112"/>
  </g>
  
  <!-- 徽章（高级别） -->
  <g transform="translate(145, 260)">
    <rect x="0" y="0" width="20" height="25" rx="2" fill="#1a3050" stroke="#4A9EFF" stroke-width="0.5"/>
    <text x="10" y="17" font-family="monospace" font-size="8" fill="#4A9EFF" text-anchor="middle">主</text>
  </g>
</svg>

