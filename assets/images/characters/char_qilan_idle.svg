<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 栖蓝 立绘（待机状态）
  角色: 多余者代表，街角修补匠
  尺寸: 400×600px
  风格: 平静坚硬，工装围裙
-->
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 工装 -->
    <linearGradient id="workwearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3530"/>
      <stop offset="100%" style="stop-color:#1e2825"/>
    </linearGradient>
    
    <!-- 深度青光环 -->
    <filter id="depthCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 皮肤 -->
    <linearGradient id="skinGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8C8B8"/>
      <stop offset="100%" style="stop-color:#C8B8A8"/>
    </linearGradient>
  </defs>
  
  <!-- 深度青光环 -->
  <g filter="url(#depthCyanGlow)" opacity="0.2">
    <ellipse cx="200" cy="330" rx="100" ry="180" fill="#00FFAA" opacity="0.3"/>
  </g>
  
  <!-- ===== 身体 ===== -->
  
  <!-- 工装上衣 -->
  <path d="M145 215 Q135 280, 140 380 L140 520 L260 520 L260 380 Q265 280, 255 215 Z" fill="url(#workwearGrad)" stroke="#3a4540" stroke-width="1"/>
  
  <!-- 围裙 -->
  <path d="M155 280 L155 500 L245 500 L245 280 Z" fill="#4a5550" stroke="#3a4540" stroke-width="1"/>
  
  <!-- 围裙带 -->
  <path d="M155 280 Q120 275, 140 250" fill="none" stroke="#4a5550" stroke-width="4"/>
  <path d="M245 280 Q280 275, 260 250" fill="none" stroke="#4a5550" stroke-width="4"/>
  
  <!-- 围裙口袋 -->
  <rect x="165" y="320" width="70" height="60" rx="3" fill="#3a4540" stroke="#4a5550" stroke-width="0.5"/>
  
  <!-- 工具（在口袋里） -->
  <rect x="175" y="310" width="8" height="40" fill="#8B7355" rx="1"/>
  <rect x="190" y="315" width="6" height="35" fill="#6a6a70" rx="1"/>
  <rect x="205" y="312" width="10" height="38" fill="#8B7355" rx="1"/>
  
  <!-- 领口 -->
  <polygon points="180,220 200,245 220,220" fill="#1e2825"/>
  
  <!-- ===== 手臂 ===== -->
  
  <!-- 左臂 -->
  <path d="M145 225 Q110 285, 100 355 Q90 425, 110 475" fill="none" stroke="url(#workwearGrad)" stroke-width="28" stroke-linecap="round"/>
  
  <!-- 右臂（持工具） -->
  <path d="M255 225 Q290 285, 300 355 Q310 425, 290 475" fill="none" stroke="url(#workwearGrad)" stroke-width="28" stroke-linecap="round"/>
  
  <!-- 手 -->
  <ellipse cx="113" cy="490" rx="17" ry="21" fill="url(#skinGrad5)" stroke="#B8A898" stroke-width="0.5"/>
  <ellipse cx="287" cy="490" rx="17" ry="21" fill="url(#skinGrad5)" stroke="#B8A898" stroke-width="0.5"/>
  
  <!-- 右手持锤子 -->
  <g transform="translate(270, 450)">
    <rect x="0" y="0" width="8" height="60" fill="#8B7355" rx="2"/>
    <rect x="-8" y="-15" width="24" height="20" fill="#6a6a70" rx="2"/>
  </g>
  
  <!-- ===== 头部 ===== -->
  
  <!-- 颈部 -->
  <rect x="180" y="180" width="40" height="45" rx="5" fill="url(#skinGrad5)"/>
  
  <!-- 脸部 -->
  <ellipse cx="200" cy="120" rx="52" ry="68" fill="url(#skinGrad5)" stroke="#B8A898" stroke-width="0.5"/>
  
  <!-- 头发（短发，实用） -->
  <path d="M148 90 Q155 45, 200 40 Q245 45, 252 90 L255 120 Q248 85, 200 80 Q152 85, 145 120 Z" fill="#3a3530" stroke="#4a4540" stroke-width="0.5"/>
  
  <!-- 眼睛（坚定平静） -->
  <g transform="translate(168, 112)">
    <!-- 左眼 -->
    <ellipse cx="0" cy="0" rx="9" ry="6" fill="#1a1a24"/>
    <circle cx="1" cy="-1" r="4" fill="#406050"/>
    <circle cx="2" cy="-2" r="1.5" fill="#FFFFFF"/>
    
    <!-- 右眼 -->
    <ellipse cx="64" cy="0" rx="9" ry="6" fill="#1a1a24"/>
    <circle cx="65" cy="-1" r="4" fill="#406050"/>
    <circle cx="66" cy="-2" r="1.5" fill="#FFFFFF"/>
  </g>
  
  <!-- 眉毛（平直） -->
  <path d="M155 100 L185 100" fill="none" stroke="#3a3530" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M215 100 L245 100" fill="none" stroke="#3a3530" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 鼻子 -->
  <path d="M200 122 L196 145 L200 152 L204 145" fill="none" stroke="#B8A898" stroke-width="1" opacity="0.5"/>
  
  <!-- 嘴巴（紧闭坚定） -->
  <line x1="188" y1="170" x2="212" y2="170" stroke="#908070" stroke-width="2"/>
  
  <!-- ===== 腿部 ===== -->
  
  <!-- 工装裤 -->
  <rect x="155" y="500" width="38" height="95" rx="4" fill="url(#workwearGrad)"/>
  <rect x="207" y="500" width="38" height="95" rx="4" fill="url(#workwearGrad)"/>
  
  <!-- 工靴 -->
  <ellipse cx="174" cy="595" rx="24" ry="10" fill="#3a3530" stroke="#4a4540" stroke-width="1"/>
  <ellipse cx="226" cy="595" rx="24" ry="10" fill="#3a3530" stroke="#4a4540" stroke-width="1"/>
  
  <!-- ===== 深度青装饰（多余者标记） ===== -->
  <g filter="url(#depthCyanGlow)" opacity="0.5">
    <circle cx="185" cy="305" r="4" fill="#00FFAA"/>
    <circle cx="215" cy="308" r="3" fill="#00FFAA"/>
    <path d="M190 340 L210 340" stroke="#00FFAA" stroke-width="2" stroke-dasharray="4 2"/>
  </g>
</svg>

