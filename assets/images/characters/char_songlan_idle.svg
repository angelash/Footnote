<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 宋岚 立绘（待机状态）
  角色: 层下记录者，测绘员
  尺寸: 400×600px
  风格: 学者气质，带地图卷轴
-->
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 服装渐变 -->
    <linearGradient id="songlanCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3530"/>
      <stop offset="100%" style="stop-color:#2a2520"/>
    </linearGradient>
    
    <!-- 差异金高光 -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 皮肤 -->
    <linearGradient id="skinGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D8C8"/>
      <stop offset="100%" style="stop-color:#D8C8B8"/>
    </linearGradient>
  </defs>
  
  <!-- 差异金光环 -->
  <g filter="url(#goldGlow)" opacity="0.2">
    <ellipse cx="200" cy="350" rx="100" ry="180" fill="#FFD700" opacity="0.3"/>
  </g>
  
  <!-- ===== 身体 ===== -->
  
  <!-- 外套 -->
  <path d="M145 220 Q135 280, 140 380 L140 520 L260 520 L260 380 Q265 280, 255 220 Z" fill="url(#songlanCloth)" stroke="#4a4540" stroke-width="1"/>
  
  <!-- 内衬 -->
  <polygon points="180,220 200,250 220,220" fill="#E8D4A0" opacity="0.7"/>
  
  <!-- 衣领 -->
  <path d="M175 220 L155 320" fill="none" stroke="#4a4540" stroke-width="1"/>
  <path d="M225 220 L245 320" fill="none" stroke="#4a4540" stroke-width="1"/>
  
  <!-- 口袋（装笔记本） -->
  <rect x="155" y="280" width="35" height="45" rx="2" fill="#2a2520" stroke="#4a4540" stroke-width="0.5"/>
  <rect x="160" y="285" width="25" height="5" fill="#E8D4A0" opacity="0.6"/>
  
  <!-- ===== 手臂 ===== -->
  
  <!-- 左臂（抱着卷轴） -->
  <path d="M145 230 Q110 280, 100 340 Q90 400, 110 450" fill="none" stroke="url(#songlanCloth)" stroke-width="28" stroke-linecap="round"/>
  
  <!-- 右臂 -->
  <path d="M255 230 Q290 280, 300 340 Q310 400, 290 450" fill="none" stroke="url(#songlanCloth)" stroke-width="28" stroke-linecap="round"/>
  
  <!-- 手 -->
  <ellipse cx="115" cy="465" rx="16" ry="20" fill="url(#skinGrad3)" stroke="#C8B8A8" stroke-width="0.5"/>
  <ellipse cx="285" cy="465" rx="16" ry="20" fill="url(#skinGrad3)" stroke="#C8B8A8" stroke-width="0.5"/>
  
  <!-- ===== 地图卷轴 ===== -->
  <g transform="translate(80, 350)">
    <!-- 卷轴主体 -->
    <rect x="0" y="0" width="80" height="120" rx="4" fill="#E8D4A0" stroke="#C8B480" stroke-width="1"/>
    
    <!-- 卷轴装饰 -->
    <ellipse cx="0" cy="10" rx="8" ry="10" fill="#8B7355"/>
    <ellipse cx="0" cy="110" rx="8" ry="10" fill="#8B7355"/>
    <ellipse cx="80" cy="10" rx="8" ry="10" fill="#8B7355"/>
    <ellipse cx="80" cy="110" rx="8" ry="10" fill="#8B7355"/>
    
    <!-- 地图线条 -->
    <g stroke="#C8B480" stroke-width="0.5" fill="none" opacity="0.7">
      <path d="M15 30 Q40 25, 65 35"/>
      <path d="M10 50 Q30 45, 50 55 Q60 60, 70 50"/>
      <path d="M20 70 L55 75"/>
      <path d="M15 90 Q35 85, 60 95"/>
    </g>
    
    <!-- 差异标记（金色） -->
    <g filter="url(#goldGlow)">
      <circle cx="35" cy="45" r="4" fill="#FFD700" opacity="0.8"/>
      <circle cx="55" cy="75" r="3" fill="#FFD700" opacity="0.6"/>
    </g>
  </g>
  
  <!-- ===== 头部 ===== -->
  
  <!-- 颈部 -->
  <rect x="180" y="185" width="40" height="45" rx="5" fill="url(#skinGrad3)"/>
  
  <!-- 脸部 -->
  <ellipse cx="200" cy="125" rx="50" ry="65" fill="url(#skinGrad3)" stroke="#C8B8A8" stroke-width="0.5"/>
  
  <!-- 头发（学者式） -->
  <path d="M150 90 Q155 50, 200 45 Q245 50, 250 90 L255 130 Q250 100, 200 95 Q150 100, 145 130 Z" fill="#4a4540" stroke="#5a5550" stroke-width="0.5"/>
  
  <!-- 发丝细节 -->
  <path d="M160 75 Q180 70, 200 72" fill="none" stroke="#5a5550" stroke-width="0.5"/>
  <path d="M200 72 Q220 70, 240 75" fill="none" stroke="#5a5550" stroke-width="0.5"/>
  
  <!-- 眼睛（专注的） -->
  <g transform="translate(170, 115)">
    <!-- 左眼 -->
    <ellipse cx="0" cy="0" rx="9" ry="6" fill="#1a1a24"/>
    <circle cx="1" cy="-1" r="4" fill="#806040"/>
    <circle cx="2" cy="-2" r="1.5" fill="#FFFFFF"/>
    
    <!-- 右眼 -->
    <ellipse cx="60" cy="0" rx="9" ry="6" fill="#1a1a24"/>
    <circle cx="61" cy="-1" r="4" fill="#806040"/>
    <circle cx="62" cy="-2" r="1.5" fill="#FFFFFF"/>
  </g>
  
  <!-- 眼镜 -->
  <g fill="none" stroke="#8B7355" stroke-width="1.5">
    <circle cx="170" cy="115" r="14"/>
    <circle cx="230" cy="115" r="14"/>
    <path d="M184 115 L216 115"/>
    <path d="M156 112 L150 108"/>
    <path d="M244 112 L250 108"/>
  </g>
  
  <!-- 眉毛 -->
  <path d="M155 100 Q170 95, 185 100" fill="none" stroke="#4a4540" stroke-width="2" stroke-linecap="round"/>
  <path d="M215 100 Q230 95, 245 100" fill="none" stroke="#4a4540" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 鼻子 -->
  <path d="M200 125 L196 148 L200 155 L204 148" fill="none" stroke="#C8B8A8" stroke-width="1" opacity="0.5"/>
  
  <!-- 嘴巴（微笑） -->
  <path d="M185 172 Q200 178, 215 172" fill="none" stroke="#A08070" stroke-width="1.5"/>
  
  <!-- ===== 腿部 ===== -->
  
  <!-- 裤子 -->
  <rect x="155" y="500" width="35" height="95" rx="4" fill="#3a3530"/>
  <rect x="210" y="500" width="35" height="95" rx="4" fill="#3a3530"/>
  
  <!-- 鞋 -->
  <ellipse cx="172" cy="595" rx="22" ry="10" fill="#2a2520" stroke="#4a4540" stroke-width="0.5"/>
  <ellipse cx="228" cy="595" rx="22" ry="10" fill="#2a2520" stroke="#4a4540" stroke-width="0.5"/>
  
  <!-- ===== 差异金装饰 ===== -->
  <g filter="url(#goldGlow)" opacity="0.6">
    <rect x="145" y="235" width="3" height="80" fill="#FFD700"/>
    <rect x="252" y="235" width="3" height="80" fill="#FFD700"/>
  </g>
</svg>

