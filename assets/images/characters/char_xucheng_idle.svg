<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 许澄 立绘（待机状态）
  角色: 医生，对齐与减伤边界人
  尺寸: 400×600px
  风格: 专业温柔，白大褂
-->
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 白大褂 -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E6E3"/>
      <stop offset="100%" style="stop-color:#D0CEC8"/>
    </linearGradient>
    
    <!-- 治愈绿光环 -->
    <filter id="healGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 皮肤 -->
    <linearGradient id="skinGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E0D0"/>
      <stop offset="100%" style="stop-color:#E0D0C0"/>
    </linearGradient>
  </defs>
  
  <!-- 治愈光环 -->
  <g filter="url(#healGlow)" opacity="0.2">
    <ellipse cx="200" cy="320" rx="100" ry="180" fill="#00CC66" opacity="0.3"/>
  </g>
  
  <!-- ===== 身体 ===== -->
  
  <!-- 白大褂 -->
  <path d="M140 220 Q130 280, 135 380 L135 530 L265 530 L265 380 Q270 280, 260 220 Z" fill="url(#coatGrad)" stroke="#C8C6C0" stroke-width="1"/>
  
  <!-- 内衬（浅蓝） -->
  <polygon points="180,225 200,260 220,225" fill="#A8C8D8"/>
  
  <!-- 大褂领子 -->
  <path d="M175 225 L145 320" fill="none" stroke="#C8C6C0" stroke-width="1"/>
  <path d="M225 225 L255 320" fill="none" stroke="#C8C6C0" stroke-width="1"/>
  
  <!-- 口袋 -->
  <rect x="150" y="300" width="45" height="50" rx="3" fill="#D8D6D0" stroke="#C8C6C0" stroke-width="0.5"/>
  <!-- 口袋里的笔 -->
  <rect x="155" y="305" width="4" height="30" fill="#4A9EFF"/>
  <rect x="162" y="308" width="4" height="27" fill="#00CC66"/>
  
  <!-- 纽扣 -->
  <circle cx="200" cy="280" r="5" fill="#C8C6C0" stroke="#B8B6B0" stroke-width="0.5"/>
  <circle cx="200" cy="340" r="5" fill="#C8C6C0" stroke="#B8B6B0" stroke-width="0.5"/>
  <circle cx="200" cy="400" r="5" fill="#C8C6C0" stroke="#B8B6B0" stroke-width="0.5"/>
  
  <!-- ===== 手臂 ===== -->
  
  <!-- 左臂 -->
  <path d="M140 230 Q105 290, 95 360 Q85 420, 105 470" fill="none" stroke="url(#coatGrad)" stroke-width="30" stroke-linecap="round"/>
  
  <!-- 右臂（手持听诊器） -->
  <path d="M260 230 Q295 290, 305 360 Q315 420, 295 470" fill="none" stroke="url(#coatGrad)" stroke-width="30" stroke-linecap="round"/>
  
  <!-- 手 -->
  <ellipse cx="108" cy="485" rx="17" ry="21" fill="url(#skinGrad4)" stroke="#D8C8B8" stroke-width="0.5"/>
  <ellipse cx="292" cy="485" rx="17" ry="21" fill="url(#skinGrad4)" stroke="#D8C8B8" stroke-width="0.5"/>
  
  <!-- ===== 听诊器 ===== -->
  <g transform="translate(170, 250)">
    <!-- 听诊器管 -->
    <path d="M30 0 Q20 30, 30 60 Q50 100, 30 140" fill="none" stroke="#2a2a35" stroke-width="4"/>
    <!-- 听诊器头 -->
    <circle cx="30" cy="150" r="15" fill="#4a4a58" stroke="#3a3a48" stroke-width="1"/>
    <circle cx="30" cy="150" r="8" fill="#3a3a48"/>
  </g>
  
  <!-- ===== 头部 ===== -->
  
  <!-- 颈部 -->
  <rect x="180" y="185" width="40" height="45" rx="5" fill="url(#skinGrad4)"/>
  
  <!-- 脸部 -->
  <ellipse cx="200" cy="125" rx="52" ry="68" fill="url(#skinGrad4)" stroke="#D8C8B8" stroke-width="0.5"/>
  
  <!-- 头发（整洁短发） -->
  <path d="M148 90 Q155 45, 200 40 Q245 45, 252 90 L252 110 Q245 80, 200 75 Q155 80, 148 110 Z" fill="#3a3530" stroke="#4a4540" stroke-width="0.5"/>
  
  <!-- 眼睛（温和的） -->
  <g transform="translate(168, 118)">
    <!-- 左眼 -->
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#1a1a24"/>
    <circle cx="1" cy="-1" r="4" fill="#4a6048"/>
    <circle cx="2" cy="-2" r="1.5" fill="#FFFFFF"/>
    
    <!-- 右眼 -->
    <ellipse cx="64" cy="0" rx="10" ry="7" fill="#1a1a24"/>
    <circle cx="65" cy="-1" r="4" fill="#4a6048"/>
    <circle cx="66" cy="-2" r="1.5" fill="#FFFFFF"/>
  </g>
  
  <!-- 眉毛（柔和） -->
  <path d="M152 105 Q168 100, 182 105" fill="none" stroke="#3a3530" stroke-width="2" stroke-linecap="round"/>
  <path d="M218 105 Q232 100, 248 105" fill="none" stroke="#3a3530" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 鼻子 -->
  <path d="M200 128 L196 150 L200 158 L204 150" fill="none" stroke="#D8C8B8" stroke-width="1" opacity="0.5"/>
  
  <!-- 嘴巴（微笑） -->
  <path d="M185 175 Q200 182, 215 175" fill="none" stroke="#B08878" stroke-width="1.5"/>
  
  <!-- ===== 腿部 ===== -->
  
  <!-- 裤子 -->
  <rect x="150" y="510" width="40" height="85" rx="4" fill="#2a2a35"/>
  <rect x="210" y="510" width="40" height="85" rx="4" fill="#2a2a35"/>
  
  <!-- 鞋 -->
  <ellipse cx="170" cy="595" rx="24" ry="10" fill="#E8E6E3" stroke="#C8C6C0" stroke-width="0.5"/>
  <ellipse cx="230" cy="595" rx="24" ry="10" fill="#E8E6E3" stroke="#C8C6C0" stroke-width="0.5"/>
  
  <!-- ===== 名牌 ===== -->
  <g transform="translate(210, 285)">
    <rect x="0" y="0" width="50" height="20" rx="2" fill="#FFFFFF" stroke="#C8C6C0" stroke-width="0.5"/>
    <text x="25" y="14" font-family="Noto Sans SC" font-size="8" fill="#2a2a35" text-anchor="middle">许澄 医师</text>
  </g>
  
  <!-- 治愈绿装饰 -->
  <g opacity="0.5">
    <circle cx="155" cy="310" r="3" fill="#00CC66"/>
    <circle cx="165" cy="315" r="2" fill="#00CC66"/>
  </g>
</svg>

