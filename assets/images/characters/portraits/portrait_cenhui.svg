<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 岑回 立绘
  尺寸: 400×600px
  角色: 玩家角色/例外处理器
  特征: 20+岁外勤，沉默克制，工装，短发
  特征色: #4A9EFF（系统蓝）
-->
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 皮肤渐变 -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D8C8"/>
      <stop offset="100%" style="stop-color:#D4C4B4"/>
    </linearGradient>
    
    <!-- 头发渐变 -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a35"/>
      <stop offset="100%" style="stop-color:#1a1a24"/>
    </linearGradient>
    
    <!-- 工装渐变 -->
    <linearGradient id="uniformGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a48"/>
      <stop offset="100%" style="stop-color:#2a2a35"/>
    </linearGradient>
    
    <!-- 系统蓝发光 -->
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 阴影 -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- 眼睛虹膜渐变 -->
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4A9EFF"/>
      <stop offset="70%" style="stop-color:#3080DD"/>
      <stop offset="100%" style="stop-color:#2060AA"/>
    </radialGradient>
  </defs>
  
  <!-- 背景光晕 -->
  <ellipse cx="200" cy="300" rx="150" ry="250" fill="#4A9EFF" opacity="0.03"/>
  
  <!-- ===== 身体 ===== -->
  <g filter="url(#shadowFilter)">
    
    <!-- 工装外套 - 主体 -->
    <path d="M120 280 
             Q100 320, 90 400 
             L90 580 L310 580 L310 400 
             Q300 320, 280 280
             Q250 260, 200 260 
             Q150 260, 120 280" 
          fill="url(#uniformGrad)" stroke="#2a2a35" stroke-width="1"/>
    
    <!-- 工装领口 -->
    <path d="M150 260 Q170 250, 200 248 Q230 250, 250 260" 
          fill="none" stroke="#3a3a48" stroke-width="2"/>
    
    <!-- 领口V形 -->
    <path d="M160 265 L200 310 L240 265" 
          fill="#1a1a24" stroke="#2a2a35" stroke-width="1"/>
    
    <!-- 内衬 -->
    <path d="M165 270 L200 305 L235 270" 
          fill="#0a0a0f" stroke="none"/>
    
    <!-- 肩章左 -->
    <rect x="105" y="275" width="35" height="8" rx="2" fill="#4A9EFF" opacity="0.3"/>
    <rect x="105" y="275" width="35" height="8" rx="2" fill="none" stroke="#4A9EFF" stroke-width="1"/>
    
    <!-- 肩章右 -->
    <rect x="260" y="275" width="35" height="8" rx="2" fill="#4A9EFF" opacity="0.3"/>
    <rect x="260" y="275" width="35" height="8" rx="2" fill="none" stroke="#4A9EFF" stroke-width="1"/>
    
    <!-- 口袋左 -->
    <rect x="115" y="380" width="50" height="60" rx="4" fill="#2a2a35" stroke="#3a3a48" stroke-width="1"/>
    <line x1="120" y1="395" x2="160" y2="395" stroke="#3a3a48" stroke-width="1"/>
    
    <!-- 口袋右 -->
    <rect x="235" y="380" width="50" height="60" rx="4" fill="#2a2a35" stroke="#3a3a48" stroke-width="1"/>
    <line x1="240" y1="395" x2="280" y2="395" stroke="#3a3a48" stroke-width="1"/>
    
    <!-- 拉链线 -->
    <line x1="200" y1="310" x2="200" y2="520" stroke="#4A9EFF" stroke-width="1" opacity="0.4"/>
    <circle cx="200" cy="320" r="4" fill="#4A9EFF" opacity="0.6"/>
    
    <!-- 袖子左 -->
    <path d="M90 290 Q60 350, 50 420 Q45 450, 55 480 L85 480 Q95 450, 95 420 Q90 360, 100 300" 
          fill="url(#uniformGrad)" stroke="#2a2a35" stroke-width="1"/>
    
    <!-- 袖子右 -->
    <path d="M310 290 Q340 350, 350 420 Q355 450, 345 480 L315 480 Q305 450, 305 420 Q310 360, 300 300" 
          fill="url(#uniformGrad)" stroke="#2a2a35" stroke-width="1"/>
    
    <!-- 手部 -->
    <ellipse cx="70" cy="495" rx="20" ry="25" fill="url(#skinGrad)"/>
    <ellipse cx="330" cy="495" rx="20" ry="25" fill="url(#skinGrad)"/>
  </g>
  
  <!-- ===== 颈部 ===== -->
  <path d="M170 250 Q180 260, 200 262 Q220 260, 230 250 L230 230 Q220 235, 200 235 Q180 235, 170 230 Z" 
        fill="url(#skinGrad)"/>
  
  <!-- ===== 头部 ===== -->
  <g filter="url(#shadowFilter)">
    
    <!-- 脸部轮廓 -->
    <ellipse cx="200" cy="150" rx="70" ry="90" fill="url(#skinGrad)"/>
    
    <!-- 下巴修饰 -->
    <path d="M140 170 Q150 220, 200 240 Q250 220, 260 170" 
          fill="url(#skinGrad)" stroke="none"/>
    
    <!-- 耳朵 -->
    <ellipse cx="128" cy="150" rx="10" ry="18" fill="url(#skinGrad)"/>
    <ellipse cx="272" cy="150" rx="10" ry="18" fill="url(#skinGrad)"/>
    
    <!-- ===== 头发 ===== -->
    <!-- 主要发型 - 短发 -->
    <path d="M130 100 
             Q120 60, 160 40 
             Q200 25, 240 40 
             Q280 60, 270 100
             Q275 130, 275 140
             L270 120 Q260 90, 200 85 Q140 90, 130 120
             L125 140 Q125 130, 130 100" 
          fill="url(#hairGrad)" stroke="#1a1a24" stroke-width="1"/>
    
    <!-- 刘海 -->
    <path d="M145 95 Q155 75, 175 80 Q165 95, 160 115" 
          fill="url(#hairGrad)" stroke="none"/>
    <path d="M175 90 Q190 70, 210 72 Q200 90, 195 110" 
          fill="url(#hairGrad)" stroke="none"/>
    <path d="M205 88 Q220 68, 245 80 Q235 95, 230 115" 
          fill="url(#hairGrad)" stroke="none"/>
    
    <!-- 鬓角 -->
    <path d="M130 120 Q125 150, 130 170" fill="url(#hairGrad)" stroke="none"/>
    <path d="M270 120 Q275 150, 270 170" fill="url(#hairGrad)" stroke="none"/>
  </g>
  
  <!-- ===== 五官 ===== -->
  
  <!-- 眉毛 -->
  <path d="M152 115 Q170 108, 185 112" fill="none" stroke="#2a2a35" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M215 112 Q230 108, 248 115" fill="none" stroke="#2a2a35" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 眼睛 - 左 -->
  <g>
    <ellipse cx="168" cy="135" rx="18" ry="12" fill="#FFFFFF"/>
    <ellipse cx="168" cy="135" rx="18" ry="12" fill="none" stroke="#2a2a35" stroke-width="1"/>
    <!-- 虹膜 -->
    <circle cx="168" cy="136" r="9" fill="url(#irisGrad)"/>
    <!-- 瞳孔 -->
    <circle cx="168" cy="136" r="4" fill="#1a1a24"/>
    <!-- 高光 -->
    <circle cx="165" cy="133" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="171" cy="138" r="1" fill="#FFFFFF" opacity="0.5"/>
    <!-- 上眼睑阴影 -->
    <path d="M150 128 Q168 125, 186 128" fill="none" stroke="#C4B4A4" stroke-width="2"/>
  </g>
  
  <!-- 眼睛 - 右 -->
  <g>
    <ellipse cx="232" cy="135" rx="18" ry="12" fill="#FFFFFF"/>
    <ellipse cx="232" cy="135" rx="18" ry="12" fill="none" stroke="#2a2a35" stroke-width="1"/>
    <!-- 虹膜 -->
    <circle cx="232" cy="136" r="9" fill="url(#irisGrad)"/>
    <!-- 瞳孔 -->
    <circle cx="232" cy="136" r="4" fill="#1a1a24"/>
    <!-- 高光 -->
    <circle cx="229" cy="133" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="235" cy="138" r="1" fill="#FFFFFF" opacity="0.5"/>
    <!-- 上眼睑阴影 -->
    <path d="M214 128 Q232 125, 250 128" fill="none" stroke="#C4B4A4" stroke-width="2"/>
  </g>
  
  <!-- 鼻子 -->
  <path d="M200 140 L198 165 Q195 172, 200 175 Q205 172, 202 165 L200 140" 
        fill="none" stroke="#C4B4A4" stroke-width="1"/>
  <ellipse cx="192" cy="173" rx="4" ry="2" fill="none" stroke="#C4B4A4" stroke-width="0.5"/>
  <ellipse cx="208" cy="173" rx="4" ry="2" fill="none" stroke="#C4B4A4" stroke-width="0.5"/>
  
  <!-- 嘴唇 - 克制/中性表情 -->
  <path d="M178 198 Q190 202, 200 200 Q210 202, 222 198" 
        fill="none" stroke="#B8A090" stroke-width="2" stroke-linecap="round"/>
  <path d="M182 200 Q200 206, 218 200" 
        fill="none" stroke="#C4A898" stroke-width="1"/>
  
  <!-- ===== 细节装饰 ===== -->
  
  <!-- 耳机/通讯设备 -->
  <g filter="url(#blueGlow)">
    <path d="M120 140 Q105 140, 100 150 Q95 165, 100 175" 
          fill="none" stroke="#4A9EFF" stroke-width="2"/>
    <circle cx="100" cy="175" r="5" fill="#4A9EFF" opacity="0.5"/>
    <circle cx="100" cy="175" r="3" fill="#4A9EFF"/>
  </g>
  
  <!-- 工牌 -->
  <g transform="translate(145, 330)">
    <rect x="0" y="0" width="50" height="35" rx="3" fill="#1a1a24" stroke="#4A9EFF" stroke-width="1"/>
    <rect x="5" y="5" width="40" height="8" rx="1" fill="#4A9EFF" opacity="0.3"/>
    <line x1="5" y1="18" x2="45" y2="18" stroke="#4A9EFF" stroke-width="0.5" opacity="0.5"/>
    <line x1="5" y1="24" x2="35" y2="24" stroke="#4A9EFF" stroke-width="0.5" opacity="0.3"/>
    <text x="25" y="32" font-family="monospace" font-size="6" fill="#4A9EFF" text-anchor="middle" opacity="0.6">外勤</text>
  </g>
  
  <!-- 系统蓝微光效果 -->
  <g opacity="0.3">
    <circle cx="100" cy="175" r="8" fill="#4A9EFF">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

