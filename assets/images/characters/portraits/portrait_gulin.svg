<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 顾临 立绘
  尺寸: 400×600px
  角色: 维修局主管/收敛主义者
  特征: 35-45岁主管，温和秩序，西装，中年气质
  特征色: #A8A6A3（稳定灰）
-->
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 皮肤渐变（略微成熟肤色） -->
    <linearGradient id="skinGradGL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0D0C0"/>
      <stop offset="100%" style="stop-color:#D0C0B0"/>
    </linearGradient>
    
    <!-- 头发渐变（灰黑色，带白发丝） -->
    <linearGradient id="hairGradGL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#404048"/>
      <stop offset="100%" style="stop-color:#303038"/>
    </linearGradient>
    
    <!-- 西装渐变 -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a32"/>
      <stop offset="100%" style="stop-color:#1e1e26"/>
    </linearGradient>
    
    <!-- 稳定灰发光 -->
    <filter id="grayGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 阴影 -->
    <filter id="shadowGL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- 眼睛（深灰色，沉稳） -->
    <radialGradient id="irisGradGL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#5a5a60"/>
      <stop offset="70%" style="stop-color:#4a4a50"/>
      <stop offset="100%" style="stop-color:#3a3a40"/>
    </radialGradient>
  </defs>
  
  <!-- 背景光晕 -->
  <ellipse cx="200" cy="300" rx="150" ry="250" fill="#A8A6A3" opacity="0.02"/>
  
  <!-- ===== 身体 ===== -->
  <g filter="url(#shadowGL)">
    
    <!-- 西装外套 - 主体 -->
    <path d="M110 280 
             Q85 330, 80 420 
             L80 580 L320 580 L320 420 
             Q315 330, 290 280
             Q250 255, 200 255 
             Q150 255, 110 280" 
          fill="url(#suitGrad)" stroke="#1a1a22" stroke-width="1"/>
    
    <!-- 西装领 - 左 -->
    <path d="M130 270 L160 260 L175 300 L200 340 L155 340 L120 290 Z" 
          fill="#1e1e26" stroke="#2a2a32" stroke-width="1"/>
    
    <!-- 西装领 - 右 -->
    <path d="M270 270 L240 260 L225 300 L200 340 L245 340 L280 290 Z" 
          fill="#1e1e26" stroke="#2a2a32" stroke-width="1"/>
    
    <!-- 衬衫 -->
    <path d="M160 265 L200 340 L240 265 Q220 258, 200 258 Q180 258, 160 265" 
          fill="#E8E6E3" stroke="#D0CEC8" stroke-width="0.5"/>
    
    <!-- 领带 -->
    <path d="M190 275 L200 280 L210 275 L205 340 L200 345 L195 340 Z" 
          fill="#A8A6A3"/>
    <path d="M195 340 L200 400 L205 340" fill="#A8A6A3"/>
    <circle cx="200" cy="278" r="5" fill="#A8A6A3" stroke="#8a8a88" stroke-width="0.5"/>
    
    <!-- 西装扣 -->
    <circle cx="200" cy="420" r="6" fill="#1a1a22" stroke="#3a3a42" stroke-width="1"/>
    <circle cx="200" cy="480" r="6" fill="#1a1a22" stroke="#3a3a42" stroke-width="1"/>
    
    <!-- 口袋方巾 -->
    <g transform="translate(115, 320)">
      <path d="M0 0 L20 0 L25 15 L5 20 Z" fill="#A8A6A3" opacity="0.7"/>
    </g>
    
    <!-- 袖子左 -->
    <path d="M80 300 Q50 370, 45 450 Q42 490, 55 520 L90 520 Q100 490, 98 450 Q95 380, 105 310" 
          fill="url(#suitGrad)" stroke="#1a1a22" stroke-width="1"/>
    
    <!-- 袖子右 -->
    <path d="M320 300 Q350 370, 355 450 Q358 490, 345 520 L310 520 Q300 490, 302 450 Q305 380, 295 310" 
          fill="url(#suitGrad)" stroke="#1a1a22" stroke-width="1"/>
    
    <!-- 袖口（衬衫露出） -->
    <rect x="55" y="510" width="35" height="12" rx="2" fill="#E8E6E3"/>
    <rect x="310" y="510" width="35" height="12" rx="2" fill="#E8E6E3"/>
    
    <!-- 手部 -->
    <ellipse cx="72" cy="540" rx="22" ry="28" fill="url(#skinGradGL)"/>
    <ellipse cx="328" cy="540" rx="22" ry="28" fill="url(#skinGradGL)"/>
  </g>
  
  <!-- ===== 颈部 ===== -->
  <path d="M165 250 Q180 258, 200 260 Q220 258, 235 250 L235 225 Q220 232, 200 232 Q180 232, 165 225 Z" 
        fill="url(#skinGradGL)"/>
  
  <!-- ===== 头部 ===== -->
  <g filter="url(#shadowGL)">
    
    <!-- 脸部轮廓（略方，成熟感） -->
    <path d="M130 130 
             Q125 90, 150 60 
             Q175 40, 200 38 
             Q225 40, 250 60 
             Q275 90, 270 130
             Q275 170, 260 195
             Q240 230, 200 240
             Q160 230, 140 195
             Q125 170, 130 130" 
          fill="url(#skinGradGL)"/>
    
    <!-- 耳朵 -->
    <ellipse cx="125" cy="140" rx="12" ry="20" fill="url(#skinGradGL)"/>
    <ellipse cx="275" cy="140" rx="12" ry="20" fill="url(#skinGradGL)"/>
    
    <!-- ===== 头发（中年，带灰） ===== -->
    <path d="M130 95 
             Q125 55, 165 35 
             Q200 22, 235 35 
             Q275 55, 270 95
             Q278 130, 278 140
             L273 115 Q260 80, 200 75 Q140 80, 127 115
             L122 140 Q122 130, 130 95" 
          fill="url(#hairGradGL)" stroke="#2a2a30" stroke-width="1"/>
    
    <!-- 额角略高发际线 -->
    <path d="M145 85 Q160 70, 180 75 Q168 88, 158 100" fill="url(#hairGradGL)"/>
    <path d="M255 85 Q240 70, 220 75 Q232 88, 242 100" fill="url(#hairGradGL)"/>
    
    <!-- 白发丝装饰 -->
    <path d="M155 65 Q160 45, 165 70" fill="none" stroke="#808080" stroke-width="0.5" opacity="0.5"/>
    <path d="M245 65 Q240 45, 235 70" fill="none" stroke="#808080" stroke-width="0.5" opacity="0.5"/>
    <path d="M125 110 Q120 95, 128 115" fill="none" stroke="#808080" stroke-width="0.5" opacity="0.4"/>
    
    <!-- 鬓角 -->
    <path d="M128 110 Q122 140, 126 165" fill="url(#hairGradGL)"/>
    <path d="M272 110 Q278 140, 274 165" fill="url(#hairGradGL)"/>
  </g>
  
  <!-- ===== 五官（沉稳表情）===== -->
  
  <!-- 眉毛（略粗，沉稳） -->
  <path d="M148 108 Q168 100, 188 105" fill="none" stroke="#3a3a40" stroke-width="3" stroke-linecap="round"/>
  <path d="M212 105 Q232 100, 252 108" fill="none" stroke="#3a3a40" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 眼睛 - 左（略小，成熟） -->
  <g>
    <ellipse cx="168" cy="130" rx="16" ry="10" fill="#FFFFFF"/>
    <ellipse cx="168" cy="130" rx="16" ry="10" fill="none" stroke="#3a3a40" stroke-width="1"/>
    <circle cx="168" cy="131" r="7" fill="url(#irisGradGL)"/>
    <circle cx="168" cy="131" r="3" fill="#1a1a24"/>
    <circle cx="166" cy="129" r="2" fill="#FFFFFF" opacity="0.7"/>
    <path d="M152 124 Q168 121, 184 124" fill="none" stroke="#C0B0A0" stroke-width="1.5"/>
    <!-- 眼袋细节 -->
    <path d="M154 140 Q168 143, 182 140" fill="none" stroke="#C8B8A8" stroke-width="0.5" opacity="0.5"/>
  </g>
  
  <!-- 眼睛 - 右 -->
  <g>
    <ellipse cx="232" cy="130" rx="16" ry="10" fill="#FFFFFF"/>
    <ellipse cx="232" cy="130" rx="16" ry="10" fill="none" stroke="#3a3a40" stroke-width="1"/>
    <circle cx="232" cy="131" r="7" fill="url(#irisGradGL)"/>
    <circle cx="232" cy="131" r="3" fill="#1a1a24"/>
    <circle cx="230" cy="129" r="2" fill="#FFFFFF" opacity="0.7"/>
    <path d="M216 124 Q232 121, 248 124" fill="none" stroke="#C0B0A0" stroke-width="1.5"/>
    <path d="M218 140 Q232 143, 246 140" fill="none" stroke="#C8B8A8" stroke-width="0.5" opacity="0.5"/>
  </g>
  
  <!-- 鼻子（略挺） -->
  <path d="M200 135 L197 168 Q193 178, 200 180 Q207 178, 203 168 L200 135" 
        fill="none" stroke="#C0B0A0" stroke-width="1"/>
  
  <!-- 嘴唇 - 温和微笑 -->
  <path d="M175 200 Q188 196, 200 198 Q212 196, 225 200" 
        fill="none" stroke="#A08878" stroke-width="2" stroke-linecap="round"/>
  <path d="M180 202 Q200 210, 220 202" 
        fill="none" stroke="#B09888" stroke-width="1"/>
  
  <!-- 法令纹（微妙） -->
  <path d="M150 175 Q155 195, 168 210" fill="none" stroke="#D0C0B0" stroke-width="0.5" opacity="0.4"/>
  <path d="M250 175 Q245 195, 232 210" fill="none" stroke="#D0C0B0" stroke-width="0.5" opacity="0.4"/>
  
  <!-- ===== 配饰 ===== -->
  
  <!-- 眼镜 -->
  <g stroke="#3a3a42" stroke-width="1.5" fill="none">
    <rect x="148" y="118" width="40" height="28" rx="4" fill="#FFFFFF" fill-opacity="0.03"/>
    <rect x="212" y="118" width="40" height="28" rx="4" fill="#FFFFFF" fill-opacity="0.03"/>
    <line x1="188" y1="130" x2="212" y2="130"/>
    <line x1="148" y1="130" x2="125" y2="135"/>
    <line x1="252" y1="130" x2="275" y2="135"/>
  </g>
  
  <!-- 主管徽章 -->
  <g transform="translate(255, 310)" filter="url(#grayGlow)">
    <circle cx="0" cy="0" r="12" fill="#1a1a22" stroke="#A8A6A3" stroke-width="1.5"/>
    <text x="0" y="4" font-family="serif" font-size="10" fill="#A8A6A3" text-anchor="middle">主</text>
  </g>
</svg>

