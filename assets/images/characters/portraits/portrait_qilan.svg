<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 栖蓝 立绘
  尺寸: 400×600px
  角色: 多余者代表/无收益行为发动机
  特征: 街角修补匠，平静坚硬，工装围裙
  特征色: #00FFAA（深度青）
-->
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 皮肤渐变（健康但粗糙） -->
    <linearGradient id="skinQL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8C8B8"/>
      <stop offset="100%" style="stop-color:#C8B8A8"/>
    </linearGradient>
    
    <!-- 头发（灰褐色，朴实） -->
    <linearGradient id="hairQL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4038"/>
      <stop offset="100%" style="stop-color:#3a3028"/>
    </linearGradient>
    
    <!-- 工装渐变 -->
    <linearGradient id="workwearQL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a5850"/>
      <stop offset="100%" style="stop-color:#4a4840"/>
    </linearGradient>
    
    <!-- 围裙渐变 -->
    <linearGradient id="apronQL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a4038"/>
      <stop offset="100%" style="stop-color:#2a3028"/>
    </linearGradient>
    
    <!-- 深度青发光 -->
    <filter id="tealGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 阴影 -->
    <filter id="shadowQL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- 眼睛（沉静灰蓝） -->
    <radialGradient id="irisQL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#607080"/>
      <stop offset="70%" style="stop-color:#506070"/>
      <stop offset="100%" style="stop-color:#405060"/>
    </radialGradient>
  </defs>
  
  <!-- 背景光晕 -->
  <ellipse cx="200" cy="300" rx="150" ry="250" fill="#00FFAA" opacity="0.02"/>
  
  <!-- ===== 身体 ===== -->
  <g filter="url(#shadowQL)">
    
    <!-- 工装上衣 -->
    <path d="M115 275 
             Q90 330, 85 420 
             L85 580 L315 580 L315 420 
             Q310 330, 285 275
             Q250 255, 200 255 
             Q150 255, 115 275" 
          fill="url(#workwearQL)" stroke="#3a3830" stroke-width="1"/>
    
    <!-- 领口（简单圆领） -->
    <ellipse cx="200" cy="265" rx="45" ry="15" fill="#4a4840" stroke="#5a5850" stroke-width="1"/>
    
    <!-- 围裙 -->
    <path d="M130 320 L130 560 L270 560 L270 320 Q250 310, 200 310 Q150 310, 130 320" 
          fill="url(#apronQL)" stroke="#2a3028" stroke-width="1"/>
    
    <!-- 围裙带 -->
    <path d="M130 320 Q100 310, 85 330" fill="none" stroke="#3a4038" stroke-width="3"/>
    <path d="M270 320 Q300 310, 315 330" fill="none" stroke="#3a4038" stroke-width="3"/>
    
    <!-- 围裙口袋（装工具） -->
    <rect x="145" y="380" width="50" height="60" rx="3" fill="#2a3028" stroke="#3a4038" stroke-width="1"/>
    <rect x="205" y="380" width="50" height="60" rx="3" fill="#2a3028" stroke="#3a4038" stroke-width="1"/>
    
    <!-- 口袋里的工具 -->
    <g transform="translate(155, 370)">
      <!-- 螺丝刀 -->
      <rect x="0" y="0" width="6" height="25" rx="1" fill="#888888"/>
      <rect x="1" y="25" width="4" height="8" rx="1" fill="#A08060"/>
      <!-- 钳子柄 -->
      <rect x="15" y="5" width="5" height="20" rx="1" fill="#A08060"/>
      <rect x="25" y="3" width="5" height="22" rx="1" fill="#A08060"/>
    </g>
    
    <!-- 袖子（卷起） -->
    <path d="M85 290 Q60 340, 58 380 L58 390 Q62 395, 75 395 L95 395 Q108 395, 112 390 L112 380 Q108 350, 115 300" 
          fill="url(#workwearQL)" stroke="#3a3830" stroke-width="1"/>
    
    <path d="M315 290 Q340 340, 342 380 L342 390 Q338 395, 325 395 L305 395 Q292 395, 288 390 L288 380 Q292 350, 285 300" 
          fill="url(#workwearQL)" stroke="#3a3830" stroke-width="1"/>
    
    <!-- 袖口卷边 -->
    <rect x="55" y="385" width="60" height="12" rx="3" fill="#5a5850" stroke="#4a4840" stroke-width="0.5"/>
    <rect x="285" y="385" width="60" height="12" rx="3" fill="#5a5850" stroke="#4a4840" stroke-width="0.5"/>
    
    <!-- 手部（粗糙有力） -->
    <g transform="translate(45, 400)">
      <ellipse cx="30" cy="35" rx="25" ry="30" fill="url(#skinQL)"/>
      <!-- 手指 -->
      <ellipse cx="15" cy="20" rx="8" ry="12" fill="url(#skinQL)"/>
      <ellipse cx="30" cy="15" rx="8" ry="14" fill="url(#skinQL)"/>
      <ellipse cx="45" cy="20" rx="8" ry="12" fill="url(#skinQL)"/>
    </g>
    
    <!-- 右手持修补工具 -->
    <g transform="translate(295, 400)">
      <ellipse cx="30" cy="35" rx="25" ry="30" fill="url(#skinQL)"/>
      <!-- 持小锤 -->
      <rect x="40" y="10" width="8" height="50" rx="2" fill="#8B7355"/>
      <rect x="35" y="0" width="18" height="15" rx="3" fill="#606060"/>
    </g>
  </g>
  
  <!-- ===== 颈部 ===== -->
  <path d="M165 250 Q180 258, 200 260 Q220 258, 235 250 L235 225 Q220 232, 200 232 Q180 232, 165 225 Z" 
        fill="url(#skinQL)"/>
  
  <!-- ===== 头部 ===== -->
  <g filter="url(#shadowQL)">
    
    <!-- 脸部轮廓（方正结实） -->
    <path d="M140 130 
             Q135 90, 160 65 
             Q180 48, 200 45 
             Q220 48, 240 65 
             Q265 90, 260 130
             Q268 170, 255 200
             Q235 235, 200 245
             Q165 235, 145 200
             Q132 170, 140 130" 
          fill="url(#skinQL)"/>
    
    <!-- 耳朵 -->
    <ellipse cx="135" cy="145" rx="12" ry="20" fill="url(#skinQL)"/>
    <ellipse cx="265" cy="145" rx="12" ry="20" fill="url(#skinQL)"/>
    
    <!-- ===== 头发（短发，朴实） ===== -->
    <path d="M142 100 
             Q138 60, 170 42 
             Q200 30, 230 42 
             Q262 60, 258 100
             Q265 130, 265 140
             L260 115 Q252 75, 200 70 Q148 75, 140 115
             L135 140 Q135 130, 142 100" 
          fill="url(#hairQL)" stroke="#3a3028" stroke-width="1"/>
    
    <!-- 简单刘海 -->
    <path d="M150 90 Q165 72, 185 80 Q170 95, 160 115" fill="url(#hairQL)"/>
    <path d="M250 90 Q235 72, 215 80 Q230 95, 240 115" fill="url(#hairQL)"/>
    
    <!-- 鬓角 -->
    <path d="M138 115 Q132 145, 135 170" fill="url(#hairQL)"/>
    <path d="M262 115 Q268 145, 265 170" fill="url(#hairQL)"/>
  </g>
  
  <!-- ===== 五官（平静坚定）===== -->
  
  <!-- 眉毛（浓密平直） -->
  <path d="M152 115 Q170 110, 188 115" fill="none" stroke="#3a3028" stroke-width="3" stroke-linecap="round"/>
  <path d="M212 115 Q230 110, 248 115" fill="none" stroke="#3a3028" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 眼睛 - 左（平静） -->
  <g>
    <ellipse cx="170" cy="138" rx="15" ry="10" fill="#FFFFFF"/>
    <ellipse cx="170" cy="138" rx="15" ry="10" fill="none" stroke="#3a3028" stroke-width="1"/>
    <circle cx="170" cy="139" r="7" fill="url(#irisQL)"/>
    <circle cx="170" cy="139" r="3" fill="#1a1a20"/>
    <circle cx="168" cy="137" r="2" fill="#FFFFFF" opacity="0.7"/>
    <path d="M155 132 Q170 128, 185 132" fill="none" stroke="#B8A898" stroke-width="1.5"/>
  </g>
  
  <!-- 眼睛 - 右 -->
  <g>
    <ellipse cx="230" cy="138" rx="15" ry="10" fill="#FFFFFF"/>
    <ellipse cx="230" cy="138" rx="15" ry="10" fill="none" stroke="#3a3028" stroke-width="1"/>
    <circle cx="230" cy="139" r="7" fill="url(#irisQL)"/>
    <circle cx="230" cy="139" r="3" fill="#1a1a20"/>
    <circle cx="228" cy="137" r="2" fill="#FFFFFF" opacity="0.7"/>
    <path d="M215 132 Q230 128, 245 132" fill="none" stroke="#B8A898" stroke-width="1.5"/>
  </g>
  
  <!-- 鼻子（挺直） -->
  <path d="M200 142 L198 175 Q193 183, 200 186 Q207 183, 202 175 L200 142" 
        fill="none" stroke="#B8A898" stroke-width="1"/>
  
  <!-- 嘴唇（微微抿唇，坚定） -->
  <path d="M175 208 Q188 203, 200 205 Q212 203, 225 208" 
        fill="none" stroke="#A09080" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 皱纹（劳作痕迹） -->
  <path d="M155 195 Q160 200, 170 205" fill="none" stroke="#C8B8A8" stroke-width="0.5" opacity="0.4"/>
  <path d="M245 195 Q240 200, 230 205" fill="none" stroke="#C8B8A8" stroke-width="0.5" opacity="0.4"/>
  
  <!-- ===== 装饰 ===== -->
  
  <!-- 修补标记（深度青发光） -->
  <g transform="translate(220, 340)" filter="url(#tealGlow)">
    <circle cx="0" cy="0" r="10" fill="#0a0a10" stroke="#00FFAA" stroke-width="1.5"/>
    <path d="M-5 0 L5 0 M0 -5 L0 5" stroke="#00FFAA" stroke-width="1.5"/>
  </g>
  
  <!-- 工匠印记 -->
  <g transform="translate(255, 380)" opacity="0.6">
    <text font-family="serif" font-size="8" fill="#00FFAA">修</text>
  </g>
</svg>

