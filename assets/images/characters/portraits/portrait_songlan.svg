<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 宋岚 立绘
  尺寸: 400×600px
  角色: 层下记录者/版本差异守护人
  特征: 28-35岁测绘员，学者气质，带地图卷轴
  特征色: #FFD700（差异金）
-->
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 皮肤渐变 -->
    <linearGradient id="skinSL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E0D0"/>
      <stop offset="100%" style="stop-color:#E0D0C0"/>
    </linearGradient>
    
    <!-- 头发渐变（深棕色） -->
    <linearGradient id="hairSL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3028"/>
      <stop offset="100%" style="stop-color:#2a2018"/>
    </linearGradient>
    
    <!-- 外套（学者风） -->
    <linearGradient id="coatSL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4840"/>
      <stop offset="100%" style="stop-color:#3a3830"/>
    </linearGradient>
    
    <!-- 金色发光 -->
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 阴影 -->
    <filter id="shadowSL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- 眼睛（琥珀色，观察者） -->
    <radialGradient id="irisSL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#D4A020"/>
      <stop offset="70%" style="stop-color:#B88818"/>
      <stop offset="100%" style="stop-color:#8A6610"/>
    </radialGradient>
  </defs>
  
  <!-- 背景光晕 -->
  <ellipse cx="200" cy="300" rx="150" ry="250" fill="#FFD700" opacity="0.02"/>
  
  <!-- ===== 身体 ===== -->
  <g filter="url(#shadowSL)">
    
    <!-- 风衣外套 -->
    <path d="M115 275 
             Q90 330, 85 420 
             L85 580 L315 580 L315 420 
             Q310 330, 285 275
             Q250 255, 200 255 
             Q150 255, 115 275" 
          fill="url(#coatSL)" stroke="#2a2820" stroke-width="1"/>
    
    <!-- 外套领 -->
    <path d="M140 270 Q160 260, 200 255 Q240 260, 260 270 L250 290 L200 275 L150 290 Z" 
          fill="#3a3830" stroke="#4a4840" stroke-width="1"/>
    
    <!-- 衬衫内衬 -->
    <path d="M155 275 L200 330 L245 275 Q220 265, 200 265 Q180 265, 155 275" 
          fill="#E8E4D8" stroke="#D0CCC0" stroke-width="0.5"/>
    
    <!-- 外套纽扣 -->
    <circle cx="200" cy="360" r="5" fill="#8B7355" stroke="#5a4838" stroke-width="1"/>
    <circle cx="200" cy="420" r="5" fill="#8B7355" stroke="#5a4838" stroke-width="1"/>
    <circle cx="200" cy="480" r="5" fill="#8B7355" stroke="#5a4838" stroke-width="1"/>
    
    <!-- 腰带 -->
    <rect x="100" y="400" width="200" height="12" rx="2" fill="#5a4838" stroke="#3a2818" stroke-width="1"/>
    <rect x="190" y="398" width="20" height="16" rx="2" fill="#8B7355" stroke="#5a4838" stroke-width="1"/>
    
    <!-- 口袋（装地图） -->
    <rect x="115" y="340" width="55" height="50" rx="3" fill="#3a3830" stroke="#4a4840" stroke-width="1"/>
    <!-- 地图卷轴露出 -->
    <g transform="translate(125, 335)">
      <rect x="0" y="0" width="35" height="8" rx="2" fill="#E8D4A0" stroke="#C4B080" stroke-width="0.5"/>
      <line x1="5" y1="4" x2="30" y2="4" stroke="#A08060" stroke-width="0.5"/>
    </g>
    
    <!-- 袖子左 -->
    <path d="M85 295 Q55 360, 50 440 Q48 480, 60 510 L95 510 Q105 480, 102 440 Q98 370, 108 305" 
          fill="url(#coatSL)" stroke="#2a2820" stroke-width="1"/>
    
    <!-- 袖子右（持卷轴） -->
    <path d="M315 295 Q345 360, 350 440 Q352 480, 340 510 L305 510 Q295 480, 298 440 Q302 370, 292 305" 
          fill="url(#coatSL)" stroke="#2a2820" stroke-width="1"/>
    
    <!-- 手部 -->
    <ellipse cx="77" cy="530" rx="22" ry="28" fill="url(#skinSL)"/>
    <ellipse cx="323" cy="480" rx="22" ry="28" fill="url(#skinSL)"/>
    
    <!-- 右手持卷轴 -->
    <g transform="translate(310, 420)">
      <rect x="0" y="0" width="60" height="12" rx="3" fill="#E8D4A0" stroke="#C4B080" stroke-width="1" transform="rotate(45)"/>
      <!-- 卷轴装饰 -->
      <circle cx="-5" cy="5" r="6" fill="#8B7355"/>
      <circle cx="50" cy="50" r="6" fill="#8B7355" transform="rotate(45)"/>
    </g>
  </g>
  
  <!-- ===== 颈部 ===== -->
  <path d="M165 248 Q180 258, 200 260 Q220 258, 235 248 L235 225 Q220 232, 200 232 Q180 232, 165 225 Z" 
        fill="url(#skinSL)"/>
  
  <!-- ===== 头部 ===== -->
  <g filter="url(#shadowSL)">
    
    <!-- 脸部轮廓（清秀） -->
    <ellipse cx="200" cy="145" rx="65" ry="85" fill="url(#skinSL)"/>
    
    <!-- 下巴 -->
    <path d="M145 165 Q155 215, 200 235 Q245 215, 255 165" 
          fill="url(#skinSL)"/>
    
    <!-- 耳朵 -->
    <ellipse cx="132" cy="145" rx="10" ry="18" fill="url(#skinSL)"/>
    <ellipse cx="268" cy="145" rx="10" ry="18" fill="url(#skinSL)"/>
    
    <!-- ===== 头发（中长，盘起部分） ===== -->
    <path d="M135 95 
             Q130 55, 165 35 
             Q200 20, 235 35 
             Q270 55, 265 95
             Q272 140, 270 160
             L265 130 Q255 85, 200 80 Q145 85, 135 130
             L130 160 Q130 140, 135 95" 
          fill="url(#hairSL)"/>
    
    <!-- 刘海（侧分） -->
    <path d="M140 90 Q150 70, 175 78 Q163 95, 155 120" fill="url(#hairSL)"/>
    <path d="M260 90 Q250 70, 225 78 Q237 95, 245 120" fill="url(#hairSL)"/>
    
    <!-- 侧边头发 -->
    <path d="M130 130 Q120 180, 125 220 Q128 250, 120 280" fill="url(#hairSL)" stroke="#2a2018" stroke-width="0.5"/>
    <path d="M270 130 Q280 180, 275 220 Q272 250, 280 280" fill="url(#hairSL)" stroke="#2a2018" stroke-width="0.5"/>
    
    <!-- 发簪（金色） -->
    <g transform="translate(240, 70)" filter="url(#goldGlow)">
      <line x1="0" y1="0" x2="30" y2="15" stroke="#FFD700" stroke-width="2"/>
      <circle cx="30" cy="15" r="5" fill="#FFD700"/>
      <circle cx="25" cy="12" r="3" fill="#FFD700" opacity="0.7"/>
    </g>
  </g>
  
  <!-- ===== 五官 ===== -->
  
  <!-- 眉毛（细长，学者感） -->
  <path d="M150 112 Q168 105, 186 110" fill="none" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
  <path d="M214 110 Q232 105, 250 112" fill="none" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 眼睛 - 左 -->
  <g>
    <ellipse cx="168" cy="132" rx="17" ry="11" fill="#FFFFFF"/>
    <ellipse cx="168" cy="132" rx="17" ry="11" fill="none" stroke="#3a3028" stroke-width="1"/>
    <circle cx="168" cy="133" r="8" fill="url(#irisSL)"/>
    <circle cx="168" cy="133" r="3.5" fill="#1a1a18"/>
    <circle cx="165" cy="130" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <path d="M151 126 Q168 122, 185 126" fill="none" stroke="#C8B8A8" stroke-width="1.5"/>
  </g>
  
  <!-- 眼睛 - 右 -->
  <g>
    <ellipse cx="232" cy="132" rx="17" ry="11" fill="#FFFFFF"/>
    <ellipse cx="232" cy="132" rx="17" ry="11" fill="none" stroke="#3a3028" stroke-width="1"/>
    <circle cx="232" cy="133" r="8" fill="url(#irisSL)"/>
    <circle cx="232" cy="133" r="3.5" fill="#1a1a18"/>
    <circle cx="229" cy="130" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <path d="M215 126 Q232 122, 249 126" fill="none" stroke="#C8B8A8" stroke-width="1.5"/>
  </g>
  
  <!-- 鼻子 -->
  <path d="M200 138 L198 168 Q194 176, 200 178 Q206 176, 202 168 L200 138" 
        fill="none" stroke="#C8B8A8" stroke-width="1"/>
  
  <!-- 嘴唇（微微抿唇，思考状） -->
  <path d="M178 195 Q190 192, 200 194 Q210 192, 222 195" 
        fill="none" stroke="#B09080" stroke-width="2" stroke-linecap="round"/>
  
  <!-- ===== 配饰 ===== -->
  
  <!-- 测绘员徽章 -->
  <g transform="translate(260, 295)" filter="url(#goldGlow)">
    <polygon points="0,-12 10.4,6 -10.4,6" fill="none" stroke="#FFD700" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#FFD700" opacity="0.5"/>
  </g>
  
  <!-- 记录簿挂件 -->
  <g transform="translate(140, 420)">
    <rect x="0" y="0" width="25" height="35" rx="2" fill="#E8D4A0" stroke="#C4B080" stroke-width="1"/>
    <line x1="5" y1="8" x2="20" y2="8" stroke="#A08060" stroke-width="0.5"/>
    <line x1="5" y1="14" x2="18" y2="14" stroke="#A08060" stroke-width="0.5"/>
    <line x1="5" y1="20" x2="20" y2="20" stroke="#A08060" stroke-width="0.5"/>
  </g>
</svg>

