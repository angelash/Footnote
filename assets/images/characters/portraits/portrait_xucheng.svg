<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 许澄 立绘
  尺寸: 400×600px
  角色: 医生/对齐与减伤边界人
  特征: 30-40岁医生，专业温柔，白大褂
  特征色: #00CC66（治愈绿）
-->
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 皮肤渐变 -->
    <linearGradient id="skinXC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D8C8"/>
      <stop offset="100%" style="stop-color:#D8C8B8"/>
    </linearGradient>
    
    <!-- 头发（深棕色整洁） -->
    <linearGradient id="hairXC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3028"/>
      <stop offset="100%" style="stop-color:#2a2018"/>
    </linearGradient>
    
    <!-- 白大褂渐变 -->
    <linearGradient id="coatXC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F8F4"/>
      <stop offset="100%" style="stop-color:#E8E8E4"/>
    </linearGradient>
    
    <!-- 治愈绿发光 -->
    <filter id="healGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 阴影 -->
    <filter id="shadowXC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    
    <!-- 眼睛（温暖棕色） -->
    <radialGradient id="irisXC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="70%" style="stop-color:#6B5010"/>
      <stop offset="100%" style="stop-color:#4B380C"/>
    </radialGradient>
  </defs>
  
  <!-- 背景光晕 -->
  <ellipse cx="200" cy="300" rx="150" ry="250" fill="#00CC66" opacity="0.02"/>
  
  <!-- ===== 身体 ===== -->
  <g filter="url(#shadowXC)">
    
    <!-- 白大褂 -->
    <path d="M110 275 
             Q85 330, 80 420 
             L80 580 L320 580 L320 420 
             Q315 330, 290 275
             Q250 255, 200 255 
             Q150 255, 110 275" 
          fill="url(#coatXC)" stroke="#D0D0CC" stroke-width="1"/>
    
    <!-- 大褂领 -->
    <path d="M135 270 L165 260 L200 280 L235 260 L265 270 L255 290 L200 285 L145 290 Z" 
          fill="#F0F0EC" stroke="#E0E0DC" stroke-width="1"/>
    
    <!-- 内衬衬衫 -->
    <path d="M160 270 L200 310 L240 270 Q220 260, 200 260 Q180 260, 160 270" 
          fill="#E8F0E8" stroke="#D0E0D0" stroke-width="0.5"/>
    
    <!-- 纽扣 -->
    <circle cx="200" cy="340" r="5" fill="#D0D0CC" stroke="#B0B0AC" stroke-width="1"/>
    <circle cx="200" cy="400" r="5" fill="#D0D0CC" stroke="#B0B0AC" stroke-width="1"/>
    <circle cx="200" cy="460" r="5" fill="#D0D0CC" stroke="#B0B0AC" stroke-width="1"/>
    
    <!-- 口袋（左胸） -->
    <rect x="115" y="320" width="55" height="50" rx="3" fill="#F0F0EC" stroke="#E0E0DC" stroke-width="1"/>
    <!-- 笔 -->
    <g transform="translate(130, 312)">
      <rect x="0" y="0" width="4" height="30" rx="1" fill="#3a3a48"/>
      <rect x="0" y="30" width="4" height="8" rx="1" fill="#00CC66"/>
    </g>
    <g transform="translate(140, 315)">
      <rect x="0" y="0" width="4" height="28" rx="1" fill="#2a2a38"/>
      <rect x="0" y="28" width="4" height="6" rx="1" fill="#4A9EFF"/>
    </g>
    
    <!-- 口袋（右侧） -->
    <rect x="230" y="380" width="60" height="70" rx="3" fill="#F0F0EC" stroke="#E0E0DC" stroke-width="1"/>
    
    <!-- 袖子 -->
    <path d="M80 290 Q50 355, 48 430 Q46 470, 58 500 L93 500 Q103 470, 100 430 Q97 365, 108 300" 
          fill="url(#coatXC)" stroke="#D0D0CC" stroke-width="1"/>
    
    <path d="M320 290 Q350 355, 352 430 Q354 470, 342 500 L307 500 Q297 470, 300 430 Q303 365, 292 300" 
          fill="url(#coatXC)" stroke="#D0D0CC" stroke-width="1"/>
    
    <!-- 手部 -->
    <ellipse cx="75" cy="520" rx="22" ry="28" fill="url(#skinXC)"/>
    <ellipse cx="325" cy="520" rx="22" ry="28" fill="url(#skinXC)"/>
    
    <!-- 左手持听诊器 -->
    <g transform="translate(50, 480)">
      <!-- 听诊器头 -->
      <circle cx="20" cy="30" r="12" fill="#888888" stroke="#666666" stroke-width="1"/>
      <circle cx="20" cy="30" r="8" fill="#444444"/>
      <!-- 管子 -->
      <path d="M20 18 Q20 0, 35 -15 Q50 -30, 50 -50" fill="none" stroke="#333333" stroke-width="4"/>
    </g>
  </g>
  
  <!-- ===== 颈部 ===== -->
  <path d="M168 250 Q182 258, 200 260 Q218 258, 232 250 L232 228 Q218 234, 200 234 Q182 234, 168 228 Z" 
        fill="url(#skinXC)"/>
  
  <!-- ===== 头部 ===== -->
  <g filter="url(#shadowXC)">
    
    <!-- 脸部轮廓（温和） -->
    <ellipse cx="200" cy="145" rx="62" ry="82" fill="url(#skinXC)"/>
    
    <!-- 下巴 -->
    <path d="M145 165 Q155 212, 200 232 Q245 212, 255 165" 
          fill="url(#skinXC)"/>
    
    <!-- 耳朵 -->
    <ellipse cx="135" cy="145" rx="10" ry="18" fill="url(#skinXC)"/>
    <ellipse cx="265" cy="145" rx="10" ry="18" fill="url(#skinXC)"/>
    
    <!-- ===== 头发（整洁短发） ===== -->
    <path d="M140 95 
             Q135 55, 170 38 
             Q200 25, 230 38 
             Q265 55, 260 95
             Q268 130, 266 145
             L261 118 Q253 78, 200 73 Q147 78, 139 118
             L134 145 Q134 130, 140 95" 
          fill="url(#hairXC)" stroke="#2a2018" stroke-width="1"/>
    
    <!-- 整齐刘海 -->
    <path d="M148 88 Q160 72, 180 78 Q168 92, 160 112" fill="url(#hairXC)"/>
    <path d="M178 85 Q195 68, 215 72 Q202 88, 195 108" fill="url(#hairXC)"/>
    <path d="M252 88 Q240 72, 220 78 Q232 92, 240 112" fill="url(#hairXC)"/>
    
    <!-- 鬓角 -->
    <path d="M137 115 Q130 145, 133 170" fill="url(#hairXC)"/>
    <path d="M263 115 Q270 145, 267 170" fill="url(#hairXC)"/>
  </g>
  
  <!-- ===== 五官（温柔专业）===== -->
  
  <!-- 眉毛 -->
  <path d="M152 115 Q170 110, 186 113" fill="none" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
  <path d="M214 113 Q230 110, 248 115" fill="none" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 眼睛 - 左（温暖） -->
  <g>
    <ellipse cx="169" cy="133" rx="16" ry="11" fill="#FFFFFF"/>
    <ellipse cx="169" cy="133" rx="16" ry="11" fill="none" stroke="#3a3028" stroke-width="1"/>
    <circle cx="169" cy="134" r="8" fill="url(#irisXC)"/>
    <circle cx="169" cy="134" r="3.5" fill="#1a1a18"/>
    <circle cx="166" cy="131" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <path d="M153 127 Q169 123, 185 127" fill="none" stroke="#C8B8A8" stroke-width="1.5"/>
    <!-- 温暖笑意 -->
    <path d="M155 142 Q169 146, 183 142" fill="none" stroke="#D8C8B8" stroke-width="0.5" opacity="0.4"/>
  </g>
  
  <!-- 眼睛 - 右 -->
  <g>
    <ellipse cx="231" cy="133" rx="16" ry="11" fill="#FFFFFF"/>
    <ellipse cx="231" cy="133" rx="16" ry="11" fill="none" stroke="#3a3028" stroke-width="1"/>
    <circle cx="231" cy="134" r="8" fill="url(#irisXC)"/>
    <circle cx="231" cy="134" r="3.5" fill="#1a1a18"/>
    <circle cx="228" cy="131" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <path d="M215 127 Q231 123, 247 127" fill="none" stroke="#C8B8A8" stroke-width="1.5"/>
    <path d="M217 142 Q231 146, 245 142" fill="none" stroke="#D8C8B8" stroke-width="0.5" opacity="0.4"/>
  </g>
  
  <!-- 鼻子 -->
  <path d="M200 140 L198 168 Q194 176, 200 178 Q206 176, 202 168 L200 140" 
        fill="none" stroke="#C8B8A8" stroke-width="1"/>
  
  <!-- 嘴唇（温和微笑） -->
  <path d="M178 198 Q190 193, 200 195 Q210 193, 222 198" 
        fill="none" stroke="#A89080" stroke-width="2" stroke-linecap="round"/>
  <path d="M182 200 Q200 208, 218 200" 
        fill="none" stroke="#B8A090" stroke-width="1"/>
  
  <!-- ===== 配饰 ===== -->
  
  <!-- 胸牌 -->
  <g transform="translate(235, 310)">
    <rect x="0" y="0" width="50" height="30" rx="3" fill="#FFFFFF" stroke="#00CC66" stroke-width="1"/>
    <rect x="5" y="5" width="40" height="8" rx="1" fill="#00CC66" opacity="0.2"/>
    <line x1="5" y1="18" x2="45" y2="18" stroke="#00CC66" stroke-width="0.5" opacity="0.5"/>
    <text x="25" y="26" font-family="monospace" font-size="6" fill="#00CC66" text-anchor="middle">医师</text>
  </g>
  
  <!-- 治愈光环提示 -->
  <g filter="url(#healGlow)" opacity="0.3">
    <circle cx="200" cy="300" r="100" fill="none" stroke="#00CC66" stroke-width="1" stroke-dasharray="10 5">
      <animate attributeName="r" values="95;105;95" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

