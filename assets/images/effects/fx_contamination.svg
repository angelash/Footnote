<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 时间污染特效
  尺寸: 100×100px（可缩放）
  用途: 标记时间干预产生的污染区域
-->
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 污染发光 -->
    <filter id="contaminationGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 污染渐变 -->
    <radialGradient id="contaminationGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#FF4444;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#FF4444;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- 污染场 -->
  <circle cx="50" cy="50" r="45" fill="url(#contaminationGrad)">
    <animate attributeName="r" values="40;48;40" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 扭曲波纹 -->
  <g filter="url(#contaminationGlow)" stroke="#FF4444" stroke-width="1" fill="none">
    <circle cx="50" cy="50" r="20">
      <animate attributeName="r" values="15;25;15" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="50" r="35">
      <animate attributeName="r" values="30;40;30" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 闪烁碎片 -->
  <g filter="url(#contaminationGlow)" fill="#FF4444">
    <rect x="30" y="30" width="8" height="3" rx="1" transform="rotate(25 34 31.5)">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="25" width="6" height="2" rx="1" transform="rotate(-15 63 26)">
      <animate attributeName="opacity" values="0;0.8;0" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="55" y="60" width="7" height="2.5" rx="1" transform="rotate(45 58.5 61.25)">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="25" y="55" width="5" height="2" rx="1" transform="rotate(-30 27.5 56)">
      <animate attributeName="opacity" values="0;0.7;0" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- 中心标记 -->
  <g filter="url(#contaminationGlow)">
    <circle cx="50" cy="50" r="6" fill="#FF4444" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 警告符号 -->
    <text x="50" y="54" font-family="sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">!</text>
  </g>
  
  <!-- 边缘噪点 -->
  <g fill="#FF4444" opacity="0.4">
    <circle cx="20" cy="50" r="1">
      <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="20" r="1">
      <animate attributeName="opacity" values="0;0.5;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="50" r="1">
      <animate attributeName="opacity" values="0;0.4;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="80" r="1">
      <animate attributeName="opacity" values="0;0.5;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

