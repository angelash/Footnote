<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 深度介入特效
  尺寸: 200×200px（可缩放）
  用途: 激活深度介入时的视觉叠加层
-->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 介入渐变 -->
    <radialGradient id="interventionGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00FFAA;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#00FFAA;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#00FFAA;stop-opacity:0"/>
    </radialGradient>
    
    <!-- 强发光 -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 扭曲效果 -->
    <filter id="distort">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <!-- 能量场 -->
  <circle cx="100" cy="100" r="90" fill="url(#interventionGrad)">
    <animate attributeName="r" values="85;95;85" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 结构网格（被改变中） -->
  <g filter="url(#distort)" stroke="#00FFAA" stroke-width="1" fill="none" opacity="0.6">
    <rect x="40" y="40" width="120" height="120" rx="2"/>
    <rect x="60" y="60" width="80" height="80" rx="2"/>
    <rect x="80" y="80" width="40" height="40" rx="2"/>
  </g>
  
  <!-- 能量线 -->
  <g filter="url(#strongGlow)" stroke="#00FFAA" stroke-width="2">
    <!-- 从中心向外辐射 -->
    <line x1="100" y1="100" x2="100" y2="30">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="100" x2="170" y2="100">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="100" x2="100" y2="170">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="100" x2="30" y2="100">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    
    <!-- 对角线 -->
    <line x1="100" y1="100" x2="150" y2="50">
      <animate attributeName="opacity" values="0;0.7;0" dur="0.8s" begin="0.1s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="100" x2="150" y2="150">
      <animate attributeName="opacity" values="0;0.7;0" dur="0.8s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="100" x2="50" y2="150">
      <animate attributeName="opacity" values="0;0.7;0" dur="0.8s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="100" x2="50" y2="50">
      <animate attributeName="opacity" values="0;0.7;0" dur="0.8s" begin="0.7s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- 中心高能核心 -->
  <g filter="url(#strongGlow)">
    <circle cx="100" cy="100" r="15" fill="#00FFAA" opacity="0.8">
      <animate attributeName="r" values="12;18;12" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="8" fill="#FFFFFF" opacity="0.9"/>
  </g>
  
  <!-- 警告标记 -->
  <g transform="translate(100, 175)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#00FFAA" text-anchor="middle" opacity="0.8">INTERVENTION</text>
    <text x="0" y="12" font-family="monospace" font-size="8" fill="#FF4444" text-anchor="middle" opacity="0.6">⚠ STRUCTURE ALTERING</text>
  </g>
</svg>

