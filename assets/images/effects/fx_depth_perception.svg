<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 深度感知特效
  尺寸: 200×200px（可缩放）
  用途: 激活深度感知时的视觉叠加层
-->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 深度感知渐变 -->
    <radialGradient id="depthPerceptionGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00FFAA;stop-opacity:0"/>
      <stop offset="70%" style="stop-color:#00FFAA;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#00FFAA;stop-opacity:0.3"/>
    </radialGradient>
    
    <!-- 扫描线模式 -->
    <pattern id="scanLines" patternUnits="userSpaceOnUse" width="4" height="4">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00FFAA" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    
    <!-- 发光滤镜 -->
    <filter id="depthGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景辐射 -->
  <circle cx="100" cy="100" r="95" fill="url(#depthPerceptionGrad)"/>
  
  <!-- 扫描线覆盖 -->
  <circle cx="100" cy="100" r="90" fill="url(#scanLines)"/>
  
  <!-- 深度网格 -->
  <g stroke="#00FFAA" stroke-width="0.5" opacity="0.4" fill="none">
    <circle cx="100" cy="100" r="30"/>
    <circle cx="100" cy="100" r="50"/>
    <circle cx="100" cy="100" r="70"/>
    <circle cx="100" cy="100" r="90">
      <animate attributeName="r" values="85;95;85" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.2;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 十字准星 -->
  <g filter="url(#depthGlow)" stroke="#00FFAA" stroke-width="1.5">
    <line x1="100" y1="40" x2="100" y2="70" stroke-dasharray="5 3"/>
    <line x1="100" y1="130" x2="100" y2="160" stroke-dasharray="5 3"/>
    <line x1="40" y1="100" x2="70" y2="100" stroke-dasharray="5 3"/>
    <line x1="130" y1="100" x2="160" y2="100" stroke-dasharray="5 3"/>
  </g>
  
  <!-- 中心标记 -->
  <g filter="url(#depthGlow)">
    <circle cx="100" cy="100" r="8" fill="none" stroke="#00FFAA" stroke-width="2">
      <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="3" fill="#00FFAA" opacity="0.8"/>
  </g>
  
  <!-- 角标记 -->
  <g stroke="#00FFAA" stroke-width="1.5" fill="none">
    <path d="M20 20 L35 20 L35 35"/>
    <path d="M180 20 L165 20 L165 35"/>
    <path d="M20 180 L35 180 L35 165"/>
    <path d="M180 180 L165 180 L165 165"/>
  </g>
  
  <!-- 数据显示 -->
  <text x="100" y="190" font-family="monospace" font-size="10" fill="#00FFAA" text-anchor="middle" opacity="0.7">DEPTH PERCEPTION</text>
</svg>

