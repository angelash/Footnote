<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 空字段特效 ◦◦◦
  尺寸: 100×30px
  用途: 显示系统无法填充的空字段
-->
<svg width="100" height="30" viewBox="0 0 100 30" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="fieldPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景框 -->
  <rect x="0" y="0" width="100" height="30" rx="4" fill="#1a1a24" stroke="#4A9EFF" stroke-width="1" stroke-dasharray="5 3" opacity="0.8"/>
  
  <!-- 空字段符号 ◦◦◦ -->
  <g filter="url(#fieldPulse)">
    <circle cx="35" cy="15" r="4" fill="none" stroke="#4A9EFF" stroke-width="1.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="15" r="4" fill="none" stroke="#4A9EFF" stroke-width="1.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="65" cy="15" r="4" fill="none" stroke="#4A9EFF" stroke-width="1.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

