<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 系统更正特效
  尺寸: 150×50px
  用途: 显示"已更正"时的视觉效果
-->
<svg width="150" height="50" viewBox="0 0 150 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="correctGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <linearGradient id="correctGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9EFF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#4A9EFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4A9EFF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect x="0" y="0" width="150" height="50" rx="4" fill="#1a1a24" opacity="0.9"/>
  
  <!-- 边框 -->
  <rect x="1" y="1" width="148" height="48" rx="4" fill="none" stroke="url(#correctGrad)" stroke-width="1"/>
  
  <!-- 扫描线 -->
  <rect x="0" y="23" width="30" height="4" fill="#4A9EFF" opacity="0.5">
    <animate attributeName="x" values="-30;150" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- 文字 -->
  <g filter="url(#correctGlow)">
    <text x="75" y="32" font-family="monospace" font-size="14" fill="#4A9EFF" text-anchor="middle">已更正</text>
  </g>
  
  <!-- 勾选标记 -->
  <g transform="translate(120, 15)" filter="url(#correctGlow)">
    <path d="M0 10 L5 15 L15 0" fill="none" stroke="#00CC66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

