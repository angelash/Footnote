<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 深度介入图标
  尺寸: 48×48px
  用途: 能力按钮、状态显示
  风格: 手+结构改变 + 更强发光
-->
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 强发光效果 -->
    <filter id="interventionGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 渐变 -->
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFAA"/>
      <stop offset="100%" style="stop-color:#00CC88"/>
    </linearGradient>
    
    <!-- 结构线渐变 -->
    <linearGradient id="structureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFAA;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#00FFAA;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00FFAA;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="24" cy="24" r="22" fill="#0a0a0f" stroke="#1a1a24" stroke-width="1"/>
  
  <!-- 结构网格（被改变） -->
  <g stroke="#00FFAA" stroke-width="0.5" opacity="0.3">
    <line x1="8" y1="16" x2="40" y2="16"/>
    <line x1="8" y1="24" x2="40" y2="24" stroke-width="1" opacity="0.5"/>
    <line x1="8" y1="32" x2="40" y2="32"/>
    <line x1="16" y1="8" x2="16" y2="40"/>
    <line x1="24" y1="8" x2="24" y2="40" stroke-width="1" opacity="0.5"/>
    <line x1="32" y1="8" x2="32" y2="40"/>
  </g>
  
  <!-- 手形（简化） -->
  <g filter="url(#interventionGlow)">
    <path d="M24 14 L24 34 M18 20 L24 14 L30 20" 
          fill="none" stroke="url(#handGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 手指展开效果 -->
    <path d="M16 26 L24 18 L32 26" 
          fill="none" stroke="#00FFAA" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- 改变波纹 -->
  <circle cx="24" cy="24" r="12" fill="none" stroke="#00FFAA" stroke-width="1" opacity="0">
    <animate attributeName="r" values="8;18;8" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 角落警告标记 -->
  <circle cx="38" cy="10" r="4" fill="#FF4444" opacity="0.3"/>
  <text x="38" y="13" font-family="sans-serif" font-size="8" fill="#FF4444" text-anchor="middle" opacity="0.6">!</text>
</svg>

