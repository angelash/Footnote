<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 深度感知图标
  尺寸: 48×48px
  用途: 能力按钮、状态显示
  风格: 透视眼 + 青色发光
-->
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 发光效果 -->
    <filter id="depthGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 渐变 -->
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFAA"/>
      <stop offset="100%" style="stop-color:#00CC88"/>
    </linearGradient>
    
    <!-- 透视线渐变 -->
    <linearGradient id="perspectiveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFAA;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00FFAA;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="24" cy="24" r="22" fill="#0a0a0f" stroke="#1a1a24" stroke-width="1"/>
  
  <!-- 眼睛外轮廓 -->
  <g filter="url(#depthGlow)">
    <ellipse cx="24" cy="24" rx="16" ry="10" fill="none" stroke="url(#eyeGradient)" stroke-width="2"/>
  </g>
  
  <!-- 瞳孔 -->
  <circle cx="24" cy="24" r="6" fill="#0a0a0f" stroke="#00FFAA" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="3" fill="#00FFAA" opacity="0.8"/>
  
  <!-- 高光点 -->
  <circle cx="21" cy="22" r="1.5" fill="#ffffff" opacity="0.6"/>
  
  <!-- 透视线（向右延伸） -->
  <g opacity="0.6">
    <line x1="30" y1="24" x2="42" y2="18" stroke="url(#perspectiveGrad)" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="30" y1="24" x2="42" y2="24" stroke="url(#perspectiveGrad)" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="30" y1="24" x2="42" y2="30" stroke="url(#perspectiveGrad)" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
  
  <!-- 扫描动画 -->
  <line x1="8" y1="24" x2="40" y2="24" stroke="#00FFAA" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="18;30;18" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="18;30;18" dur="2s" repeatCount="indefinite"/>
  </line>
</svg>

