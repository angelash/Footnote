<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- P值计数器（观察者压力）
  尺寸: 40×40px
-->
<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <linearGradient id="pressureGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFAA"/>
      <stop offset="50%" style="stop-color:#FFAA00"/>
      <stop offset="100%" style="stop-color:#FF4444"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <circle cx="20" cy="20" r="18" fill="#1a1a24" stroke="#FFAA00" stroke-width="1.5"/>
  
  <!-- P字母 -->
  <text x="20" y="26" font-family="monospace" font-size="18" fill="#FFAA00" text-anchor="middle" font-weight="bold" filter="url(#pGlow)">P</text>
  
  <!-- 压力计刻度 -->
  <g stroke="#FFAA00" stroke-width="1" opacity="0.4">
    <line x1="20" y1="3" x2="20" y2="6"/>
    <line x1="34" y1="14" x2="31" y2="16"/>
    <line x1="34" y1="26" x2="31" y2="24"/>
    <line x1="6" y1="14" x2="9" y2="16"/>
    <line x1="6" y1="26" x2="9" y2="24"/>
  </g>
</svg>

