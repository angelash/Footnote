<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- R值计数器（无收益残差）
  尺寸: 40×40px
-->
<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="rGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <circle cx="20" cy="20" r="18" fill="#1a1a24" stroke="#4A9EFF" stroke-width="1.5"/>
  
  <!-- R字母 -->
  <text x="20" y="26" font-family="monospace" font-size="18" fill="#4A9EFF" text-anchor="middle" font-weight="bold" filter="url(#rGlow)">R</text>
  
  <!-- 空心圆点装饰 -->
  <circle cx="8" cy="8" r="3" fill="none" stroke="#4A9EFF" stroke-width="1" opacity="0.5"/>
  <circle cx="32" cy="8" r="3" fill="none" stroke="#4A9EFF" stroke-width="1" opacity="0.5"/>
  <circle cx="8" cy="32" r="3" fill="none" stroke="#4A9EFF" stroke-width="1" opacity="0.5"/>
  <circle cx="32" cy="32" r="3" fill="none" stroke="#4A9EFF" stroke-width="1" opacity="0.5"/>
</svg>

