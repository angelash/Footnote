<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- W值计数器（世界可读性）
  尺寸: 40×40px
-->
<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <circle cx="20" cy="20" r="18" fill="#1a1a24" stroke="#E8E6E3" stroke-width="1.5"/>
  
  <!-- W字母 -->
  <text x="20" y="26" font-family="monospace" font-size="16" fill="#E8E6E3" text-anchor="middle" font-weight="bold" filter="url(#wGlow)">W</text>
  
  <!-- 书页装饰 -->
  <g stroke="#E8E6E3" stroke-width="0.8" fill="none" opacity="0.4">
    <path d="M8 8 L8 14 L14 14"/>
    <path d="M32 8 L32 14 L26 14"/>
    <path d="M8 32 L8 26 L14 26"/>
    <path d="M32 32 L32 26 L26 26"/>
  </g>
</svg>

