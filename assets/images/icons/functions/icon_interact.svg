<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 交互图标
  尺寸: 32×32px
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="interactGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 手形指针 -->
  <g filter="url(#interactGlow)">
    <path d="M16 6 L16 18 M12 14 L16 10 L20 14" 
          fill="none" stroke="#00FFAA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- 点击圆环 -->
  <circle cx="16" cy="22" r="6" fill="none" stroke="#00FFAA" stroke-width="1.5"/>
  <circle cx="16" cy="22" r="3" fill="#00FFAA" opacity="0.5"/>
  
  <!-- 波纹动画 -->
  <circle cx="16" cy="22" r="6" fill="none" stroke="#00FFAA" stroke-width="1" opacity="0">
    <animate attributeName="r" values="6;12;6" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>

