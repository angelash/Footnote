<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 背包/卡片收集图标
  尺寸: 32×32px
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFAA"/>
      <stop offset="100%" style="stop-color:#00CC88"/>
    </linearGradient>
  </defs>
  
  <!-- 背景卡片（层叠效果） -->
  <rect x="8" y="8" width="18" height="20" rx="2" fill="#1a1a24" stroke="#2a2a35" stroke-width="1" transform="rotate(-8 17 18)"/>
  <rect x="6" y="6" width="18" height="20" rx="2" fill="#1a1a24" stroke="#2a2a35" stroke-width="1" transform="rotate(-4 15 16)"/>
  
  <!-- 前景卡片 -->
  <rect x="4" y="4" width="18" height="20" rx="2" fill="#0a0a0f" stroke="url(#cardGrad)" stroke-width="1.5"/>
  
  <!-- 卡片线条 -->
  <line x1="7" y1="10" x2="19" y2="10" stroke="#00FFAA" stroke-width="0.5" opacity="0.3"/>
  <line x1="7" y1="14" x2="16" y2="14" stroke="#00FFAA" stroke-width="0.5" opacity="0.3"/>
  <line x1="7" y1="18" x2="18" y2="18" stroke="#00FFAA" stroke-width="0.5" opacity="0.3"/>
  
  <!-- 数量指示器 -->
  <circle cx="26" cy="26" r="5" fill="#00FFAA"/>
  <text x="26" y="29" font-family="sans-serif" font-size="8" fill="#0a0a0f" text-anchor="middle" font-weight="bold">3</text>
</svg>

