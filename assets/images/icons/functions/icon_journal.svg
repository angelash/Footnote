<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 日志图标
  尺寸: 32×32px
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="journalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D4A0"/>
      <stop offset="100%" style="stop-color:#C8B480"/>
    </linearGradient>
  </defs>
  
  <!-- 书本 -->
  <rect x="6" y="4" width="20" height="24" rx="2" fill="#1a1a24" stroke="url(#journalGrad)" stroke-width="1.5"/>
  
  <!-- 书脊 -->
  <rect x="6" y="4" width="4" height="24" rx="1" fill="#C8B480"/>
  
  <!-- 页面线条 -->
  <g stroke="#E8D4A0" stroke-width="0.5" opacity="0.6">
    <line x1="14" y1="10" x2="22" y2="10"/>
    <line x1="14" y1="14" x2="22" y2="14"/>
    <line x1="14" y1="18" x2="22" y2="18"/>
    <line x1="14" y1="22" x2="20" y2="22"/>
  </g>
  
  <!-- 书签 -->
  <path d="M22 4 L22 12 L24 10 L26 12 L26 4" fill="#FF4444" opacity="0.7"/>
</svg>

