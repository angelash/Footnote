<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 地图图标
  尺寸: 32×32px
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4A020"/>
    </linearGradient>
  </defs>
  
  <!-- 地图折叠效果 -->
  <polygon points="4,6 12,4 20,8 28,6 28,26 20,28 12,24 4,26" fill="#1a1a24" stroke="url(#mapGrad)" stroke-width="1.5"/>
  
  <!-- 折痕 -->
  <line x1="12" y1="4" x2="12" y2="24" stroke="#FFD700" stroke-width="0.5" opacity="0.5"/>
  <line x1="20" y1="8" x2="20" y2="28" stroke="#FFD700" stroke-width="0.5" opacity="0.5"/>
  
  <!-- 路径标记 -->
  <path d="M8 12 Q12 10, 16 14 Q20 18, 24 16" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="3 2"/>
  
  <!-- 位置点 -->
  <circle cx="8" cy="12" r="2" fill="#FFD700"/>
  <circle cx="24" cy="16" r="2" fill="#00FFAA"/>
  
  <!-- X标记（目的地） -->
  <g transform="translate(24, 16)" stroke="#00FFAA" stroke-width="1.5">
    <line x1="-3" y1="-3" x2="3" y2="3"/>
    <line x1="3" y1="-3" x2="-3" y2="3"/>
  </g>
</svg>

