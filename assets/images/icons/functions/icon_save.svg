<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 存档图标
  尺寸: 32×32px
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="saveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EFF"/>
      <stop offset="100%" style="stop-color:#3080DD"/>
    </linearGradient>
  </defs>
  
  <!-- 软盘外框 -->
  <rect x="4" y="4" width="24" height="24" rx="2" fill="#1a1a24" stroke="url(#saveGrad)" stroke-width="1.5"/>
  
  <!-- 顶部标签区 -->
  <rect x="8" y="4" width="16" height="8" rx="1" fill="#0a0a0f" stroke="#4A9EFF" stroke-width="0.5"/>
  
  <!-- 底部读取区 -->
  <rect x="10" y="20" width="12" height="6" rx="1" fill="#4A9EFF" opacity="0.3"/>
  <rect x="18" y="21" width="3" height="4" rx="0.5" fill="#4A9EFF" opacity="0.5"/>
  
  <!-- 写入动画 -->
  <rect x="12" y="22" width="4" height="2" fill="#4A9EFF" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>

