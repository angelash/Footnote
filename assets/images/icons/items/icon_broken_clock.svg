<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 破损怀表
  尺寸: 32×32px
  来源: 时间异常区
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="watchMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8B898"/>
      <stop offset="100%" style="stop-color:#8B7355"/>
    </linearGradient>
  </defs>
  
  <!-- 表壳 -->
  <circle cx="16" cy="18" r="12" fill="url(#watchMetal)" stroke="#6B5345" stroke-width="1"/>
  
  <!-- 表盘 -->
  <circle cx="16" cy="18" r="9" fill="#E8E6E3"/>
  
  <!-- 刻度 -->
  <g stroke="#2a2a35" stroke-width="0.5">
    <line x1="16" y1="10" x2="16" y2="12"/>
    <line x1="16" y1="24" x2="16" y2="26"/>
    <line x1="8" y1="18" x2="10" y2="18"/>
    <line x1="22" y1="18" x2="24" y2="18"/>
  </g>
  
  <!-- 指针（扭曲） -->
  <line x1="16" y1="18" x2="16" y2="12" stroke="#2a2a35" stroke-width="1.5"/>
  <path d="M16 18 Q20 16, 22 20" fill="none" stroke="#2a2a35" stroke-width="1"/>
  
  <!-- 裂痕 -->
  <path d="M12 12 L18 22" fill="none" stroke="#FF4444" stroke-width="1" opacity="0.6"/>
  <path d="M20 14 L14 20" fill="none" stroke="#FF4444" stroke-width="0.8" opacity="0.4"/>
  
  <!-- 吊环 -->
  <circle cx="16" cy="5" r="2" fill="none" stroke="url(#watchMetal)" stroke-width="2"/>
</svg>

