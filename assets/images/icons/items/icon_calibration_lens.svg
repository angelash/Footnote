<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 校准透镜
  尺寸: 32×32px
  来源: 深度感知设备
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lensGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#00FFAA;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00FFAA;stop-opacity:0.1"/>
    </radialGradient>
    <filter id="lensGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 外框 -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#4a4a55" stroke-width="2"/>
  
  <!-- 透镜 -->
  <circle cx="16" cy="16" r="10" fill="url(#lensGrad)" stroke="#00FFAA" stroke-width="1" filter="url(#lensGlow)"/>
  
  <!-- 校准刻度 -->
  <g stroke="#00FFAA" stroke-width="0.5" opacity="0.6">
    <line x1="16" y1="4" x2="16" y2="7"/>
    <line x1="16" y1="25" x2="16" y2="28"/>
    <line x1="4" y1="16" x2="7" y2="16"/>
    <line x1="25" y1="16" x2="28" y2="16"/>
  </g>
  
  <!-- 中心十字 -->
  <g stroke="#00FFAA" stroke-width="1" opacity="0.8">
    <line x1="14" y1="16" x2="18" y2="16"/>
    <line x1="16" y1="14" x2="16" y2="18"/>
  </g>
  
  <!-- 手柄 -->
  <rect x="26" y="14" width="5" height="4" rx="1" fill="#4a4a55"/>
</svg>

