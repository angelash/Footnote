<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 因果丝线
  尺寸: 32×32px
  来源: 因果账本
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFAA44"/>
      <stop offset="50%" style="stop-color:#FF4444"/>
      <stop offset="100%" style="stop-color:#FFAA44"/>
    </linearGradient>
  </defs>
  
  <!-- 缠绕丝线 -->
  <g fill="none" stroke="url(#threadGrad)" stroke-width="1.5">
    <path d="M6 8 Q16 4, 26 8 Q20 12, 26 16 Q16 20, 6 16 Q12 12, 6 8">
      <animate attributeName="stroke-dasharray" values="0 100;50 50;100 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M10 20 Q16 16, 22 20 Q16 24, 10 20"/>
    <path d="M8 26 Q16 22, 24 26"/>
  </g>
  
  <!-- 节点 -->
  <circle cx="6" cy="8" r="2" fill="#FFAA44"/>
  <circle cx="26" cy="8" r="2" fill="#FFAA44"/>
  <circle cx="26" cy="16" r="2" fill="#FF4444"/>
  <circle cx="6" cy="16" r="2" fill="#FFAA44"/>
  <circle cx="16" cy="24" r="2" fill="#FFAA44"/>
  
  <!-- 时间方向 -->
  <polygon points="14,10 18,12 14,14" fill="#FFAA44" opacity="0.6"/>
</svg>

