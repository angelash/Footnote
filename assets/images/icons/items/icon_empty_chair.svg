<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 空椅子（象征）
  尺寸: 32×32px
  来源: 无收益行为象征
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="chairGhost" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 椅背 -->
  <rect x="8" y="4" width="16" height="12" rx="2" fill="none" stroke="#6a6a70" stroke-width="1.5"/>
  <line x1="12" y1="6" x2="12" y2="14" stroke="#6a6a70" stroke-width="1"/>
  <line x1="20" y1="6" x2="20" y2="14" stroke="#6a6a70" stroke-width="1"/>
  
  <!-- 椅座 -->
  <rect x="6" y="16" width="20" height="4" rx="1" fill="#6a6a70"/>
  
  <!-- 椅腿 -->
  <rect x="8" y="20" width="2" height="10" fill="#6a6a70"/>
  <rect x="22" y="20" width="2" height="10" fill="#6a6a70"/>
  
  <!-- 空的轮廓（人影缺失） -->
  <g filter="url(#chairGhost)" opacity="0.3">
    <ellipse cx="16" cy="10" rx="5" ry="6" fill="none" stroke="#4A9EFF" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
  
  <!-- 深度青标记 -->
  <circle cx="16" cy="18" r="1.5" fill="#00FFAA" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>

