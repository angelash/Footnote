<!--
  《备注 / Footnote》- 折叠地图
  尺寸: 32×32px
  来源: 多余者
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- 地图主体（折叠） -->
  <polygon points="4,8 12,6 20,8 28,6 28,26 20,28 12,26 4,28" fill="#E8E0D0" stroke="#C8B898" stroke-width="1"/>
  
  <!-- 折痕 -->
  <line x1="12" y1="6" x2="12" y2="26" stroke="#B8A888" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="20" y1="8" x2="20" y2="28" stroke="#B8A888" stroke-width="1" stroke-dasharray="2 2"/>
  
  <!-- 地图线条 -->
  <g stroke="#8a8a8a" stroke-width="0.5" fill="none" opacity="0.5">
    <path d="M6 12 Q10 14, 14 12 Q18 10, 22 12 Q24 14, 26 12"/>
    <path d="M6 18 Q9 16, 12 18 Q15 20, 18 18 Q22 16, 26 18"/>
    <rect x="8" y="14" width="4" height="3" rx="0.5"/>
    <rect x="22" y="16" width="3" height="4" rx="0.5"/>
  </g>
  
  <!-- 标记点 -->
  <circle cx="16" cy="16" r="2" fill="#00FFAA" opacity="0.8"/>
  <circle cx="10" cy="20" r="1.5" fill="#FF4444" opacity="0.6"/>
  
  <!-- 手绘标注 -->
  <path d="M14 10 Q16 8, 18 10" fill="none" stroke="#FFAA44" stroke-width="0.8"/>
</svg>

