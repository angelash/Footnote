<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 身份卡/工作证
  尺寸: 32×32px
  来源: 维修局
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- 卡片主体 -->
  <rect x="4" y="6" width="24" height="20" rx="2" fill="#1a1a24" stroke="#4A9EFF" stroke-width="1"/>
  
  <!-- 头像区 -->
  <rect x="6" y="9" width="8" height="10" rx="1" fill="#2a2a35"/>
  <ellipse cx="10" cy="13" rx="2.5" ry="3" fill="#4a4a55"/>
  <ellipse cx="10" cy="17" rx="3" ry="2" fill="#4a4a55"/>
  
  <!-- 文字区 -->
  <rect x="16" y="9" width="10" height="2" rx="0.5" fill="#4A9EFF" opacity="0.5"/>
  <rect x="16" y="13" width="8" height="1.5" rx="0.5" fill="#686868" opacity="0.5"/>
  <rect x="16" y="16" width="6" height="1.5" rx="0.5" fill="#686868" opacity="0.5"/>
  
  <!-- 条形码 -->
  <g stroke="#4A9EFF" stroke-width="0.8" opacity="0.6">
    <line x1="6" y1="21" x2="6" y2="24"/>
    <line x1="8" y1="21" x2="8" y2="24"/>
    <line x1="9" y1="21" x2="9" y2="24"/>
    <line x1="11" y1="21" x2="11" y2="24"/>
    <line x1="14" y1="21" x2="14" y2="24"/>
    <line x1="15" y1="21" x2="15" y2="24"/>
    <line x1="18" y1="21" x2="18" y2="24"/>
    <line x1="20" y1="21" x2="20" y2="24"/>
    <line x1="21" y1="21" x2="21" y2="24"/>
    <line x1="24" y1="21" x2="24" y2="24"/>
    <line x1="26" y1="21" x2="26" y2="24"/>
  </g>
</svg>

