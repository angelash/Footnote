<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 医疗手环
  尺寸: 32×32px
  来源: 许澄/医疗站
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="healGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 手环主体 -->
  <ellipse cx="16" cy="16" rx="12" ry="8" fill="none" stroke="#E8E6E3" stroke-width="4"/>
  
  <!-- 扣环 -->
  <rect x="26" y="13" width="3" height="6" rx="1" fill="#C8C6C0"/>
  
  <!-- 显示屏 -->
  <rect x="8" y="12" width="10" height="8" rx="2" fill="#1a1a24" stroke="#00CC66" stroke-width="0.5"/>
  
  <!-- 数据显示 -->
  <g filter="url(#healGlow2)">
    <text x="13" y="18" font-family="monospace" font-size="5" fill="#00CC66" text-anchor="middle">OK</text>
  </g>
  
  <!-- 指示灯 -->
  <circle cx="20" cy="14" r="1.5" fill="#00CC66">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>

