<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- 书脊 -->
  <rect x="5" y="4" width="4" height="24" fill="#8B7355"/>
  
  <!-- 书页 -->
  <rect x="9" y="5" width="18" height="22" fill="#E8E6E3" stroke="#C8C6C0" stroke-width="0.5"/>
  
  <!-- 封面 -->
  <rect x="9" y="4" width="18" height="24" rx="1" fill="none" stroke="#FFAA44" stroke-width="1.5"/>
  
  <!-- 书签 -->
  <path d="M22 4 L22 10 L24 8 L26 10 L26 4" fill="#FF4444"/>
  
  <!-- 文字线 -->
  <g stroke="#686868" stroke-width="0.5" opacity="0.4">
    <line x1="12" y1="10" x2="24" y2="10"/>
    <line x1="12" y1="14" x2="22" y2="14"/>
    <line x1="12" y1="18" x2="23" y2="18"/>
    <line x1="12" y1="22" x2="20" y2="22"/>
  </g>
  
  <!-- 橙色标记 -->
  <circle cx="12" cy="10" r="1" fill="#FFAA44"/>
