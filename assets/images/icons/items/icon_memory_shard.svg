<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 记忆碎片
  尺寸: 32×32px
  来源: 漂移者/时间异常
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="memoryGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="memoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF88FF"/>
      <stop offset="100%" style="stop-color:#8844AA"/>
    </linearGradient>
  </defs>
  
  <!-- 碎片主体 -->
  <polygon points="16,4 26,10 24,22 16,28 8,22 6,10" fill="#2a1a3a" stroke="url(#memoryGrad)" stroke-width="1" filter="url(#memoryGlow)"/>
  
  <!-- 内部裂纹 -->
  <g stroke="#FF88FF" stroke-width="0.8" opacity="0.5">
    <path d="M12 10 L16 16 L20 12"/>
    <path d="M14 18 L16 16 L18 20"/>
    <line x1="16" y1="8" x2="16" y2="24"/>
  </g>
  
  <!-- 闪烁光点 -->
  <circle cx="16" cy="16" r="2" fill="#FF88FF" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="12" r="1" fill="#FF88FF" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="20" r="1" fill="#FF88FF" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>

