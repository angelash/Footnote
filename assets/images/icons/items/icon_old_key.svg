<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 旧钥匙
  尺寸: 32×32px
  来源: C0-Z2 薄墙屋
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="keyMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8B898"/>
      <stop offset="100%" style="stop-color:#8B7355"/>
    </linearGradient>
  </defs>
  
  <!-- 钥匙柄（圆环） -->
  <circle cx="10" cy="10" r="6" fill="none" stroke="url(#keyMetal)" stroke-width="2.5"/>
  <circle cx="10" cy="10" r="3" fill="#1a1a24"/>
  
  <!-- 钥匙杆 -->
  <rect x="14" y="8" width="14" height="4" rx="1" fill="url(#keyMetal)"/>
  
  <!-- 钥匙齿 -->
  <rect x="24" y="12" width="3" height="4" fill="url(#keyMetal)"/>
  <rect x="20" y="12" width="2" height="3" fill="url(#keyMetal)"/>
  <rect x="17" y="12" width="2" height="2" fill="url(#keyMetal)"/>
  
  <!-- 磨损痕迹 -->
  <line x1="16" y1="9" x2="22" y2="9" stroke="#6B5345" stroke-width="0.5" opacity="0.5"/>
</svg>

