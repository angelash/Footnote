<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 旧油灯
  尺寸: 32×32px
  来源: 陈匠
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="lampGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 灯座 -->
  <rect x="8" y="26" width="16" height="4" rx="1" fill="#8B7355" stroke="#6B5345" stroke-width="0.5"/>
  
  <!-- 灯身 -->
  <ellipse cx="16" cy="18" rx="8" ry="10" fill="#1a1a24" stroke="#8B7355" stroke-width="1.5"/>
  <ellipse cx="16" cy="18" rx="5" ry="7" fill="#2a2a35"/>
  
  <!-- 灯芯 -->
  <rect x="14" y="8" width="4" height="6" fill="#E8D4A0"/>
  
  <!-- 火焰 -->
  <g filter="url(#lampGlow2)">
    <ellipse cx="16" cy="5" rx="4" ry="6" fill="#FFAA44" opacity="0.8">
      <animate attributeName="ry" values="5;7;5" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="16" cy="4" rx="2.5" ry="4" fill="#FFDD88" opacity="0.9"/>
    <ellipse cx="16" cy="3" rx="1" ry="2" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- 提手 -->
  <path d="M10 14 Q16 6, 22 14" fill="none" stroke="#8B7355" stroke-width="2"/>
</svg>

