<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 伤痕样本
  尺寸: 32×32px
  来源: 深度介入后
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="scarGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 容器 -->
  <rect x="6" y="4" width="20" height="24" rx="3" fill="#1a1a24" stroke="#2a2a35" stroke-width="1"/>
  
  <!-- 玻璃内部 -->
  <rect x="8" y="6" width="16" height="20" rx="2" fill="#0e0e14"/>
  
  <!-- 伤痕样本 -->
  <g filter="url(#scarGlow2)">
    <path d="M12 10 Q16 14, 14 18 Q18 16, 20 22" fill="none" stroke="#00FFAA" stroke-width="2" opacity="0.8">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M14 12 L18 14 L15 20" fill="none" stroke="#00FFAA" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- 标签 -->
  <rect x="10" y="24" width="12" height="3" rx="0.5" fill="#E8E6E3"/>
  <text x="16" y="26.5" font-family="monospace" font-size="2.5" fill="#1a1a24" text-anchor="middle">SCAR-01</text>
</svg>

