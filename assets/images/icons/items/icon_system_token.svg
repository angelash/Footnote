<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 系统令牌
  尺寸: 32×32px
  来源: 维修局/收敛运行时
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EFF"/>
      <stop offset="100%" style="stop-color:#2a6eaf"/>
    </linearGradient>
    <filter id="tokenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 六边形外框 -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#1a1a24" stroke="url(#tokenGrad)" stroke-width="1.5"/>
  
  <!-- 内部电路 -->
  <g stroke="#4A9EFF" stroke-width="0.8" opacity="0.6">
    <line x1="16" y1="8" x2="16" y2="16"/>
    <line x1="10" y1="12" x2="16" y2="16"/>
    <line x1="22" y1="12" x2="16" y2="16"/>
    <line x1="16" y1="16" x2="12" y2="22"/>
    <line x1="16" y1="16" x2="20" y2="22"/>
  </g>
  
  <!-- 中心节点 -->
  <circle cx="16" cy="16" r="4" fill="url(#tokenGrad)" filter="url(#tokenGlow)"/>
  <circle cx="16" cy="16" r="2" fill="#1a1a24"/>
  
  <!-- 角落节点 -->
  <circle cx="16" cy="8" r="1.5" fill="#4A9EFF" opacity="0.8"/>
  <circle cx="10" cy="12" r="1.5" fill="#4A9EFF" opacity="0.6"/>
  <circle cx="22" cy="12" r="1.5" fill="#4A9EFF" opacity="0.6"/>
  <circle cx="12" cy="22" r="1.5" fill="#4A9EFF" opacity="0.6"/>
  <circle cx="20" cy="22" r="1.5" fill="#4A9EFF" opacity="0.6"/>
</svg>

