<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 时间残渣
  尺寸: 32×32px
  来源: 时间干预后
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="timeGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 瓶子 -->
  <path d="M12 6 L12 4 Q12 2, 16 2 Q20 2, 20 4 L20 6 Q24 8, 24 12 L24 26 Q24 30, 16 30 Q8 30, 8 26 L8 12 Q8 8, 12 6 Z" fill="#1a1a24" stroke="#FF4444" stroke-width="1" opacity="0.8"/>
  
  <!-- 时间残渣 -->
  <g filter="url(#timeGlow2)">
    <circle cx="12" cy="20" r="2" fill="#FF4444" opacity="0.7">
      <animate attributeName="cy" values="20;18;20" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="24" r="2.5" fill="#FF4444" opacity="0.8">
      <animate attributeName="cy" values="24;22;24" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="22" r="1.5" fill="#FF4444" opacity="0.6">
      <animate attributeName="cy" values="22;20;22" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14" cy="26" r="1.8" fill="#FF4444" opacity="0.5"/>
    <circle cx="18" cy="27" r="1.2" fill="#FF4444" opacity="0.4"/>
  </g>
  
  <!-- 瓶塞 -->
  <rect x="13" y="1" width="6" height="3" rx="1" fill="#2a2a35" stroke="#FF4444" stroke-width="0.5"/>
</svg>

