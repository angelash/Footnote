<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 记忆漂移图标
  尺寸: 24×24px
-->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="driftBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 头脑轮廓 -->
  <ellipse cx="12" cy="11" rx="8" ry="9" fill="none" stroke="#FF88FF" stroke-width="1.5" opacity="0.8"/>
  
  <!-- 漂移波纹 -->
  <g filter="url(#driftBlur)" stroke="#FF88FF" stroke-width="1" fill="none">
    <path d="M6 12 Q8 10, 10 12 Q12 14, 14 12 Q16 10, 18 12">
      <animate attributeName="d" values="M6 12 Q8 10, 10 12 Q12 14, 14 12 Q16 10, 18 12;M6 12 Q8 14, 10 12 Q12 10, 14 12 Q16 14, 18 12;M6 12 Q8 10, 10 12 Q12 14, 14 12 Q16 10, 18 12" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M8 8 Q10 6, 12 8 Q14 10, 16 8" opacity="0.5"/>
    <path d="M8 16 Q10 18, 12 16 Q14 14, 16 16" opacity="0.5"/>
  </g>
  
  <!-- 问号 -->
  <text x="12" y="15" font-family="sans-serif" font-size="10" fill="#FF88FF" text-anchor="middle" opacity="0.6">?</text>
</svg>

