<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 新内容图标
  尺寸: 24×24px
-->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="newGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 圆形背景 -->
  <circle cx="12" cy="12" r="10" fill="#4A9EFF" filter="url(#newGlow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- NEW文字 -->
  <text x="12" y="16" font-family="sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">NEW</text>
</svg>

