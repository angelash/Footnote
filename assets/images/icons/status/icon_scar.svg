<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 深度伤痕图标
  尺寸: 24×24px
-->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="scarGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect x="2" y="2" width="20" height="20" rx="3" fill="#1a1a24" stroke="#00FFAA" stroke-width="1" opacity="0.8"/>
  
  <!-- 裂纹 -->
  <g filter="url(#scarGlow2)" stroke="#00FFAA" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M12 4 L10 10 L14 12 L11 18 L13 20"/>
    <path d="M10 10 L7 11"/>
    <path d="M14 12 L17 13"/>
  </g>
  
  <!-- 能量点 -->
  <circle cx="10" cy="10" r="2" fill="#00FFAA" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>

