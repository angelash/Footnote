<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 警告图标
  尺寸: 32×32px
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="warningGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 三角形 -->
  <g filter="url(#warningGlow)">
    <polygon points="16,4 30,28 2,28" fill="#1a1a24" stroke="#FF4444" stroke-width="2" stroke-linejoin="round"/>
  </g>
  
  <!-- 感叹号 -->
  <g fill="#FF4444">
    <rect x="14" y="11" width="4" height="10" rx="1"/>
    <circle cx="16" cy="24" r="2"/>
  </g>
</svg>

