<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 冲突区图标
  尺寸: 24×24px
-->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="conflictGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <circle cx="12" cy="12" r="10" fill="#1a1a24" stroke="#FF4444" stroke-width="1"/>
  
  <!-- 交叉冲突 -->
  <g filter="url(#conflictGlow)">
    <line x1="6" y1="6" x2="18" y2="18" stroke="#FF4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="6" x2="6" y2="18" stroke="#FF4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- 能量波动 -->
  <circle cx="12" cy="12" r="6" fill="none" stroke="#FF4444" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="4;8;4" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>

