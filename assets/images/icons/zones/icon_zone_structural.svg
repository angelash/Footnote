<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 结构异常图标
  尺寸: 24×24px
-->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="crackGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
    </filter>
  </defs>
  
  <!-- 背景方块 -->
  <rect x="4" y="4" width="16" height="16" rx="2" fill="#1a1a24" stroke="#00FFAA" stroke-width="1"/>
  
  <!-- 裂纹 -->
  <g filter="url(#crackGlow)">
    <path d="M12 4 L10 10 L14 12 L11 16 L13 20" fill="none" stroke="#00FFAA" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M10 10 L7 11" fill="none" stroke="#00FFAA" stroke-width="1"/>
    <path d="M14 12 L17 13" fill="none" stroke="#00FFAA" stroke-width="1"/>
  </g>
  
  <!-- 碎片效果 -->
  <polygon points="6,8 8,6 10,9" fill="#00FFAA" opacity="0.3"/>
  <polygon points="16,14 18,16 15,17" fill="#00FFAA" opacity="0.3"/>
</svg>

