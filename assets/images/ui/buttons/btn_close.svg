<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 关闭按钮
  尺寸: 32×32px
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="closeBtnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a35"/>
      <stop offset="100%" style="stop-color:#1e1e28"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="16" cy="16" r="14" fill="url(#closeBtnBg)" stroke="#3a3a48" stroke-width="1"/>
  
  <!-- X符号 -->
  <g stroke="#E8E6E3" stroke-width="2.5" stroke-linecap="round">
    <line x1="10" y1="10" x2="22" y2="22"/>
    <line x1="22" y1="10" x2="10" y2="22"/>
  </g>
</svg>

