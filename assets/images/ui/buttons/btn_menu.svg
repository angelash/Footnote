<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 菜单按钮
  尺寸: 48×48px
-->
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="menuBtnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a35"/>
      <stop offset="100%" style="stop-color:#1e1e28"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect x="2" y="2" width="44" height="44" rx="8" fill="url(#menuBtnBg)" stroke="#3a3a48" stroke-width="1"/>
  
  <!-- 汉堡菜单图标 -->
  <g stroke="#E8E6E3" stroke-width="3" stroke-linecap="round">
    <line x1="12" y1="16" x2="36" y2="16"/>
    <line x1="12" y1="24" x2="36" y2="24"/>
    <line x1="12" y1="32" x2="36" y2="32"/>
  </g>
</svg>

