<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 主按钮
  尺寸: 200×60px
  状态: normal / hover / pressed / disabled
  风格: 深度青边框 + 微光效果
-->
<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Normal状态背景 -->
    <linearGradient id="btnNormalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24"/>
      <stop offset="100%" style="stop-color:#12121a"/>
    </linearGradient>
    
    <!-- Hover状态背景 -->
    <linearGradient id="btnHoverBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2a"/>
      <stop offset="100%" style="stop-color:#16161e"/>
    </linearGradient>
    
    <!-- Pressed状态背景 -->
    <linearGradient id="btnPressedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#101018"/>
      <stop offset="100%" style="stop-color:#0a0a10"/>
    </linearGradient>
    
    <!-- 边框发光 -->
    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 顶部高光 -->
    <linearGradient id="btnTopLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFAA;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00FFAA;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#00FFAA;stop-opacity:0"/>
    </linearGradient>
    
    <!-- Hover高光 -->
    <linearGradient id="btnHoverLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFAA;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00FFAA;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#00FFAA;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- ========== Normal State ========== -->
  <g id="state-normal">
    <!-- 主背景 -->
    <rect x="2" y="2" width="196" height="56" rx="8" fill="url(#btnNormalBg)"/>
    
    <!-- 边框 -->
    <rect x="2" y="2" width="196" height="56" rx="8" 
          fill="none" stroke="#00FFAA" stroke-width="1.5" opacity="0.6"/>
    
    <!-- 顶部高光 -->
    <rect x="30" y="2" width="140" height="1" fill="url(#btnTopLight)"/>
    
    <!-- 角落装饰 -->
    <path d="M8 6 L6 6 L6 14" fill="none" stroke="#00FFAA" stroke-width="1" opacity="0.8"/>
    <path d="M192 6 L194 6 L194 14" fill="none" stroke="#00FFAA" stroke-width="1" opacity="0.8"/>
    <path d="M8 54 L6 54 L6 46" fill="none" stroke="#00FFAA" stroke-width="1" opacity="0.5"/>
    <path d="M192 54 L194 54 L194 46" fill="none" stroke="#00FFAA" stroke-width="1" opacity="0.5"/>
    
    <!-- 内部微光 -->
    <rect x="8" y="8" width="184" height="44" rx="4" 
          fill="none" stroke="#00FFAA" stroke-width="0.5" opacity="0.1"/>
  </g>
  
  <!-- 文本占位区 (居中) -->
  <rect x="40" y="18" width="120" height="24" rx="2" fill="none" stroke="#1a1a24" stroke-dasharray="2 2" opacity="0.2"/>
</svg>

