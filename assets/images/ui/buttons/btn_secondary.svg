<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 次按钮
  尺寸: 160×48px
  风格: 简约线框 + 系统蓝
-->
<svg width="160" height="48" viewBox="0 0 160 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="btnSecBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14141c"/>
      <stop offset="100%" style="stop-color:#0c0c12"/>
    </linearGradient>
    
    <!-- 边框渐变 -->
    <linearGradient id="btnSecBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EFF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#4A9EFF;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  
  <!-- 主背景 -->
  <rect x="1" y="1" width="158" height="46" rx="6" fill="url(#btnSecBg)"/>
  
  <!-- 边框 -->
  <rect x="1" y="1" width="158" height="46" rx="6" 
        fill="none" stroke="url(#btnSecBorder)" stroke-width="1"/>
  
  <!-- 左侧装饰点 -->
  <circle cx="12" cy="24" r="2" fill="#4A9EFF" opacity="0.5"/>
  
  <!-- 右侧装饰点 -->
  <circle cx="148" cy="24" r="2" fill="#4A9EFF" opacity="0.5"/>
  
  <!-- 文本占位 -->
  <rect x="30" y="14" width="100" height="20" rx="2" fill="none" stroke="#1a1a24" stroke-dasharray="2 2" opacity="0.2"/>
</svg>

