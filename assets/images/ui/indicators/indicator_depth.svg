<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 深度能力指示器
  尺寸: 120×40px
  用途: 显示深度感知/介入能力状态
-->
<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景 -->
    <linearGradient id="depthIndicatorBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a24;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0e0e14;stop-opacity:0.9"/>
    </linearGradient>
    
    <!-- 能量条 -->
    <linearGradient id="depthEnergyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFAA"/>
      <stop offset="100%" style="stop-color:#00CC88"/>
    </linearGradient>
    
    <!-- 发光 -->
    <filter id="indicatorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect x="0" y="0" width="120" height="40" rx="6" fill="url(#depthIndicatorBg)" stroke="#00FFAA" stroke-width="1" opacity="0.8"/>
  
  <!-- 图标区 -->
  <g transform="translate(8, 8)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#00FFAA" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="4" fill="#00FFAA" opacity="0.5"/>
    <!-- 眼睛图标 -->
    <path d="M6 12 Q12 6, 18 12 Q12 18, 6 12" fill="none" stroke="#00FFAA" stroke-width="1"/>
    <circle cx="12" cy="12" r="2" fill="#00FFAA"/>
  </g>
  
  <!-- 能量条背景 -->
  <rect x="35" y="12" width="75" height="16" rx="3" fill="#0e0e14" stroke="#2a2a35" stroke-width="0.5"/>
  
  <!-- 能量条填充 -->
  <rect x="37" y="14" width="60" height="12" rx="2" fill="url(#depthEnergyGrad)" filter="url(#indicatorGlow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- 刻度线 -->
  <g stroke="#0e0e14" stroke-width="1" opacity="0.5">
    <line x1="55" y1="14" x2="55" y2="26"/>
    <line x1="75" y1="14" x2="75" y2="26"/>
    <line x1="95" y1="14" x2="95" y2="26"/>
  </g>
</svg>

