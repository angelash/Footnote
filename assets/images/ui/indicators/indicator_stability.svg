<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 结构稳定指示器
  尺寸: 120×40px
  用途: 显示当前区域结构稳定性
-->
<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景 -->
    <linearGradient id="stabilityBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a24;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0e0e14;stop-opacity:0.9"/>
    </linearGradient>
    
    <!-- 稳定渐变 -->
    <linearGradient id="stableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00CC66"/>
      <stop offset="50%" style="stop-color:#FFAA00"/>
      <stop offset="100%" style="stop-color:#FF4444"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect x="0" y="0" width="120" height="40" rx="6" fill="url(#stabilityBg)" stroke="#4A9EFF" stroke-width="1" opacity="0.8"/>
  
  <!-- 图标区（结构图标） -->
  <g transform="translate(8, 8)">
    <rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="#4A9EFF" stroke-width="1.5"/>
    <!-- 裂纹 -->
    <path d="M12 2 L10 10 L14 12 L11 18 L13 22" fill="none" stroke="#FFAA00" stroke-width="1" stroke-linecap="round"/>
    <path d="M10 10 L7 11" fill="none" stroke="#FFAA00" stroke-width="0.5"/>
    <path d="M14 12 L17 13" fill="none" stroke="#FFAA00" stroke-width="0.5"/>
  </g>
  
  <!-- 稳定度条背景 -->
  <rect x="35" y="12" width="75" height="16" rx="3" fill="#0e0e14" stroke="#2a2a35" stroke-width="0.5"/>
  
  <!-- 渐变色条 -->
  <rect x="37" y="14" width="71" height="12" rx="2" fill="url(#stableGrad)" opacity="0.3"/>
  
  <!-- 当前稳定度指针 -->
  <g transform="translate(75, 8)">
    <polygon points="0,0 -5,8 5,8" fill="#E8E6E3"/>
    <line x1="0" y1="8" x2="0" y2="24" stroke="#E8E6E3" stroke-width="2"/>
  </g>
  
  <!-- 刻度标记 -->
  <g font-family="monospace" font-size="6" fill="#686868">
    <text x="40" y="35">稳定</text>
    <text x="100" y="35">失稳</text>
  </g>
</svg>

