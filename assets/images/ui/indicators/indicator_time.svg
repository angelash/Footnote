<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 时间能力指示器
  尺寸: 120×40px
  用途: 显示时间干预能力状态
-->
<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景 -->
    <linearGradient id="timeIndicatorBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1418;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0e0a0c;stop-opacity:0.9"/>
    </linearGradient>
    
    <!-- 能量条 -->
    <linearGradient id="timeEnergyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4444"/>
      <stop offset="100%" style="stop-color:#CC2222"/>
    </linearGradient>
    
    <!-- 发光 -->
    <filter id="timeIndicatorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect x="0" y="0" width="120" height="40" rx="6" fill="url(#timeIndicatorBg)" stroke="#FF4444" stroke-width="1" opacity="0.8"/>
  
  <!-- 图标区 -->
  <g transform="translate(8, 8)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#FF4444" stroke-width="1.5"/>
    <!-- 时钟指针 -->
    <line x1="12" y1="12" x2="12" y2="5" stroke="#FF4444" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="12" x2="17" y2="14" stroke="#FF4444" stroke-width="1" stroke-linecap="round"/>
    <!-- 回溯箭头 -->
    <path d="M5 8 Q3 5, 6 3" fill="none" stroke="#FF4444" stroke-width="1" stroke-linecap="round"/>
    <path d="M5 8 L3 6 L6 5" fill="none" stroke="#FF4444" stroke-width="0.8"/>
  </g>
  
  <!-- 能量条背景 -->
  <rect x="35" y="12" width="75" height="16" rx="3" fill="#0e0a0c" stroke="#2a2025" stroke-width="0.5"/>
  
  <!-- 能量条填充（污染程度） -->
  <rect x="37" y="14" width="45" height="12" rx="2" fill="url(#timeEnergyGrad)" filter="url(#timeIndicatorGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- 刻度线 -->
  <g stroke="#0e0a0c" stroke-width="1" opacity="0.5">
    <line x1="55" y1="14" x2="55" y2="26"/>
    <line x1="75" y1="14" x2="75" y2="26"/>
    <line x1="95" y1="14" x2="95" y2="26"/>
  </g>
  
  <!-- 警告标记 -->
  <text x="105" y="25" font-family="sans-serif" font-size="10" fill="#FF4444" text-anchor="middle" opacity="0.8">!</text>
</svg>

