<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 卡片详情面板
  尺寸: 650×900px
  用途: 长按卡片后显示的详情页
-->
<svg width="650" height="900" viewBox="0 0 650 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 面板背景 -->
    <linearGradient id="detailPanelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24"/>
      <stop offset="100%" style="stop-color:#0e0e14"/>
    </linearGradient>
    
    <!-- 边框渐变 -->
    <linearGradient id="detailBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9EFF"/>
      <stop offset="50%" style="stop-color:#00FFAA"/>
      <stop offset="100%" style="stop-color:#4A9EFF"/>
    </linearGradient>
    
    <!-- 内发光 -->
    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
      <feFlood flood-color="#4A9EFF" flood-opacity="0.3"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 主面板 -->
  <rect x="5" y="5" width="640" height="890" rx="16" fill="url(#detailPanelBg)" stroke="url(#detailBorder)" stroke-width="2" filter="url(#innerGlow)"/>
  
  <!-- 顶部装饰线 -->
  <line x1="30" y1="80" x2="620" y2="80" stroke="#4A9EFF" stroke-width="1" opacity="0.3"/>
  
  <!-- 关闭按钮区 -->
  <g transform="translate(590, 20)">
    <circle cx="20" cy="20" r="18" fill="#2a2a35" stroke="#4A9EFF" stroke-width="1" opacity="0.8"/>
    <line x1="12" y1="12" x2="28" y2="28" stroke="#E8E6E3" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="12" x2="12" y2="28" stroke="#E8E6E3" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- 标题区 -->
  <g transform="translate(30, 25)">
    <text x="0" y="30" font-family="Noto Sans SC" font-size="24" fill="#E8E6E3" font-weight="bold">[卡片标题]</text>
  </g>
  
  <!-- 类型标签 -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="80" height="28" rx="4" fill="#4A9EFF" opacity="0.2"/>
    <text x="40" y="19" font-family="Noto Sans SC" font-size="12" fill="#4A9EFF" text-anchor="middle">[类型]</text>
  </g>
  
  <!-- 图像区 -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="590" height="280" rx="8" fill="#14141c" stroke="#2a2a35" stroke-width="1"/>
    <text x="295" y="145" font-family="Noto Sans SC" font-size="14" fill="#686868" text-anchor="middle">[卡片图像区域]</text>
  </g>
  
  <!-- 分隔线 -->
  <line x1="30" y1="460" x2="620" y2="460" stroke="#4A9EFF" stroke-width="1" opacity="0.2"/>
  
  <!-- 正面内容 -->
  <g transform="translate(30, 480)">
    <text x="0" y="0" font-family="Noto Sans SC" font-size="14" fill="#4A9EFF">正面文本</text>
    <rect x="0" y="15" width="590" height="80" rx="4" fill="#14141c" opacity="0.5"/>
    <text x="15" y="45" font-family="Noto Sans SC" font-size="13" fill="#E8E6E3" opacity="0.9">[正面文本内容...]</text>
    <text x="15" y="70" font-family="Noto Sans SC" font-size="13" fill="#E8E6E3" opacity="0.9">[第二行...]</text>
  </g>
  
  <!-- 分隔线 -->
  <line x1="30" y1="590" x2="620" y2="590" stroke="#00FFAA" stroke-width="1" opacity="0.2"/>
  
  <!-- 长按内容 -->
  <g transform="translate(30, 610)">
    <text x="0" y="0" font-family="Noto Sans SC" font-size="14" fill="#00FFAA">详细内容</text>
    <rect x="0" y="15" width="590" height="150" rx="4" fill="#14141c" opacity="0.5" stroke="#00FFAA" stroke-width="0.5" stroke-dasharray="5 3"/>
    <text x="15" y="45" font-family="Noto Sans SC" font-size="13" fill="#E8E6E3" opacity="0.85">[长按显示的详细内容...]</text>
    <text x="15" y="70" font-family="Noto Sans SC" font-size="13" fill="#E8E6E3" opacity="0.85">[更多细节...]</text>
    <text x="15" y="95" font-family="Noto Sans SC" font-size="13" fill="#E8E6E3" opacity="0.85">[隐藏信息...]</text>
    <text x="15" y="120" font-family="Noto Sans SC" font-size="13" fill="#E8E6E3" opacity="0.85">[伏笔暗示...]</text>
  </g>
  
  <!-- 底部信息 -->
  <g transform="translate(30, 800)">
    <line x1="0" y1="0" x2="590" y2="0" stroke="#2a2a35" stroke-width="1"/>
    <text x="0" y="30" font-family="monospace" font-size="11" fill="#686868">获取来源: [Zone ID]</text>
    <text x="0" y="55" font-family="monospace" font-size="11" fill="#686868">获取时间: [时间戳]</text>
    <text x="590" y="30" font-family="monospace" font-size="11" fill="#686868" text-anchor="end">状态: [状态]</text>
  </g>
  
  <!-- 角装饰 -->
  <g stroke="#4A9EFF" stroke-width="2" fill="none" opacity="0.4">
    <path d="M20 40 L20 20 L40 20"/>
    <path d="M630 40 L630 20 L610 20"/>
    <path d="M20 880 L20 860 L40 860"/>
    <path d="M630 880 L630 860 L610 860"/>
  </g>
</svg>

