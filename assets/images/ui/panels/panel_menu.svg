<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 主菜单面板
  尺寸: 600×800px
  风格: 深邃空间感 + 几何装饰
-->
<svg width="600" height="800" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主背景渐变 -->
    <radialGradient id="menuBgRadial" cx="50%" cy="30%" r="80%">
      <stop offset="0%" style="stop-color:#14141c;stop-opacity:0.98"/>
      <stop offset="100%" style="stop-color:#08080c;stop-opacity:0.99"/>
    </radialGradient>
    
    <!-- 光晕效果 -->
    <filter id="menuGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- 顶部光源 -->
    <radialGradient id="topLight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" style="stop-color:#00FFAA;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#00FFAA;stop-opacity:0"/>
    </radialGradient>
    
    <!-- 边框渐变 -->
    <linearGradient id="menuBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFAA;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#2a2a35;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4A9EFF;stop-opacity:0.3"/>
    </linearGradient>
    
    <!-- 标题区背景 -->
    <linearGradient id="titleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFAA;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#00FFAA;stop-opacity:0"/>
    </linearGradient>
    
    <!-- 按钮区域渐变 -->
    <linearGradient id="buttonAreaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#1a1a24;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1a1a24;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- 主背景 -->
  <rect x="0" y="0" width="600" height="800" rx="16" fill="url(#menuBgRadial)"/>
  
  <!-- 顶部光晕 -->
  <ellipse cx="300" cy="0" rx="400" ry="200" fill="url(#topLight)"/>
  
  <!-- 主边框 -->
  <rect x="2" y="2" width="596" height="796" rx="14" 
        fill="none" stroke="url(#menuBorder)" stroke-width="2"/>
  
  <!-- 外层装饰边框 -->
  <rect x="8" y="8" width="584" height="784" rx="12" 
        fill="none" stroke="#1a1a24" stroke-width="1"/>
  
  <!-- 顶部装饰线组 -->
  <g filter="url(#menuGlow)">
    <path d="M20 16 L50 16" stroke="#00FFAA" stroke-width="2" stroke-linecap="round"/>
    <path d="M60 16 L100 16" stroke="#00FFAA" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>
  <g filter="url(#menuGlow)">
    <path d="M580 16 L550 16" stroke="#00FFAA" stroke-width="2" stroke-linecap="round"/>
    <path d="M540 16 L500 16" stroke="#00FFAA" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- 角落几何装饰 - 左上 -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="30" height="30" fill="none" stroke="#00FFAA" stroke-width="1" opacity="0.3"/>
    <rect x="5" y="5" width="8" height="8" fill="#00FFAA" opacity="0.2"/>
  </g>
  
  <!-- 角落几何装饰 - 右上 -->
  <g transform="translate(550, 20)">
    <rect x="0" y="0" width="30" height="30" fill="none" stroke="#00FFAA" stroke-width="1" opacity="0.3"/>
    <rect x="17" y="5" width="8" height="8" fill="#00FFAA" opacity="0.2"/>
  </g>
  
  <!-- 标题区域 -->
  <rect x="40" y="80" width="520" height="120" rx="8" fill="url(#titleBg)"/>
  
  <!-- 标题装饰线 -->
  <line x1="100" y1="200" x2="500" y2="200" stroke="#2a2a35" stroke-width="1"/>
  <circle cx="300" cy="200" r="3" fill="#00FFAA" opacity="0.6"/>
  
  <!-- 按钮区域背景 -->
  <rect x="60" y="260" width="480" height="400" rx="8" fill="url(#buttonAreaBg)"/>
  
  <!-- 按钮位置指示 (开发用) -->
  <g opacity="0.15">
    <rect x="100" y="300" width="400" height="60" rx="8" fill="none" stroke="#00FFAA" stroke-dasharray="4 4"/>
    <rect x="100" y="380" width="400" height="60" rx="8" fill="none" stroke="#00FFAA" stroke-dasharray="4 4"/>
    <rect x="100" y="460" width="400" height="60" rx="8" fill="none" stroke="#00FFAA" stroke-dasharray="4 4"/>
    <rect x="100" y="540" width="400" height="60" rx="8" fill="none" stroke="#4A9EFF" stroke-dasharray="4 4"/>
  </g>
  
  <!-- 底部装饰区 -->
  <g transform="translate(0, 700)">
    <!-- 分隔线 -->
    <line x1="100" y1="20" x2="500" y2="20" stroke="#2a2a35" stroke-width="1"/>
    
    <!-- 版本信息区域 -->
    <rect x="200" y="40" width="200" height="30" rx="4" fill="none" stroke="#1a1a24" stroke-dasharray="2 2" opacity="0.3"/>
  </g>
  
  <!-- 底部角落装饰 -->
  <g transform="translate(20, 750)">
    <path d="M0 30 L0 10 L10 0" fill="none" stroke="#4A9EFF" stroke-width="1" opacity="0.4"/>
  </g>
  <g transform="translate(580, 750)">
    <path d="M0 30 L0 10 L-10 0" fill="none" stroke="#4A9EFF" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- 环境光粒子（装饰） -->
  <g opacity="0.3">
    <circle cx="120" cy="150" r="1" fill="#00FFAA">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="180" r="1" fill="#00FFAA">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="650" r="1" fill="#4A9EFF">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="720" r="1" fill="#4A9EFF">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

