<?xml version="1.0" encoding="UTF-8"?>
<!--
  《备注 / Footnote》- 存档槽位面板
  尺寸: 600×120px
  用途: 存档/读档界面的单个槽位
-->
<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 槽位背景 -->
    <linearGradient id="slotBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a24"/>
      <stop offset="100%" style="stop-color:#14141c"/>
    </linearGradient>
    
    <!-- 悬停效果 -->
    <linearGradient id="slotHover" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A9EFF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#4A9EFF;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#4A9EFF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- 主背景 -->
  <rect x="0" y="0" width="600" height="120" rx="8" fill="url(#slotBg)" stroke="#2a2a35" stroke-width="1"/>
  
  <!-- 悬停层 -->
  <rect x="0" y="0" width="600" height="120" rx="8" fill="url(#slotHover)" opacity="0"/>
  
  <!-- 缩略图区 -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="140" height="90" rx="4" fill="#0e0e14" stroke="#2a2a35" stroke-width="1"/>
    <text x="70" y="50" font-family="Noto Sans SC" font-size="12" fill="#686868" text-anchor="middle">[预览图]</text>
  </g>
  
  <!-- 槽位编号 -->
  <g transform="translate(175, 20)">
    <rect x="0" y="0" width="60" height="28" rx="4" fill="#4A9EFF" opacity="0.2"/>
    <text x="30" y="19" font-family="monospace" font-size="14" fill="#4A9EFF" text-anchor="middle">槽位 1</text>
  </g>
  
  <!-- 存档信息 -->
  <g transform="translate(175, 58)">
    <text x="0" y="0" font-family="Noto Sans SC" font-size="14" fill="#E8E6E3">[章节名称] - [Zone名称]</text>
    <text x="0" y="25" font-family="monospace" font-size="11" fill="#686868">游戏时间: 02:34:15</text>
    <text x="0" y="45" font-family="monospace" font-size="11" fill="#686868">保存时间: 2024-12-24 15:30</text>
  </g>
  
  <!-- 进度指示 -->
  <g transform="translate(450, 50)">
    <rect x="0" y="0" width="130" height="8" rx="2" fill="#0e0e14"/>
    <rect x="0" y="0" width="78" height="8" rx="2" fill="#00FFAA" opacity="0.7"/>
    <text x="65" y="25" font-family="monospace" font-size="10" fill="#00FFAA" text-anchor="middle">60%</text>
  </g>
  
  <!-- 状态指示 -->
  <g transform="translate(540, 15)">
    <circle cx="20" cy="20" r="8" fill="#00CC66">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 边框高亮（选中状态） -->
  <rect x="0" y="0" width="600" height="120" rx="8" fill="none" stroke="#4A9EFF" stroke-width="2" opacity="0"/>
</svg>

