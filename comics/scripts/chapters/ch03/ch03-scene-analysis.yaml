characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"
  songlan:
    name: 宋岚
    gender: 男
    description: "28-35岁亚洲男性，170cm偏瘦，略长有些凌乱的头发，戴圆框眼镜，棕色眼睛带好奇与执着；穿旧马甲与米白衬衫（袖子挽起、略有墨渍），口袋鼓鼓囊囊插着笔与纸条，指尖有墨渍"

anchors:
  # 原文锚点短句（用于对齐检查）
  - "居住区的走廊像一条长长的纸缝。"
  - "门牌“17-06”"
  - "终端提示：地址匹配。"
  - "建议：撤离。"
  - "每走三步，墙上的白漆纹理都会重复出现一次"
  - "路线：已更正。"
  - "我是真的。"
  - "少解释，多对比。"
  - "宋岚。"
  - "我卖的不是地图，是差异。"
  - "已记录。"
  - "无需解释，仅需标注。"

scenes:
  - page_id: P01
    description: "走廊像纸缝，岑回按任务单寻找标注点，在门牌17-06前停下并敲门，终端提示地址匹配，但距离感异常。"
    panels:
      - panel_id: 1
        description: "广角：居住区长走廊，像纸缝；门牌整齐递增；旁白：『居住区的走廊像一条长长的纸缝。』"
      - panel_id: 2
        description: "中景：岑回沿门牌走，低头看任务单坐标；旁白：『岑回沿着门牌走，按任务单上的坐标去找标注点。』"
      - panel_id: 3
        description: "近景：门牌“17-06”特写；岑回下意识停住；旁白：『走到门牌“17-06”时，他下意识停了一下。』"
      - panel_id: 4
        description: "中景：岑回抬手敲门，无回应；终端小字弹出『地址匹配』；旁白：『他抬手，敲了敲门。没有回应。』"

  - page_id: P02
    description: "门没锁，进入更窄更暗的走廊；尽头窗外贴着墙；房内无生活痕迹。"
    panels:
      - panel_id: 1
        description: "近景：岑回推门，门竟没锁；旁白：『他试着推门。门竟然没锁。』"
      - panel_id: 2
        description: "广角：门内更窄走廊，墙面暗一阶；门在身后轻合，尾音被截断；旁白：『门内是一段更窄的走廊…合上的声音短得像被截断。』"
      - panel_id: 3
        description: "中景：走廊尽头窗外不是天空而是墙，窗贴墙；岑回摸玻璃；旁白：『窗外不是天空，而是另一面墙。』"
      - panel_id: 4
        description: "近景：空置、无鞋架无气味；旁白：『这间“房子”里没有生活的痕迹。』"

  - page_id: P03
    description: "转身想退出却发现门不见；终端提示撤离；走廊变长、纹理重复；按墙联想到薄墙回声。"
    panels:
      - panel_id: 1
        description: "中景：岑回转身准备退出，来时门消失；旁白：『却发现来时的门不见了。』"
      - panel_id: 2
        description: "特写：终端亮起提示『建议：撤离。』岑回心跳加快；旁白：『撤离去哪？门都不在了。』"
      - panel_id: 3
        description: "中景：岑回沿走廊往回走，走廊像变长；墙面纹理重复；旁白：『每走三步，墙上的白漆纹理都会重复出现一次。』"
      - panel_id: 4
        description: "近景：岑回抬手按墙，墙面平滑不正常；旁白：『那种平滑让他想起薄墙巷口的回声。』"

  - page_id: P04
    description: "用纸质任务单贴墙，墙排斥纸边翘起；他按平，纸发出嚓声像在说真实；终端闪出路线已更正。"
    panels:
      - panel_id: 1
        description: "中景：岑回掏出纸质任务单，贴在墙上；旁白：『他掏出纸质任务单，贴在墙上。』"
      - panel_id: 2
        description: "特写：纸边缘翘起，像墙在排斥；旁白：『纸边缘翘了起来，像墙面在排斥它。』"
      - panel_id: 3
        description: "特写：指尖把纸边按平，“嚓”一声；旁白加粗：『像在提醒：我是真的。』"
      - panel_id: 4
        description: "特写：终端文字闪两下：『路线：已更正。』岑回胃沉；旁白：『如果路线可以被更正，那他回去的路也可以被更正。』"

  - page_id: P05
    description: "拍快照，音效未被截断；摸到门框缝隙推门门出现；冲出回到明亮走廊，一切仿佛未发生，但手心仍冷，任务单路线字迹有涂改痕。"
    panels:
      - panel_id: 1
        description: "中景：岑回打开标注功能拍走廊尽头墙快照；旁白：『对着走廊尽头的墙拍了一张快照。』"
      - panel_id: 2
        description: "特写：快照保存提示音响起，这次没被截断；旁白：『音效很轻，但这一次，它没有被截断。』"
      - panel_id: 3
        description: "近景：岑回摸索到缝隙里的门框轮廓，用力一推门出现；旁白：『门出现了，像从墙面里被挤出来。』"
      - panel_id: 4
        description: "广角：冲出回到明亮走廊，门牌17-06与电梯口都在；岑回看掌心冷、任务单路线字边缘模糊涂改；旁白：『仿佛刚才…从未存在过。』"

  - page_id: P06
    description: "走廊里呼吸声很真；风带来纸味；楼道转角出现摊位，旧纸箱铺发黄地图；摊主眼神像笔，说你走错了。"
    panels:
      - panel_id: 1
        description: "近景：岑回站在走廊里听呼吸，呼吸声很真；旁白：『呼吸声很真，没有被截断。』"
      - panel_id: 2
        description: "中景：一阵风吹过，纸张味道；岑回循味道走；旁白：『一阵风…带来一股纸张的味道。』"
      - panel_id: 3
        description: "广角：楼道转角摊位，旧纸箱+发黄地图；摊主抬头；旁白：『像有人把旧纸箱摆开，铺上几张发黄的地图。』"
      - panel_id: 4
        description: "近景：摊主眼神像笔把他画一遍；对白（摊主）：『你走错了。』"

  - page_id: P07
    description: "摊主继续说同地记两次、少解释多对比；岑回询问对方是谁；摊主自报宋岚，递便签并说卖差异。"
    panels:
      - panel_id: 1
        description: "中景：摊主语气像记录；对白（摊主）：『同一个地方，记两次。』"
      - panel_id: 2
        description: "近景：摊主补一句；对白（摊主）：『少解释，多对比。』"
      - panel_id: 3
        description: "中景：岑回凝视；对白（岑回）：『你是谁？』"
      - panel_id: 4
        description: "近景：摊主递便签（硬字像刻出来），自报姓名并说明；对白（摊主）：『宋岚。我卖的不是地图，是差异。』"

  - page_id: P08
    description: "便签上有重写痕；谈奖励无、抹掉更难；岑回把快照和便签标注进终端；插页文件B-02与B-04作为档案页呈现。"
    panels:
      - panel_id: 1
        description: "特写：便签末尾两字被重写，带涂改痕；旁白：『便签末尾有两个字被重写过一遍。』"
      - panel_id: 2
        description: "近景：岑回问奖励；宋岚答没有但抹掉更难；对白（岑回）：『奖励呢？』对白（宋岚）：『没有。但抹掉会更难。』"
      - panel_id: 3
        description: "中景：岑回把便签收进口袋，心里一点点稳；旁白：『不解释也可以，先保存差异。』"
      - panel_id: 4
        description: "文件插页（四格内做“档案拼贴”）：左上《错门快照-01》摘要（门牌17-06/现象/处理/附注）；右上《宋岚便签：差异规则》三条；下方淡字：『别让“正常”替你收尾』；终端提示两行：『已记录。』『无需解释，仅需标注。』"
