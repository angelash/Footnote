# CH04《以最新更正为准》场景分析（Phase 1）
# 参照：story/1.md L382-L516

metadata:
  chapter: 4
  title: 以最新更正为准
  part: "第一部：流程"
  status: in_progress
  pages_planned: 8
  scope:
    - "只允许使用本章原文内容与插页 A-06/A-07/A-05，不得引入后续章事件/术语"

characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"
  clerk:
    name: 窗口职员
    gender: 女
    description: "市政办事厅窗口职员，眼神疲惫，语气标准化，动作熟练"
  oldman:
    name: 老人
    gender: 男
    description: "排队办理的老人，手抖得厉害，表情茫然且焦急"

anchors:
  # 每章至少列 6-12 个“原文锚点短句”，用于对齐检查
  - "市政办事厅比维修局更亮。"
  - "亮得像灯光不是照在人身上，而是照在“流程”上。"
  - "请按指引填写表格。请以最新更正为准。"
  - "为提高效率，部分字段将自动更正。"
  - "系统会自动更正。以最新更正为准。"
  - "（已更正）"
  - "纸不会自动更正，至少签名不会。"
  - "这里不受理主观叙述，按标准填。按标准填。"
  - "没有这个字段。"
  - "备注栏很小，两行。"
  - "不一致。"
  - "临时通行贴"
  - "对齐已应用"
  - "如果世界的更正是一种黏性，那人会不会慢慢被粘成同一种形状？"
  - "他只把那句“没有这个字段”记下来。"

scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - page_id: P01
    description: "市政办事厅明亮如流程，屏幕滚动“以最新更正为准”。"
    panels:
      - panel_id: 1
        description: "外景/入口广角：市政办事厅门口与冷亮灯带；旁白：『市政办事厅比维修局更亮。』"
      - panel_id: 2
        description: "大厅广角：椅子整齐、间距一致；旁白：『亮得像灯光不是照在人身上，而是照在“流程”上。』"
      - panel_id: 3
        description: "大屏特写：滚动办事须知；大字清晰：『请按指引填写表格。请以最新更正为准。』"
      - panel_id: 4
        description: "岑回站在屏幕下抬头看，神情克制；旁白：『屏幕滚动得平稳，像专门冲走不一致的河。』"

  - page_id: P02
    description: "取号、候位、椅子硬、等待姿势被迫对齐。"
    panels:
      - panel_id: 1
        description: "机器吐号纸，边缘一刀切齐；旁白：『号码纸从机器里吐出来，边缘一刀切齐。』"
      - panel_id: 2
        description: "号纸小字特写：『为提高效率，部分字段将自动更正。』"
      - panel_id: 3
        description: "候位区中景：岑回坐下，椅子塑料面很硬；旁白：『等待可以，但不要乱。』"
      - panel_id: 4
        description: "叫号灯/提示牌准时跳号；旁白：『窗口叫号很准时。』"

  - page_id: P03
    description: "窗口办理：职员疲惫，扫描“滴”，地址字段出现不对。"
    panels:
      - panel_id: 1
        description: "窗口中景：职员不抬头伸手接卡；扫描枪“滴”；旁白：『屏幕上跳出一串字段。』"
      - panel_id: 2
        description: "职员对白：『居住信息确认一下。』"
      - panel_id: 3
        description: "屏幕字段：姓名/工号/部门都对；地址行带字母分区；旁白：『地址看起来像他的地址，又不是。』"
      - panel_id: 4
        description: "岑回皱眉对白：『这行不对。』"

  - page_id: P04
    description: "“以最新更正为准”：系统更正、地址闪一下、（已更正）、签名与纸声。"
    panels:
      - panel_id: 1
        description: "职员抬头疲惫，机械回答；对白：『系统会自动更正。以最新更正为准。』"
      - panel_id: 2
        description: "屏幕地址行闪一下后稳定，末尾出现：『（已更正）』"
      - panel_id: 3
        description: "职员推来表格副本；对白：『签名。』"
      - panel_id: 4
        description: "岑回握笔签名，纸面摩擦“沙沙”；旁白：『纸不会自动更正，至少签名不会。』"

  - page_id: P05
    description: "旁边窗口老人：主观叙述不受理，“没有这个字段”。"
    panels:
      - panel_id: 1
        description: "老人手抖对着表格发愣；旁白：『像握不住“正确填法”。』"
      - panel_id: 2
        description: "职员语速快的对白：『这里不受理主观叙述，按标准填。按标准填。』"
      - panel_id: 3
        description: "老人低声：『我家里本来有一间小房……』"
      - panel_id: 4
        description: "职员冷对白：『没有这个字段。请按标准填。』"

  - page_id: P06
    description: "岑回犹豫后帮老人填表，把人压进流程；备注栏两行像缝。"
    panels:
      - panel_id: 1
        description: "老人抬头求助眼神；岑回犹豫一秒走过去；旁白：『像想抓住一个能把“小房”塞进世界的人。』"
      - panel_id: 2
        description: "岑回工整填写姓名/年龄/住址等字段；旁白：『像替老人把自己压进流程里。』"
      - panel_id: 3
        description: "备注栏特写：很小两行空白；旁白：『备注栏很小，两行。』"
      - panel_id: 4
        description: "老人小声：『那间小房…他们说从来没有。』岑回笔尖悬停。"

  - page_id: P07
    description: "岑回最终写下“ 不一致 ”，把表推回，老人握着证据。"
    panels:
      - panel_id: 1
        description: "岑回想起薄墙回声与“正常（已更正）”；旁白：『他知道自己不该写，也知道写了未必能留下。』"
      - panel_id: 2
        description: "笔尖落下，备注栏写出：『不一致。』（字清晰）"
      - panel_id: 3
        description: "岑回把表格推回去，不敢对视；旁白：『像怕眼神会变成更长的备注。』"
      - panel_id: 4
        description: "老人握着表格，像握着随时会被撕掉的证据；气氛压抑。"

  - page_id: P08
    description: "插页拼贴：流程说明/表格副本/临时通行贴；黏性与“粘成同一种形状”。"
    panels:
      - panel_id: 1
        description: "插页A-06《市政办事厅流程说明》：三步流程+提示（自动更正/以最新更正为准/不受理主观叙述）。"
      - panel_id: 2
        description: "插页A-07《居住信息确认表》：地址『██巷██号-B（已更正）』；角落盖章：『对齐已应用』"
      - panel_id: 3
        description: "插页A-05《临时通行贴》：范围/有效/提示；背面极小字：『更新频率：不定』"
      - panel_id: 4
        description: "岑回手指碰到通行贴背胶，指腹被粘一下；旁白：『如果世界的更正是一种黏性…会不会慢慢被粘成同一种形状？』并收尾：『他只把那句“没有这个字段”记下来…像一条备注。』"
