scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - id: S01
    location: "回城路上：霓虹与“刷白”的亮"
    event: "岑回绕路；不想太快回到亮得像刷白的地方"
    beats:
      - "回城路上，岑回绕了一段"
      - "不想太快回到那种“亮得像把人刷白”的地方"
  - id: S02
    location: "居住区东侧：小院与公告墙"
    event: "公告墙与过期通知：旧漆、卷边、随时会被撕走"
    beats:
      - "公告墙是木板，刷着旧漆，边角翘起"
      - "墙上贴着几张过期的通知"
      - "纸被雨淋过，边缘卷起，像随时会被撕走"
  - id: S03
    location: "公告墙前：栖蓝贴地图"
    event: "栖蓝贴地图；地图不是既定路线；对话开场"
    beats:
      - "栖蓝蹲在一面公告墙前"
      - "手里拿着一卷胶带，另一只手按着一张地图"
      - "地图上画的不是常规街区，而是一些没人走的巷子与绕行路线"
      - "那不是“既定路线”"
      - "岑回：你在贴什么？"
      - "栖蓝：地图。"
  - id: S04
    location: "公告墙前：删法与“没用”"
    event: "栖蓝说地图没用；解释“没用只是删法”"
    beats:
      - "有人看吗？（岑回自己后悔，像在问有用吗）"
      - "这张地图没用"
      - "没用不是事实。没用只是删法。"
  - id: S05
    location: "公告墙前：贴牢一点"
    event: "岑回按住地图；贴牢一点；不是为了好看，是为了不被一撕就没"
    beats:
      - "帮我按一下"
      - "贴牢一点"
      - "岑回手掌按在地图上，纸粗糙，能摸到纤维"
      - "贴牢一点，不是为了好看"
      - "是为了不被一撕就没"
  - id: S06
    location: "公告墙旁：电子屏 vs 纸地图"
    event: "电子屏干净统一；地图像补丁；终端无字段；自定义记录与结算"
    beats:
      - "公告墙旁边就是新装的电子屏，字体干净、统一、不会卷边"
      - "地图贴在那里，像一口气没被系统吞下去"
      - "终端里没有“贴地图”这个事项。没有字段"
      - "打开自定义记录：贴图。无指令。无收益。"
      - "终端提示：结算：无可用收益。"
  - id: S07
    location: "公告墙前：不被更正的一次"
    event: "岑回盯着“无可用收益”反而心里一松；栖蓝的两句"
    beats:
      - "无可用收益——至少这一次，它没有被更正成“正常”"
      - "你别指望它感谢你。"
      - "我没指望。"
      - "栖蓝背影很直，像把自己当成一条必要的螺丝"
  - id: S08
    location: "公告墙前：贴牢的对抗与“多余维护”"
    event: "风吹来地图不翘起；岑回意识到这是多余维护，维护存在过的可能"
    beats:
      - "风吹来，地图没有翘起。胶带把它贴牢了"
      - "那是一种很小的、多余的维护"
      - "维护的对象不是秩序，而是存在过的可能"
      - "不安，也第一次有一点点踏实"
