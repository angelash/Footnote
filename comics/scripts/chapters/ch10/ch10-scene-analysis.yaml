      - "阿棠指向外套内侧位置，像能看见通行贴与口袋里的纸"
      - "对白：你今天带回来了很多东西。"
      - "对白：你带回来的东西，会把你也变成一样的。"
      - "岑回：你怎么知道？"
      - "阿棠：我不是在猜。"
      - "阿棠停在看不见的线前：你刚刚是不是又被改了一点？"
