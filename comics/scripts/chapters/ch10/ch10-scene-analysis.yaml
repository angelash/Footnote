      - "地址行多了字母分区"
      - "极小字：（已更正）"
      - "他不确定变化发生在何时"
  - id: S05
    location: "身份卡正面"
    event: "签发日期末尾出现淡淡涂改痕"
    beats:
      - "名字照片职位都还在"
      - "签发日期末尾有淡淡涂改痕"
      - "岑回攥紧卡，掌心疼"
  - id: S06
    location: "走廊转角"
    event: "岑回想找人确认，但知道“你记错了”最省成本"
    beats:
