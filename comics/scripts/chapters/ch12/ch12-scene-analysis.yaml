# CH12《双份回执》场景分析（Phase 1）
# 参照：story/2.md L63-L231

metadata:
  chapter: 12
  title: 双份回执
  part: "第2部：残差"
  status: in_progress
  scope:
    - "只允许使用本章原文内容，不得引入后续章事件/术语"

characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"
  songlan:
    name: 宋岚
    gender: 女
    description: "年轻女性，岑回的同事，常藏在阴影处，语气冷静克制，强调‘差异’与‘存’"
  staff:
    name: 工作人员
    gender: 女
    description: "窗口工作人员，语气标准化，像系统口吻借她的嘴说出来"

anchors:
  # 每章至少列 6-12 个“原文锚点短句”，用于对齐检查
  - "岑回回到维修局时，天还没完全亮开。"
  - "大厅里照常明亮，明亮得像不允许阴影站稳。"
  - "提示：路线既定"
  - "版本：1.4"
  - "旧版的“备注”下面，末尾多了一句更长的提醒——"
  - "复杂度超阈值将触发权限收紧。"
  - "以最新更正为准。"
  - "保留旧版本会增加解释成本。"
  - "纠偏队列：新增条目 1"
  - "状态：待结算"
  - "条目编号：Q-██-17"
  - "别盯着它看太久。"
  - "我在差异里。"
  - "差异卡"
  - "别写进终端。终端会把你写进去。"
  - "同地记两次。少解释，多对比。别急着把两份合成一份。"
  - "合成一份，等于你替它做了更正。"
  - "你要它留，就得让它难删。"
  - "我不急着解释，我先留下。"

scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - id: S01
    location: "维修局大厅 / 外勤窗口"
    event: "清晨返岗打印任务单，发现版本 1.4"
    pages:
      - P01
    beats:
      - "天未亮透，大厅异常明亮"
      - "岑回打印今日任务单"
      - "任务单上出现：提示：路线既定；版本：1.4"
      - "岑回想起口袋里还有旧版 1.3"

  - id: S02
    location: "外勤窗口台面"
    event: "两版本对照：旧版多一句‘权限收紧’"
    pages:
      - P02
    beats:
      - "岑回掏出旧任务单 1.3 与新版 1.4 并排"
      - "格式内容几乎相同"
      - "差异：旧版备注多一句‘复杂度超阈值将触发权限收紧’"
      - "新版像把那句话擦掉"

  - id: S03
    location: "窗口 / 闸机附近"
    event: "窗口对话：以最新更正为准；旧版本=解释成本"
    pages:
      - P03
    beats:
      - "岑回拿旧任务单询问是否有效"
      - "工作人员标准回答：以最新更正为准"
      - "岑回要自己留着，工作人员提示：保留旧版本会增加解释成本"
      - "口袋里纸变沉"

  - id: S04
    location: "大厅角落显示屏"
    event: "纠偏队列溢出到公共屏：Q-██-17"
    pages:
      - P04
    beats:
      - "闸机发出短促提醒音"
      - "公共屏滚动：纠偏队列新增条目；状态待结算"
      - "编号 Q-██-17 与岑回‘17’对上"
      - "岑回被迫停住"

  - id: S05
    location: "走廊阴影"
    event: "宋岚出现：别盯太久；你口袋里有两份版本；你得存"
    pages:
      - P05
    beats:
      - "宋岚在阴影里提醒：别盯着屏幕太久"
      - "岑回问她为何在这"
      - "宋岚说自己在差异里"
      - "她指出岑回口袋里有两份版本，强调：你得存"

  - id: S06
    location: "走廊阴影 / 手心特写"
    event: "差异卡：别写进终端"
    pages:
      - P06
    beats:
      - "宋岚递出差异卡（用途：记录差异；结算：无）"
      - "背面角落有淡淡刻度点"
      - "宋岚告诫：别写进终端；终端会把你写进去"
      - "岑回问写什么：写能证明的差异"

  - id: S07
    location: "大厅边缘 / 显示屏余光"
    event: "关于队列与‘账’：同地记两次；别合并版本"
    pages:
      - P07
    beats:
      - "岑回问队列是什么"
      - "宋岚先说：是他们的账；随即改口：是系统的账，是维护的账"
      - "宋岚给策略：同地记两次，少解释多对比"
      - "警告：别急着把两份合成一份"

  - id: S08
    location: "走廊尽头 / 大厅"
    event: "留下：让它难删；岑回的低誓言"
    pages:
      - P08
    beats:
      - "宋岚临走补充：写下的残差会变成它的成本"
      - "规则句：你要它留，就得让它难删"
      - "岑回翻看差异卡，理解它只承诺保留"
      - "把差异卡与两版本任务单放一起：我不急着解释，我先留下"
