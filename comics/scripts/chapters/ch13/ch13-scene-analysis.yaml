scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - id: S01
    location: "岑回的工作动线 / 维修局附近"
    event: "决定复走，写下目标：验证流程是否可复现"
    beats:
      - "岑回决定试一次：不是证明自己对，而是确认流程是否会复现"
      - "在差异卡背面角落写下“复走”"
  - id: S02
    location: "早餐店"
    event: "第一趟：老样子；小票日期=今天，时间07:12"
    beats:
      - "风铃响半下；店主问“老样子”"
      - "小票显示今天早上，时间07:12；岑回折起放进口袋"
  - id: S03
    location: "薄墙巷口"
    event: "第一趟：薄墙未触发"
    beats:
      - "墙白，裂纹在；岑回只看三秒，不按墙"
      - "差异卡记：薄墙：未触发"
  - id: S04
    location: "维修局闸机与大厅"
    event: "第一趟回局：路线既定；纠偏队列编号仍为Q-██-17"
    beats:
      - "闸机滴；通行通过；提示路线既定"
      - "大厅屏纠偏队列滚动；编号Q-██-17仍在"
  - id: S05
    location: "早餐店（第二趟）"
    event: "第二趟：系统显示没来过；小票日期被改写成昨天"
    beats:
      - "店主皱眉：你怎么又来"
      - "岑回：我刚刚来过；店主：系统显示你没来过"
      - "递出第一张小票；店主：这是昨天的"
      - "岑回发现：折痕/油墨/章不变，只有日期变；时间仍07:12"
  - id: S06
    location: "薄墙巷口（第二趟）"
    event: "未按墙但回声出现；岑回修改措辞"
    beats:
      - "风更冷；裂纹前听见墙里响一下、又响第二下"
      - "差异卡补记：回声：自发（划掉）→ 回声：无触发出现"
  - id: S07
    location: "维修局闸机与大厅屏"
    event: "闸机屏闪过“重复路径：已检测”；队列Q-██-17出现子项"
    beats:
      - "闸机通行通过；提示路线既定"
      - "屏幕最下方极短闪字：重复路径：已检测（0.2s）"
      - "大厅屏：Q-██-17下面多出一个子项"
      - "岑回意识到：你重复一次，它就多一笔账"
  - id: S08
    location: "外勤窗口 / 证据归档视角"
    event: "两张小票并排；确认残差；插页B-14/B-15呈现对照抄录与差异卡摘录"
    beats:
      - "岑回把两张早餐小票并排：一张今日，一张昨日；折痕一样"
      - "他不是证明哪张真，而是确认世界允许一张纸承担两份日期"
      - "把两张小票夹进板夹：让删掉变难"
      - "插页文件B-14：小票A/B字段对照；备注“仅日期字段变化”"
      - "插页文件B-15：复走记录（薄墙未触发/无回声 vs 回声无触发出现；终端曾闪重复路径已检测0.2s）"
