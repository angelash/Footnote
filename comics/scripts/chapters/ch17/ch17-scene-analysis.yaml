  title: 底层抽屉
  part: "第2部：残差"
  status: draft
  scope:
    - "只允许使用本章原文内容，不得引入后续章事件/术语"

characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"

anchors:
  # 每章至少列 6-12 个“原文锚点短句”，用于对齐检查
  - "你看了。"
  - "薄墙里有骨架空腔。"
  - "你现在开始会越来越讨厌‘正常’这个词。"
  - "建议：降低观察频率"
  - "已封存"
  - "版本 / 互斥 / 延迟 / 不可归档 / 不可结算"
  - "版本库底层。"
  - "官方库只收敛，你这里存残差。"
  - "条目：早餐小票"
  - "状态：互斥双日期"
  - "保留方式：纸质 + 差异卡"
  - "别用对抗这个词。对抗太像故事。这里没有故事，只有账。"
  - "同一条巷子，在V1里通，V2里断，V3里根本不存在。"
  - "你要是把它们合成一张，你就替更正做完了。"
  - "你应该问：哪张被允许运行。"
  - "底层索引卡"
  - "用途：挂接互斥证据"
  - "结算：无"
  - "备注：请勿合并"
  - "◦◦"
  - "对账。"
  - "别问太深。你现在只读，你问太深会想写。"
  - "因为你开始制造成本了。"
  - "别让你的口袋太轻。太轻的人最容易被对齐。"
  - "插页｜文件 B-18"
  - "“合并”=替更正收尾"

scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - id: S01
    location: "维修局后巷（阴影处）"
    event: "宋岚在垃圾分类箱旁拦住岑回，确认他“看了”"
    pages:
      - P01
    beats:
      - "宋岚没在亮处等他，她站在维修局后巷的垃圾分类箱旁边。"
      - "宋岚说：“你看了。”语气像确认。岑回承认薄墙里有骨架空腔。"
      - "宋岚说：“你现在开始会越来越讨厌‘正常’这个词。”并提到终端“建议：降低观察频率”。"

  - id: S02
    location: "后巷尽头的无牌门"
    event: "封条门与老钥匙：进入地下楼梯"
    pages:
      - P02
    beats:
      - "后巷尽头有一扇不起眼的门，门上没有牌子。"
      - "封条贴得歪歪扭扭，印着“已封存”，被指甲刮出浅口子。"
      - "宋岚掏出一串老钥匙，钥匙碰撞声清脆。门开了，里面是向下的楼梯。"

  - id: S03
    location: "地下室楼梯与尽头小房间"
    event: "潮与旧纸味：抽屉柜与手写标签"
    pages:
      - P03
    beats:
      - "地下室潮，潮里带着旧纸的味道；灯光很弱却稳定。"
      - "楼梯尽头狭窄房间，墙边摆满抽屉柜。"
      - "每个抽屉贴着手写标签：版本 / 互斥 / 延迟 / 不可归档 / 不可结算。"

  - id: S04
    location: "抽屉柜前"
    event: "版本库底层：索引卡的“更正赛跑”"
    pages:
      - P04
    beats:
      - "宋岚拉开抽屉：大量索引卡，编号日期地点密密麻麻，很多地方被划掉重写。"
      - "岑回问“这是什么？”宋岚答：“版本库底层。官方库只收敛，你这里存残差。”"
      - "岑回摸索引卡边缘，纸硬粗糙像故意让你写得慢。"

  - id: S05
    location: "索引卡示例"
    event: "早餐小票条目：互斥双日期与保留方式"
    pages:
      - P05
    beats:
      - "宋岚抽出卡片给岑回看：条目：早餐小票；状态：互斥双日期；结算：延迟；保留方式：纸质 + 差异卡。"
      - "岑回问“你在教我怎么对抗？”宋岚冷声：“别用对抗这个词。这里没有故事，只有账。”"

  - id: S06
    location: "地图抽屉/桌面"
    event: "三份地图互斥：不要合并，不问真，问运行"
    pages:
      - P06
    beats:
      - "另一个抽屉里几张地图被分成三份版本，用不同颜色夹子夹着。"
      - "宋岚指出：同一条巷子V1里通，V2里断，V3里根本不存在；合成一张就是替更正做完。"
      - "岑回问“哪张是真的？”宋岚说：你应该问：哪张被允许运行。"

  - id: S07
    location: "递卡"
    event: "底层索引卡模板与◦◦：对账；只读警告"
    pages:
      - P07
    beats:
      - "宋岚抽出一张新的索引卡递给岑回：底层索引卡；用途：挂接互斥证据；结算：无；备注：请勿合并。"
      - "背面角落印着两个刻度点：◦◦。岑回问含义，宋岚答：“对账。”"
      - "宋岚打断追问：别问太深。你现在只读，你问太深会想写。"

  - id: S08
    location: "关抽屉与离开地下室"
    event: "制造成本：口袋别太轻；插页文件B-18"
    pages:
      - P08
    beats:
      - "岑回问“你为什么帮我？”宋岚说：因为你开始制造成本了。"
      - "宋岚解释：每留下一张纸、每不合并一次、每复走一次，会让删掉变难，系统必须花力气，露出更多格式。"
      - "宋岚推回抽屉咔一声：回去。别让你的口袋太轻。太轻的人最容易被对齐。"
      - "岑回把索引卡塞进口袋，纸边刮到指腹；并以插页文件B-18展示“版本库底层索引卡-01”与“合并=替更正收尾”。"
