    beats:
      - "牧平翻开抄本读出短短几行：折回去，折痕还在；抹平不是恶，是本能；本能没有善恶，只有尺度；尺度不问你累不累。"
      - "岑回意识：牧平在训练一种不被意义绑架的语言。"

  - id: S05
    location: "散场后的礼堂"
    event: "递抄本：◦◦◦；带着但别用来解释"
    pages:
      - P05
    beats:
      - "散场：牧平把抄本递给岑回，纸角落点着三个点：◦◦◦。"
      - "牧平说：带着；别用它解释；用它提醒。"
      - "岑回触到三个点：像金属铆钉钉在纸上、钉在心里。"

  - id: S06
    location: "礼堂门口 / 街口"
    event: "疗程之问：反对太轻；救人也抹人；让它多花一次力气"
    pages:
      - P06
    beats:
      - "岑回问：你知道疗程吗？牧平说：知道。"
      - "岑回问：你反对吗？牧平说：反对这个词太轻。"
      - "牧平直言：疗程会救人，也会抹人。"
      - "要做的不是站队：在抹之前，让它多花一次力气。"

  - id: S07
    location: "礼堂街暗处"
    event: "同一件事：让删法付出动作；别急着胜利"
    pages:
      - P07
    beats:
      - "岑回想起栖蓝的胶带、宋岚的底层抽屉、许澄的手写备注：原来都是让删法付出动作。"
      - "牧平补一句：别急着胜利。你现在连失败都还没被承认。"

  - id: S08
    location: "礼堂街 / 插页A-16"
    event: "只读与疲惫：记录/贴牢/增加成本；插页A-16《祷文抄本-06（刻度点版）》"
    pages:
      - P08
    beats:
      - "岑回仍然只读：看见却无法扶正；只能记录、贴牢、增加成本。"
      - "累很累，但累不等于错误：只是尺度不配的副作用。"
      - "插页A-16：◦折痕 / ◦◦对账 / ◦◦◦不可合并 + 祷文四行 + 页脚小字“让它多花一次力气。”"
