characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"
  muping:
    name: 牧平
    gender: 男
    description: "男性，中年偏瘦，神情平静克制，像讲台边的旧灯；穿着旧外套或深色衣物，手里常捏着手抄纸张，语气不安慰人，更像训练语言"

anchors:
  # 每章至少列 6-12 个“原文锚点短句”，用于对齐检查
  - "礼堂街的灯更暗了。"
  - "不是灯坏了，而像这条街被城市的亮处遗忘"
  - "牧平仍坐在讲台边"
  - "纸不是印刷的，是手抄的。"
  - "岑回坐在后排，没开终端。"
  - "他怕一开…会立刻变成“条目”。"
  - "这是折痕。"
  - "这是对账。"
  - "这是你开始无法合并的那部分。"
  - "点没用。点只是删法的反面。"
  - "折回去，折痕还在。"
  - "抹平不是恶，是本能。"
  - "本能没有善恶，只有尺度。"
  - "尺度不问你累不累。"
  - "带着。别用它解释。用它提醒。"
  - "反对这个词太轻。"
  - "疗程会救人，也会抹人。"
  - "在抹之前，让它多花一次力气。"
  - "别急着胜利。你现在连失败都还没被承认。"
  - "你只能记录、贴牢、增加成本。"
  - "累并不等于错误。"

scenes:
