      - "岑回联想到：宋岚索引卡角落◦◦、节点回执◦◦、差异卡◦。"
      - "有人问点有什么用；牧平答：点没用，点只是删法的反面。"

  - id: S04
    location: "旧礼堂"
    event: "祷文四行：折痕/本能/尺度"
    pages:
