    beats:
      - "顾临在走廊尽头等他：无法绕开，像闸机的“滴”。"
      - "顾临：你做了写在底层的事。岑回：你们监控底层？顾临：不监控。监控也是成本。我们只看结果。"
      - "大厅屏幕：纠偏队列新增12；最上面滚动闪过：互斥证据：未合并。"
      - "岑回背脊发冷：你们希望我合并。顾临：希望，是为了维护。"

  - id: S03
    location: "走廊边"
    event: "只读不够：必须处理避免事故"
    pages:
      - P05
    beats:
      - "岑回质问：为什么还让我看深度？顾临：因为只读已经不够了。"
      - "顾临：有些条目不靠对齐能消化；有些必须处理，否则会变成事故。"
      - "岑回想起断口的方形阴影、空椅互斥存在：影响动作、影响人、影响一句话后半段。"

  - id: S04
    location: "走廊桌面"
    event: "《例外许可》：深度介入（写入）的定义与代价；永久补丁痕迹"
    pages:
      - P06
    beats:
      - "顾临推来薄纸：《例外许可》。例外意味着规则承认自己处理不了。"
      - "顾临解释：这是深度介入（写入），权限局部、有限、可追踪；把暂时不存在的边界写得坚硬，或把多余空洞写得柔软。"
      - "代价：留下伤痕、无法完全回滚、解释成本上升；条款加粗：写入将导致永久补丁痕迹。"
      - "岑回联想到牧平：墨多纸裂。"

  - id: S05
    location: "走廊签名处"
    event: "为什么选我；字段空位；签下与授权卡"
    pages:
      - P07
      - P08
    beats:
      - "岑回：为什么选我？顾临：你已在复走、保留残差、制造成本；你能承受“看到之后不乱写”。岑回：像夸奖。顾临：像风险评估。"
      - "许可末尾签名栏旁的字段名：字段：＿。顾临：我们也不知道，现在用空格占位。"
      - "岑回想到许澄手写“轻松不是唯一目标”、栖蓝胶带、宋岚抽屉、空椅女人吞句：签与不签的代价。"
      - "岑回签了；笔声在走廊异常清晰。"
      - "顾临递授权卡：能力：深度介入（写入）；警告：将留下永久伤痕；结算方式：待定。"
      - "顾临：别用它证明你能。用它避免别人被吞掉。"
