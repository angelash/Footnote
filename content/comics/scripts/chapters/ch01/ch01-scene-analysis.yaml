# CH01《既定路线》场景分析（Phase 1）
# 参照：story/1.md L9-L121

metadata:
  chapter: 1
  title: 既定路线
  part: "第1部：流程"
  status: draft
  scope:
    - "只允许使用本章原文内容，不得引入后续章事件/术语"

characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"

anchors:
  # 每章至少列 6-12 个“原文锚点短句”，用于对齐检查
  - "安静得像一张纸，被人压过熨斗"
  - "今天是“秩序月”的第十一天，主题词是：稳定"
  - "请以最新更正为准。"
  - "通行：通过。"
  - "提示：路线既定。"
  - "老样子？"
  - "温热更安心。"
  - "已完成。"
  - "不会出错，是一种身份。"
  - "无需解释，仅需标注。"
  - "异常讨论将增加复杂度。"
  - "你会看见一些不该被讨论的东西。看见就记录，别动。"
  - "别让复杂度伤到你。"
  - "连灰尘都知道怎么对齐。"

scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - id: S01
    location: "岑回的房间（清晨）"
    event: "在过分安静中醒来，感知到“被抚平”的异常"
    beats:
      - "岑回醒得比闹钟早"
      - "安静得不真实：声音像被“抚平”"
      - "拉开窗帘：楼群整齐、广告屏“秩序月/稳定”"
  - id: S02
    location: "家门口走廊/楼道"
    event: "携带身份卡与纸张，看到公告“请以最新更正为准”"
    beats:
      - "身份识别卡：细微划痕“太规矩了”"
      - "夹层纸：早餐小票、过期通行贴、无抬头回执；“纸比屏幕可靠”"
      - "钥匙换口袋：左边→右边（细小自检）"
      - "公告：请以最新更正为准（纸面反光像被重排）"
  - id: S03
    location: "小区闸机 + 早餐店门口"
    event: "闸机通行提示“路线既定”，早餐店风铃“只响半下”"
    beats:
      - "闸机：通行：通过；提示：路线既定"
      - "早餐店风铃：清脆但只响半下（余音被削掉）"
      - "对话：店主“老样子？” 岑回“嗯。”"
      - "纸袋字：温热更安心；油墨毛刺让他意识到“这是真的印出来的”"
  - id: S04
    location: "维修局大厅/外勤柜台"
    event: "流程化提示与任务单：无需解释，仅需标注；异常讨论将增加复杂度"
    beats:
      - "维修局冷色楼体，电子屏值班名单"
      - "窗口提示：无需解释，仅需标注"
      - "任务单格式：路线/事项/返岗时间；最下面：异常讨论将增加复杂度"
  - id: S05
    location: "维修局走廊（顾临出现）"
    event: "顾临强调克制与“只看不动”：看见就记录，别动"
    beats:
      - "顾临整洁如纪律，声音压低"
      - "指令：今天走居住区那条线，按既定路线"
      - "警告：你会看见一些不该被讨论的东西；看见就记录，别动"
      - "补一句个人化：别让复杂度伤到你"
  - id: S06
    location: "街道/既定路线（外出）"
    event: "沿既定路线行走，看到“请以最新更正为准”的重复，压下念头"
    beats:
      - "街道有护栏与指示牌；“请以最新更正为准”每隔五十米出现"
      - "踩过砖缝：灰尘被压平；念头：连灰尘都知道怎么对齐"
      - "把念头压下去：外勤最重要的技能之一"
  - id: S07
    location: "插页文件（A-01 外勤任务单-00）"
    event: "以“文件复印件/档案页”的形式呈现任务单内容"
    beats:
      - "外勤任务单-00：路线：居住区→薄墙巷→维修局"
      - "完成标准：标注3处可见异常；不做解释，只做记录；返岗提交"
      - "备注：无需解释，仅需标注；提示：路线既定"
