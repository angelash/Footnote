    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"
  qilan:
    name: 栖蓝
    gender: 女
    description: "亚洲女性，常出现在居住区边缘做“没人要求”的修补；穿着耐磨旧外套，手上有灰与细小划痕，眼神平静但带疲惫；动作慢而坚定"

