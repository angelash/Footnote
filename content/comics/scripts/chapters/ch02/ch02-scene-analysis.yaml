scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - id: S01
    location: "薄墙巷口（居住区边缘）"
    event: "进入薄墙巷，环境描写：窄、高、白漆冷"
    beats:
      - "巷子窄、墙体高"
      - "白漆层层覆盖，白得发冷"
      - "岑回翻开任务单，准备按流程标注"

  - id: S02
    location: "薄墙中段裂纹处"
    event: "标注裂纹：墙体裂纹（已记录）"
    beats:
      - "裂纹像皱纹，被白漆填过一半"
      - "贴纸边缘压得很平"
      - "终端提示：已记录。"

  - id: S03
    location: "巷内地面"
    event: "地面轻微翘起，指腹被刮出红痕"
    beats:
      - "地砖像被挤出平面"
      - "岑回蹲下触碰，边缘锋利"
      - "指腹出现红痕：红色很真"
      - "终端提示：已记录。"

  - id: S04
    location: "巷口回到薄墙前"
    event: "听到墙内回声，按住薄墙，终端提示忽略"
    beats:
      - "回声来自墙体内部空腔"
      - "墙面很冷，像被编号"
      - "终端跳出：建议：忽略。"
      - "岑回不放手，把耳朵贴近墙面"

  - id: S05
    location: "薄墙前（终端备注）"
    event: "写下“空腔感明显”，系统回写“状态：正常（已更正）”"
    beats:
      - "备注栏很小，只给两行字"
      - "输入四个字：空腔感明显。并提交"
      - "系统结论：状态：正常（已更正）。"
      - "认知眩晕：听见却被告知没有"
      - "背后轻微敲击，像指甲敲墙（从里面）"

  - id: S06
    location: "巷口与路边"
    event: "遇到栖蓝修补路标，谈“有没有用”"
    beats:
      - "栖蓝在修补路标：路标歪着，看着难受"
      - "岑回问：有用吗？"
      - "栖蓝答：别问有没有用。问了就做不下去了。"
      - "岑回想到：这也是一种对齐，但无回执无奖励"
      - "栖蓝补一句：没用不是事实。"

  - id: S07
    location: "薄墙巷口回望"
    event: "回望薄墙，克制不再按，继续既定路线"
    beats:
      - "薄墙沉默着，像在等下一次被按住"
      - "岑回把“别动”当规则，把备注当记录"
      - "路线还没走完"
