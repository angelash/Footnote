# CH06《纸背的风》场景分析（Phase 1）
# 参照：story/1.md L642-L709

metadata:
  chapter: 6
  title: 纸背的风
  part: "第1部：流程"
  status: completed
  scope:
    - "只允许使用本章原文内容，不得引入后续章事件/术语"

characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"
  mouping:
    name: 牧平
    gender: 男
    description: "中年亚洲男性，神情平静，不急不躁，坐在讲台边不使用麦克风，说话声音不大但字字清晰，像刻在纸上"
  young_man:
    name: "年轻人（礼堂听众）"
    gender: 男
    description: "20岁出头的亚洲男性，衣着朴素，语气随意但清醒，散场时递给岑回一张抄本"
  audience:
    name: "听众（若干）"
    gender: mixed
    description: "几个人坐在木椅上，有人低声提问，有人在抄写"

anchors:
  # 每章至少列 6-12 个“原文锚点短句”，用于对齐检查
  - "礼堂街的灯比别处暗一些"
  - "门口没有牌匾，只有一盏旧灯"
  - "尘土和纸的味道"
  - "木椅咯吱响"
  - "看见只是风"
  - "写入才是墨"
  - "墨多了，纸会裂"
  - "写得轻一点，也是种选择"
  - "折回去，折痕还在"
  - "至少纸不会自动更正"
  - "他现在只允许自己写备注"
  - "看 / 写 / 墨 / 折"

scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - id: S01
    location: "礼堂街：小礼堂门口"
    event: "进入礼堂：暗灯、旧灯、稳定的微光"
    beats:
      - "街灯更暗，影子有地方站着"
      - "小礼堂无牌匾，旧灯微弱却稳定"
      - "岑回推门进入"
  - id: S02
    location: "礼堂内：木椅与讲台边"
    event: "尘土与纸的味道；木椅的咯吱声；牧平开口"
    beats:
      - "尘土和纸味"
      - "木椅咯吱响，但不烦，反而安心"
      - "牧平坐在讲台边，没有麦克风"
  - id: S03
    location: "礼堂内：讲台边"
    event: "牧平讲述“风/墨/裂”与“写得轻”的选择"
    beats:
      - "牧平：看见只是风，写入才是墨"
      - "岑回想起薄墙回声与“空腔感明显”"
      - "牧平：墨多了，纸会裂"
      - "有人问：那怎么办？"
      - "牧平：写得轻一点，也是种选择"
  - id: S04
    location: "礼堂内：听众抄写"
    event: "抄本像祷文；“折回去，折痕还在”；岑回胸口发闷"
    beats:
      - "纸张翻动细碎"
      - "抄本短句像祷文又像提醒"
      - "牧平：折回去，折痕还在"
      - "折痕像证据，岑回胸口发闷"
  - id: S05
    location: "礼堂散场：门口/走廊"
    event: "年轻人递抄本：至少纸不会自动更正；纸粗糙毛刺"
    beats:
      - "年轻人：带着吧，没什么用"
      - "岑回：那为什么给我？"
      - "年轻人：至少纸不会自动更正"
      - "纸粗糙，边缘毛刺扎手却安心"
  - id: S06
    location: "礼堂外：夜风"
    event: "夜风很冷；“风一直都在”；岑回压下结论，只写备注"
    beats:
      - "走出礼堂，夜风吹来，很冷"
      - "风一直都在：有些纸承受不住，有些纸会变厚"
      - "他把这句话压下去：太像结论"
      - "他现在只允许自己写备注"
  - id: S07
    location: "插页：祷文抄本-02（A-12 变体）"
    event: "抄本内容与角落提示：看/写/墨/折"
    beats:
      - "看见是风 / 写入是墨 / 墨多纸裂 / 折痕不灭"
      - "注：写得轻，也是一种选择"
      - "角落轻点四个首字：看/写/墨/折"
