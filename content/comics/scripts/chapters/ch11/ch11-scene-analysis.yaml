# CH11《两份小票》场景分析（Phase 1）
# 参照：story/2.md L5-L62

metadata:
  chapter: 11
  title: 两份小票
  part: "第2部：残差"
  status: ready
  scope:
    - "只允许使用本章原文内容，不得引入后续章事件/术语"

characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"

anchors:
  # 每章至少列 6-12 个“原文锚点短句”，用于对齐检查
  - "风铃响了半下"
  - "老样子？"
  - "你昨天没来。"
  - "我昨天来过。"
  - "昨天是宋岚来拿的两份。你没出现。"
  - "固定套餐"
  - "已完成"
  - "这张不是昨天的。"
  - "这是今天的。"
  - "折痕无法当证据。"
  - "像有人把昨天删掉，把今天贴上去"
  - "你回来得更快了。"
  - "错觉也许只是残差的第一种形式。"
  - "栖蓝贴的地图还在。"
  - "能留下的东西，不一定是正确的；但能留下的东西，会成为下一次对齐的成本。"
  - "路线既定。"
  - "他第一次不敢保证：自己今天走的，是不是昨天走过的那条。"

scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - id: S01
    location: "早餐店门口 / 店内柜台"
    event: "岑回第二天早上再来早餐店；风铃尾音被削掉；点“老样子”"
    beats:
      - "岑回推门，风铃只响半下"
      - "店主笑：老样子？"
      - "岑回点头：老样子。"
  - id: S02
    location: "早餐店柜台"
    event: "店主指出岑回昨天没来；岑回坚持自己来过；店主说宋岚拿了两份"
    beats:
      - "店主补一句：你昨天没来"
      - "岑回：我昨天来过"
      - "店主：没有。昨天是宋岚来拿的两份。你没出现。"
      - "岑回摸到口袋里小票的折痕"
  - id: S03
    location: "早餐店柜台（小票特写）"
    event: "岑回掏出昨天的小票；小票写“固定套餐”并盖“已完成”；店主说这是今天的"
    beats:
      - "岑回掏出折起的小票递给店主"
      - "小票上：固定套餐；淡灰章：已完成"
      - "店主：这张不是昨天的。这是今天的。"
      - "小票底部小字显示“今天早上”的日期时间"
  - id: S04
    location: "早餐店门外 / 街边"
    event: "岑回翻看小票背面空白；折痕无法作证；拿到温热纸袋"
    beats:
      - "岑回翻到背面：空白"
      - "他意识到：折痕无法当证据"
      - "店主催促：拿着吧，后面有人"
      - "纸袋温热像嘲讽"
  - id: S05
    location: "街边"
    event: "岑回反复确认日期；像昨天被删，今天被贴上去；想起阿棠的话"
    beats:
      - "日期确实是今天"
      - "像有人把昨天删掉，把今天贴上去"
      - "想起阿棠：你回来得更快了"
      - "岑回怀疑：错觉也是残差"
  - id: S06
    location: "街口公告墙"
    event: "看见栖蓝贴的地图还在；明白“能留下的东西会成为成本”"
    beats:
      - "公告墙上，栖蓝贴的地图还在"
      - "胶带压得很平，边缘不卷"
      - "岑回明白：能留下的不一定正确，但会成为下一次对齐的成本"
  - id: S07
    location: "去维修局的路上"
    event: "沿既定路线走向维修局；路线既定但不敢保证是否同一条"
    beats:
      - "他握紧纸袋走向维修局"
      - "路线既定"
      - "他第一次不敢保证：今天走的是不是昨天走过的那条"
