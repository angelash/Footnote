    beats:
      - "终端直接弹出通知：请至纠偏中心提交补充说明。"
      - "岑回走到后楼：门口小牌子“纠偏”，走廊安静得像声音被压进表格。"

  - id: S02
    location: "纠偏中心小窗口"
    event: "年轻窗口员查询Q条目：结算延迟"
    pages:
      - P02
    beats:
      - "窗口后年轻人疲惫，问“编号”。岑回报：Q-██-17。"
      - "对方皱眉：你这条延迟很久。解释：结算延迟，同一条目出现互斥证据，需要排队。"

  - id: S03
    location: "纠偏中心小窗口"
    event: "回执打印：结算将延迟 / 解释成本上升"
    pages:
      - P03
    beats:
      - "年轻人递回执，岑回看见：结算将延迟。"
      - "回执小字：解释成本：上升。岑回追问：所以要我补充说明？"

  - id: S04
    location: "纠偏中心小窗口"
    event: "纸质证据不纳入结算，补充说明表字段化"
    pages:
      - P04
    beats:
      - "岑回摊开两张互斥日期的小票，年轻人眼睛一瞬睁大。"
      - "对方拒收：纸质证据不纳入结算，因为无法对齐/缺乏标准字段。"
      - "推来补充说明表：地点/时间/动作/结果，最后只有两行备注栏。"

  - id: S05
    location: "纠偏中心小窗口"
    event: "岑回填表自我对齐，只写最短一句"
    pages:
      - P05
    beats:
      - "岑回客观填写地点时间动作，像把自己变成可结算条目。"
      - "到“结果”栏停住，最终只写：出现延迟结算。"
      - "年轻人收表：记录已收，等待结算。队列很长，不确定多久。"

  - id: S06
    location: "纠偏中心走廊/出口"
    event: "走出纠偏中心，顾临出现"
    pages:
      - P06
    beats:
      - "岑回走出，灯更暗。身后有人叫他名字。"
      - "顾临出现，目光落在回执：你来纠偏中心了。"
      - "顾临点破：队列会越来越长。你做了复走，对吗？系统检测到了重复路径。"

  - id: S07
    location: "纠偏中心走廊"
    event: "延迟结算的解释与对峙：维护可读性"
    pages:
      - P07
    beats:
      - "岑回质问：系统说我没来过，为什么？顾临：这就是延迟结算。"
      - "岑回追问：你们维护什么？顾临：我们维护可读性，维护城市能继续运行。"
      - "顾临说：你已经被更新过一次。并给出两个选择。"

  - id: S08
    location: "插页文件/走廊深处"
    event: "两份文件插页 + 只读校准室"
    pages:
      - P08
    beats:
      - "插页：文件E-01《纠偏回执》：条目编号Q-██-17，状态待结算，原因互斥证据，结论结算将延迟，附注解释成本上升。"
      - "插页：文件E-02《补充说明表（空白模板）》：地点/时间/动作/结果，备注两行。"
      - "顾临：第二，跟我去校准室。只读，你只被允许看见。"
      - "岑回：带我去。两人走向走廊深处，灯光在背后变暗。"
