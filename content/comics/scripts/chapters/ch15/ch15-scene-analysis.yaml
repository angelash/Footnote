# CH15《只读》场景分析（Phase 1）
# 参照：story/2.md L522-L650

metadata:
  chapter: 15
  title: 只读
  part: "第2部：残差"
  status: draft
  scope:
    - "只允许使用本章原文内容，不得引入后续章事件/术语"

characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"
  gu_lin:
    name: 顾临
    gender: 男
    description: "维修局主管，男性，衣着整洁克制，语气温和但更硬，目光像在看一条难算的账"
  atang:
    name: 阿棠
    gender: 女
    description: "女性，瘦削，神情疲惫但清醒，眼神像不愿被抹平的残差，穿着偏旧的深色外套，坐姿像早就等在那里"

anchors:
  # 每章至少列 6-12 个“原文锚点短句”，用于对齐检查
  - "未经授权禁止进入。"
  - "你只看。"
  - "不碰。"
  - "这叫深度感知。"
  - "只读。"
  - "残差会进队列。"
  - "能力：深度感知（只读）"
  - "权限：观察"
  - "写入：禁用"
  - "你别把看见当成答案。"
  - "先记录。别急着解释。别急着写。"
  - "对象不存在 / 行为可执行"

scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - id: S01
    location: "维修局后楼 / 校准室门口"
    event: "进入校准室"
    pages:
      - P01
    beats:
      - "校准室的门很厚；门上只有提示牌“未经授权禁止进入。”"
      - "顾临刷卡，门锁低沉“咔”；岑回闻到冷金属与塑料的味道"

  - id: S02
    location: "校准室内"
    event: "看见模型与边界线"
    pages:
      - P02
    beats:
      - "室内很空；台面、透明盒子、白色模型（像缩小建筑），表面平整"
      - "顾临示意岑回站在淡灰色线内；提醒“你只看。不碰。”"

  - id: S03
    location: "校准室 / 台面"
    event: "模型显现骨架：深度感知（只读）"
    pages:
      - P03
    beats:
      - "顾临按按钮，盒内冷光亮起；岑回看见模型表面之下的线框骨架"
      - "顾临解释“这叫深度感知。只读。”"

  - id: S04
    location: "校准室 / 台面旁"
    event: "为什么给他：复走、残差、队列、对齐"
    pages:
      - P04
    beats:
      - "岑回问“你们早就能看见？”顾临只答“现在你也能。”"
      - "顾临说明：复走会制造残差，残差进队列拖慢维护，最终会触发更激烈的对齐"

  - id: S05
    location: "校准室 / 授权记录"
    event: "签署授权：观察可用、写入禁用；收回骨架与警告"
    pages:
      - P05
    beats:
      - "顾临递授权记录；纸很新但纤维粗；上面写“能力：深度感知（只读）/ 权限：观察 / 写入：禁用”"
      - "岑回签名；顾临按按钮，骨架收回；提醒“开得越多，越难回去”与“别把看见当成答案”"

  - id: S06
    location: "校准室外走廊"
    event: "离开后的冲动与克制：先记录"
    pages:
      - P06
    beats:
      - "岑回走出校准室，灯光刺眼；他看身份卡，想在深度里看它的骨架"
      - "他忍住；手指碰到差异卡，被边缘刮一下；提醒“先记录。别急着解释。别急着写。”"

  - id: S07
    location: "走廊尽头"
    event: "阿棠等候：只读很累"
    pages:
      - P07
    beats:
      - "走廊尽头阿棠坐着等；她说“你也签了。”岑回问“你怎么知道？”阿棠不答，只指向口袋"
      - "阿棠说“只读很累。”岑回问“你以前也是只读？”阿棠答“我一直都是。”"

  - id: S08
    location: "走廊 / 插页文件"
    event: "纸片与插页：对象不存在 / 行为可执行；以文件收束"
    pages:
      - P08
    beats:
      - "阿棠递撕得很急的纸片，两行字“对象不存在 / 行为可执行”；劝他“别急着合成一句”"
      - "岑回把纸片夹进差异卡后；插页呈现文件B-09授权记录与文件B-16纸片内容；旁白收束“能看见骨架”"
