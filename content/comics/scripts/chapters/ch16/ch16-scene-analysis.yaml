# CH16《骨架线》场景分析（Phase 1）
# 参照：story/2.md L651-L731

metadata:
  chapter: 16
  title: 骨架线
  part: "第2部：残差"
  status: draft
  scope:
    - "只允许使用本章原文内容，不得引入后续章事件/术语"

characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"

anchors:
  # 每章至少列 6-12 个“原文锚点短句”，用于对齐检查
  - "薄墙巷口比记忆里更白。"
  - "你开得越多，越难回去。"
  - "岑回还是开了。"
  - "线框，像骨架。"
  - "最刺眼的是那块空。"
  - "一个近乎矩形的轮廓，像门框的影子被压进墙里。"
  - "对象不存在 / 行为可执行。"
  - "只读 / 观察"
  - "建议：降低观察频率。"
  - "薄墙：空腔边界规则。"
  - "状态：正常（已更正）。"
  - "建议：降低观察频率"

scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - id: S01
    location: "薄墙巷口"
    event: "岑回到达巷口，回想校准室警告，决定开启深度感知"
    pages:
      - P01
    beats:
      - "薄墙巷口比记忆里更白，白得像闭眼后看到的白。"
      - "岑回摸到口袋里“授权记录”，更硬，像提醒：现在能看见，但也仅止于看见。"
      - "顾临的警告回响：你开得越多，越难回去。岑回还是开了。"

  - id: S02
    location: "薄墙巷口（深度视野开启）"
    event: "深度视野冷光出现，薄墙显出骨架线"
    pages:
      - P02
      - P03
    beats:
      - "终端屏幕亮起更冷的光，像把空气里的尘埃也照亮。"
      - "薄墙在普通视野里只是白漆和裂纹，在深度视野里出现线框，像骨架。"
      - "骨架线并不均匀，像被折过很多次的纸：有的密，有的稀，稀处空得发凉。"

  - id: S03
    location: "巷口正中（裂纹下方）"
    event: "骨架断开形成规则空腔边界，像门框影子"
    pages:
      - P04
    beats:
      - "最刺眼的是那块空：骨架突然断开一段，只剩边界。"
      - "边界近乎矩形，规矩得像门框的影子被压进墙里。"
      - "岑回想到阿棠纸片：对象不存在 / 行为可执行。"

  - id: S04
    location: "薄墙前（终端提示）"
    event: "终端提示只读/观察与降低观察频率"
    pages:
      - P05
    beats:
      - "岑回把终端凑近，想看更清楚。"
      - "屏幕边缘弹出：只读 / 观察。"
      - "更小一行闪得很快：建议：降低观察频率。"
      - "岑回太阳穴跳动，意识到深度视野像把神经拽去对齐结构。"

  - id: S05
    location: "矩形空腔边界（回声）"
    event: "墙里传来克制的“敲击”，岑回想伸手但克制"
    pages:
      - P06
    beats:
      - "墙里响起回声，像有人在矩形轮廓里轻轻敲了一下，提示“里面”有可敲的边界。"
      - "岑回手指伸向墙面，离一指远又停住。"
      - "他想起顾临的“别碰”，也想起宋岚的“别替它更正”。"

  - id: S06
    location: "巷口（差异卡记录）"
    event: "岑回把所见写入差异卡并自我修正措辞"
    pages:
      - P07
    beats:
      - "岑回把一切写进差异卡：“薄墙：深度骨架存在矩形空腔边界。”"
      - "他意识到写得太满，像在解释，于是把“矩形”划掉，改为更干的词：“薄墙：空腔边界规则。”"

  - id: S07
    location: "巷口（观测快照与系统覆盖）"
    event: "观测快照音变短，系统结论覆盖所见；岑回离开，刺扎在盲区"
    pages:
      - P08
    beats:
      - "岑回按下终端“观测快照”，提示音比以往更短，像被剪掉的尾音重新出现。"
      - "屏幕弹出系统结论：状态：正常（已更正）。"
      - "岑回觉得这不像撒谎，而像覆盖他刚才看见的骨架、门框念头。"
      - "他关掉深度视野离开，背后矩形空腔像细刺扎在盲区：看不见，但知道它在。"
