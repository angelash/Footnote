# CH18《告知书》场景分析（Phase 1）
# 参照：story/2.md L853-L970

metadata:
  chapter: 18
  title: 告知书
  part: "第2部：残差"
  status: draft
  scope:
    - "只允许使用本章原文内容，不得引入后续章事件/术语"

characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"
  xucheng:
    name: 许澄
    gender: 女
    description: "20多到30岁之间的亚洲女性医生，黑发利落（低马尾或盘起），眼神温和但坚定，穿白色医生外套或浅色医疗站制服，举止克制，语气很平"
  atang:
    name: 阿棠
    gender: 女
    description: "20多岁的亚洲女性，偏瘦，衣着随意偏旧，眼神游离但敏锐，常坐在角落，气质像被世界遗漏的人"

anchors:
  # 每章至少列 6-12 个“原文锚点短句”，用于对齐检查
  - "你看得更用力了。"
  - "《稳定疗程告知书（试行）》"
  - "纠偏队列太长了。"
  - "他们要降低解释成本。"
  - "对齐。把不一致压平。让人轻松一点。"
  - "代价是，你口袋里的那些纸，可能会变成空白。"
  - "轻松不是唯一目标。"
  - "不是为了改变流程。只是为了让它留下一个成本。"
  - "我希望你知道后果。"
  - "你选什么都不代表善恶。只代表你愿意承担哪种累。"
  - "你要是决定留下，就别偷懒。"
  - "你又多了一张。"
  - "太轻的人会消失得很快。"

scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - id: S01
    location: "医疗站诊室"
    event: "许澄先看岑回的眼睛，点破他“看得更用力了”"
    pages:
      - P01
    beats:
      - "许澄看见岑回进门时，第一反应不是问诊，而是看他的眼睛。"
      - "许澄说：“你看得更用力了。”"

  - id: S02
    location: "医疗站诊室"
    event: "告知书出现：降低解释成本"
    pages:
      - P02
    beats:
      - "许澄把一份薄薄的纸推过来：“先看这个。”"
      - "抬头： 《稳定疗程告知书（试行）》。纸比普通表格更厚。"
      - "许澄说：“纠偏队列太长了。他们要降低解释成本。”"

  - id: S03
    location: "医疗站诊室"
    event: "疗程解释：对齐；代价引出"
    pages:
      - P03
    beats:
      - "岑回问：“疗程是什么？”"
      - "许澄说：“对齐。把不一致压平。让人轻松一点。”"
      - "岑回问：“代价呢？”许澄沉默。"

  - id: S04
    location: "医疗站诊室"
    event: "代价直说 + 备注栏手写“轻松不是唯一目标”"
    pages:
      - P04
    beats:
      - "许澄说：“代价是，你口袋里的那些纸，可能会变成空白。”"
      - "她翻到背面备注栏，写： “轻松不是唯一目标。” 并轻轻划掉“唯一”。"
      - "许澄说：不是为了改变流程，只是为了让它留下一个成本。"

  - id: S05
    location: "候诊区与诊室"
    event: "为何做疗程：很多人撑不住；被抹掉也许是他们的一部分"
    pages:
      - P05
    beats:
      - "岑回想到备注栏只是能留下的最小伤口。"
      - "许澄看向候诊区角落：疲惫的人想把折痕磨平。"
      - "许澄说：很多人真的撑不住；对齐能救他们。"
      - "岑回问：“那被抹掉的部分呢？” 许澄答：“也许就是他们的一部分。”"

  - id: S06
    location: "医疗站诊室"
    event: "选择与后果：不代表善恶，只代表愿意承担哪种累（插页B-19）"
    pages:
      - P06
    beats:
      - "许澄说：你不用现在签；你可以不签；你也可以签。"
      - "岑回问：你希望我怎么选？"
      - "许澄说：我希望你知道后果；你选什么都不代表善恶；只代表你愿意承担哪种累。"

  - id: S07
    location: "医疗站诊室→门口"
    event: "岑回不签，把告知书夹进差异卡；许澄提醒“别偷懒”"
    pages:
      - P07
    beats:
      - "岑回低头看条款，背面手写像一粒沙卡在齿轮里。"
      - "岑回把告知书折好，没签，夹进差异卡后面。"
      - "许澄说：“你要是决定留下，就别偷懒。偷懒会让你误以为自己留了，其实只是被允许暂时没删。”"

  - id: S08
    location: "医疗站门口与室外"
    event: "阿棠的提醒：你又多了一张；太轻的人会消失得很快（插页A-15）"
    pages:
      - P08
    beats:
      - "离开医疗站时，阿棠坐在角落，说：“你又多了一张。”"
      - "阿棠说：我不数；我只知道，太轻的人会消失得很快。"
      - "岑回走出门，风声依旧轻，却不再让他安心：风背后有一整套账本。"
