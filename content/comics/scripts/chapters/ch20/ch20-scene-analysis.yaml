# CH20《同一处》场景分析（Phase 1）
# 参照：story/2.md L1062-L1162

metadata:
  chapter: 20
  title: 同一处
  part: "第2部：残差"
  status: draft
  scope:
    - "只允许使用本章原文内容，不得引入后续章事件/术语"

characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"
  resident_woman:
    name: 住户（中年女人）
    gender: 女
    description: "中年女性住户，提着菜篮子，穿着居住区日常衣物，神情疲惫但动作自然；在版本冲突面前先无感，后出现不确定与轻微请求"
  child:
    name: 小孩
    gender: 男
    description: "居住区小孩，跑得快，动作冲动不懂“版本”；在空地边缘被绊倒后追问“放着什么？”"

anchors:
  # 每章至少列 6-12 个“原文锚点短句”，用于对齐检查
  - "小院里那块空地很安静"
  - "安静得像专门用来放“被删掉的东西”。"
  - "《空椅事件-更正》：对象不存在，建议忽略。"
  - "他打开终端，开启深度视野。"
  - "四条椅腿、一个椅面、一个靠背。"
  - "椅子在深度里存在，在表层里不存在。"
  - "同一处，两个互斥状态同时成立。"
  - "篮子没有掉下去。"
  - "一个人坐在空气上"
  - "他突然绊了一下"
  - "住户出现“吞句”（后半句未说完）"
  - "同一处：对象存在/不存在同时成立。"
  - "空椅：表层无 / 深度有。"
  - "快照会进入终端…会把它变成条目"
  - "别把她也拖进队列。"
  - "抽屉里装的不是故事，是成本。"
  - "压下去只是延迟结算。"
  - "而延迟不是消失。"

scenes:
  # 每个 scene 对应一段可视化单元（可拆成漫画页）
  - id: S01
    location: "居住区东侧小院（傍晚）"
    event: "岑回回到小院，看见被删掉的空椅痕迹"
    pages:
      - P01
    beats:
      - "天快黑，小院空地异常安静，像专门用来放被删掉的东西。"
      - "栖蓝曾摆空椅处如今“什么都没有”，地面平整、椅脚印都淡了。"
      - "岑回想起系统文件《空椅事件-更正》：对象不存在，建议忽略。"

  - id: S02
    location: "空地边缘（岑回视角）"
    event: "开启深度视野：空椅骨架在深处浮现"
    pages:
      - P02
    beats:
      - "岑回打开终端，开启深度视野。"
      - "空地表层干净，但深处线条浮出：四条椅腿、椅面、靠背。"
      - "他关掉/再开：在两个版本之间来回切换，像站在裂缝上。"

  - id: S03
    location: "院门口到空地"
    event: "住户进来放菜篮：篮子稳稳停在“空地”上"
    pages:
      - P03
    beats:
      - "中年女人提菜篮进来，嘟囔“今天怎么这么冷”。"
      - "她把篮子放在空地上，篮子没有掉下去，像放在看不见的平面。"
      - "岑回关掉深度视野，看到篮子悬在离地几厘米的位置却很稳。"

  - id: S04
    location: "空地（版本冲突）"
    event: "住户坐下：普通视野里坐在空气上；深度里椅骨架托住重量"
    pages:
      - P04
    beats:
      - "女人顺势坐下，姿势自然，甚至挪臀找舒服。"
      - "普通视野：荒诞——人坐在空气上；衣料褶皱顺着“椅面”走。"
      - "深度视野：椅子骨架清楚托住她与篮子。"
      - "同一处：存在/不存在互斥状态同时成立。"

  - id: S05
    location: "空地边缘"
    event: "小孩跑来在边缘绊倒，住户抓住他并出现“吞句”"
    pages:
      - P05
    beats:
      - "小孩冲向空地追猫，跑到边缘突然绊一下扑前。"
      - "女人下意识抓住他，骂“慢点！这里放着——”后半句吞掉。"
      - "小孩问“放着什么？”女人搜索解释，最后说“没什么”。"

  - id: S06
    location: "空地旁（岑回独白）"
    event: "岑回理解对齐的具体性，写下差异卡两行"
    pages:
      - P06
    beats:
      - "岑回喉咙发痛，想起许澄“很多人撑不住”、牧平“让它多花一次力气”。"
      - "他明白对齐不是抽象伦理：具体到一把椅子，有人能坐、有人会绊、有人会吞句。"
      - "他掏出差异卡，写：同一处：对象存在/不存在同时成立。"
      - "又补：空椅：表层无 / 深度有。"

  - id: S07
    location: "终端前（岑回犹豫）"
    event: "岑回想拍快照又停住：快照会变条目，进队列，走向疗程"
    pages:
      - P07
    beats:
      - "岑回想拍观测快照，按下前停住。"
      - "快照会进入终端，终端会把它变成条目，条目进队列，队列会结算。"
      - "结算尽头可能是疗程：把椅子彻底抹平，或把所有人对齐到同一版本。"
      - "他不知道该希望哪一种，只确定这事实无法被“正常（已更正）”盖回去。"

  - id: S08
    location: "院门口/空地（收束）"
    event: "住户轻请求：别拖我进队列；岑回沉默点头；“成本”与插页B-20"
    pages:
      - P08
    beats:
      - "女人起身提篮，像从看不见的平面剥离；看岑回一眼：轻请求别把她也拖进队列。"
      - "岑回点头不说话；女人走得更轻：别踩得太重。"
      - "院子恢复干净的空，但岑回知道深处那把椅子还在某个版本里。"
      - "差异卡塞进口袋：口袋像越来越重的抽屉，抽屉里装的不是故事，是成本。"
      - "结尾：压下去只是延迟结算；延迟不是消失。"
      - "插页文件 B-20《空椅观测记录-02》（节选）"
