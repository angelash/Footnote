  title: 救援
  part: "第3部：写入"
  status: draft
  scope:
    - "只允许使用本章原文内容，不得引入后续章事件/术语"

characters:
  cenhui:
    name: 岑回
    gender: 男
    description: "20多岁的亚洲男性，黑色短发整齐干练，深邃疲倦但锐利的眼神，穿着灰色维修局工作服，胸口佩戴工号牌，身材中等偏瘦，气质克制沉稳"
  gulin:
    name: 顾临
    gender: 男
    description: "男性，维修局主管，穿着整洁深色制服，表情稳定克制，站在规则边缘，让别人承担跨线代价"
  jiaozhunyuan:
    name: 校准员
    gender: 未知
    description: "校准员，现场指挥与解释者"
  waiqin:
    name: 外勤
    gender: 未知
    description: "两名外勤，执行下探与救援"
  laoren:
    name: 老人
    gender: 男
    description: "背工具包的老人，靠栏杆喘气，脸色很白"
  zhongnianzhe:
    name: 中年人
    gender: 男
    description: "穿旧工服的中年人"

anchors:
  - "事故发生在傍晚。"
  - "救援请求。"
  - "坐标：边缘断口·西段。"
  - "条目：人员滞留。"
  - "状态：不可撤离。"
  - "断口西段，是那块方形阴影附近。"
  - "下去了。脚下那块地在表层是实的，在深度里是空的。"
  - "骨架线浮出来。"
  - "我们叫它‘回弹层’。"
  - "绳索下不去。绳子会在边缘处‘不成立’。"
  - "只写一小段边界，让绳子成立，让他能抓住。"
  - "有人吗——"
  - "介入（写入）"
  - "写入不可完全回滚。"
  - "世界的骨架线对他的手指产生了回应。"
  - "下！"
  - "介入保持"
  - "12s"
  - "介入结束。补丁痕迹已生成。"
  - "那就是补丁痕迹。"
  - "那就是他欠下的债。"
  - "字段：——"

scenes:
  - id: S01
    location: "维修局后门外（傍晚）"
    event: "终端警报：救援请求与断口西段"
    pages:
      - P01
    beats:
      - "事故发生在傍晚。岑回刚出维修局后门，终端震动，短促警报音。"
      - "屏幕弹出：救援请求；坐标：边缘断口·西段；条目：人员滞留；状态：不可撤离。"
      - "岑回心紧：断口西段在方形阴影附近，“正常（已更正）”盖得最勤。"

  - id: S02
    location: "封锁线现场"
    event: "人群与规则边缘的顾临"
    pages:
      - P02
    beats:
      - "封锁线前：校准员、两名外勤、旧工服中年人、背工具包老人。老人靠栏杆喘气，脸色白。"
      - "顾临也在，站得很近却没越过淡灰线。"
      - "岑回问：人在哪？"

  - id: S03
    location: "断口塌陷边缘"
    event: "表层实/深度空：空洞与回弹层"
    pages:
      - P03
    beats:
      - "校准员解释：脚下那块地表层实、深度空；踩下去那刻版本切了。"
      - "岑回开启深度视野：骨架线浮出，塌陷处像被剪掉：表层仍是地面，深度里规则空洞，边缘整齐像刀切；下方更深线条像通向被禁止路径。"
      - "校准员：人在夹层里，不是底也不是上，我们叫它回弹层；按流程走会被弹回来。"

  - id: S04
    location: "塌陷边缘与封锁线内"
    event: "绳子不成立：许可的用途与轻声呼喊"
    pages:
      - P04
    beats:
      - "外勤：绳索下不去，绳子在边缘处不成立；表层有，深度里断。"
      - "岑回看顾临：所以给我许可是因为这种事。顾临：只写一小段边界，让绳子成立，让他能抓住；然后马上撤，别写太多。"
      - "夹层里传来轻呼：有人吗—— 尾音断得像被削掉。"

  - id: S05
    location: "塌陷边缘（深度视野开启）"
    event: "第一次写入：介入（写入）按钮与细线让绳子成立"
    pages:
      - P05
    beats:
      - "岑回固定安全绳：表层稳，但深度里绳子穿过空洞边缘线条发虚像要断。"
      - "终端出现新按钮：介入（写入）；警告：写入不可完全回滚。"
      - "岑回按下：世界骨架线对手指回应；他只在空洞边缘写一条允许通过的细线，绳索线框立刻连续，不再发虚。"

  - id: S06
    location: "空洞边缘上方"
    event: "外勤下探：介入保持倒计时12s与头痛"
    pages:
      - P06
    beats:
      - "校准员大喊：下！外勤顺绳下去；线框身体穿过边缘没有被剪断。"
      - "岑回太阳穴剧痛：写入像把神经变成接口；每一笔都用自己承担解释成本。"
      - "岑回按住介入保持，屏幕倒计时：12s。"

  - id: S07
    location: "空洞边缘与地面"
    event: "抓住绳子与拉出：线框错位"
    pages:
      - P07
    beats:
      - "下面外勤喊：抓住绳子！夹层里急促呼吸与摩擦声；一只手出现在空洞边缘，深度里清楚抓住绳索承重。"
      - "外勤喊：拉！众人用力，像拉起夹在版本缝隙里的条目。"
      - "那人被拉出时身体线框轻微错位，像被两套版本挤压；落地蜷缩咳嗽，校准员盖毯。"

  - id: S08
    location: "封锁线旁与插页文件"
    event: "介入结束：补丁痕迹与欠下的债；插页C-02/C-03与字段：——"
    pages:
      - P08
    beats:
      - "岑回松开介入保持，倒计时剩2s；提示弹出：介入结束。补丁痕迹已生成。"
      - "岑回眼前黑一瞬，扶栏杆；顾临低声：做得轻。很好。"
      - "空洞线框边界多了一道极细痕：擦得掉墨，擦不掉压痕；那就是补丁痕迹，那就是他欠下的债。"
      - "插页：文件C-02《救援记录-01A（流程绕行）》模板（未采用）；文件C-03《救援记录-01B（写入）》：方式深度写入/结果已完成/归档状态待审查/提示写入将留下永久伤痕；末尾闪过后消失：字段：——"
