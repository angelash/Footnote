    location: "封锁线外侧"
    event: "陈匠看见“写入”：感觉到那条细线"
    pages:
      - P02
    beats:
      - "陈匠裹毯坐着，呼吸平稳，眼神很直：无怨无谢。"
      - "陈匠说：你刚才写了。岑回：你看见了？"
      - "陈匠：没看见，感觉到；像墙上划一道线，很细但够抓住。"

  - id: S03
    location: "封锁线外侧"
    event: "岑回拒绝英雄叙事：别忘代价"
    pages:
