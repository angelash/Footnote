  chenjiang:
    name: 陈匠
    gender: 男
    description: "被救出来的中年男性，裹着毯子坐在封锁线外侧，眼神很直，沉默克制，背着工具包/工具箱"
  gulin:
    name: 顾临
    gender: 男
    description: "维修局主管，站在规则边缘，话少但像风险评估"

anchors:
  - "被救出来的人叫陈匠。"
  - "我只是来修断口边缘的护栏，螺丝松了，我怕有人绊倒。"
  - "又一个栖蓝式的人：做无收益的维护，结果被版本吞进夹层。"
  - "你刚才写了。"
  - "我没看见。我感觉到。像有人在墙上划了一道线，线很细，但够我抓住。"
  - "英雄叙事会让人忘记代价。"
  - "一只小铁盒"
  - "一截旧灯芯"
  - "给你。"
  - "我以前修灯。"
  - "旧灯芯没用了，没人要。但我一直留着。"
  - "因为它能点亮一种不该被删掉的光。"
  - "牧平讲风，我讲火。其实都是一回事。"
  - "没用。"
  - "没用不是事实。没用只是删法。"
  - "你写得轻。轻得好。写得重，会裂。"
  - "那里那道补丁痕迹在表层几乎看不见，可在深度里会一直存在。"
  - "我还欠着。"
  - "欠着就对了。你要是不欠，就说明你其实没写进去。"
  - "风从断口吹来"
  - "连人也会被当作字段。"
  - "他刚刚写下的那一笔"
  - "插页｜文件 C-04"
  - "《旧灯芯（物品备注）》"
  - "物品：旧灯芯"
  - "来源：陈匠"
  - "状态：干燥 / 可燃"
  - "点亮它的人已不在记录里。"

