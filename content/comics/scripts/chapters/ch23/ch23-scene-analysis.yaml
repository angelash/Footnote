    beats:
      - "岑回沉默：不想把写入变成英雄叙事。"
      - "旁白：英雄叙事会让人忘记代价。"
      - "镜头回到岑回的手/口袋：写入后的沉重与克制。"

  - id: S04
    location: "封锁线外侧"
    event: "旧灯芯：小铁盒里的一截光"
    pages:
      - P04
    beats:
      - "陈匠从工具包摸出小铁盒，边缘磨亮；打开：一截旧灯芯，发黄松散但完整。"
      - "陈匠把灯芯递给岑回：给你。岑回：为什么给我？"
      - "灯芯很轻却很真实，像能点燃。"

  - id: S05
    location: "封锁线外侧"
    event: "“能点亮不该被删掉的光”：风与火"
    pages:
      - P05
    beats:
      - "陈匠：我以前修灯。旧灯芯没用，没人要，但我一直留着。"
      - "陈匠：因为它能点亮一种不该被删掉的光。"
      - "岑回：你说得像牧平。陈匠淡笑：牧平讲风，我讲火，其实一回事。"

  - id: S06
    location: "封锁线外侧"
    event: "“没用”与删法：暗河般的语言"
    pages:
      - P06
    beats:
      - "岑回问：这东西有什么用？陈匠看他：没用。"
      - "岑回心里一跳：栖蓝说过这句。"
      - "陈匠补充：没用不是事实。没用只是删法。"

  - id: S07
    location: "断口边缘/封锁线外侧"
    event: "写得轻就好：补丁痕迹是伤痕"
    pages:
      - P07
    beats:
      - "陈匠扣上铁盒：你写得轻。轻得好。写得重，会裂。"
      - "岑回望断口：补丁痕迹表层几乎看不见，但深度里一直存在；不是修复，是伤痕。"
      - "岑回低声：我还欠着。"

  - id: S08
    location: "断口现场与插页文件"
    event: "欠着与尺度维护：旧灯芯入袋；插页C-04"
    pages:
      - P08
    beats:
      - "陈匠点头：欠着就对了；不欠说明其实没写进去。"
      - "岑回把旧灯芯塞进口袋：轻，却像扎下小钉子；未来会用在不求收益的地方。"
      - "风从断口吹来，推着纸背、灯芯、补丁痕迹：持续稳定无情绪。"
      - "岑回明白：不是谁干的，是尺度维护逻辑；连人也会被当作字段；他刚写下那一笔让维护逻辑多花力气。"
      - "插页｜文件C-04《旧灯芯（物品备注）》：物品旧灯芯/来源陈匠/状态干燥可燃/备注：点亮它的人已不在记录里。"
