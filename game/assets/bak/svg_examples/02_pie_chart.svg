<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- 饼图示例 -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g transform="translate(100,100)" filter="url(#shadow)">
    <!-- 40% - 蓝色 -->
    <path d="M0,0 L0,-70 A70,70 0 0,1 66.57,-21.63 Z" fill="#2196F3"/>
    <!-- 30% - 绿色 -->
    <path d="M0,0 L66.57,-21.63 A70,70 0 0,1 21.63,66.57 Z" fill="#4CAF50"/>
    <!-- 20% - 橙色 -->
    <path d="M0,0 L21.63,66.57 A70,70 0 0,1 -56.57,40.98 Z" fill="#FF9800"/>
    <!-- 10% - 紫色 -->
    <path d="M0,0 L-56.57,40.98 A70,70 0 0,1 0,-70 Z" fill="#9C27B0"/>
  </g>
  
  <!-- 图例 -->
  <g transform="translate(200, 40)" font-family="Arial, sans-serif" font-size="12">
    <rect x="0" y="0" width="12" height="12" fill="#2196F3"/>
    <text x="18" y="10">技术 40%</text>
    
    <rect x="0" y="25" width="12" height="12" fill="#4CAF50"/>
    <text x="18" y="35">产品 30%</text>
    
    <rect x="0" y="50" width="12" height="12" fill="#FF9800"/>
    <text x="18" y="60">设计 20%</text>
    
    <rect x="0" y="75" width="12" height="12" fill="#9C27B0"/>
    <text x="18" y="85">运营 10%</text>
  </g>
</svg>

