# 《备注 / Footnote》环境音效配置
# 格式: YAML
# 状态: 待生成音频文件（配置先行）

# ==========================================
# 环境音效列表 (12个)
# ==========================================

ambience:
  # ------------------------------------------
  # 城市/日常
  # ------------------------------------------
  - id: amb_city_day
    name: "城市白天"
    file: assets/audio/ambience/amb_city_day.mp3
    description: |
      城市日常环境音
      内容: 远处人声、机械运转、偶尔脚步
      情绪: 日常、机械、有序
    duration: 60
    volume: 0.3
    loop: true
    fadeIn: 3000
    fadeOut: 2000
    tags: [city, day, outdoor]
    
  - id: amb_city_night
    name: "城市夜晚"
    file: assets/audio/ambience/amb_city_night.mp3
    description: |
      城市夜间环境音
      内容: 远处嗡鸣、稀疏脚步、偶尔灯光嗡嗡
      情绪: 安静、略微不安
    duration: 60
    volume: 0.25
    loop: true
    fadeIn: 3000
    fadeOut: 2000
    tags: [city, night, outdoor]
    
  # ------------------------------------------
  # 室内
  # ------------------------------------------
  - id: amb_indoor_office
    name: "室内办公"
    file: assets/audio/ambience/amb_indoor_office.mp3
    description: |
      维修局等室内办公环境
      内容: 空调声、键盘声、偶尔脚步
      情绪: 专业、机构感
    duration: 45
    volume: 0.25
    loop: true
    fadeIn: 2000
    fadeOut: 1500
    tags: [indoor, office, bureau]
    
  - id: amb_indoor_archive
    name: "档案室"
    file: assets/audio/ambience/amb_indoor_archive.mp3
    description: |
      档案室环境音
      内容: 纸张沙沙、偶尔翻页、老旧空调
      情绪: 安静、神秘、专注
    duration: 50
    volume: 0.2
    loop: true
    fadeIn: 2500
    fadeOut: 2000
    tags: [indoor, archive, quiet]
    
  - id: amb_indoor_medical
    name: "医疗站"
    file: assets/audio/ambience/amb_indoor_medical.mp3
    description: |
      医疗站/诊室环境
      内容: 仪器嗡鸣、偶尔滴答、消毒气味联想
      情绪: 临床、略带紧张
    duration: 40
    volume: 0.25
    loop: true
    fadeIn: 2000
    fadeOut: 1500
    tags: [indoor, medical, clinic]
    
  # ------------------------------------------
  # 异常区域
  # ------------------------------------------
  - id: amb_anomaly_zone
    name: "异常区域"
    file: assets/audio/ambience/amb_anomaly_zone.mp3
    description: |
      结构异常区域环境
      内容: 低频嗡鸣、偶尔裂响、空间扭曲感
      情绪: 不安、危险、扭曲
    duration: 55
    volume: 0.35
    loop: true
    fadeIn: 2000
    fadeOut: 1500
    tags: [anomaly, danger, distortion]
    
  - id: amb_collapse_area
    name: "坍塌区"
    file: assets/audio/ambience/amb_collapse_area.mp3
    description: |
      坍塌/断口区域
      内容: 碎石偶尔滚落、风声、结构吱嘎
      情绪: 危险、废墟、不稳定
    duration: 45
    volume: 0.3
    loop: true
    fadeIn: 1500
    fadeOut: 1500
    tags: [collapse, danger, ruin]
    
  # ------------------------------------------
  # 深度/时间异常
  # ------------------------------------------
  - id: amb_depth_active
    name: "深度感知中"
    file: assets/audio/ambience/amb_depth_active.mp3
    description: |
      深度感知激活时的环境层
      内容: 晶体共鸣、空间层叠、透视感
      情绪: 超然、看穿、认知扩展
    duration: 30
    volume: 0.3
    loop: true
    fadeIn: 500
    fadeOut: 500
    tags: [depth, perception, overlay]
    
  - id: amb_time_distortion
    name: "时间扭曲"
    file: assets/audio/ambience/amb_time_distortion.mp3
    description: |
      时间异常/干预时的环境层
      内容: 时钟滴答（不规则）、倒放采样、回响
      情绪: 扭曲、不连续、时间感错乱
    duration: 35
    volume: 0.35
    loop: true
    fadeIn: 800
    fadeOut: 800
    tags: [time, distortion, overlay]
    
  # ------------------------------------------
  # 特殊场景
  # ------------------------------------------
  - id: amb_drifter_area
    name: "漂移者聚集区"
    file: assets/audio/ambience/amb_drifter_area.mp3
    description: |
      漂移者聚集的区域
      内容: 模糊人声、记忆碎片回响、迷失感
      情绪: 迷茫、悲伤、碎片化
    duration: 50
    volume: 0.25
    loop: true
    fadeIn: 3000
    fadeOut: 2500
    tags: [drifter, memory, sad]
    
  - id: amb_prayer_hall
    name: "礼堂/祷告区"
    file: assets/audio/ambience/amb_prayer_hall.mp3
    description: |
      平面信徒祷告区域
      内容: 低沉吟唱、烛火声、庄严回响
      情绪: 庄重、信仰、平面
    duration: 55
    volume: 0.25
    loop: true
    fadeIn: 3000
    fadeOut: 2500
    tags: [prayer, faith, solemn]
    
  - id: amb_finale
    name: "终局空间"
    file: assets/audio/ambience/amb_finale.mp3
    description: |
      终章/对话空间
      内容: 深空嗡鸣、格式化声音、超越感
      情绪: 庄严、命运、超越人类尺度
    duration: 60
    volume: 0.35
    loop: true
    fadeIn: 4000
    fadeOut: 3000
    tags: [finale, transcendent, epic]

# ==========================================
# Zone-环境音映射
# ==========================================

zone_mapping:
  # 序章
  C0-Z1: amb_city_day
  C0-Z2: amb_indoor_office  # 薄墙屋内
  C0-Z3: amb_indoor_office
  C0-Z4: amb_drifter_area
  
  # 第一章
  C1-Z1: amb_indoor_archive
  C1-Z2: amb_indoor_archive
  C1-Z3: amb_indoor_medical
  C1-Z4: amb_indoor_medical
  C1-Z5: amb_city_night
  C1-Z6: amb_collapse_area
  
  # 第二章
  C2-Z1: amb_indoor_office
  # C2其他Zone根据类型配置
  
  # 终章
  CF-Z1: amb_finale
  CF-Z2: amb_finale
  CF-Z3: amb_finale

# ==========================================
# 层叠配置
# ==========================================

layering:
  # 深度感知时叠加
  depth_perception_overlay: amb_depth_active
  depth_perception_base_reduction: 0.5  # 基础环境音降低到50%
  
  # 时间干预时叠加
  time_intervention_overlay: amb_time_distortion
  time_intervention_base_reduction: 0.4
  
  # 最大同时播放环境音数量
  max_concurrent_layers: 2
