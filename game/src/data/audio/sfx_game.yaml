# 《备注 / Footnote》游戏音效配置
# 格式: YAML
# 状态: 待生成音频文件（配置先行）

# ==========================================
# 游戏音效列表 (20个)
# ==========================================

sfx_game:
  # ------------------------------------------
  # 能力系统
  # ------------------------------------------
  - id: sfx_depth_perception_activate
    name: "深度感知激活"
    file: assets/audio/sfx/game/sfx_depth_perception_activate.mp3
    description: |
      深度感知能力开启
      风格: 电子晶体音 + 空间展开感
    duration: 0.8
    volume: 0.6
    tags: [ability, depth, perception]
    
  - id: sfx_depth_perception_deactivate
    name: "深度感知关闭"
    file: assets/audio/sfx/game/sfx_depth_perception_deactivate.mp3
    description: "深度感知能力关闭"
    duration: 0.5
    volume: 0.5
    tags: [ability, depth, perception]
    
  - id: sfx_depth_intervention
    name: "深度介入"
    file: assets/audio/sfx/game/sfx_depth_intervention.mp3
    description: |
      深度介入能力使用
      风格: 结构撕裂 + 能量释放
    duration: 1.2
    volume: 0.7
    tags: [ability, depth, intervention]
    
  - id: sfx_scar_create
    name: "伤痕产生"
    file: assets/audio/sfx/game/sfx_scar_create.mp3
    description: "深度介入后留下伤痕"
    duration: 0.6
    volume: 0.55
    tags: [scar, damage, consequence]
    
  - id: sfx_time_intervention
    name: "时间干预"
    file: assets/audio/sfx/game/sfx_time_intervention.mp3
    description: |
      时间干预能力使用
      风格: 倒放 + 时钟齿轮 + 扭曲
    duration: 1.5
    volume: 0.7
    tags: [ability, time, intervention]
    
  - id: sfx_time_contamination
    name: "时间污染"
    file: assets/audio/sfx/game/sfx_time_contamination.mp3
    description: "时间干预后产生污染"
    duration: 0.8
    volume: 0.6
    tags: [time, contamination, consequence]
    
  # ------------------------------------------
  # 系统反馈
  # ------------------------------------------
  - id: sfx_system_correct
    name: "系统更正"
    file: assets/audio/sfx/game/sfx_system_correct.mp3
    description: |
      收敛运行时更正
      风格: 数据处理 + 轻微电流
    duration: 0.4
    volume: 0.45
    tags: [system, correct, align]
    
  - id: sfx_system_align
    name: "对齐完成"
    file: assets/audio/sfx/game/sfx_system_align.mp3
    description: "系统完成对齐操作"
    duration: 0.5
    volume: 0.5
    tags: [system, align]
    
  - id: sfx_system_warning
    name: "系统警告"
    file: assets/audio/sfx/game/sfx_system_warning.mp3
    description: "系统发出警告信号"
    duration: 0.6
    volume: 0.6
    tags: [system, warning]
    
  - id: sfx_field_new
    name: "新字段出现"
    file: assets/audio/sfx/game/sfx_field_new.mp3
    description: |
      终局时新字段被创建
      风格: 神秘 + 突破感
    duration: 1.0
    volume: 0.7
    tags: [field, new, breakthrough]
    
  # ------------------------------------------
  # 交互音效
  # ------------------------------------------
  - id: sfx_interact
    name: "交互"
    file: assets/audio/sfx/game/sfx_interact.mp3
    description: "与物体/NPC交互"
    duration: 0.2
    volume: 0.4
    tags: [interact, object]
    
  - id: sfx_door_open
    name: "门打开"
    file: assets/audio/sfx/game/sfx_door_open.mp3
    description: "打开门"
    duration: 0.5
    volume: 0.5
    tags: [door, open]
    
  - id: sfx_zone_enter
    name: "进入区域"
    file: assets/audio/sfx/game/sfx_zone_enter.mp3
    description: "切换到新Zone"
    duration: 0.6
    volume: 0.5
    tags: [zone, enter, transition]
    
  - id: sfx_item_pickup
    name: "拾取物品"
    file: assets/audio/sfx/game/sfx_item_pickup.mp3
    description: "获得道具"
    duration: 0.3
    volume: 0.5
    tags: [item, pickup]
    
  # ------------------------------------------
  # 漂移/异常
  # ------------------------------------------
  - id: sfx_drift
    name: "漂移发生"
    file: assets/audio/sfx/game/sfx_drift.mp3
    description: |
      记忆/状态漂移
      风格: 失真 + 碎片化
    duration: 0.7
    volume: 0.55
    tags: [drift, anomaly]
    
  - id: sfx_memory_fragment
    name: "记忆碎片"
    file: assets/audio/sfx/game/sfx_memory_fragment.mp3
    description: "获得或触发记忆碎片"
    duration: 0.8
    volume: 0.5
    tags: [memory, fragment]
    
  # ------------------------------------------
  # 环境交互
  # ------------------------------------------
  - id: sfx_crack
    name: "裂缝"
    file: assets/audio/sfx/game/sfx_crack.mp3
    description: "结构裂缝发声"
    duration: 0.4
    volume: 0.45
    tags: [crack, structure]
    
  - id: sfx_collapse
    name: "坍塌"
    file: assets/audio/sfx/game/sfx_collapse.mp3
    description: "结构坍塌"
    duration: 1.0
    volume: 0.7
    tags: [collapse, danger]
    
  # ------------------------------------------
  # 特殊音效
  # ------------------------------------------
  - id: sfx_foreshadow_trigger
    name: "伏笔触发"
    file: assets/audio/sfx/game/sfx_foreshadow_trigger.mp3
    description: |
      伏笔被激活/回收
      风格: 微妙的认知提示
    duration: 0.5
    volume: 0.4
    tags: [foreshadow, trigger]
    
  - id: sfx_r_increment
    name: "R值增加"
    file: assets/audio/sfx/game/sfx_r_increment.mp3
    description: |
      无收益残差累积
      风格: 微弱但坚定的音调
    duration: 0.3
    volume: 0.3
    tags: [counter, r, increment]

# ==========================================
# 音效组配置
# ==========================================

groups:
  ability:
    - sfx_depth_perception_activate
    - sfx_depth_perception_deactivate
    - sfx_depth_intervention
    - sfx_scar_create
    - sfx_time_intervention
    - sfx_time_contamination
    
  system:
    - sfx_system_correct
    - sfx_system_align
    - sfx_system_warning
    - sfx_field_new
    
  interaction:
    - sfx_interact
    - sfx_door_open
    - sfx_zone_enter
    - sfx_item_pickup
    
  anomaly:
    - sfx_drift
    - sfx_memory_fragment
    - sfx_crack
    - sfx_collapse
    
  special:
    - sfx_foreshadow_trigger
    - sfx_r_increment
