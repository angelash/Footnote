# 《备注 / Footnote》UI音效配置
# 格式: YAML
# 状态: 待生成音频文件（配置先行）

# ==========================================
# UI音效列表 (18个)
# ==========================================

sfx_ui:
  # ------------------------------------------
  # 基础交互
  # ------------------------------------------
  - id: sfx_button_hover
    name: "按钮悬停"
    file: assets/audio/sfx/ui/sfx_button_hover.mp3
    description: "鼠标悬停在按钮上"
    duration: 0.1
    volume: 0.3
    tags: [button, hover]
    
  - id: sfx_button_click
    name: "按钮点击"
    file: assets/audio/sfx/ui/sfx_button_click.mp3
    description: "点击按钮确认"
    duration: 0.15
    volume: 0.5
    tags: [button, click, confirm]
    
  - id: sfx_button_back
    name: "返回/取消"
    file: assets/audio/sfx/ui/sfx_button_back.mp3
    description: "返回上一级或取消操作"
    duration: 0.2
    volume: 0.4
    tags: [button, back, cancel]
    
  # ------------------------------------------
  # 菜单/面板
  # ------------------------------------------
  - id: sfx_menu_open
    name: "菜单打开"
    file: assets/audio/sfx/ui/sfx_menu_open.mp3
    description: "打开菜单面板"
    duration: 0.3
    volume: 0.4
    tags: [menu, open, panel]
    
  - id: sfx_menu_close
    name: "菜单关闭"
    file: assets/audio/sfx/ui/sfx_menu_close.mp3
    description: "关闭菜单面板"
    duration: 0.25
    volume: 0.35
    tags: [menu, close, panel]
    
  # ------------------------------------------
  # 对话系统
  # ------------------------------------------
  - id: sfx_dialogue_appear
    name: "对话框出现"
    file: assets/audio/sfx/ui/sfx_dialogue_appear.mp3
    description: "对话框弹出"
    duration: 0.2
    volume: 0.4
    tags: [dialogue, appear]
    
  - id: sfx_dialogue_text
    name: "文字打字"
    file: assets/audio/sfx/ui/sfx_dialogue_text.mp3
    description: "文字逐字出现的打字音（循环短音）"
    duration: 0.05
    volume: 0.2
    loop: true
    tags: [dialogue, text, typing]
    
  - id: sfx_dialogue_complete
    name: "对话完成"
    file: assets/audio/sfx/ui/sfx_dialogue_complete.mp3
    description: "一段对话文字显示完成"
    duration: 0.1
    volume: 0.3
    tags: [dialogue, complete]
    
  - id: sfx_choice_appear
    name: "选项出现"
    file: assets/audio/sfx/ui/sfx_choice_appear.mp3
    description: "对话选项展开"
    duration: 0.25
    volume: 0.4
    tags: [choice, appear]
    
  - id: sfx_choice_select
    name: "选项选择"
    file: assets/audio/sfx/ui/sfx_choice_select.mp3
    description: "确认选择对话选项"
    duration: 0.2
    volume: 0.5
    tags: [choice, select, confirm]
    
  # ------------------------------------------
  # 卡片系统
  # ------------------------------------------
  - id: sfx_card_get
    name: "卡片获取"
    file: assets/audio/sfx/ui/sfx_card_get.mp3
    description: "获得新卡片"
    duration: 0.5
    volume: 0.6
    tags: [card, get, reward]
    
  - id: sfx_card_flip
    name: "卡片翻转"
    file: assets/audio/sfx/ui/sfx_card_flip.mp3
    description: "长按查看卡片详情"
    duration: 0.3
    volume: 0.4
    tags: [card, flip, detail]
    
  - id: sfx_card_archive
    name: "卡片归档"
    file: assets/audio/sfx/ui/sfx_card_archive.mp3
    description: "卡片放入收藏"
    duration: 0.25
    volume: 0.35
    tags: [card, archive]
    
  # ------------------------------------------
  # 存档系统
  # ------------------------------------------
  - id: sfx_save
    name: "存档"
    file: assets/audio/sfx/ui/sfx_save.mp3
    description: "游戏保存成功"
    duration: 0.4
    volume: 0.5
    tags: [save, success]
    
  - id: sfx_load
    name: "读档"
    file: assets/audio/sfx/ui/sfx_load.mp3
    description: "加载存档"
    duration: 0.5
    volume: 0.5
    tags: [load]
    
  # ------------------------------------------
  # 通知/提示
  # ------------------------------------------
  - id: sfx_notification
    name: "通知提示"
    file: assets/audio/sfx/ui/sfx_notification.mp3
    description: "一般通知弹出"
    duration: 0.3
    volume: 0.45
    tags: [notification, info]
    
  - id: sfx_warning
    name: "警告提示"
    file: assets/audio/sfx/ui/sfx_warning.mp3
    description: "警告或危险提示"
    duration: 0.35
    volume: 0.55
    tags: [warning, danger]
    
  - id: sfx_error
    name: "错误提示"
    file: assets/audio/sfx/ui/sfx_error.mp3
    description: "操作失败或错误"
    duration: 0.25
    volume: 0.5
    tags: [error, fail]

# ==========================================
# 音效组配置
# ==========================================

groups:
  button:
    - sfx_button_hover
    - sfx_button_click
    - sfx_button_back
    
  dialogue:
    - sfx_dialogue_appear
    - sfx_dialogue_text
    - sfx_dialogue_complete
    - sfx_choice_appear
    - sfx_choice_select
    
  card:
    - sfx_card_get
    - sfx_card_flip
    - sfx_card_archive
    
  system:
    - sfx_save
    - sfx_load
    - sfx_notification
    - sfx_warning
    - sfx_error
