# C0-Z1 宿舍走廊 对话数据
# 序章第一个Zone的所有对话

dialogues:
  # ==================== 开场独白 ====================
  CENHUI_MONO_01:
    id: CENHUI_MONO_01
    speaker: 岑回
    text: 先按流程走。
    expression: neutral
    next: CENHUI_MONO_02

  CENHUI_MONO_02:
    id: CENHUI_MONO_02
    speaker: 岑回
    text: 七点二十，出门前检查。
    expression: thinking
    next: CENHUI_MONO_03

  CENHUI_MONO_03:
    id: CENHUI_MONO_03
    speaker: 岑回
    text: 身份卡、通讯器、维修工具包。
    expression: neutral
    next: null
    # 不再自动给卡片，改为点击场景物品获取

  # ==================== 身份卡交互 ====================
  # 首次拾取身份卡
  C0Z1_IDENTITY_PICKUP:
    id: C0Z1_IDENTITY_PICKUP
    lines:
      - speaker: 岑回
        text: （拿起身份卡）
      - speaker: ""
        text: 维修局外勤身份凭证。持卡人：岑回。编号：EX-7749。
    onComplete:
      - type: card
        cardId: CARD_C0_IDENTITY
      - type: flag
        flagName: FLAG_C0Z1_GOT_IDENTITY
        flagValue: true

  # 已获得后再次点击
  C0Z1_IDENTITY_EXAMINE_DONE:
    id: C0Z1_IDENTITY_EXAMINE_DONE
    lines:
      - speaker: 岑回
        text: 身份卡已经在手上了。

  # ==================== 公告板交互 ====================
  NOTICE_BOARD_LOOK:
    id: NOTICE_BOARD_LOOK
    speaker: 岑回
    text: 公告板上贴满了通知，日期处有涂改痕迹...
    expression: curious
    next: NOTICE_BOARD_DETAIL

  NOTICE_BOARD_DETAIL:
    id: NOTICE_BOARD_DETAIL
    speaker: 岑回
    text: 「本周维修配额：17件」「严禁私自保留异常物件」
    expression: thinking
    next: NOTICE_BOARD_CHOICE
    
  NOTICE_BOARD_CHOICE:
    id: NOTICE_BOARD_CHOICE
    speaker: 系统
    text: 是否仔细查看日期涂改处？
    choices:
      - label: 仔细查看
        next: NOTICE_BOARD_EXAMINE
        effect:
          r: 1
      - label: 算了，不重要
        next: null

  NOTICE_BOARD_EXAMINE:
    id: NOTICE_BOARD_EXAMINE
    speaker: 岑回
    text: 涂改下面隐约能看到「第274周期」的字样...但现在显示的是「第275周期」。
    expression: surprised
    next: NOTICE_BOARD_EXAMINE_2
    trigger:
      foreshadow: [F02, plant]
      flags:
        - name: FLAG_C0Z1_NOTICE_EXAMINED
          value: true

  # 公告板（已查看过涂改痕迹）- 此对话不再单独设置 flag，因为 NOTICE_BOARD_EXAMINE 已设置
  NOTICE_BOARD_EXAMINED:
    id: NOTICE_BOARD_EXAMINED
    speaker: 岑回
    text: 公告板上的涂改痕迹……第274周期的字样隐约可见。
    expression: thinking
    next: null

  NOTICE_BOARD_EXAMINE_2:
    id: NOTICE_BOARD_EXAMINE_2
    speaker: 岑回
    text: 周期变更？维修局从不提这种事。
    expression: thinking
    next: null

  # 已检查过公告板后的对话
  NOTICE_BOARD_DONE:
    id: NOTICE_BOARD_DONE
    speaker: 岑回
    text: 公告板上的涂改痕迹...第274周期被改成了第275周期。
    expression: thinking
    next: null

  # ==================== 储物柜交互 ====================
  C0Z1_STORAGE:
    id: C0Z1_STORAGE
    lines:
      - speaker: 岑回
        text: 工具包已经准备好了。标准配置，和每天一样。
      - speaker: 岑回
        text: 早餐券也在这里……
      - speaker: 岑回
        text: 还有今天的工单。
    onComplete:
      - type: card
        cardId: CARD_C0_MEAL_TICKET
      - type: card
        cardId: CARD_C0_WORK_ORDER
      - type: flag
        flagName: FLAG_C0Z1_GOT_TOOLS
        flagValue: true

  # 已经取过工具的情况
  C0Z1_STORAGE_DONE:
    id: C0Z1_STORAGE_DONE
    lines:
      - speaker: 岑回
        text: 工具包已经取过了。

  # ==================== 邻居交互 ====================
  NEIGHBOR_DOOR_KNOCK:
    id: NEIGHBOR_DOOR_KNOCK
    speaker: 系统
    text: 邻居的门紧闭着，门上有一个褪色的号码牌。
    next: NEIGHBOR_DOOR_KNOCK_2

  NEIGHBOR_DOOR_KNOCK_2:
    id: NEIGHBOR_DOOR_KNOCK_2
    speaker: 岑回
    text: 103号？不对，我记得这里应该是102号……
    expression: confused
    next: null

  # ==================== 身份卡长按细节（F06伏笔）====================
  C0Z1_IDENTITY_DETAIL:
    id: C0Z1_IDENTITY_DETAIL
    lines:
      - speaker: 岑回
        text: （仔细查看身份卡背面……）
      - speaker: ""
        text: 生效日下方有一行极淡的小字。
      - speaker: ""
        text: 「更正：03/17 → 03/16」
        delay: 500
      - speaker: 岑回
        text: 什么时候改的？我怎么不记得……
        expression: confused
    onComplete:
      - type: foreshadow
        foreshadowId: F06
        foreshadowStage: plant
      - type: flag
        flagName: FLAG_SEEN_IDENTITY_CORRECTION
        flagValue: true

  # ==================== 祷词台交互 ====================
  C0Z1_PRAYER_BOARD:
    id: C0Z1_PRAYER_BOARD
    lines:
      - speaker: ""
        text: 墙上贴着一张晨间祷词，边角已经泛黄。
      - speaker: 岑回
        text: 「平面永恒，收敛是福」……每天都要念的。
    choices:
      - id: take_prayer
        text: 取下祷词
        effects:
          setFlag:
            name: FLAG_C0Z1_GOT_PRAYER
            value: true
          giveCard: CARD_C0_MORNING_PRAYER
        nextDialogueId: C0Z1_PRAYER_TAKEN
      - id: leave_prayer
        text: 算了
        nextDialogueId: null

  C0Z1_PRAYER_TAKEN:
    id: C0Z1_PRAYER_TAKEN
    lines:
      - speaker: 岑回
        text: （收好了祷词）
      - speaker: 岑回
        text: 背面有人用铅笔写了两个字：「真的吗？」

  C0Z1_PRAYER_BOARD_DONE:
    id: C0Z1_PRAYER_BOARD_DONE
    lines:
      - speaker: 岑回
        text: 祷词台空了。我已经取走了那张祷词。

