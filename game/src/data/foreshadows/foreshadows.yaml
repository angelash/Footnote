  # ==================== F11: 字段空白闪现 ====================
  F11:
    id: F11
    name: 字段空白闪现
    description: 第三层显影方式：格式不是给人看的
    stages:
      plant:
        zone: C3-Z2
        description: 救援记录B版出现"字段：——"
      deepen:
        zone: C5-Z2
        description: 纠偏回执半字段表
      mislead:
        zone: C5-Z4
        description: 玩家以为是外星人/神秘组织在写日志
      reveal:
        zone: CF-Z3
        description: 字段接受回执（字段◦◦◦固定）

  # ==================== F12: 自相似/表示痕迹 ====================
  F12:
    id: F12
    name: 自相似表示痕迹
    description: 表示格式的投影残留
    stages:
      plant:
        zone: C2-Z3
        description: 楼梯间地图差异
      deepen:
        zone: C5-Z1
        description: 版本冲突现场滑动对比卡
      mislead:
        zone: C5-Z3
        description: 玩家以为是迷宫彩蛋
      reveal:
        zone: CF-Z3
        description: 格式坠落时，提示语从句子变成标签

  # ==================== F13: 补丁一致性 ====================
  F13:
    id: F13
    name: 补丁一致性
    description: 自洽代价的可视化（不可归因）
    stages:
      plant:
        zone: C4-Z2
        description: 演示回溯桌角擦痕
      deepen:
        zone: C4-Z3
        description: 强制回溯后墙面补丁标记
      mislead:
        zone: C4-Z5
        description: 玩家以为系统在惩罚你
      reveal:
        zone: CF-Z4
        description: 补丁不再被视为错误，纳入字段可承载的现象

  # ==================== F14: 编号/刻度点 ====================
  F14:
    id: F14
    name: 编号刻度点
    description: 对账序列在低维的伪装输出
    stages:
      plant:
        zone: C3-Z5
        description: 病例卡-01编号空块
      deepen:
        zone: C4-Z4
        description: 病例卡-02刻度点与节点卡一致
      mislead:
        zone: C5-Z1
        description: 玩家以为是单纯UI风格
      reveal:
        zone: CF-Z3
        description: 字段刻度板（玩家亲手点出◦◦◦）

  # ==================== F15: 祷文首字链 ====================
  F15:
    id: F15
    name: 祷文首字链
    description: 用隐喻绕开"危险知识判定"的传播方式
    stages:
      plant:
        zone: C1-Z5
        description: 祷文抄本-01首次出现
      deepen:
        zone: C5-Z4
        description: 祷文抄本-04更接近模型词碎片
      mislead:
        zone: C5-Z5
        description: 玩家以为是宗教彩蛋
      reveal:
        zone: CF-Z6
        description: 祷文拼读结果"字段已接受"

