# 伏笔系统数据
# 包含所有需要追踪的伏笔及其触发条件
# 阶段命名统一：plant(投放) / deepen(加深) / mislead(误读) / reveal(回收)

foreshadows:
  # ==================== F01: 薄墙回声 ====================
  F01:
    id: F01
    name: 薄墙回声
    description: 长按墙听回声，表示压缩造成的结构空腔残留
    stages:
      plant:
        zone: C0-Z3
        description: 长按墙听回声
      deepen:
        zone: C2-Z2
        description: 深度感知看到空腔线框
      mislead:
        zone: C3-Z1
        description: 玩家以为有人藏在墙里
      reveal:
        zone: CF-Z3
        description: 字段接受后，部分空腔不再被更正抹平

  # ==================== F02: 门牌与面积不符 ====================
  F02:
    id: F02
    name: 门牌与面积不符
    description: 表象编号与深度结构对不齐（表示守恒断裂）
    stages:
      plant:
        zone: C1-Z2
        description: 纯2D解谜发现门牌不对
      deepen:
        zone: C3-Z2
        description: 不存在的房间可进入
      mislead:
        zone: C4-Z1
        description: 玩家以为是机关/异次元阴谋
      reveal:
        zone: C5-Z1
        description: 版本冲突时理解：这是互斥版本

  # ==================== F03: 系统提示自我更正 ====================
  F03:
    id: F03
    name: 系统提示自我更正
    description: 收敛运行时在压缩解释成本，自动覆盖表象文本
    stages:
      plant:
        zone: C0-Z1
        description: 公告板闪现"已更正"
      deepen:
        zone: C2-Z1
        description: 授权记录出现"已更正"
      mislead:
        zone: C3-Z3
        description: 玩家以为是某个人在后台改字
      reveal:
        zone: C5-Z6
        description: 审计覆盖区提示语变成结算字段

  # ==================== F04: NPC叙述互斥 ====================
  F04:
    id: F04
    name: NPC叙述互斥
    description: 因果对账导致记忆漂移与版本切换
    stages:
      plant:
        zone: C1-Z2
        description: 问路时NPC说法矛盾
      deepen:
        zone: C4-Z1
        description: 灾后重访"昨天你来过/你没来过"
      mislead:
        zone: C4-Z2
        description: 玩家以为NPC在撒谎
      reveal:
        zone: C4-Z3
        description: 强制回溯后，同一NPC对补丁痕迹描述一致

  # ==================== F05: 无奖励支线 ====================
  F05:
    id: F05
    name: 无奖励支线
    description: 这些行为就是R（无收益残差）的结构来源
    stages:
      plant:
        zone: C2-Z4
        description: 路标修补完成，无可用收益
      deepen:
        zone: C3-Z4
        description: 空椅、贴地图等行为
      mislead:
        zone: C4-Z6
        description: 玩家以为作者故意不给奖励
      reveal:
        zone: C5-Z7
        description: F21判词触发，理解R的意义

  # ==================== F06: 身份卡日期更正 ====================
  F06:
    id: F06
    name: 身份卡日期更正
    description: 岑回作为运行时接口，人生片段可拼接以维持可读性
    stages:
      plant:
        zone: C0-Z1
        description: 身份卡细节页出现"更正"
      deepen:
        zone: C2-Z5
        description: 个人档案页逐渐字段化
      mislead:
        zone: C3-Z5
        description: 玩家以为主角失忆/阴谋实验体
      reveal:
        zone: CF-Z6
        description: 结局C"承载字段"时，档案变为字段表

  # ==================== F07: 顾临口癖 ====================
  F07:
    id: F07
    name: 顾临口癖
    description: 他是收敛主义的人类代表样本
    stages:
      plant:
        zone: C0-Z4
        description: "城市不需要更多复杂度"
      deepen:
        zone: C4-Z8
        description: "还能继续被读下去"
      mislead:
        zone: C5-Z2
        description: 玩家以为他在替阴谋说话
      reveal:
        zone: CF-Z6
        description: 顾临承认"读不下去的东西也能留下"

  # ==================== F08-F10: 预留位 ====================
  F08:
    id: F08
    name: 预留伏笔08
    description: 预留位，用于后续扩展
    stages:
      plant:
        zone: TBD
        description: 待定义
      deepen:
        zone: TBD
        description: 待定义
      reveal:
        zone: TBD
        description: 待定义

  F09:
    id: F09
    name: 预留伏笔09
    description: 预留位，用于后续扩展
    stages:
      plant:
        zone: TBD
        description: 待定义
      deepen:
        zone: TBD
        description: 待定义
      reveal:
        zone: TBD
        description: 待定义

