  # ==================== F21: 判词无意义 ====================
  F21:
    id: F21
    name: 判词无意义
    description: 模型无法解释无收益残差，只能判无意义
    stages:
      plant:
        zone: C5-Z7
        description: 玩家完成无收益微任务触发判词
      deepen:
        zone: CF-Z2
        description: 系统改成"条目：不可结算。已保留。"
      mislead:
        zone: CF-Z1
        description: 玩家以为系统在羞辱玩家
      reveal:
        zone: CF-Z3
        description: 玩家定义字段，系统说"字段已接受"

  # ==================== F22: 冗余信息不可关闭 ====================
  F22:
    id: F22
    name: 冗余信息不可关闭
    description: 抽象层级坠落，系统不得不保留新字段占位
    stages:
      plant:
        zone: C5-Z6
        description: 离开审计覆盖区时短暂残留提示条
      deepen:
        zone: CF-Z1
        description: 底部冗余字段条永久存在
      mislead:
        zone: CF-Z2
        description: 玩家以为是bug/界面坏了
      reveal:
        zone: CF-Z3
        description: 字段条可点击并被接受

  # ==================== F23: 非最优解被保存 ====================
  F23:
    id: F23
    name: 非最优解被保存
    description: 字段接受后，"多余"获得合法性
    stages:
      plant:
        zone: C3-Z4
        description: 空椅子作为情感锚
      deepen:
        zone: C5-Z5
        description: 椅子消失→占位→R高时短暂实体显影
      mislead:
        zone: CF-Z1
        description: 玩家以为是支线彩蛋物件
      reveal:
        zone: CF-Z4
        description: 系统首次说"条目：保留。"

  # ==================== F24: 解释成本语义漂移 ====================
  F24:
    id: F24
    name: 解释成本语义漂移
    description: 玩家理解"意义=解释成本=模型参数"
    stages:
      plant:
        zone: C2-Z1
        description: 早期像行政话术（授权、顾临提醒）
      deepen:
        zone: C4-Z1
        description: 变成警告（权限收紧）
      mislead:
        zone: C5-Z1
        description: 玩家以为是官僚用语
      reveal:
        zone: CF-Z3
        description: 变成无法回避的代价（字段接受回执）

  # ==================== F25: 对象不存在悖论 ====================
  F25:
    id: F25
    name: 对象不存在悖论
    description: 尺度失配的语言痕迹（不是阴谋，是格式不对）
    stages:
      plant:
        zone: C3-Z5
        description: 救援时（陈匠、门影）
      deepen:
        zone: C4-Z5
        description: 点灯/纸条塞回墙缝
      mislead:
        zone: C5-Z2
        description: 玩家以为是系统bug或阴谋
      reveal:
        zone: CF-Z3
        description: 仪式③点灯与字段接受

  # ==================== F26: 删选项预言链 ====================
  F26:
    id: F26
    name: 删选项预言链
    description: 玩家意识到自己一直在和"可选性"对抗
    stages:
      plant:
        zone: C5-Z4
        description: 牧平说"算不过来会删选项"
      deepen:
        zone: CF-Z4
        description: 感受到选项在减少
      mislead:
        zone: CF-Z5
        description: 玩家以为是分支设计问题
      reveal:
        zone: CF-Z5
        description: 三结局：继续删选项/让选项变多/你背代价
