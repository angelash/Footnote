id: C0-Z1
title: 宿舍走廊
# 进入场景时自动触发开场独白
onEnter:
  dialogue: CENHUI_MONO_01
background:
  texture: bg_c0z1_corridor  # 使用WebP背景，key与zones.config.ts保持一致
  x: 0
  y: 0
  origin: [0, 0]
  displaySize: [750, 1334]
objects:
  # ========== 拾取物：拾取后消失 ==========
  
  # 身份卡 - 拾取后消失
  - id: identity_card
    type: image
    texture: obj_filing_cabinet
    x: 200
    y: 620
    scale: 0.8
    depth: 10
    label: 身份卡
    condition:
      flagFalse: FLAG_C0Z1_GOT_IDENTITY
    interactive:
      cursor: true
      testid: identity-card
      action:
        type: dialogue
        dialogueId: C0Z1_IDENTITY_PICKUP

  # ========== 交互物：交互后保留 ==========

  # 公告板（未检查）
  - id: notice_board
    type: image
    texture: obj_sign
    x: 520
    y: 520
    scale: 0.8
    depth: 10
    label: 公告板
    condition:
      flagFalse: FLAG_C0Z1_NOTICE_EXAMINED
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: NOTICE_BOARD_LOOK

  # 公告板（已检查）
  - id: notice_board_done
    type: image
    texture: obj_sign
    x: 520
    y: 520
    scale: 0.8
    depth: 10
    label: 公告板
    condition:
      flagTrue: FLAG_C0Z1_NOTICE_EXAMINED
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: NOTICE_BOARD_DONE

  # 储物柜（未取工具）
  - id: storage_cabinet
    type: image
    texture: obj_filing_cabinet
    x: 350
    y: 680
    scale: 0.7
    depth: 9
    label: 储物柜
    condition:
      flagFalse: FLAG_C0Z1_GOT_TOOLS
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C0Z1_STORAGE

  # 储物柜（已取工具）
  - id: storage_cabinet_done
    type: image
    texture: obj_filing_cabinet
    x: 350
    y: 680
    scale: 0.7
    depth: 9
    label: 储物柜
    condition:
      flagTrue: FLAG_C0Z1_GOT_TOOLS
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C0Z1_STORAGE_DONE

  # 祷词台（未取祷词）
  - id: prayer_board
    type: image
    texture: obj_sign
    x: 450
    y: 380
    scale: 0.5
    depth: 7
    label: 祷词台
    condition:
      flagFalse: FLAG_C0Z1_GOT_PRAYER
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C0Z1_PRAYER_BOARD

  # 祷词台（已取祷词）
  - id: prayer_board_done
    type: image
    texture: obj_sign
    x: 450
    y: 380
    scale: 0.5
    depth: 7
    label: 祷词台
    condition:
      flagTrue: FLAG_C0Z1_GOT_PRAYER
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C0Z1_PRAYER_BOARD_DONE

  # ========== 装饰物和固定设施 ==========

  # 走廊台灯
  - id: corridor_lamp
    type: sprite
    texture: anim_lamp_flicker_frame_0
    x: 380
    y: 400
    scale: 1.0
    depth: 15
    animation:
      key: webp_lamp_flicker
      frameRate: 4
      repeat: -1

  # 走廊植物
  - id: corridor_plant
    type: image
    texture: obj_plant
    x: 650
    y: 700
    scale: 0.6
    depth: 8

  # 邻居的门
  - id: corridor_door
    type: image
    texture: obj_door
    x: 100
    y: 450
    scale: 0.7
    depth: 5
    label: 邻居的门
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: NEIGHBOR_DOOR_KNOCK

  # 出口门（前往早餐小店）
  - id: exit_door
    type: image
    texture: obj_door
    x: 600
    y: 900
    scale: 0.8
    depth: 6
    label: 出口
    interactive:
      cursor: true
      action:
        type: gotoZone
        zoneId: C0-Z2
