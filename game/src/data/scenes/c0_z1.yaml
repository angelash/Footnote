id: C0-Z1
title: 宿舍走廊
background:
  texture: bg_c0z1_corridor  # 使用WebP背景，key与zones.config.ts保持一致
  x: 0
  y: 0
  origin: [0, 0]
  displaySize: [750, 1334]
objects:
  # 身份卡（点击获得身份卡）
  - id: identity_card
    type: image
    texture: obj_filing_cabinet  # WebP物件：文件柜（存放身份卡的地方）
    x: 200
    y: 620
    scale: 0.8
    depth: 10
    label: 身份卡
    labelOffset: [0, 90]
    interactive:
      cursor: true
      testid: identity-card
      action:
        type: card
        cardId: CARD_C0_IDENTITY

  # 公告板（发现日期涂改痕迹）
  - id: notice_board
    type: image
    texture: obj_sign  # WebP物件：标识牌
    x: 520
    y: 520
    scale: 0.8
    depth: 10
    label: 公告板
    labelOffset: [0, 90]
    interactive:
      cursor: true
      action:
        type: dialogue
        speaker: 系统
        text: 公告板上贴满了通知，日期处有涂改痕迹...仔细看的话，最新的日期下面还有另一个数字。

  # 储物柜（取工具包）
  - id: storage_cabinet
    type: image
    texture: obj_filing_cabinet
    x: 350
    y: 680
    scale: 0.7
    depth: 9
    label: 储物柜
    labelOffset: [0, 80]
    interactive:
      cursor: true
      action:
        type: dialogue
        speaker: 岑回
        text: 工具包已经准备好了。标准配置，和每天一样。

  # 走廊台灯（WebP可动物件动画）
  - id: corridor_lamp
    type: sprite
    texture: anim_lamp_flicker_frame_0  # 使用第一帧作为初始纹理
    x: 380
    y: 400
    scale: 1.0
    depth: 15
    animation:
      key: webp_lamp_flicker  # 动画键名
      frameRate: 4
      repeat: -1

  # 走廊植物
  - id: corridor_plant
    type: image
    texture: obj_plant  # WebP物件：植物
    x: 650
    y: 700
    scale: 0.6
    depth: 8

  # 邻居的门
  - id: corridor_door
    type: image
    texture: obj_door  # WebP物件：门
    x: 100
    y: 450
    scale: 0.7
    depth: 5
    label: 邻居的门
    labelOffset: [0, 80]
    interactive:
      cursor: true
      action:
        type: dialogue
        speaker: 岑回
        text: 邻居的门紧闭着，门上有一个褪色的号码牌。...103号？不对，我记得这里应该是102号。

  # 出口门（前往早餐小店）
  - id: exit_door
    type: image
    texture: obj_door
    x: 600
    y: 900
    scale: 0.8
    depth: 6
    label: 出口
    labelOffset: [0, 80]
    interactive:
      cursor: true
      action:
        type: gotoZone
        zoneId: C0-Z2

