# C0-Z3 薄墙巷口
# 生活→异常微光，F01薄墙回声首次出现
id: C0-Z3
title: 薄墙巷口
background:
  texture: px_bg_placeholder
  x: 0
  y: 0
  origin: [0, 0]
  displaySize: [750, 1334]
objects:
  # 薄墙（核心交互点）
  - id: thin_wall
    type: image
    texture: px_item_wall_segment
    x: 200
    y: 500
    scale: 0.8
    depth: 8
    label: 薄墙
    labelOffset: [0, 100]
    interactive:
      cursor: true
      testid: thin-wall
      action:
        type: dialogue
        dialogueId: C0Z3_THIN_WALL
    # 长按效果（听回声）
    longPress:
      duration: 1000
      action:
        type: dialogue
        dialogueId: C0Z3_WALL_ECHO

  # 歪斜路标
  - id: crooked_sign
    type: image
    texture: px_item_sign
    x: 500
    y: 450
    scale: 0.55
    depth: 9
    label: 路标
    labelOffset: [0, 80]
    rotation: 0.15
    interactive:
      cursor: true
      action:
        type: dialogue
        speaker: 岑回
        text: 路标歪了。暂时不能修，不在任务范围内。

  # 墙缝里的钉子（可拾取物品）
  - id: wall_nail
    type: image
    texture: px_item_keycard
    x: 230
    y: 580
    scale: 0.3
    depth: 10
    label: 钉子
    labelOffset: [0, 50]
    # 当已经捡起钉子后，此对象不再显示
    condition:
      flagFalse: FLAG_HAS_NAIL
    interactive:
      cursor: true
      testid: wall-nail
      action:
        type: dialogue
        dialogueId: C0Z3_NAIL_PICKUP

  # 路人剪影1
  - id: passerby_1
    type: image
    texture: placeholder_char
    x: 600
    y: 650
    scale: 0.8
    depth: 6
    alpha: 0.4
    tint: 0x444444

  # 前往维修局的出口
  - id: exit_to_bureau
    type: image
    texture: px_item_door
    x: 375
    y: 200
    scale: 0.6
    depth: 5
    label: 前往维修局
    labelOffset: [0, 80]
    interactive:
      cursor: true
      action:
        type: gotoZone
        zoneId: C0-Z4

  # 返回早餐店
  - id: exit_back
    type: zone
    x: 375
    y: 1200
    width: 200
    height: 100
    label: 返回
    interactive:
      cursor: true
      action:
        type: gotoZone
        zoneId: C0-Z2

