  # 阿棠（远景）- 可交互
  - id: atang_distant
    type: image
    texture: portrait_atang_neutral
    x: 650
    y: 600
    scale: 0.25
    depth: 5
    alpha: 0.7
    label: 阿棠
    labelOffset: [0, 50]
    interactive:
      cursor: true
      testid: atang-distant
      action:
