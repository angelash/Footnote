# C1-Z4 诊疗台候诊区
# 记忆一致性问卷 - 答案被抹平
id: C1-Z4
title: 诊疗台候诊区
background:
  texture: bg_clinic
  x: 0
  y: 0
  origin: [0, 0]
  displaySize: [750, 1334]
objects:
  # ========== 核心交互物 ==========

  # 问卷台（未填写问卷）
  - id: questionnaire_desk
    type: image
    texture: px_item_archive
    x: 375
    y: 380
    scale: 0.9
    depth: 10
    label: 问卷台
    labelOffset: [0, 100]
    condition:
      flagFalse: FLAG_C1Z4_QUESTIONNAIRE_DONE
    interactive:
      cursor: true
      testid: questionnaire-desk
      action:
        type: dialogue
        dialogueId: C1Z4_QUESTIONNAIRE

  # 问卷台（已填写问卷）
  - id: questionnaire_desk_done
    type: image
    texture: px_item_archive
    x: 375
    y: 380
    scale: 0.9
    depth: 10
    label: 问卷台
    labelOffset: [0, 100]
    condition:
      flagTrue: FLAG_C1Z4_QUESTIONNAIRE_DONE
    interactive:
      cursor: true
      testid: questionnaire-desk-done
      action:
        type: dialogue
        dialogueId: C1Z4_QUESTIONNAIRE_DONE

  # 公告板（未查看）
  - id: notice_board
    type: image
    texture: px_item_archive
    x: 150
    y: 350
    scale: 0.5
    depth: 9
    label: 公告板
    labelOffset: [0, 60]
    condition:
      flagFalse: FLAG_C1Z4_NOTICE_CHECKED
    interactive:
      cursor: true
      testid: notice-board
      action:
        type: dialogue
        dialogueId: C1Z4_NOTICE_BOARD

  # 公告板（已查看）
  - id: notice_board_done
    type: image
    texture: px_item_archive
    x: 150
    y: 350
    scale: 0.5
    depth: 9
    label: 公告板
    labelOffset: [0, 60]
    condition:
      flagTrue: FLAG_C1Z4_NOTICE_CHECKED
    interactive:
      cursor: true
      testid: notice-board-done
      action:
        type: dialogue
        dialogueId: C1Z4_NOTICE_BOARD_DONE

  # 诊疗室门（未进入）
  - id: clinic_door
    type: image
    texture: px_item_door
    x: 600
    y: 280
    scale: 0.6
    depth: 11
    label: 诊疗室
    labelOffset: [0, 70]
    condition:
      flagFalse: FLAG_C1Z4_CLINIC_VISITED
    interactive:
      cursor: true
      testid: clinic-door
      action:
        type: dialogue
        dialogueId: C1Z4_CLINIC_DOOR

  # 诊疗室门（已进入）
  - id: clinic_door_done
    type: image
    texture: px_item_door
    x: 600
    y: 280
    scale: 0.6
    depth: 11
