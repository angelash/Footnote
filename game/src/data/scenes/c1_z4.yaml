    x: 350
    y: 520
    scale: 0.8
    depth: 8

  # ========== 出口和导航 ==========

  # 出口 - 前往礼堂街
  - id: exit_forward
    type: zone
    x: 375
    y: 180
    width: 200
    height: 100
    label: 离开诊所
    condition:
      flag: FLAG_C1Z4_QUESTIONNAIRE_DONE
    interactive:
      cursor: true
      action:
        type: gotoZone
        zoneId: C1-Z5

  # 返回
  - id: exit_back
    type: zone
    x: 375
    y: 1200
    width: 200
    height: 100
    label: 返回
    interactive:
      cursor: true
      action:
        type: gotoZone
        zoneId: C1-Z3
