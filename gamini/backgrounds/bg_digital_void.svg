<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="voidGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#111118;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050508;stop-opacity:1" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4a9eff" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#voidGrad)" />
  
  <!-- Perspective Grid -->
  <rect width="800" height="600" fill="url(#grid)" />
  
  <!-- Floating Cubes/Structures -->
  <g opacity="0.3">
    <rect x="100" y="100" width="60" height="60" fill="none" stroke="#4a9eff" stroke-width="1" stroke-dasharray="5,5">
        <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="20s" repeatCount="indefinite" />
    </rect>
    <rect x="600" y="400" width="100" height="100" fill="none" stroke="#4a9eff" stroke-width="1">
         <animateTransform attributeName="transform" type="rotate" from="0 650 450" to="-360 650 450" dur="30s" repeatCount="indefinite" />
    </rect>
  </g>
  
  <!-- Data Streams -->
  <path d="M0,300 Q200,250 400,300 T800,300" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.1" />
  <path d="M0,320 Q200,370 400,320 T800,320" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.05" />

</svg>
