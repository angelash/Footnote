<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ff4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    <filter id="swirlBlur">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Core Glow -->
  <circle cx="128" cy="128" r="40" fill="url(#portalCore)" filter="url(#swirlBlur)">
    <animate attributeName="r" values="38;42;38" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Swirling Arms -->
  <g filter="url(#swirlBlur)" stroke="#ff4444" stroke-width="2" fill="none" opacity="0.8">
    <path d="M128,80 A48,48 0 0,1 176,128">
      <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M128,176 A48,48 0 0,1 80,128">
      <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="3s" repeatCount="indefinite" />
    </path>
  </g>
  
  <!-- Particles -->
  <circle cx="128" cy="128" r="2" fill="#fff">
    <animate attributeName="cy" values="128;80" dur="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" />
  </circle>
   <circle cx="128" cy="128" r="2" fill="#fff">
    <animate attributeName="cx" values="128;176" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite" />
  </circle>
</svg>
