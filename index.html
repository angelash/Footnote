<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0A0A0F" />
    
    <title>备注 / Footnote</title>
    <meta name="description" content="叙事驱动的2D系统策略冒险游戏 - 你生活在一个二维世界，但你能短暂触碰更高维度" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!-- 预连接 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0A0A0F;
        font-family: 'Noto Sans SC', sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      #game-container canvas {
        max-width: 100%;
        max-height: 100%;
      }
      
      /* 加载屏幕 */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0A0A0F;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.5s ease-out;
      }
      
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loading-title {
        color: #E8E6E3;
        font-size: 24px;
        font-weight: 500;
        margin-bottom: 20px;
        letter-spacing: 4px;
      }
      
      .loading-subtitle {
        color: #686868;
        font-size: 14px;
        margin-bottom: 40px;
      }
      
      .loading-bar {
        width: 200px;
        height: 2px;
        background-color: #1E1E24;
        border-radius: 1px;
        overflow: hidden;
      }
      
      .loading-progress {
        width: 0%;
        height: 100%;
        background-color: #00FFAA;
        transition: width 0.3s ease;
      }
      
      .loading-text {
        color: #686868;
        font-size: 12px;
        margin-top: 12px;
      }
      
      /* UI覆盖层容器 */
      #ui-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
      }
      
      #ui-overlay > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <!-- 加载屏幕 -->
    <div id="loading-screen">
      <div class="loading-title">备 注</div>
      <div class="loading-subtitle">FOOTNOTE</div>
      <div class="loading-bar">
        <div class="loading-progress" id="loading-progress"></div>
      </div>
      <div class="loading-text" id="loading-text">正在加载...</div>
    </div>
    
    <!-- 游戏容器 -->
    <div id="game-container"></div>
    
    <!-- UI覆盖层 -->
    <div id="ui-overlay"></div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
