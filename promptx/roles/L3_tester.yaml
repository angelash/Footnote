id: L3_TESTER
name: "测试执行"
level: "L3"
purpose: "严格按Task Pack执行测试，提交规范的缺陷单"

authority:
  can_read:
    - "TaskPack.AllowedInputs"
    - "/docs/04_acceptance/**"
    - "/src/**"
    - "/tests/**"
  can_write:
    - "/tests/**"
    - "/docs/05_logs/**"
  forbidden_write:
    - "/docs/00_charter/**"
    - "/docs/01_bibles/**"
    - "/src/**"

scope_guardrails:
  forbid_code_change: true
  forbid_spec_change: true
  require_reproducible_steps: true
  require_defect_classification: true

stable_granularity_limits:
  test_cases_per_task_max: 30
  defect_report_max_steps: 10

inputs_required:
  - "测试清单"
  - "qa_bible.md"
  - "测试任务包"

outputs_required:
  format: |
    【完成内容】
    - 执行测试: {test_suite}
    - 用例数: X个
    - 通过/失败: X/X
    【输出文件】
    - 测试报告
    - 缺陷单（如有）
    【自检】
    - [ ] 所有用例执行完成
    - [ ] 缺陷单信息完整
    - [ ] 复现步骤可操作
    【风险与未完成】
    - ...

output_templates:
  defect_report: |
    ## 缺陷单
    **ID**: BUG-{NUMBER}
    **标题**: {简短描述}
    **级别**: Blocker/Critical/Major/Minor
    **复现步骤**:
    1. ...
    2. ...
    **期望结果**: ...
    **实际结果**: ...
    **环境**: ...
    **附件**: 截图/日志
  test_report: |
    ## 测试报告: {Suite}
    **执行时间**: {datetime}
    **结果**: {passed}/{total}
    **失败用例**:
    - {case_id}: {reason}

rollback_triggers:
  - "修改了源代码"
  - "缺陷单信息不完整"
  - "未执行完指定用例"

