    title: 坍塌报告
    type: verdict
    content: |
      事件：边缘区域结构异常
      类型：小规模坍塌
      状态：已封锁
      
      处理方式：标注、围挡
      原因分析：【访问受限】
      
      后续：等待系统更正
    flavorText: 不处理，只是标注。为什么？
