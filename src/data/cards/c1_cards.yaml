# 第1章卡片数据
cards:
  # C1-Z1 通行证
  CARD_C1_PERMIT:
    id: CARD_C1_PERMIT
    title: 通行证
    type: archive
    content: |
      持证人：岑回
      居住区域：居住环（标准）
      通行范围：外围区（有限）
      
      版本：C1-许可-02
      更正：已应用
    flavorText: 手续完成了，但总觉得有什么被改过。
