    foreshadowId: F03

  # C1-Z2 走廊便签
  CARD_C1_CORRIDOR_NOTE:
    id: CARD_C1_CORRIDOR_NOTE
    title: 走廊便签
    type: archive
    content: |
      门牌更换通知（复印件）
      
      致住户：
      因区域编号调整，门牌将于……
      
      （关键行字迹模糊，无法辨认）
      
      ……请以新编号为准。
    flavorText: 被更正过的痕迹，总是这样模糊。
    rarity: uncommon
    foreshadowId: F02

  # C1-Z3 版本地图
  CARD_C1_VERSION_MAP_01:
    id: CARD_C1_VERSION_MAP_01
