      版本A：主街宽12单位
      版本B：主街宽10单位
      
      差异：2单位消失
      原因：未记录
    flavorText: 同一个地方，两条街道位置略错开。
    rarity: rare
    foreshadowId: F12

  # C1-Z4 问卷副本
  CARD_C1_QUESTIONNAIRE:
    id: CARD_C1_QUESTIONNAIRE
    title: 问卷副本
    type: archive
    content: |
      记忆一致性评估
      
      问题1：您是否在同一天里见过两次相同的事？
      问题2：您是否在熟悉的路上迷路？
      问题3：您是否对某些日期感到不确定？
      
      评估结论：状态稳定。无需干预。
      
      编号：MC-4721-X
      对齐：已应用
    flavorText: 无论怎么回答，结论都是一样的。
    rarity: uncommon
    foreshadowId: F14

  # C1-Z5 祷文抄本
  CARD_C1_PRAYER_01:
    id: CARD_C1_PRAYER_01
    title: 祷文抄本-01
    type: prayer
    content: |
      纸页不恨你
      它只会承受不住
      别往一页纸上写太多
      空 是被留下的
    flavorText: 诗性的文字背后，似乎藏着什么。
    rarity: rare
    foreshadowId: F15

  # C1-Z6 坍塌报告
  CARD_C1_COLLAPSE_REPORT:
