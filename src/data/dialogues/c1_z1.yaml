# C1-Z1 市政办事厅对话数据
dialogues:
  # 取号机
  C1Z1_TICKET_MACHINE:
    id: C1Z1_TICKET_MACHINE
    lines:
      - speaker: 系统
        text: 请取号排队。
      - speaker: 岑回
        text: （按下取号按钮）
      - speaker: 系统
        text: 您的号码是 A-047。
      - speaker: 系统
        text: 预计等待时间：12分钟。
    onComplete:
      - type: flag
        flagName: FLAG_C1Z1_GOT_TICKET
        flagValue: true

  # 填表台
  C1Z1_FORM_DESK:
    id: C1Z1_FORM_DESK
    lines:
      - speaker: 岑回
        text: 通行证申请表……
      - speaker: ""
        text: （开始填写表格）
      - speaker: 岑回
        text: 姓名：岑回
      - speaker: 岑回
        text: 居住区域：……
    choices:
      - id: fill_standard
        text: 填写"居住环"
        nextDialogueId: C1Z1_FORM_CORRECTED
      - id: fill_outer
        text: 填写"外围区"
        nextDialogueId: C1Z1_FORM_CORRECTED

  # 表格被更正
  C1Z1_FORM_CORRECTED:
    id: C1Z1_FORM_CORRECTED
    lines:
      - speaker: ""
        text: （填写完成）
      - speaker: 岑回
        text: ……
      - speaker: ""
        text: 表格上的文字微微闪烁
      - speaker: 岑回
        text: 等等，我刚才写的不是这个……
      - speaker: ""
        text: 居住区域：居住环（标准）
      - speaker: ""
        text: 日期：（系统推荐日期）
      - speaker: 岑回
        text: 它自己改了。
    onComplete:
      - type: flag
        flagName: FLAG_C1Z1_FORM_FILLED
        flagValue: true
      - type: foreshadow
        foreshadowId: F03
        foreshadowStage: deepen

  # 服务窗口
  C1Z1_WINDOW:
    id: C1Z1_WINDOW
    lines:
      - speaker: 市政职员
        text: 下一位。表格和取号单。
    choices:
      - id: submit_form
        text: 提交表格
        condition:
          flagTrue: FLAG_C1Z1_FORM_FILLED
        nextDialogueId: C1Z1_SUBMIT
      - id: no_form
        text: 我还没填好
        nextDialogueId: C1Z1_GO_FILL

  # 提交表格
  C1Z1_SUBMIT:
    id: C1Z1_SUBMIT
    lines:
      - speaker: 市政职员
        text: （查看表格）
      - speaker: 市政职员
        text: 格式正确。
      - speaker: 市政职员
        text: 通行证将在3个工作周期内发放。
      - speaker: 岑回
        text: 3个周期？我以为今天就能拿到。
      - speaker: 市政职员
        text: 规定如此。下一位。
    onComplete:
      - type: card
        cardId: CARD_C1_PERMIT
      - type: flag
        flagName: FLAG_C1Z1_PERMIT_OBTAINED
        flagValue: true

  # 去填表
  C1Z1_GO_FILL:
    id: C1Z1_GO_FILL
    lines:
      - speaker: 市政职员
        text: 填表台在那边。填好再来。

  # 老人
  C1Z1_ELDERLY:
    id: C1Z1_ELDERLY
    lines:
      - speaker: 老人
        text: 年轻人……能帮我看看这表怎么填吗？
      - speaker: 老人
        text: 我眼睛不好使了。
    choices:
      - id: help_elder
        text: 帮他填表
        effects:
          rDelta: 1
          setFlag:
            name: FLAG_HELPED_ELDER
            value: true
        nextDialogueId: C1Z1_HELP_ELDER
      - id: refuse_elder
        text: 抱歉，我赶时间
        nextDialogueId: C1Z1_REFUSE_ELDER

  # 帮助老人
  C1Z1_HELP_ELDER:
    id: C1Z1_HELP_ELDER
    lines:
      - speaker: 岑回
        text: 好，我帮您看看。
      - speaker: ""
        text: （帮老人填写表格……）
      - speaker: 老人
        text: 谢谢你。
      - speaker: 老人
        text: 我明明来过这里……可他们说我没来过。
      - speaker: 岑回
        text: ……
      - speaker: 老人
        text: 也许是我记错了吧。
      - speaker: 岑回
        text: （也许不是。）

  # 拒绝老人
  C1Z1_REFUSE_ELDER:
    id: C1Z1_REFUSE_ELDER
    lines:
      - speaker: 岑回
        text: 抱歉，我赶时间。
      - speaker: 老人
        text: 没关系……慢慢等就好。



