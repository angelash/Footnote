# 伏笔系统数据
# 包含所有需要追踪的伏笔及其触发条件

foreshadows:
  # ==================== F01: 岑回身份异常 ====================
  F01:
    id: F01
    name: 例外处理器
    description: 岑回的真实身份远非普通维修员
    stages:
      plant:
        zoneId: C0-Z1
        dialogueId: CENHUI_MONO_01
      deepen:
        zoneId: C2-Z3
        dialogueId: GULIN_REVEAL_01
        condition:
          zoneVisited: C2-Z1
      resolve:
        zoneId: C5-Z5
        condition:
          rMin: 6

  # ==================== F02: 周期重置痕迹 ====================
  F02:
    id: F02
    name: 周期涂改
    description: 世界经历过周期重置，但官方从不承认
    stages:
      plant:
        zoneId: C0-Z1
        dialogueId: NOTICE_BOARD_EXAMINE
      deepen:
        zoneId: C1-Z4
        condition:
          hasCard: CARD_C1_OLD_RECORD
      resolve:
        zoneId: C4-Z2
        condition:
          abilityUnlocked: TIME_INTERVENTION

  # ==================== F03: 顾临的矛盾 ====================
  F03:
    id: F03
    name: 收敛者的动摇
    description: 顾临表面坚定，内心却有裂痕
    stages:
      plant:
        zoneId: C0-Z4
        dialogueId: GULIN_INTRO_01
      deepen:
        zoneId: C2-Z6
        dialogueId: GULIN_DOUBT_01
        condition:
          rMin: 3
      resolve:
        zoneId: C5-Z3
        condition:
          zoneCompleted: C5-Z2

  # ==================== F04: 宋岚的记录 ====================
  F04:
    id: F04
    name: 版本差异
    description: 宋岚记录的「异常」暗示着更大的真相
    stages:
      plant:
        zoneId: C1-Z2
        dialogueId: SONGLAN_FIRST_MEET
      deepen:
        zoneId: C3-Z1
        dialogueId: SONGLAN_ARCHIVE_01
        condition:
          hasCard: CARD_C2_FRAGMENT
      resolve:
        zoneId: C4-Z5
        condition:
          abilityUnlocked: DEPTH_PERCEPTION

  # ==================== F05: 阿棠的来历 ====================
  F05:
    id: F05
    name: 对账失败
    description: 阿棠是系统无法解释的存在
    stages:
      plant:
        zoneId: C1-Z5
        dialogueId: ATANG_APPEAR_01
      deepen:
        zoneId: C3-Z4
        dialogueId: ATANG_MEMORY_01
        condition:
          zoneVisited: C3-Z1
      resolve:
        zoneId: C5-Z1
        condition:
          rMin: 5
          zoneCompleted: C4-Z8

