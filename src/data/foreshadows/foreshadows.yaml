        zoneId: C3-Z6
        dialogueId: XUCHENG_DILEMMA_01
        condition:
          hasCard: CARD_C3_MEDICINE
      resolve:
        zoneId: C5-Z4
        condition:
          pMin: 50

  # ==================== F07: 牧平的信仰 ====================
  F07:
    id: F07
    name: 平面信徒
    description: 牧平的「迷信」实则是远古的技术残响
    stages:
      plant:
        zoneId: C2-Z1
        dialogueId: MUPING_PRAYER_01
      deepen:
