  F08:
    id: F08
    name: 无收益残差
    description: 栖蓝的存在本身就在挑战系统
    stages:
      plant:
        zoneId: C2-Z4
        dialogueId: QILAN_FIRST_01
      deepen:
        zoneId: C4-Z1
        dialogueId: QILAN_PURPOSE_01
        condition:
          rMin: 4
      resolve:
        zoneId: CF-Z3
        condition:
          rMin: 8

  # ==================== F09: 陈匠的坚持 ====================
  F09:
    id: F09
    name: 点灯者
    description: 陈匠为不存在的人点灯
    stages:
      plant:
        zoneId: C2-Z5
        dialogueId: CHENJIANG_LAMP_01
      deepen:
        zoneId: C4-Z4
        dialogueId: CHENJIANG_REASON_01
        condition:
          zoneCompleted: C4-Z3
      resolve:
        zoneId: CF-Z4
        condition:
          zoneCompleted: CF-Z3





