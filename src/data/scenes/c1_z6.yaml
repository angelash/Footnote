# C1-Z6 边缘断口：小坍塌现场
# 结构异常引爆点 - 第1章高潮
id: C1-Z6
title: 边缘断口
background:
  texture: bg_collapse
  x: 0
  y: 0
  origin: [0, 0]
  displaySize: [750, 1334]
objects:
  # 坍塌区域
  - id: collapse_zone
    type: image
    texture: obj_crack
    x: 375
    y: 400
    scale: 1.5
    depth: 10
    label: 坍塌区域
    labelOffset: [0, 120]
    interactive:
      cursor: true
      testid: collapse-zone
      action:
        type: dialogue
        dialogueId: C1Z6_COLLAPSE_INSPECT

  # 封锁线
  - id: barrier_1
    type: image
    texture: obj_barrier
    x: 200
    y: 500
    scale: 0.6
    depth: 12
    rotation: 0.1

  - id: barrier_2
    type: image
    texture: obj_barrier
    x: 550
    y: 480
    scale: 0.6
    depth: 12
    rotation: -0.1

  # 警告标志
  - id: warning_sign
    type: image
    texture: px_item_sign
    x: 150
    y: 400
    scale: 0.5
    depth: 11
    label: 警告
    labelOffset: [0, 60]
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C1Z6_WARNING_SIGN

  # 裂缝边缘
  - id: crack_edge
    type: image
    texture: obj_crack
    x: 450
    y: 350
    scale: 0.8
    depth: 8
    alpha: 0.8

  # 住户NPC
  - id: affected_resident
    type: image
    texture: placeholder_char
    x: 600
    y: 550
    scale: 0.9
    depth: 9
    tint: 0xAA8888
    label: 受灾住户
    labelOffset: [0, 70]
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C1Z6_RESIDENT

  # 维修局标记
  - id: bureau_marker
    type: image
    texture: px_fx_system_correct
    x: 320
    y: 420
    scale: 0.6
    depth: 15
    label: 维修局标记
    labelOffset: [0, 60]
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C1Z6_BUREAU_MARKER

  # 顾临远程通讯点
  - id: comms_point
    type: image
    texture: px_item_archive
    x: 250
    y: 300
    scale: 0.5
    depth: 10
    label: 通讯点
    labelOffset: [0, 55]
    interactive:
      cursor: true
      testid: comms-point
      action:
        type: dialogue
        dialogueId: C1Z6_GULIN_COMMS

  # 碎片收集点
  - id: debris
    type: image
    texture: px_fx_scar
    x: 480
    y: 480
    scale: 0.5
    depth: 7
    label: 碎片
    labelOffset: [0, 50]
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C1Z6_DEBRIS

  # 深度感知触发点（隐藏的裂缝内部）
  - id: hidden_crack
    type: zone
    x: 375
    y: 380
    width: 100
    height: 100
    depth: 20
    condition:
      abilityActive: depthPerception
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C1Z6_HIDDEN_STRUCTURE

  # 返回
  - id: exit_back
    type: zone
    x: 375
    y: 1200
    width: 200
    height: 100
    label: 返回礼堂街
    interactive:
      cursor: true
      action:
        type: gotoZone
        zoneId: C1-Z5

  # 前往第2章（条件触发）
  - id: exit_to_c2
    type: zone
    x: 375
    y: 180
    width: 200
    height: 100
    label: 继续前进
    condition:
      flag: FLAG_C1_COMPLETE
    interactive:
      cursor: true
      action:
        type: gotoZone
        zoneId: C2-Z1





