# C5-Z5 栖蓝：空椅子的消失与归来
# 系统显影 F23前奏
id: C5-Z5
title: 栖蓝的街角
background:
  texture: px_bg_placeholder
  x: 0
  y: 0
  origin: [0, 0]
  displaySize: [750, 1334]
objects:
  # 原本椅子位置（空）
  - id: chair_position
    type: zone
    x: 350
    y: 420
    width: 100
    height: 100
    depth: 9
    label: 空位置
    labelOffset: [0, 70]
    interactive:
      cursor: true
      testid: chair-position
      action:
        type: dialogue
        dialogueId: C5Z5_EMPTY_POSITION

  # 椅脚印（长按可见）
  - id: chair_footprint
    type: image
    texture: px_fx_scar
    x: 350
    y: 440
    scale: 0.4
    depth: 8
    alpha: 0.3
    label: 椅脚印
    labelOffset: [0, 50]
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C5Z5_FOOTPRINT

  # 栖蓝工具箱
  - id: qilan_toolbox
    type: image
    texture: px_item_archive
    x: 480
    y: 500
    scale: 0.5
    depth: 10
    label: 工具箱
    labelOffset: [0, 60]
    condition:
      flagTrue: FLAG_C5Z5_STAY
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C5Z5_TOOLBOX

  # 粉笔（描边用）
  - id: chalk
    type: image
    texture: px_fx_system_correct
    x: 280
    y: 480
    scale: 0.3
    depth: 9
    label: 粉笔
    labelOffset: [0, 40]
