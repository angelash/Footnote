      flagTrue: FLAG_C5Z5_TOOLBOX_OPEN
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C5Z5_CHALK

  # 木板
  - id: wood_plank
    type: image
    texture: px_tiles_platform
    x: 550
    y: 480
    scale: 0.5
    depth: 9
    label: 木板
    labelOffset: [0, 55]
    condition:
      flagTrue: FLAG_C5Z5_OUTLINED
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C5Z5_WOOD_PLANK

  # 替代椅（放置后）
  - id: placeholder_chair
    type: image
    texture: obj_chair
    x: 350
    y: 420
    scale: 0.7
    depth: 10
    alpha: 0.7
    visible: false
    condition:
      flagTrue: FLAG_CHAIR_PLACEHOLDER

  # 旧灯座
  - id: old_lamp_stand
    type: image
    texture: obj_oil_lamp
    x: 250
    y: 400
    scale: 0.4
    depth: 8
    condition:
      flagTrue: FLAG_LAMP_LIT

  # 栖蓝
  - id: qilan
    type: image
    texture: portrait_qilan_sad
    x: 180
    y: 420
    scale: 0.4
    depth: 12
    label: 栖蓝
    labelOffset: [0, 80]
    interactive:
      cursor: true
      testid: qilan
      action:
        type: dialogue
        dialogueId: C5Z5_QILAN_TALK

  # 出口
  - id: exit_forward
    type: zone
    x: 375
    y: 180
    width: 200
    height: 100
    label: 前往断口
    interactive:
      cursor: true
      action:
        type: gotoZone
        zoneId: C5-Z6

  # 返回
  - id: exit_back
    type: zone
    x: 375
    y: 1200
    width: 200
    height: 100
    label: 返回
    interactive:
      cursor: true
      action:
        type: gotoZone
        zoneId: C5-Z4


