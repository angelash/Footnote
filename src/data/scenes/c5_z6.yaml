# C5-Z6 边缘断口：审计样式的界面覆盖
# 第三层显影
id: C5-Z6
title: 审计覆盖区
background:
  texture: bg_collapse
  x: 0
  y: 0
  origin: [0, 0]
  displaySize: [750, 1334]
objects:
  # 覆盖区入口
  - id: audit_entrance
    type: zone
    x: 375
    y: 350
    width: 200
    height: 100
    depth: 10
    label: 进入覆盖区
    interactive:
      cursor: true
      testid: audit-entrance
      action:
        type: dialogue
        dialogueId: C5Z6_ENTER_AUDIT

  # 异常点1（缺口）
  - id: anomaly_1
    type: image
    texture: obj_crack
    x: 250
    y: 420
    scale: 0.6
    depth: 9
    label: 异常①
    labelOffset: [0, 60]
    condition:
      flagTrue: FLAG_C5Z6_IN_AUDIT
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C5Z6_ANOMALY_1

  # 异常点2（重复）
  - id: anomaly_2
    type: image
    texture: px_fx_glitch
    x: 400
    y: 450
    scale: 0.5
    depth: 9
    alpha: 0.8
    label: 异常②
    labelOffset: [0, 55]
    condition:
      flagTrue: FLAG_C5Z6_ANOMALY_1_DONE
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C5Z6_ANOMALY_2

  # 异常点3（空白字段）
  - id: anomaly_3
    type: image
    texture: px_fx_field_accept
    x: 520
    y: 400
    scale: 0.5
    depth: 9
    alpha: 0.6
    label: 异常③
    labelOffset: [0, 55]
    condition:
      flagTrue: FLAG_C5Z6_ANOMALY_2_DONE
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C5Z6_ANOMALY_3

  # 时间堆栈异化提示
  - id: time_stack_hint
    type: zone
    x: 680
    y: 650
    width: 100
    height: 60
    depth: 20
    label: 时间堆栈
    condition:
      flagTrue: FLAG_C5Z6_IN_AUDIT
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C5Z6_TIME_STACK_ANOMALY

  # 退出门
  - id: exit_door
    type: image
    texture: obj_door
    x: 375
    y: 250
    scale: 0.7
    depth: 10
    label: 退出
    labelOffset: [0, 80]
    condition:
      flagTrue: FLAG_C5Z6_ALL_MARKED
    interactive:
      cursor: true
      action:
        type: dialogue
        dialogueId: C5Z6_EXIT

  # 出口
  - id: exit_forward
    type: zone
    x: 375
    y: 180
    width: 200
    height: 100
    label: 继续前进
    condition:
      flag: FLAG_C5Z6_COMPLETE
    interactive:
      cursor: true
      action:
        type: gotoZone
        zoneId: C5-Z7

  # 返回
  - id: exit_back
    type: zone
    x: 375
    y: 1200
    width: 200
    height: 100
    label: 返回
    interactive:
      cursor: true
      action:
        type: gotoZone
        zoneId: C5-Z5







