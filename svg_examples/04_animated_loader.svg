<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 动画加载器 -->
  <defs>
    <linearGradient id="spinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3F51B5"/>
      <stop offset="100%" style="stop-color:#00BCD4"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆环 -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#E0E0E0" stroke-width="8"/>
  
  <!-- 旋转的圆弧 -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#spinGrad)" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="180 360">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 50 50" 
      to="360 50 50" 
      dur="1.2s" 
      repeatCount="indefinite"/>
  </circle>
  
  <!-- 中心文字 -->
  <text x="50" y="55" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">
    加载中
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </text>
</svg>

