<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 可爱史莱姆怪物 -->
  <defs>
    <linearGradient id="slimeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321"/>
      <stop offset="100%" style="stop-color:#417505"/>
    </linearGradient>
    <radialGradient id="slimeShine" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" style="stop-color:#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="slimeShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 身体 -->
  <ellipse cx="32" cy="44" rx="24" ry="16" fill="url(#slimeBody)" filter="url(#slimeShadow)"/>
  
  <!-- 头部凸起 -->
  <ellipse cx="32" cy="32" rx="20" ry="18" fill="url(#slimeBody)"/>
  
  <!-- 高光 -->
  <ellipse cx="32" cy="30" rx="18" ry="16" fill="url(#slimeShine)"/>
  
  <!-- 眼睛 -->
  <ellipse cx="24" cy="32" rx="5" ry="6" fill="#FFFFFF"/>
  <ellipse cx="40" cy="32" rx="5" ry="6" fill="#FFFFFF"/>
  <circle cx="25" cy="33" r="3" fill="#1A1A1A"/>
  <circle cx="41" cy="33" r="3" fill="#1A1A1A"/>
  <circle cx="26" cy="32" r="1" fill="#FFFFFF"/>
  <circle cx="42" cy="32" r="1" fill="#FFFFFF"/>
  
  <!-- 微笑 -->
  <path d="M26 40 Q32 46 38 40" fill="none" stroke="#2D5A00" stroke-width="2" stroke-linecap="round"/>
</svg>

