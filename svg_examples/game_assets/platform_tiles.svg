<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 128" width="256" height="128">
  <!-- 平台游戏地形 Tileset -->
  <defs>
    <!-- 草地渐变 -->
    <linearGradient id="grassTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB342"/>
      <stop offset="100%" style="stop-color:#558B2F"/>
    </linearGradient>
    <linearGradient id="dirtBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8D6E63"/>
      <stop offset="100%" style="stop-color:#5D4037"/>
    </linearGradient>
    
    <!-- 石头渐变 -->
    <linearGradient id="stone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#78909C"/>
      <stop offset="50%" style="stop-color:#546E7A"/>
      <stop offset="100%" style="stop-color:#37474F"/>
    </linearGradient>
    
    <!-- 水面渐变 -->
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7" stop-opacity="0.8"/>
      <stop offset="100%" style="stop-color:#0277BD" stop-opacity="0.9"/>
    </linearGradient>
    
    <!-- 岩浆渐变 -->
    <linearGradient id="lava" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722"/>
      <stop offset="50%" style="stop-color:#F44336"/>
      <stop offset="100%" style="stop-color:#BF360C"/>
    </linearGradient>
    
    <!-- 草地图案 -->
    <pattern id="grassPattern" width="8" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 4 L2 0 M4 4 L6 1 M6 4 L8 2" stroke="#8BC34A" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  
  <!-- === 第一行：基础地形 === -->
  
  <!-- 草地块 (0,0) -->
  <g transform="translate(0, 0)">
    <rect width="32" height="32" fill="url(#dirtBody)"/>
    <rect width="32" height="10" fill="url(#grassTop)"/>
    <rect width="32" height="6" fill="url(#grassPattern)"/>
    <!-- 泥土纹理 -->
    <circle cx="8" cy="20" r="3" fill="#6D4C41" opacity="0.5"/>
    <circle cx="22" cy="24" r="4" fill="#6D4C41" opacity="0.4"/>
    <circle cx="14" cy="28" r="2" fill="#5D4037" opacity="0.6"/>
  </g>
  
  <!-- 草地块-左边缘 (32,0) -->
  <g transform="translate(32, 0)">
    <rect width="32" height="32" fill="url(#dirtBody)"/>
    <rect width="32" height="10" fill="url(#grassTop)"/>
    <path d="M0 10 L0 32" stroke="#4E342E" stroke-width="3"/>
    <rect width="32" height="6" fill="url(#grassPattern)"/>
  </g>
  
  <!-- 石头块 (64,0) -->
  <g transform="translate(64, 0)">
    <rect width="32" height="32" fill="url(#stone)"/>
    <!-- 石头裂缝纹理 -->
    <path d="M4 8 L12 12 L8 20" stroke="#37474F" stroke-width="1" fill="none"/>
    <path d="M20 4 L24 16 L18 28" stroke="#455A64" stroke-width="1" fill="none"/>
    <rect x="2" y="2" width="8" height="4" fill="#90A4AE" opacity="0.3"/>
  </g>
  
  <!-- 砖块 (96,0) -->
  <g transform="translate(96, 0)">
    <rect width="32" height="32" fill="#A1887F"/>
    <!-- 砖缝 -->
    <line x1="0" y1="8" x2="32" y2="8" stroke="#6D4C41" stroke-width="1"/>
    <line x1="0" y1="16" x2="32" y2="16" stroke="#6D4C41" stroke-width="1"/>
    <line x1="0" y1="24" x2="32" y2="24" stroke="#6D4C41" stroke-width="1"/>
    <line x1="16" y1="0" x2="16" y2="8" stroke="#6D4C41" stroke-width="1"/>
    <line x1="8" y1="8" x2="8" y2="16" stroke="#6D4C41" stroke-width="1"/>
    <line x1="24" y1="8" x2="24" y2="16" stroke="#6D4C41" stroke-width="1"/>
    <line x1="16" y1="16" x2="16" y2="24" stroke="#6D4C41" stroke-width="1"/>
    <line x1="8" y1="24" x2="8" y2="32" stroke="#6D4C41" stroke-width="1"/>
    <line x1="24" y1="24" x2="24" y2="32" stroke="#6D4C41" stroke-width="1"/>
  </g>
  
  <!-- === 第一行续：特殊地形 === -->
  
  <!-- 水面 (128,0) -->
  <g transform="translate(128, 0)">
    <rect width="32" height="32" fill="url(#water)"/>
    <!-- 波纹 -->
    <path d="M0 8 Q8 4 16 8 Q24 12 32 8" stroke="#B3E5FC" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M0 18 Q8 14 16 18 Q24 22 32 18" stroke="#B3E5FC" stroke-width="1" fill="none" opacity="0.4"/>
    <circle cx="8" cy="24" r="2" fill="#FFFFFF" opacity="0.3"/>
  </g>
  
  <!-- 岩浆 (160,0) -->
  <g transform="translate(160, 0)">
    <rect width="32" height="32" fill="url(#lava)"/>
    <!-- 岩浆气泡 -->
    <circle cx="10" cy="20" r="4" fill="#FFAB00" opacity="0.7"/>
    <circle cx="24" cy="12" r="3" fill="#FFD54F" opacity="0.6"/>
    <circle cx="16" cy="26" r="2" fill="#FFECB3" opacity="0.8"/>
    <!-- 发光效果 -->
    <rect width="32" height="6" fill="#FFEB3B" opacity="0.3"/>
  </g>
  
  <!-- 冰块 (192,0) -->
  <g transform="translate(192, 0)">
    <rect width="32" height="32" fill="#B3E5FC" stroke="#4FC3F7" stroke-width="1"/>
    <!-- 冰晶纹理 -->
    <path d="M8 8 L16 16 L8 24" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M24 6 L20 16 L26 26" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.5"/>
    <rect x="4" y="4" width="6" height="3" fill="#FFFFFF" opacity="0.4"/>
    <rect x="20" y="22" width="8" height="4" fill="#FFFFFF" opacity="0.3"/>
  </g>
  
  <!-- 木板 (224,0) -->
  <g transform="translate(224, 0)">
    <rect width="32" height="32" fill="#A1887F"/>
    <!-- 木纹 -->
    <line x1="0" y1="0" x2="0" y2="32" stroke="#8D6E63" stroke-width="8"/>
    <line x1="10" y1="0" x2="10" y2="32" stroke="#8D6E63" stroke-width="6"/>
    <line x1="20" y1="0" x2="20" y2="32" stroke="#8D6E63" stroke-width="8"/>
    <line x1="30" y1="0" x2="30" y2="32" stroke="#8D6E63" stroke-width="4"/>
    <!-- 钉子 -->
    <circle cx="5" cy="8" r="1.5" fill="#546E7A"/>
    <circle cx="25" cy="24" r="1.5" fill="#546E7A"/>
  </g>
  
  <!-- === 第二行：装饰物 === -->
  
  <!-- 草丛 (0,32) -->
  <g transform="translate(0, 40)">
    <path d="M4 32 L8 16 L10 32 M12 32 L16 8 L20 32 M22 32 L26 18 L28 32" 
          stroke="#7CB342" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="16" cy="10" r="2" fill="#8BC34A"/>
  </g>
  
  <!-- 蘑菇 (32,32) -->
  <g transform="translate(40, 48)">
    <ellipse cx="16" cy="24" rx="6" ry="12" fill="#EFEBE9"/>
    <ellipse cx="16" cy="12" rx="14" ry="10" fill="#E53935"/>
    <circle cx="10" cy="10" r="3" fill="#FFFFFF"/>
    <circle cx="20" cy="8" r="2" fill="#FFFFFF"/>
    <circle cx="16" cy="16" r="2" fill="#FFFFFF"/>
  </g>
  
  <!-- 石头 (80,32) -->
  <g transform="translate(80, 56)">
    <ellipse cx="16" cy="20" rx="14" ry="10" fill="#78909C"/>
    <ellipse cx="16" cy="18" rx="12" ry="8" fill="#90A4AE"/>
    <ellipse cx="12" cy="16" rx="4" ry="2" fill="#B0BEC5"/>
  </g>
  
  <!-- 宝石矿 (112,32) -->
  <g transform="translate(112, 44)">
    <rect width="32" height="32" rx="4" fill="url(#stone)"/>
    <polygon points="8,12 12,8 16,12 12,20" fill="#7C4DFF"/>
    <polygon points="20,16 26,14 24,24 18,22" fill="#E040FB"/>
    <polygon points="14,22 18,26 14,30 10,26" fill="#00BCD4"/>
    <!-- 闪烁点 -->
    <circle cx="12" cy="10" r="1" fill="#FFFFFF"/>
    <circle cx="24" cy="16" r="1" fill="#FFFFFF"/>
  </g>
  
  <!-- 云朵 (160,32) -->
  <g transform="translate(160, 44)">
    <ellipse cx="16" cy="20" rx="14" ry="10" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="8" cy="16" rx="8" ry="8" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="26" cy="18" rx="10" ry="8" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="16" cy="12" rx="10" ry="8" fill="#ECEFF1" opacity="0.7"/>
  </g>
  
  <!-- 告示牌 (208,32) -->
  <g transform="translate(208, 40)">
    <rect x="14" y="20" width="4" height="20" fill="#6D4C41"/>
    <rect x="4" y="4" width="24" height="18" rx="2" fill="#A1887F" stroke="#6D4C41" stroke-width="1"/>
    <line x1="8" y1="10" x2="24" y2="10" stroke="#5D4037" stroke-width="2"/>
    <line x1="8" y1="16" x2="20" y2="16" stroke="#5D4037" stroke-width="2"/>
  </g>
</svg>

