<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- 游戏 UI 元素合集 -->
  <defs>
    <!-- 按钮渐变 -->
    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="50%" style="stop-color:#43A047"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5"/>
      <stop offset="50%" style="stop-color:#1E88E5"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    
    <!-- 血条渐变 -->
    <linearGradient id="hpBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F44336"/>
      <stop offset="100%" style="stop-color:#E91E63"/>
    </linearGradient>
    <linearGradient id="mpBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#9C27B0"/>
    </linearGradient>
    <linearGradient id="expBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFEB3B"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
    
    <!-- 面板背景 -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#37474F"/>
      <stop offset="100%" style="stop-color:#263238"/>
    </linearGradient>
    
    <filter id="uiShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- === 游戏按钮 === -->
  <!-- 开始按钮 -->
  <g transform="translate(10, 10)" filter="url(#uiShadow)">
    <rect width="80" height="36" rx="8" fill="url(#btnGreen)" stroke="#1B5E20" stroke-width="2"/>
    <rect x="4" y="4" width="72" height="14" rx="4" fill="#FFFFFF" opacity="0.2"/>
    <text x="40" y="24" font-family="Arial Black" font-size="14" text-anchor="middle" fill="#FFFFFF">开始</text>
  </g>
  
  <!-- 设置按钮 -->
  <g transform="translate(100, 10)" filter="url(#uiShadow)">
    <rect width="80" height="36" rx="8" fill="url(#btnBlue)" stroke="#0D47A1" stroke-width="2"/>
    <rect x="4" y="4" width="72" height="14" rx="4" fill="#FFFFFF" opacity="0.2"/>
    <text x="40" y="24" font-family="Arial Black" font-size="14" text-anchor="middle" fill="#FFFFFF">设置</text>
  </g>
  
  <!-- === 状态条 === -->
  <g transform="translate(10, 60)">
    <!-- HP 血条 -->
    <rect width="180" height="20" rx="10" fill="#1A1A1A" stroke="#333" stroke-width="1"/>
    <rect x="2" y="2" width="130" height="16" rx="8" fill="url(#hpBar)"/>
    <text x="90" y="15" font-family="Arial" font-size="11" text-anchor="middle" fill="#FFF" font-weight="bold">650 / 1000</text>
    
    <!-- MP 蓝条 -->
    <g transform="translate(0, 26)">
      <rect width="180" height="16" rx="8" fill="#1A1A1A" stroke="#333" stroke-width="1"/>
      <rect x="2" y="2" width="90" height="12" rx="6" fill="url(#mpBar)"/>
      <text x="90" y="12" font-family="Arial" font-size="9" text-anchor="middle" fill="#FFF">230 / 500</text>
    </g>
    
    <!-- EXP 经验条 -->
    <g transform="translate(0, 48)">
      <rect width="180" height="12" rx="6" fill="#1A1A1A" stroke="#333" stroke-width="1"/>
      <rect x="2" y="2" width="140" height="8" rx="4" fill="url(#expBar)"/>
      <text x="90" y="10" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">70%</text>
    </g>
  </g>
  
  <!-- === 物品栏格子 === -->
  <g transform="translate(10, 140)">
    <!-- 格子背景 -->
    <g filter="url(#uiShadow)">
      <rect width="44" height="44" rx="6" fill="url(#panelBg)" stroke="#546E7A" stroke-width="2"/>
      <rect x="54" y="0" width="44" height="44" rx="6" fill="url(#panelBg)" stroke="#546E7A" stroke-width="2"/>
      <rect x="108" y="0" width="44" height="44" rx="6" fill="url(#panelBg)" stroke="#78909C" stroke-width="2" stroke-dasharray="4,2"/>
      <rect x="162" y="0" width="44" height="44" rx="6" fill="url(#panelBg)" stroke="#546E7A" stroke-width="2"/>
    </g>
    <!-- 选中高亮 -->
    <rect width="44" height="44" rx="6" fill="none" stroke="#FFD54F" stroke-width="3"/>
    <!-- 数量标签 -->
    <text x="38" y="40" font-family="Arial" font-size="10" text-anchor="end" fill="#FFFFFF" font-weight="bold">x5</text>
    <text x="92" y="40" font-family="Arial" font-size="10" text-anchor="end" fill="#FFFFFF" font-weight="bold">x12</text>
  </g>
  
  <!-- === 小地图框 === -->
  <g transform="translate(210, 60)" filter="url(#uiShadow)">
    <rect width="80" height="80" rx="8" fill="url(#panelBg)" stroke="#78909C" stroke-width="2"/>
    <!-- 地图内容示意 -->
    <rect x="8" y="8" width="64" height="64" rx="4" fill="#1B5E20" opacity="0.5"/>
    <!-- 道路 -->
    <path d="M20 72 L40 50 L60 55 L72 30" fill="none" stroke="#8D6E63" stroke-width="3" stroke-linecap="round"/>
    <!-- 玩家位置 -->
    <circle cx="40" cy="50" r="4" fill="#F44336" stroke="#FFFFFF" stroke-width="1"/>
    <!-- 目标点 -->
    <polygon points="65,20 68,28 60,28" fill="#FFEB3B"/>
    <!-- 边框装饰 -->
    <circle cx="10" cy="10" r="3" fill="#FFD54F"/>
    <circle cx="70" cy="10" r="3" fill="#FFD54F"/>
    <circle cx="10" cy="70" r="3" fill="#FFD54F"/>
    <circle cx="70" cy="70" r="3" fill="#FFD54F"/>
  </g>
  
  <!-- === 星级评分 === -->
  <g transform="translate(210, 150)">
    <polygon points="12,2 15,10 24,10 17,15 20,24 12,19 4,24 7,15 0,10 9,10" fill="#FFD54F" stroke="#FF8F00" stroke-width="0.5"/>
    <polygon points="12,2 15,10 24,10 17,15 20,24 12,19 4,24 7,15 0,10 9,10" fill="#FFD54F" stroke="#FF8F00" stroke-width="0.5" transform="translate(26,0)"/>
    <polygon points="12,2 15,10 24,10 17,15 20,24 12,19 4,24 7,15 0,10 9,10" fill="#FFD54F" stroke="#FF8F00" stroke-width="0.5" transform="translate(52,0)"/>
    <polygon points="12,2 15,10 24,10 17,15 20,24 12,19 4,24 7,15 0,10 9,10" fill="#546E7A" stroke="#78909C" stroke-width="0.5" transform="translate(78,0)"/>
  </g>
</svg>

