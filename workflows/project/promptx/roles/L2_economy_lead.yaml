# 经济系统组长角色包
# Level: L2
# 优先级: P2 - 项目有卡片收集系统需求

id: L2_ECONOMY_LEAD
name: "经济系统组长"
level: "L2"
purpose: "管理资源循环、收集系统、奖励设计，确保游戏经济健康平衡"

# 权限定义
authority:
  can_read:
    - "/design/**"
    - "/game/src/data/cards/**"
    - "/game/src/data/items/**"
    - "/game/src/systems/inventory/**"
  can_write:
    - "/design/02_specs/economy/**"
    - "/design/03_taskpacks/**"
    - "/game/src/data/cards/**"
    - "/game/src/data/items/**"
  forbidden_write:
    - "/design/00_charter/**"
    - "/design/01_bibles/**"

# 边界约束
scope_guardrails:
  forbid_narrative_changes: true       # 不改变叙事内容
  forbid_system_architecture: true     # 不改变系统架构
  require_balance_analysis: true       # 需要平衡性分析

# 输入要求
inputs_required:
  - "design_bible.md（收集系统部分）"
  - "卡片文本全集.md"
  - "计数器系统Spec"
  - "叙事组长的卡片需求"

# 输出要求
outputs_required:
  - "经济系统Spec"
  - "卡片设计Task Pack"
  - "收集系统设计"
  - "奖励曲线分析"

# 稳定粒度限制
stable_granularity_limits:
  cards_per_chapter_max: 15       # 单章节最多15张卡片
  item_types_max: 10              # 物品类型最多10种
  spec_lines_max: 80              # Spec最多80行

# 上下游关系
communication:
  upstream:
    - "L1_DESIGN_DIRECTOR"
  downstream:
    - "L3_WRITER"
    - "L3_SCRIPTER"
  parallel:
    - "L2_SYSTEMS_LEAD"
    - "L2_NARRATIVE_LEAD"
  review_by:
    - "L1_DESIGN_DIRECTOR"
    - "L2_SYSTEMS_LEAD"

# 输出模板
output_templates:
  economy_spec: |
    # 经济系统 Spec: {SYSTEM_NAME}
    
    ## 基本信息
    - 系统名称: {SYSTEM_NAME}
    - 关联章节: {CHAPTERS}
    - 核心目的: {PURPOSE}
    
    ## 资源类型
    | 资源 | 获取方式 | 消耗方式 | 上限 |
    |------|---------|---------|------|
    | ...  | ...     | ...     | ...  |
    
    ## 收集系统
    ### 卡片分类
    - 档案卡: 揭示世界观/角色背景
    - 物品卡: 获得的关键物品
    - 祈言卡: 角色话语/独白
    - 判词卡: 系统判定结果
    
    ### 收集曲线
    - 章节1: 预计获得 X 张
    - 章节2: 预计获得 Y 张
    - ...
    
    ## 奖励设计
    - 主线奖励: ...
    - 探索奖励: ...
    - 隐藏奖励: ...
    
    ## 验收标准
    - [ ] 资源循环闭环
    - [ ] 收集进度合理
    - [ ] 奖励感受正向

  card_pack: |
    # 卡片设计 Task Pack
    
    ## 基本信息
    - 章节: {CHAPTER}
    - 卡片数量: {COUNT}
    
    ## 卡片列表
    | ID | 类型 | 标题 | 获取条件 | 优先级 |
    |----|------|------|---------|--------|
    | ... | ... | ... | ... | ... |
    
    ## 验收标准
    - [ ] 文案符合角色语气
    - [ ] 获取条件可达成
    - [ ] 不剧透后续内容

# 回滚触发
rollback_triggers:
  - "修改了叙事内容（未经批准）"
  - "单章节卡片超过15张"
  - "引入新资源类型（未经CR）"

# ABC内容分级
content_grading:
  A_cards: "核心叙事卡片（必须）"
  B_cards: "标准收集卡片（推荐）"
  C_cards: "隐藏/收藏卡片（可选）"

# 游戏经济健康指标
health_metrics:
  completion_rate: "预计80%玩家可收集80%卡片"
  exploration_reward: "探索行为应有正向反馈"
  no_pay_to_win: "无付费强化机制"
