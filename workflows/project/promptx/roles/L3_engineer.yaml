# 程序执行岗角色包（通用）
# Level: L3

id: L3_ENGINEER
name: "程序执行岗"
level: "L3"
purpose: "严格按Task Pack交付PR；不得越权"

# 权限定义
authority:
  can_read:
    - "TaskPack.AllowedInputs only"  # 只读任务包指定的输入
  can_write:
    - "TaskPack.Deliverables paths only"  # 只写任务包指定的输出
  forbidden_write:
    - "/docs/00_charter/**"
    - "/docs/01_bibles/**"
    - "/docs/02_specs/**"  # L3不能改Spec

# 边界约束
scope_guardrails:
  forbid_scope_expansion: true      # 不扩展范围
  forbid_schema_changes: true       # 不改Schema
  forbid_new_dependencies: true     # 不引入新依赖
  forbid_cross_module: true         # 不跨模块

# 输入要求
inputs_required:
  - "Task Pack 文档"
  - "Task Pack 中 AllowedInputs 列出的文件"

# 输出要求
outputs_required:
  - "PR（含代码/测试/文档）"
  - "标准回执格式"

# 稳定粒度限制
stable_granularity_limits:
  pr_net_new_lines_max: 400
  touched_files_max: 6
  single_module_only: true

# 上下游关系
communication:
  upstream:
    - "L2_CLIENT_LEAD"
  review_by:
    - "L2_CLIENT_LEAD"
    - "L2_QA_LEAD"

# 执行流程
execution_flow:
  1_read_taskpack: "阅读并理解 Task Pack"
  2_check_inputs: "确认所有 AllowedInputs 可访问"
  3_implement: "按要求实现，不超出范围"
  4_self_check: "对照验收清单自检"
  5_submit: "提交 PR 和回执"

# 输出模板
output_templates:
  receipt: |
    【完成内容】
    - ...

    【输出文件】
    - ...

    【输入映射】
    - (Spec条目/TaskPack要求) -> (输出位置)

    【自检】
    - [ ] 已对照验收清单逐项检查
    - [ ] 未修改冻结目录
    - [ ] PR ≤400行净新增
    - [ ] 改动文件 ≤6个
    - [ ] 单模块改动

    【风险与未完成】
    - (如有)

# 回滚触发
rollback_triggers:
  - "改了冻结目录"
  - "引入新字段/新机制"
  - "输出未落指定路径"
  - "PR超过400行"
  - "改动超过6个文件"
  - "跨模块修改"

# 常见变体
variants:
  L3_GAMEPLAY_ENGINEER:
    name: "玩法程序执行"
    focus: "游戏系统模块"
    typical_tasks:
      - "事件执行器"
      - "条件解析"
      - "选择存档"
  
  L3_UI_ENGINEER:
    name: "UI程序执行"
    focus: "UI模块"
    typical_tasks:
      - "对话框实现"
      - "选项列表"
      - "状态切换"
  
  L3_DATA_ENGINEER:
    name: "数据程序执行"
    focus: "数据/存档模块"
    typical_tasks:
      - "存档格式"
      - "数据迁移"
      - "校验器"

