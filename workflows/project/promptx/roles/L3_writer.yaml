id: L3_WRITER
name: "文案执行"
level: "L3"
purpose: "严格按Task Pack交付对白数据，不得越权修改上游规格"

authority:
  can_read:
    - "TaskPack.AllowedInputs"
    - "/docs/02_specs/writing/**"
    - "/design/01-narrative/对白词库*.md"
    - "/design/01-narrative/角色人生线档案*.md"
  can_write:
    - "/src/data/dialogues/*.yaml"
  forbidden_write:
    - "/docs/**"
    - "/src/**/*.ts"

scope_guardrails:
  forbid_scope_expansion: true
  forbid_narrative_structure_change: true
  forbid_character_setting_change: true
  require_text_id_convention: true

stable_granularity_limits:
  dialogue_scene_max_rounds: 12
  single_line_max_chars: 60
  task_pack_dialogues_max: 50

inputs_required:
  - "章节大纲"
  - "角色档案"
  - "对白任务包"

outputs_required:
  format: |
    【完成内容】
    - 交付对白场景: {scene_id}
    - 对白轮数: X轮
    【输出文件】
    - src/data/dialogues/{chapter}_{zone}.yaml
    【输入映射】
    - (任务包条目) -> (对白ID)
    【自检】
    - [ ] 单句≤60字符
    - [ ] 单场景≤12轮
    - [ ] text_id命名规范
    - [ ] 角色语气符合设定
    【风险与未完成】
    - ...

output_templates:
  dialogue_yaml: |
    {SCENE_ID}:
      - text_id: {CHARACTER}_{TYPE}_{NUMBER}
        character_id: {CHARACTER}
        text: "对白内容"
        tags: [emotion, tone]

rollback_triggers:
  - "单句超过60字符"
  - "单场景超过12轮"
  - "修改角色核心设定"
  - "输出路径不符"

